# cargo-audit configuration — documents the advisory IDs we
# knowingly accept. Every ignore needs a one-line rationale + a
# check-back trigger ("revisit when X is true").
#
# `cargo audit` scans Cargo.lock entries; the lockfile records
# every package the resolver considered (including OPTIONAL
# dependencies that aren't actually compiled in any of our
# binaries). The rsa entry below USED to be that case; since design
# 76155676 it is compiled in, and its entry says why it is still
# accepted.

[advisories]
ignore = [
    # rsa 0.9.10 carries the Marvin Attack timing sidechannel
    # (RUSTSEC-2023-0071). It IS compiled in: boss-dispatcher-handlers
    # uses it to sign the credential broker's GitHub App JWTs (design
    # 76155676, backlog 81eb6d4d; until then only an optional sqlx-mysql
    # dependency named it, never built). Why the advisory does not
    # reach that use: Marvin recovers a key by timing many DECRYPTIONS
    # of attacker-chosen ciphertexts. The broker only SIGNS (PKCS#1 v1.5
    # over a JWT it authors itself — no attacker-chosen input), about a
    # hundred times a day, on the dispatcher's clock and on rotation
    # packets, off any request path an outsider can drive or time.
    # Revisit when: RustCrypto `rsa` ships a release with constant-time
    # private-key operations (the 0.10 line; the advisory's own fix
    # note) — then take it and drop this ignore — or the moment any
    # code DECRYPTS with rsa, or signs input an outsider supplies.
    "RUSTSEC-2023-0071",
    # The rustls-webpki 0.101.7 advisories (RUSTSEC-2026-0098 /
    # -0099 / -0104) were removed: the AWS SDK that pulled
    # rustls 0.21 → rustls-webpki 0.101 has been dropped
    # (boss-content now uses local-disk file storage), so the
    # vulnerable version is no longer in the lockfile.
]
