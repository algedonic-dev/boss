# Registers bun-plugin-svelte with Bun's Fullstack Dev Server so
# `dev-server.ts`'s HTML entrypoint (index.html) gets bundled +
# hot-reloaded when .svelte / .ts / .css files change. No effect
# on the production build, which runs `Bun.build` with the plugin
# passed explicitly.

[serve.static]
plugins = ["bun-plugin-svelte"]

# `bun test` has no Svelte pass, so `*.svelte.ts` modules (session
# envelope et al.) would throw on their module-level rune calls the
# moment a unit test imports them. The preload shims those runes as
# identity functions — values and transitions stay assertable; the
# mocked suite owns everything reactive.
[test]
preload = ["./tests/rune-preload.ts"]
# A per-test timeout exists to catch a HUNG test. Bun's default is
# 5000 ms, and on 2026-09-08 a synchronous 1 ms unit test took 8167 ms
# because the gate pod was starved while a second gate compiled on the
# same node (gates run in parallel since 2026-09-05) - the check
# reported a scheduling stall as a consist failure and struck a clean
# protocol car (gate-run 6de49582, backlog 8cbe1b7d). 30 s still catches
# a hang; a stall under load no longer reds a car.
timeout = 30000
