# Forgejo CI — the validation half of the internalized loop.
#
# This is THE CI workflow: the gate running on our own iron, so a change
# is validated where it is built and deployed rather than by someone
# else's infrastructure. The public GitHub mirror gates nothing; since
# backlog 2328c95e its own .github/workflows/ci.yml runs infra/gate.sh in
# full on each publish PR, so the public green means the tree passed the
# same one gate (its earlier ci.yml was deleted 2026-09-08, design 7b59af2c).
#
# The container image is ours, from our registry, and carries node as
# well as the Rust toolchain: Forgejo runs actions/checkout as a
# JavaScript action *inside* the job container, so an image without node
# fails every run at checkout with exitcode 127 before a line of the
# gate executes.
#
# Three jobs, in series: `build-image` (the runner image, from the
# tree), `locomotive` (the host and image checks, in seconds), `web` (the
# frontend suite in that image, run only on a train that changes its
# recipe; on every other, the train's cluster gate is the frontend's
# only judge). The `fast` and
# `test` jobs this paragraph used to describe were moved to that gate by
# design 128b5496; see the note at the foot of this file.
name: CI

# THE PULL REQUEST ALONE. Until 2026-09-12 `push: branches: [main]` was
# here too, and every train cost two full runs: the PR's, then the same
# suite again on the squash commit the merge put on main. The jobs run
# serially on one runner slot (~17 min a run, `test` 11–13 of it), so
# the second run held the slot while the NEXT train's PR queued — train
# 18:51Z's CI began at 19:30Z — and it built a second 3.48 GB
# boss-ci:<sha> image per train into the disk the floor sweep defends
# (05db904e). Nobody read it: the conductor's verdict is the PR head's
# combined status, and the cluster's image is built by the forge
# converge, not here. The squash commit carries the PR head's tree
# because the track lock keeps main still between assembly and merge.
# Measured off the forge's task list, backlog 47fc2bc1; pinned by
# boss-testing's ci_runs_once_per_train.
on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Frozen trusted-base eligibility, shared with deploy and the conductor. The
  # cached tool image may be reused only when its baked recipe stamp agrees.
  # A missing base, planner, policy or stamp chooses the existing image path.
  # Bootstrap stays in the workflow trust boundary: a candidate helper cannot
  # grant its own skip. Both inline copies are execution-tested and held equal
  # by test_delivery_ci_workflow.py (review6600844d, urgent271a2f6e).
  delivery-plan:
    runs-on: docker
    container:
      image: 10.20.0.15:3000/david/boss-ci:rust1.96
    outputs:
      route: ${{ steps.plan.outputs.route }}
      # The runner image's NAME — see build-image's note below.
      ci_stamp: ${{ steps.stamp.outputs.ci_stamp }}
    steps:
      - name: Read the exact PR inputs from the forge
        env:
          FORGE_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -eu
          git init -q .
          git remote add origin "http://x-access-token:${FORGE_TOKEN}@10.20.0.15:3000/${GITHUB_REPOSITORY}.git"
          git fetch -q origin "${GITHUB_SHA}" "${BASE_SHA}"
          git checkout -q --force "${GITHUB_SHA}"
      - name: Select and retain the complete delivery plan
        id: plan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -eu
          python3 -I - "$BASE_SHA" "$GITHUB_SHA" > delivery-plan.json <<'PY'
          import json, re, subprocess, sys
          base, head = sys.argv[1:]
          try:
              if not all(re.fullmatch(r"[0-9a-f]{40}|[0-9a-f]{64}", ref) for ref in (base, head)):
                  raise ValueError("CI requires full frozen base/head identities")
              source = subprocess.run(
                  ["git", "show", base + ":infra/forge/delivery-ci.py"],
                  check=True, capture_output=True, text=True).stdout
              executed = subprocess.run(
                  [sys.executable, "-I", "-", "--repo", ".", "--base", base,
                   "--head", head, "--stamp", "/etc/boss-ci-stamp"],
                  input=source, check=True, capture_output=True, text=True)
              plan = json.loads(executed.stdout)
              if not isinstance(plan, dict) or plan.get("schema") != 1 or plan.get("route") not in ("data", "software"):
                  raise ValueError("trusted CI adapter returned an invalid plan")
              if plan["route"] == "data" and (
                  plan.get("base") != base or plan.get("head") != head
                  or not isinstance(plan.get("obligations"), list) or not plan["obligations"]
                  or not re.fullmatch(r"[0-9a-f]{64}", plan.get("ci_runner_recipe_sha256", ""))):
                  raise ValueError("trusted CI adapter returned unbound lighter evidence")
          except Exception as error:
              stderr = getattr(error, "stderr", "")
              plan = {"schema": 1, "route": "software", "obligations": [],
                      "requested_base": base, "requested_head": head,
                      "reason": "trusted base CI adapter unavailable: " + type(error).__name__ + ": " + str(error),
                      "failure": {"kind": type(error).__name__, "message": str(error), "stderr": stderr}}
          print(json.dumps(plan, sort_keys=True, separators=(",", ":")))
          PY
          cat delivery-plan.json
          printf 'route=%s\n' "$(python3 -c 'import json; print(json.load(open("delivery-plan.json"))["route"])')" >> "$GITHUB_OUTPUT"
      - name: Name the runner image by its recipe
        # sha256(Dockerfile + required-tools.txt) at this head: the stamp
        # the Dockerfile bakes into /etc/boss-ci-stamp and locomotive.sh
        # recomputes, here so build-image (which has no checkout) and the
        # jobs that run in the image read one name. Held equal to
        # locomotive's own line by boss-testing's
        # the_ci_image_is_named_by_its_recipe. It is this job's ONLY
        # output writer besides `plan`, and the web suite's reader of this
        # file (apps/web/src/shell/web-ci-coverage.ts) admits it as this
        # exact text and no other: a second writer here could forge the
        # route that skips web (train 7474e3e0 went red on that reader).
        id: stamp
        run: |
          set -eu
          python3 -I -c 'import hashlib; print("ci_stamp=" + hashlib.sha256(b"".join(open("infra/forge/boss-ci/" + n, "rb").read() for n in ("Dockerfile", "required-tools.txt"))).hexdigest())' >> "$GITHUB_OUTPUT"

  lighter-validation:
    runs-on: docker
    needs: [delivery-plan]
    if: needs.delivery-plan.outputs.route == 'data'
    container:
      image: 10.20.0.15:3000/david/boss-ci:rust1.96
    steps:
      - name: Validate the frozen lighter tree with the matching tool image
        env:
          FORGE_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -eu
          git init -q .
          git remote add origin "http://x-access-token:${FORGE_TOKEN}@10.20.0.15:3000/${GITHUB_REPOSITORY}.git"
          git fetch -q origin "${GITHUB_SHA}" "${BASE_SHA}"
          git checkout -q --force "${GITHUB_SHA}"
          python3 -I - "$BASE_SHA" "$GITHUB_SHA" > delivery-plan.json <<'PY'
          import json, re, subprocess, sys
          base, head = sys.argv[1:]
          try:
              if not all(re.fullmatch(r"[0-9a-f]{40}|[0-9a-f]{64}", ref) for ref in (base, head)):
                  raise ValueError("CI requires full frozen base/head identities")
              source = subprocess.run(
                  ["git", "show", base + ":infra/forge/delivery-ci.py"],
                  check=True, capture_output=True, text=True).stdout
              executed = subprocess.run(
                  [sys.executable, "-I", "-", "--repo", ".", "--base", base,
                   "--head", head, "--stamp", "/etc/boss-ci-stamp"],
                  input=source, check=True, capture_output=True, text=True)
              plan = json.loads(executed.stdout)
              if not isinstance(plan, dict) or plan.get("schema") != 1 or plan.get("route") not in ("data", "software"):
                  raise ValueError("trusted CI adapter returned an invalid plan")
              if plan["route"] == "data" and (
                  plan.get("base") != base or plan.get("head") != head
                  or not isinstance(plan.get("obligations"), list) or not plan["obligations"]
                  or not re.fullmatch(r"[0-9a-f]{64}", plan.get("ci_runner_recipe_sha256", ""))):
                  raise ValueError("trusted CI adapter returned unbound lighter evidence")
          except Exception as error:
              stderr = getattr(error, "stderr", "")
              plan = {"schema": 1, "route": "software", "obligations": [],
                      "requested_base": base, "requested_head": head,
                      "reason": "trusted base CI adapter unavailable: " + type(error).__name__ + ": " + str(error),
                      "failure": {"kind": type(error).__name__, "message": str(error), "stderr": stderr}}
          print(json.dumps(plan, sort_keys=True, separators=(",", ":")))
          PY
          cat delivery-plan.json
          python3 -c 'import json; assert json.load(open("delivery-plan.json"))["route"] == "data", "lighter inputs or cached runner changed"'
          bash infra/gate.sh --quick

  # THE IMAGE IS BUILT BY THE PIPELINE, FROM THE TREE.
  #
  # Until 2026-08-16 the runner image was built by a person running
  # infra/forge/boss-ci/build.sh on the forge host. That is the same
  # defect class as every other failure of that day: an artefact whose
  # definition is in the tree but whose existence depends on somebody
  # remembering, with nothing able to tell the difference. It cost a
  # red train twice in one evening — `bunx` missing from the image,
  # then Node 18 against Playwright's required 20 — because the tree
  # said one thing and the cached image was another.
  #
  # The stamp already made the two comparable: build.sh bakes
  # sha256(Dockerfile + required-tools.txt) into /etc/boss-ci-stamp and
  # locomotive.sh recomputes it from the checkout and reds on a
  # mismatch. This job is the other half — the thing that makes the
  # image move when the tree does, so the stamp check reports drift
  # that cannot happen instead of drift nobody fixed.
  #
  # KANIKO, NOT DOCKER. Building with the daemon means mounting
  # /var/run/docker.sock into a CI job, which hands any workflow that
  # lands on this runner a path to host root. Kaniko builds in
  # userspace with no daemon and no socket. It also means no
  # actions/checkout here: that is a JavaScript action and the kaniko
  # image has no node, so the build takes its context straight from the
  # forge over git instead.
  #
  # NEEDS ONE SECRET: FORGE_PACKAGE_TOKEN, a Forgejo token with
  # read:repository + write:package. The conductor's
  # /etc/boss-train/forge.token is NOT it — that one is repo-scoped and
  # the package registry rejects it (verified: 401 on a blob upload).
  #
  # TAGGED BY RECIPE, NOT BY COMMIT, AND BUILT ONCE PER RECIPE (backlog
  # 399ee6c3). The downstream jobs pin boss-ci:<stamp>, the stamp
  # delivery-plan names, and never a floating :rust1.96: that tag is
  # served from the runner's local cache, and the cache lagged the
  # registry — build-image pushed a fresh image but locomotive ran the
  # runner's stale one, whose stamp no longer matched the tree (6aa603ef).
  # From then until 2026-10-18 the pin was boss-ci:<commit sha>, which
  # cannot be stale because no runner has seen it — and which is a
  # new 3.48 GB image for every train: 780 of them in 09-17..10-15, each
  # pushed to the registry and pulled into the system daemon whose disk
  # floor rate-limits the trains, while the recipe changed seven times in
  # two months. A STAMP TAG cannot be stale either, in the one way that
  # matters: whatever a runner holds under boss-ci:<stamp> was built from
  # that recipe, and locomotive.sh still checks the baked stamp against
  # the tree, so a wrong image is a named red, never a quiet pass.
  #
  # So the build is SKIPPED when the registry already serves the stamp
  # AND :rust1.96 serves the same manifest. The second half is the
  # floating tag's own healing: a train whose recipe was built and then
  # went red leaves :rust1.96 (the gate runner's, the dev pod's and the
  # lighter route's image) on a recipe main does not carry, and the next
  # train's rebuild has always put it back. Any registry read that fails
  # builds, as every train did before — a minute, never a red. The read
  # is anonymous (the package is public; ci-image-report.sh reads it the
  # same way), so the package token never rides in its argv. Pinned by executing
  # this block in boss-testing's the_ci_image_is_named_by_its_recipe.
  build-image:
    runs-on: docker
    needs: [delivery-plan]
    if: needs.delivery-plan.outputs.route != 'data'
    container:
      # FROM THE FORGE, NOT gcr.io. This executor, and the two bases the
      # Dockerfile FROMs, are copies in our own registry, put there by
      # infra/forge/mirror-base-images.sh (the `mirror-base-images` ops
      # verb; its IMAGES list is the one source of truth for the tags).
      # `lookup gcr.io ... no such host` redded trains #236 and #250
      # with every car clean, because fetching this image resolved a
      # public name through a resolver with no redundancy. Now the
      # runner pulls it the way every job below pulls boss-ci — same
      # registry, same credential — and a healthy build-image resolves
      # no public name at all. infra/lint/the-build-pulls-only-mirrored-
      # bases.sh pins the pair: an image here, or a FROM in the
      # Dockerfile, that is not a tag the mirror list carries fails the
      # pre-flight.
      image: 10.20.0.15:3000/david/kaniko-executor:v1.23.2-debug
    steps:
      - name: Build and push the runner image
        env:
          TOKEN: ${{ secrets.FORGE_PACKAGE_TOKEN }}
          # The job's own repo-scoped credential, the same one locomotive
          # passes to post ITS refusal status. FORGE_PACKAGE_TOKEN above is
          # read:repository + write:package and cannot write a commit
          # status; this can. Used ONLY on the exhausted-transient path
          # below, to post a `refused:` status so the conductor's strike
          # rule spares the innocent cars aboard (train.rs
          # verdict_strikes_cars / any_failing_check_refused).
          FORGE_TOKEN: ${{ github.token }}
          # Kaniko resolves a git:// context over HTTPS by default and
          # the forge speaks plain HTTP on 3000, so the first run died
          # with "server gave HTTP response to HTTPS client". This is
          # the documented knob; the alternative is terminating TLS in
          # front of Forgejo, which is a bigger change than this job.
          GIT_PULL_METHOD: http
          # The image's name: sha256(Dockerfile + required-tools.txt) at
          # this head, from delivery-plan (this container has no checkout).
          CI_STAMP: ${{ needs.delivery-plan.outputs.ci_stamp }}
        run: |
          set -eu
          [ -n "${TOKEN:-}" ] || {
            echo "build-image: FORGE_PACKAGE_TOKEN is not set."
            echo "  Create a Forgejo token with read:repository + write:package"
            echo "  and add it as an Actions secret. Without it the runner image"
            echo "  cannot be rebuilt, and locomotive will red on any change to"
            echo "  infra/forge/boss-ci/ — which is the stamp working, not a bug."
            exit 1
          }
          # An empty or misshapen stamp names no image locomotive could
          # pull; say so here, not as a pull error two jobs later.
          case "${CI_STAMP:-}" in
            *[!0-9a-f]*|'') stamp_ok=0 ;;
            *) stamp_ok=1 ;;
          esac
          if [ "$stamp_ok" -ne 1 ] || [ "${#CI_STAMP}" -ne 64 ]; then
            echo "build-image: CI_STAMP '${CI_STAMP:-}' is not a sha256 — delivery-plan's"
            echo "  'Name the runner image by its recipe' step did not name the image."
            exit 1
          fi
          # ALREADY BUILT? See the note above the job. Every failed read
          # leaves a side empty, and an empty side builds.
          REG=10.20.0.15:3000
          ACCEPT='application/vnd.oci.image.index.v1+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json, application/vnd.docker.distribution.manifest.list.v2+json'
          bearer="$(wget -q -O - "http://${REG}/v2/token?service=container_registry&scope=repository:david/boss-ci:pull" 2>/dev/null \
            | sed -n 's/.*"token" *: *"\([^"]*\)".*/\1/p')" || bearer=""
          want=""; have=""
          if [ -n "$bearer" ]; then
            want="$(wget -q -O - --header "Accept: ${ACCEPT}" --header "Authorization: Bearer ${bearer}" \
              "http://${REG}/v2/david/boss-ci/manifests/${CI_STAMP}" 2>/dev/null)" || want=""
            have="$(wget -q -O - --header "Accept: ${ACCEPT}" --header "Authorization: Bearer ${bearer}" \
              "http://${REG}/v2/david/boss-ci/manifests/rust1.96" 2>/dev/null)" || have=""
          fi
          if [ -n "$want" ] && [ "$want" = "$have" ]; then
            echo "build-image: ${REG}/david/boss-ci:${CI_STAMP} is in the registry and :rust1.96 serves"
            echo "  the same manifest — this recipe is built; nothing to build."
            echo "  locomotive and web run in boss-ci:${CI_STAMP}."
            exit 0
          fi
          if [ -z "$bearer" ]; then
            echo "build-image: building — the registry handed out no pull token, so whether boss-ci:${CI_STAMP} exists is unknown."
          elif [ -z "$want" ]; then
            echo "build-image: building — boss-ci:${CI_STAMP} is not in the registry (a new recipe, or an unreadable manifest)."
          else
            echo "build-image: building — :rust1.96 serves another recipe than boss-ci:${CI_STAMP}; the rebuild moves it back."
          fi
          printf '{"auths":{"10.20.0.15:3000":{"auth":"%s"}}}' \
            "$(printf 'david:%s' "$TOKEN" | base64 | tr -d '\n')" \
            > /kaniko/.docker/config.json
          # RETRIED, BECAUSE ONE DROPPED LOOKUP USED TO COST A TRAIN.
          #
          # Run 248 (2026-08-26) died here with `lookup
          # production.cloudfront.docker.com on 127.0.0.11:53: no such
          # host` while fetching a BLOB — kaniko had already cached the
          # manifest, so a warm cache does not protect this path. The
          # other four jobs were skipped, a six-car train went red with
          # no car at fault, and because the forge has no rerun API the
          # only recovery was cancel-and-reboard: every car back to the
          # dock and two hours of gate time queued again.
          #
          # Container DNS here has no redundancy at any hop —
          # 127.0.0.11 to the host's systemd-resolved stub to a single
          # upstream with no secondary — so a single dropped answer
          # fails the build outright.
          #
          # SINCE THE BASES MOVED TO THE FORGE (this job's container image
          # above, and the Dockerfile's FROMs), a healthy build resolves
          # no public name: executor and bases alike come from
          # 10.20.0.15:3000. The loop stays as the safety net for that
          # registry path, and for what the Dockerfile's RUN layers still
          # fetch on a cache miss — apt, nodesource, playwright's CDN —
          # which the mirror does not cover.
          #
          # ONLY TRANSIENT FAILURES ARE RETRIED. Retrying everything
          # would turn a broken Dockerfile into three identical
          # failures and triple the time before the real message is
          # visible. This is the same line boss-testing draws for the
          # database: a closed socket is weather, a rejected statement
          # is a defect in the change under test and must fail loudly
          # on the first try.
          # Output is captured in a VARIABLE, not a file. The kaniko
          # executor image is minimal and has no /tmp: redirecting to
          # /tmp/kaniko.log fails with "nonexistent directory" and takes
          # the whole build with it (caught on train #121, 2026-08-27 —
          # a fix for a 2% DNS flake that became a 100% break, because
          # the gate does not run build-image and could not see it).
          MAX_ATTEMPTS=3
          attempt=1
          while :; do
            # IDEMPOTENT RETRY. Kaniko clones the git:// --context into
            # /kaniko/buildcontext (config.BuildContextDir, v1.23.2), and
            # go-git's PlainClone refuses a directory that already holds a
            # repo. So attempt 1's clone made attempt 2 die with "error
            # resolving source context: repository already exists" — a
            # message the network-fault classifier below does NOT match,
            # so the loop bailed hard ("not a network fault, not
            # retrying") and a single DNS flake on attempt 1 became a
            # guaranteed red the retry could never clear (run 469, job
            # 2041, train #236). Removing the clone restores the exact
            # precondition of attempt 1 — a nonexistent context dir kaniko
            # re-clones from scratch — so a real transient gets a real
            # second try. No-op on attempt 1 (the dir does not exist yet);
            # touches only the git-context clone, never kaniko's layer
            # cache (/cache) or the remote --cache-repo.
            rm -rf /kaniko/buildcontext
            set +e
            OUT="$(/kaniko/executor \
                --context "git://david:${TOKEN}@10.20.0.15:3000/david/boss.git#${GITHUB_SHA}" \
                --context-sub-path infra/forge/boss-ci \
                --dockerfile Dockerfile \
                --destination 10.20.0.15:3000/david/boss-ci:rust1.96 \
                --destination "10.20.0.15:3000/david/boss-ci:${CI_STAMP}" \
                --insecure --skip-tls-verify \
                --cache=true \
                --cache-repo 10.20.0.15:3000/david/boss-ci-cache 2>&1)"
            rc=$?
            set -e
            printf '%s\n' "$OUT"
            [ "$rc" -eq 0 ] && break
            if ! printf '%s' "$OUT" | grep -qiE 'no such host|i/o timeout|dial tcp|connection refused|TLS handshake timeout|temporary failure in name resolution'; then
              echo "build-image: failure is not a network fault, not retrying."
              echo "  The message above is the real one; read it rather than the retry count."
              exit 1
            fi
            if [ "$attempt" -ge "$MAX_ATTEMPTS" ]; then
              echo "build-image: transient network fault persisted across ${MAX_ATTEMPTS} attempts."
              echo "  This is no longer weather. Check DNS on the runner host:"
              echo "    resolvectl status        # is there still only one upstream?"
              echo "    docker run --rm alpine:3 getent hosts production.cloudfront.docker.com"
              # SAY "refused" WHERE THE CONDUCTOR READS — symmetric with
              # locomotive.sh. We reach here ONLY after the classifier above
              # deemed the fault TRANSIENT on every attempt: a real break
              # (a broken Dockerfile, a compile error) matched none of the
              # network patterns and already exited at "not a network fault,
              # not retrying" WITHOUT reaching this branch. So a `refused:`
              # status posted here can never mask a broken car — the guard
              # is the wrapper's own transient determination, never a bare
              # failure. The job still exits 1 (a red); the extra commit
              # status is what tells the conductor's strike rule to spare
              # the cars aboard, exactly as locomotive's disk-floor refusal
              # does — train.rs any_failing_check_refused matches a FAILING
              # check whose description starts with "refused". Best-effort:
              # no token or a rejected POST is one line and the old
              # behaviour (a plain red that strikes) — never a second
              # failure mode. The description is a FIXED string, so there is
              # nothing to JSON-escape and no need for python3 (absent from
              # kaniko's busybox); the POST uses busybox wget.
              if [ -n "${FORGE_TOKEN:-}" ] && [ -n "${GITHUB_SHA:-}" ] && [ -n "${GITHUB_REPOSITORY:-}" ]; then
                api="${GITHUB_API_URL:-http://10.20.0.15:3000/api/v1}"
                body="$(printf '{"state":"failure","context":"CI / build-image refusal","description":"refused: build-image infra fault (registry/DNS unreachable)","target_url":"%s"}' \
                  "${GITHUB_SERVER_URL:-http://10.20.0.15:3000}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID:-}")"
                if wget -q -O /dev/null \
                     --header="Authorization: token ${FORGE_TOKEN}" \
                     --header="Content-Type: application/json" \
                     --post-data="$body" \
                     "${api}/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}"; then
                  echo "build-image: refusal posted as a commit status (context 'CI / build-image refusal') — the conductor will spare the cars."
                else
                  echo "build-image: could not post the refusal status — the conductor will read this as a plain red."
                fi
              else
                echo "build-image: no FORGE_TOKEN/GITHUB_SHA/GITHUB_REPOSITORY in the environment — refusal not posted, the conductor will read a plain red."
              fi
              exit 1
            fi
            echo "build-image: transient network fault, retrying (${attempt}/${MAX_ATTEMPTS})."
            attempt=$((attempt + 1))
            sleep $((attempt * 5))
          done

  # The locomotive goes first. On 2026-08-12 forge train #1 burned five
  # red rounds and every cause was environment, not car code — so the
  # environment is now checked in seconds before either heavy job
  # spends minutes in it. Costs ~15s of serialization on a green run;
  # buys a named failure with its remediation in the log instead of a
  # panic 20 minutes into the suite.
  # It runs AFTER build-image now, not first: its stamp check compares
  # the image against the tree, and asking that question before the
  # image has been rebuilt from the tree only ever reports the lag.
  locomotive:
    runs-on: docker
    needs: [delivery-plan, build-image]
    if: needs.delivery-plan.outputs.route != 'data'
    container:
      image: 10.20.0.15:3000/david/boss-ci:${{ needs.delivery-plan.outputs.ci_stamp }}
    steps:
      - name: Check out from the forge, not github.com
        # actions/checkout is a JavaScript action the runner pulls from
        # github.com before the job starts; the runner's container DNS
        # has no redundancy (see build-image's retry note), so one
        # dropped lookup there reds the whole train with no car at fault
        # — d9a34560. The repo is on the forge at a LAN IP, so a git
        # clone by IP resolves no name. github.token is the job's own
        # repo-scoped credential, the same one locomotive passes below.
        env:
          FORGE_TOKEN: ${{ github.token }}
        run: |
          set -eu
          git init -q .
          git remote add origin \
            "http://x-access-token:${FORGE_TOKEN}@10.20.0.15:3000/${GITHUB_REPOSITORY}.git"
          git fetch -q --depth=1 origin "${GITHUB_SHA}"
          git checkout -q --force FETCH_HEAD

      - name: Locomotive check
        # The job token, so a REFUSAL (disk floor, stale runner image,
        # wrong uid — the runner declining to run, not a check failing)
        # can be posted as a commit status the conductor reads; without
        # it a refusal is a plain red that strikes every car aboard.
        env:
          FORGE_TOKEN: ${{ github.token }}
        run: bash infra/forge/locomotive.sh

  # THE FRONTEND JOB THAT WAS ONLY EVER ON GITHUB.
  #
  # `.github/workflows/ci.yml` has carried a `web` job — typecheck,
  # unit, build, and the mocked Playwright smoke — since 2026-08-08.
  # This file, the one that actually gates a train, had none. GitHub is
  # the public mirror and is pushed by hand with David's sign-off, so
  # in practice those 13 spec files ran when somebody remembered, which
  # is the same as never: after the `/system/*` → `/it/*` rename the
  # route-smoke drift test sat red and unseen, and the crawl was
  # exercising a legacy alias instead of the twenty canonical paths.
  #
  # THIS PARAGRAPH USED TO SAY the gate deliberately does not run
  # `test:mocked`, that boss-ci has no browser, and that playwright is
  # absent from required-tools.txt because it arrives at run time. All
  # three stopped being true and the words stayed, which is the worst
  # kind of comment: a reader checking whether the gate covers the
  # mocked suite would have been told, in the file that gates trains,
  # that it does not.
  #
  # What is true, read on 2026-09-09: infra/gate.sh runs the suite as
  # the `web-suite (unit+build+mocked)` check, unconditionally in full
  # mode — `boss gate` skipping it is exactly how trains #160 and #161
  # died — and only `--auto` still scopes it to web-touching changes.
  # The browser is BAKED INTO boss-ci at /opt/ms-playwright, pinned to
  # the workspace's @playwright/test, and the gate-runner points
  # PLAYWRIGHT_BROWSERS_PATH there; nothing is downloaded per job.
  # `playwright` stays out of required-tools.txt because that manifest
  # lists binaries the gate INVOKES by name and the suite reaches the
  # browser through bun, not because it arrives at run time.
  #
  # The image DOES now carry Node 20 (nodesource, not bookworm's 18),
  # because Playwright 1.61 refuses to start below 20 and that is not
  # something a job step can paper over.
  #
  # IT RUNS IN SERIES, AND IT IS NOT FREE. This line used to say the job
  # "runs parallel to `test`, so it adds no wall-clock" — there has been
  # no `test` job since design 128b5496 (2026-09-13), and the graph is a
  # chain: build-image -> locomotive -> web, on the forge's one runner
  # slot, so every step here is track time on a train (backlog 81ee98b3).
  #
  # SO IT RUNS ONLY WHAT THE TRAIN'S GATE CANNOT. The conductor gates
  # every train branch with `--auto` and merges none without that verdict
  # (BOSS_TRAIN_GATE_REQUIRED=1). In `--auto`, gate.sh runs svelte-check
  # and every web unit suite on every tree, and the build and mocked suite
  # whenever the train changes a file they read — derived from their own
  # files by apps/web/scripts/web-suite-reads.ts (a244c6e7). On the same
  # assembled tree, the steps below were those checks run a second time.
  #
  # What the gate cannot prove is THIS image. It runs the
  # boss-ci:rust1.96 it pulled at launch, built from the recipe main
  # carries; this job runs in the image build-image made from the train's
  # own infra/forge/boss-ci/. So the `recipe` step compares that
  # directory at the PR's base and head, and the steps after it run only
  # when it changed — or when the step could not tell, which answers
  # `yes`, as every train ran them before (backlog 81ee98b3, 2026-10-20).
  # The job itself stays, always green when it skips, so the `CI / web`
  # context the conductor and the yard read still reports.
  # Pinned by boss-testing's gate_sh.rs
  # the_forge_web_job_runs_only_what_the_train_gate_may_skip (the guard
  # on each step), the_forge_web_job_runs_on_a_new_recipe.rs (the step's
  # answer, executed), and apps/web's gate-matches-ci.test.ts (that the
  # train gate's lane pays for what these steps no longer run).
  web:
    runs-on: docker
    needs: [delivery-plan, locomotive]
    if: needs.delivery-plan.outputs.route != 'data'
    container:
      image: 10.20.0.15:3000/david/boss-ci:${{ needs.delivery-plan.outputs.ci_stamp }}
    steps:
      - name: Check out from the forge, not github.com
        # actions/checkout is a JavaScript action the runner pulls from
        # github.com before the job starts; the runner's container DNS
        # has no redundancy (see build-image's retry note), so one
        # dropped lookup there reds the whole train with no car at fault
        # — d9a34560. The repo is on the forge at a LAN IP, so a git
        # clone by IP resolves no name. github.token is the job's own
        # repo-scoped credential, the same one locomotive passes below.
        env:
          FORGE_TOKEN: ${{ github.token }}
        run: |
          set -eu
          git init -q .
          git remote add origin \
            "http://x-access-token:${FORGE_TOKEN}@10.20.0.15:3000/${GITHUB_REPOSITORY}.git"
          git fetch -q --depth=1 origin "${GITHUB_SHA}"
          git checkout -q --force FETCH_HEAD

      - name: Does this train change the runner image's recipe?
        # infra/forge/boss-ci/ at the PR's base against this head, as two
        # trees: no history is needed past the one commit the base fetch
        # brings. It answers `no` only when the base is fetched, carries
        # the directory, and differs from this head nowhere in it; any
        # read that fails falls through to `yes` — the steps below run —
        # with git's own error left in this log.
        id: recipe
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -u
          if [ -n "${BASE_SHA:-}" ] && git fetch -q --depth=1 origin "${BASE_SHA}" \
            && git rev-parse -q --verify "${BASE_SHA}:infra/forge/boss-ci" \
            && git diff --quiet "${BASE_SHA}" HEAD -- infra/forge/boss-ci; then
            echo "web: infra/forge/boss-ci is the same at the base ${BASE_SHA} and here, so changed=no"
            printf 'changed=no\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "web: infra/forge/boss-ci changed since the base '${BASE_SHA:-}', or could not be compared, so changed=yes"
          printf 'changed=yes\n' >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        # PUPPETEER_SKIP_DOWNLOAD for the same reason svelte-check.sh
        # sets it: boss-web depends on puppeteer, whose postinstall
        # browser download fails in this container, and bun aborts the
        # WHOLE install on a failed postinstall — so nothing installs
        # and the failure reads as a missing tool.
        if: steps.recipe.outputs.changed != 'no'
        working-directory: apps/web
        run: PUPPETEER_SKIP_DOWNLOAD=1 bun install --frozen-lockfile

      - name: web-kit unit tests
        # From libs/web-kit, because apps/web's `test:unit` below runs
        # apps/web's own src/ and scripts/, not these. web-kit's 7 test
        # files were once executed by no job at all (feedback 80be8359);
        # the train gate runs them on every tree now (a244c6e7), and here
        # they prove a new recipe (see the note above the job).
        #
        # No extra install: `libs/*` is a workspace member, so the root
        # `bun install` above already resolved it, and these tests need
        # only `bun:test` — no browser, no Playwright.
        if: steps.recipe.outputs.changed != 'no'
        working-directory: libs/web-kit
        run: bun run test:unit

      - name: Unit tests
        if: steps.recipe.outputs.changed != 'no'
        working-directory: apps/web
        run: bun run test:unit

      - name: Build
        if: steps.recipe.outputs.changed != 'no'
        working-directory: apps/web
        run: bun run build

      - name: Frontend smoke (mocked backend)
        # Every /api call is intercepted in-browser, so there is no
        # backend and no seeding — 61 assertions in ~40s.
        #
        # NO BROWSER INSTALL STEP, on purpose. The CI image bakes
        # chromium and its system libraries at PLAYWRIGHT_BROWSERS_PATH
        # (infra/forge/boss-ci/Dockerfile, pinned to the workspace's
        # @playwright/test 1.61.0), so the `bun x playwright install
        # --with-deps chromium` that used to sit here downloaded a
        # browser the image already had — from cdn.playwright.dev,
        # which resolved to an unroutable IPv6 address and redded
        # train #162 (a700d3a4) — and ran apt for libraries already
        # present. A step that fetches from the public internet on
        # every run is a network dependency the image was built to
        # remove; the suite finds the baked browser through the
        # image's own env. Moving the pin in package.json means
        # moving it in the Dockerfile in the same car.
        if: steps.recipe.outputs.changed != 'no'
        working-directory: apps/web
        run: bun run test:mocked

  # THE RUST CHECKS RUN ON THE CLUSTER, NOT HERE (design 128b5496, David
  # 2026-09-12; cars 1–2 landed 2026-09-13). Until then this file carried
  # `fast` (fmt + clippy) and `test` (infra/gate.sh against a postgres
  # service) — 13 of the ~17 minutes every train spent on the forge's one
  # runner slot, cold, in a fresh container. The conductor now files a
  # gate-run of the TRAIN BRANCH on the cluster when it opens the PR, and
  # that gate runs the same infra/gate.sh warm on the reflink seed in 3–5
  # minutes; the train merges only when the forge's status here AND that
  # gate-run's verdict are green (boss-cli train_gate.rs). What stays
  # here is what needs the forge: the image build, the locomotive's
  # host checks, and the web suite.
  #
  # NO JOB HERE WRITES TO THE SYSTEM OF RECORD (backlog 37742794; David's
  # answer to design-doc c8502e17, `ci-reclaim`, 2026-10-07). Until then a
  # `reclaim` job ended every run by measuring the runner's disk and, below
  # the sweep's floor, POSTing an ops-request for the `reclaim-disk` verb —
  # signed `automation:ci-disk-reclaim`, asserting platform-admin, from a
  # container that had just checked out and run a train BRANCH. A CI job
  # runs branch code, so it may not hold the estate machine token (decision
  # c395e62c), and without one that POST is a request every machine gate
  # records as one it would refuse — and refuses, the day the door
  # enforces. It is named as deliberately refused, and rather than leave a
  # request in the tree whose designed answer is a refusal, the job and its
  # script (infra/forge/request-reclaim-disk.sh) are gone.
  #
  #
  # THE RECLAIM STILL RUNS, on the host's clock. That job never reclaimed
  # anything itself — it holds no docker socket, on purpose (see the top
  # of this file) — it asked the forge to run
  # infra/forge/disk-floor-sweep.sh sooner than its hourly timer would,
  # and its own header called itself an accelerator: "a request this
  # script cannot file costs LATENCY, never a missed reclaim". Under
  # enforce every one of its requests would have been refused, so the
  # hourly timer alone is the state the decision already chose; deleting
  # the job makes that the state today, where it can be watched. The
  # timer defends 100 GB and the locomotive refuses below 40.
  #
  # WHAT IS LOST, said plainly: the reclaim no longer follows the build
  # within a minute. If the 60 GB between those two floors stops being
  # enough for an hour of trains (backlog 0357e0eb read 99 GB free and
  # then 60, fifteen minutes apart, on 2026-09-11, against the 30 GB
  # margin of that day),
  # the repair is the timer's cadence, on the host — never a write from
  # here.
  #
  # AND THE RECORD of each reclaim — free space before and after, what
  # the per-train image pass freed, how the run ended — is on the sweep's
  # own maintenance-disk-floor-sweep packet, written by the host that did
  # the work. Pinned by
  # crates/core/boss-testing/tests/the_reclaim_follows_the_build.rs.
