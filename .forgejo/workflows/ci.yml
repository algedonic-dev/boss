# Forgejo CI — the validation half of the internalized loop.
#
# .github/workflows/ci.yml stays as-is for the public mirror; this is the
# same gate running on our own iron, so a change is validated where it is
# built and deployed rather than by someone else's infrastructure.
#
# The container image is ours, from our registry, and carries node as
# well as the Rust toolchain: Forgejo runs actions/checkout as a
# JavaScript action *inside* the job container, so an image without node
# fails every run at checkout with exitcode 127 before a line of the
# gate executes.
#
# Deliberately split into two jobs. `fast` is fmt + clippy and returns in
# under a minute on the Ryzen — that is the feedback loop you actually
# live in. `test` carries the Postgres service and runs `infra/gate.sh`,
# and is allowed to take as long as it takes. Reporting them separately
# means a formatting slip is not hidden behind a ten-minute test run, and
# the bottleneck is visible rather than averaged away.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The locomotive goes first. On 2026-08-12 forge train #1 burned five
  # red rounds and every cause was environment, not car code — so the
  # environment is now checked in seconds before either heavy job
  # spends minutes in it. Costs ~15s of serialization on a green run;
  # buys a named failure with its remediation in the log instead of a
  # panic 20 minutes into the suite.
  locomotive:
    runs-on: docker
    container:
      image: 10.20.0.15:3000/david/boss-ci:rust1.96
    steps:
      - uses: actions/checkout@v4

      - name: Locomotive check
        run: bash infra/forge/locomotive.sh

  fast:
    runs-on: docker
    needs: [locomotive]
    container:
      image: 10.20.0.15:3000/david/boss-ci:rust1.96
    steps:
      - uses: actions/checkout@v4

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        # -D warnings per CLAUDE.md: warnings are errors in this workspace.
        run: cargo clippy --workspace --all-features --tests -- -D warnings

  test:
    runs-on: docker
    needs: [locomotive]
    container:
      image: 10.20.0.15:3000/david/boss-ci:rust1.96
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: boss
          POSTGRES_PASSWORD: boss
          POSTGRES_DB: boss
        # Matches the deployed cluster: ~24 services each hold an sqlx
        # pool, so the default max_connections=100 saturates.
        options: >-
          --health-cmd "pg_isready -U boss"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgres://boss:boss@postgres:5432/boss
      BOSS_POSTGRES_URL: postgres://boss:boss@postgres:5432/boss
      # boss-testing creates a scratch database per test and defaults its
      # admin connection to loopback. That holds on GitHub, where the
      # service binds to the runner itself, but in a container job
      # Postgres is a separate host on the job network — without this
      # every DB-backed test dies on "Connection refused".
      BOSS_TEST_POSTGRES_ADMIN_URL: postgres://boss:boss@postgres:5432/postgres
      # TestDb refuses to run against a server that hosts a database
      # named `boss`, because that is what tells a BOSS deployment apart
      # from a scratch instance (the 2026-08-14 port-forward incident:
      # 582 scratch databases on the production volume). CI is the one
      # place that premise is false by construction — the service
      # container above is created with POSTGRES_DB=boss precisely so
      # `Apply schema` can migrate it, and it is destroyed with the job.
      # This is the disposable-server case the guard's own message names.
      BOSS_TEST_ALLOW_PRODUCTION_SERVER: "1"
    steps:
      # fetch-depth: 0 because the gate's migrations-append-only check
      # asks git whether this branch modified a migration that already
      # exists on the trunk. checkout@v4 defaults to a depth-1 clone,
      # where there is no trunk to compare against — and that check
      # refuses to run rather than pass silently, so a shallow clone
      # would red every train instead of quietly under-covering. The
      # extra history is cheap; the repo's .git is ~20M.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply schema
        run: infra/postgres/migrate.sh -- psql "$DATABASE_URL"

      - name: Gate
        # ONE definition of the rust gate — the same script an agent runs
        # before pushing a car (`infra/gate.sh -p <crate>`) and the same
        # one .github/workflows/ci.yml's rust job runs, so CI and the
        # local gate cannot drift (CLAUDE.md §9a). The check roster, each
        # check's flags, and the provenance comments for both live IN the
        # script; environment setup (image, services, schema) stays here.
        # boss-testing/tests/gate_sh.rs pins this step and the roster.
        #
        # This replaces the `cargo build --workspace` + `cargo test
        # --all-features` steps that stood here: gate.sh runs both, plus
        # clippy, fmt, and the 13-lint roster. Between the forge cutover
        # (2026-08-12) and this change the forge workflow ran neither the
        # roster nor a default-feature build, so the lints — including
        # no-wallclock, tier-import-audit, no-secrets, schema-converge —
        # were unenforced on the branch that actually gates every train.
        run: infra/gate.sh
