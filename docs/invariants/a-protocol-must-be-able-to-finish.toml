[[invariant]]
id = "a-protocol-must-be-able-to-finish"
claim = "A spec may occupy the ACTIVE slot only if it is viable — every step reachable from a trigger, every step able to reach a terminal, the graph acyclic, and every fork point covering all values of its discriminating enum."
source = "docs/design/correctness-protocol.md §Enforcement.1; crates/core/boss-jobs/src/workflow_lint.rs"
enforcement = "enforced"
mechanism = "crates/core/boss-jobs/src/workflow_lint.rs"
last_verified = ""
note = "`gate_active` is the publish gate, called from publish, publish_authored and bootstrap_reconcile in both adapters; a draft may still be SAVED unviable. Pinned end-to-end by crates/core/boss-jobs/tests/workflow_publish_gate.rs, whose assertion is that an unviable spec is refused at publish, not at the next pod roll. Provenance: the 2026-08-13 protocol-retro incident. A third layer runs at boot — crates/core/boss-jobs/src/workflow_quarantine.rs refuses to start against a broken registry, and refuses to strand open Jobs pinned to the offending row."
