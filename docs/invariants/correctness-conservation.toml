[[invariant]]
id = "correctness-conservation"
claim = "For every conserved quantity, `in − out = stock` to the unit."
source = "docs/design/correctness-protocol.md §The five properties.2"
enforcement = "checked"
mechanism = "infra/lint/conservation-invariants.sh — 8 platform SQL invariants (trial balance, inventory non-negative, closed jobs / paid invoices / paid bills carry their dates, steps-sourced facts resolve, job subjects and declared subject edges resolve) plus the balance-sheet A = L + E read — run hourly IN THE CLUSTER on every instance against its own database by the boss-conservation-invariants CronJob (infra/cluster/manifests/), filing a maintenance-conservation-invariants packet on that instance; examples/brewery/conservation-invariants.sh — the 14 brewery invariants (GL control accounts 1300/1310/1320/cash, accrual >= remittance for sales tax / payroll / deferred revenue, raw and FG GL balance identical to sum of value_cents, batch consume covers produce, opening-asset seed JEs, period close reflects net P&L) — run by the same chore on the playground and by infra/postgres/validate-brewery-sim.sh after a regen"
last_verified = "2026-09-18"
note = "The best-held of the five, and still `checked` rather than `enforced`: it needs a live populated DB and settles only over a full regen, so it cannot gate a PR. Until 2026-09-18 (H12, backlog 236529aa) the one sweep ran only on boss-gcp against the retired second stack's postgres and died with it on 2026-09-15; the platform eight now cover every tenant, and a tenant's chart-of-accounts invariants live in its own directory."
