[[invariant]]
id = "a-toolchain-pin-resolves-without-the-network"
claim = "The rustup channel in rust-toolchain.toml names the exact patch version installed in the CI image, so the pin resolves locally. A channel the image does not carry under that exact name sends rustup to static.rust-lang.org before any job does work."
source = "rust-toolchain.toml; infra/forge/boss-ci/Dockerfile; train 1597b4a4 job `fast`, 2026-08-27"
enforcement = "unenforced"
mechanism = ""
last_verified = "2026-08-27"
note = "rust-toolchain.toml said `1.96` while the image ships `1.96.1`, and to rustup those are two different toolchain names. It could not resolve the pin locally, so every job and every gate began by fetching a channel manifest from static.rust-lang.org — for a toolchain that was already installed, with both required components. Proven by running the CI image with `--network none`: channel = \"1.96\" gives 'syncing channel updates for 1.96' then a download error; channel = \"1.96.1\" gives 'rustc 1.96.1 (31fca3adb 2026-06-26)' instantly. That fetch is how `fast` died in 12 seconds on train 1597b4a4 while the house DNS was wobbling, and it made a public host a hard dependency of CI for no benefit whatsoever. Both sides now name the patch, because a floating `1.96` in the Dockerfile's FROM would reintroduce it the moment the base tag moves to 1.96.2. WHAT WOULD ENFORCE IT: a lint comparing the channel in rust-toolchain.toml against the version in the Dockerfile's FROM line — both are single greppable tokens in files that already sit beside each other, so this is genuinely tractable and is the obvious next car. The stronger version is behavioural and cheap: run the image with `--network none` and assert `rustc --version` succeeds, which catches the whole class rather than one spelling of it. THE GENERAL RULE this is one instance of: a build dependency that could be satisfied locally must be, because every remaining public host is a coin flip that the pipeline has to win on every single run."
