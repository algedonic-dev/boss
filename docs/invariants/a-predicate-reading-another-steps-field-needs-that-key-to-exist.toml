[[invariant]]
id = "a-predicate-reading-another-steps-field-needs-that-key-to-exist"
claim = "A `ready_when` clause that reads `steps.X.metadata.K` for a step X that may not have set K requires X to declare K in `metadata_defaults`, or the clause answers from `Absent` — false under `=`, TRUE under `!=` and `NOT` — and the step is silently skipped, or silently opened before X has run."
source = "crates/core/boss-expr/src/lib.rs (Value::Absent, resolve_identifier, the AND/OR short-circuit); crates/core/boss-jobs/src/registry.rs (eval_ready_when, build_context, reevaluate, refs_all_terminal, predicate_refs_job_metadata); crates/core/boss-jobs/src/workflow_lint.rs (synth_fork_payload)"
enforcement = "unenforced"
mechanism = ""
last_verified = "2026-09-22"
note = "RE-DERIVED 2026-09-22 (backlog f1bfc954) against today's evaluator; the four measurements are `registry::tests::*absent_key*` in boss-jobs. The 2026-08-15 note said boss-expr errored on a missing identifier and that OR did not short-circuit past the error, so one unreadable clause took down a predicate that was otherwise true. BOTH ARE GONE — `resolve_identifier` answers `Absent` (7b756357) and AND/OR return on the left operand (151d1e04) — and the conclusion they carried is gone with them. A disjunctive predicate now routes correctly past an unreadable clause, which was the exact case the old note called the one that bites the protocols worth writing. WHAT REPLACES IT IS NOT SMALLER. An absent key no longer raises; it ANSWERS, and the answer is a guess the author never made. Under `=` it is false, and once every referenced step is terminal `reevaluate` turns that into Skipped — indistinguishable from the branch being honestly not taken, with no log line and no lint. Under `!=` or `NOT` it is TRUE, because `Absent` is unequal to every literal, so the step opens BEFORE the step it claims to depend on has run at all. That direction is new: the old mechanism could only ever hold a step back, and this one fails open. The original pending-forever symptom survives in one shape only — a predicate that also reads `job.metadata.*`, where the skip is deliberately suppressed (aa9980c8) because job metadata can be written at any time, so the step is neither ready nor skipped nor logged. The fix in the protocol is unchanged: a `metadata_defaults` entry for the key, which materialization stamps onto every step including pending ones (verified live: an open packet's still-pending `closed` step already carries its `outcome_kind` default). What would enforce it: the viability lint already builds the reference set (`predicate_step_refs`) and can resolve each `steps.X.metadata.K`; the check is that K appears in X's `metadata_defaults` unless X is an ancestor of the step whose predicate it is, since an ancestor's completion sets its own declared fields. Not written yet because the ancestor exemption needs the same transitive walk `synth_fork_payload` gained, and the two should share it rather than each grow a copy. Until then the fork-coverage payload models the rule without asserting it: declared fields are seeded on DONE steps only, so a clause reading an unrun step's unset field reads as uncoverable in the lint exactly as it behaves at run time."
