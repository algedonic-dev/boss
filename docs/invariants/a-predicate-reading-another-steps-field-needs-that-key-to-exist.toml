[[invariant]]
id = "a-predicate-reading-another-steps-field-needs-that-key-to-exist"
claim = "A `ready_when` clause that reads `steps.X.metadata.K` for a step X that may not have run requires X to declare K in `metadata_defaults`, or the whole predicate errors and the step silently never becomes ready."
source = "crates/core/boss-expr/src/lib.rs (UnknownIdentifier); crates/core/boss-jobs/src/registry.rs (eval_ready_when, build_context); crates/core/boss-jobs/src/workflow_lint.rs (synth_fork_payload)"
enforcement = "unenforced"
mechanism = ""
last_verified = "2026-08-15"
note = "boss-expr errors on a missing identifier rather than reading it as null, and OR does not short-circuit past the error — so ONE unreadable clause takes down a predicate that is otherwise true. `eval_ready_when` maps the error to None and the step stays pending, which is indistinguishable from the predicate being false: no log line, no lint, nothing. It bites exactly the protocols worth writing — re-routing ones, where a branch is reachable from triage OR from the investigation that reached the same conclusion later (user-feedback v10). The fix in the protocol is a `metadata_defaults` entry for the key, which materialization stamps onto every step including pending ones (verified live: an open packet's still-pending `closed` step already carries its `outcome_kind` default). What would enforce it: the viability lint already builds the reference set (`predicate_step_refs`) and can resolve each `steps.X.metadata.K`; the check is that K appears in X's `metadata_defaults` unless X is an ancestor of the step whose predicate it is, since an ancestor's completion sets its own declared fields. Not written yet because the ancestor exemption needs the same transitive walk `synth_fork_payload` just gained, and the two should share it rather than each grow a copy. Until then the fork-coverage payload models the rule without asserting it: declared fields are seeded on DONE steps only, so a clause reading an unrun step's unset field reads as uncoverable in the lint exactly as it behaves at run time."
