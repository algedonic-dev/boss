[[invariant]]
id = "credentials-never-enter-the-tree"
claim = "Manifests reference their secrets by name only; the Secret objects are created out-of-band."
source = "infra/lint/no-secrets.sh; infra/cluster/manifests/README.md"
enforcement = "enforced"
mechanism = "infra/lint/no-secrets.sh"
last_verified = ""
note = "Seven credential-shaped patterns over every tracked file. The lint self-tests on every run — one planted fixture per pattern, each asserted caught — because a credential scanner nobody has proved is a credential scanner nobody should trust. Findings are redacted so the lint does not copy the secret into a CI log."
