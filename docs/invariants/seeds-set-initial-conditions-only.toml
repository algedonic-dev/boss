[[invariant]]
id = "seeds-set-initial-conditions-only"
claim = "Seed files set initial conditions only, never downstream artifacts that should emerge from a Job step.done."
source = "docs/design/seed-vs-emergent-state.md; infra/lint/seed-bypass-smell.sh"
enforcement = "enforced"
mechanism = "infra/lint/seed-bypass-smell.sh"
last_verified = "2026-09-18"
note = "Two halves. (1) seed-bypass-smell.sh scans every SQL file that reaches a database at bootstrap — the migration set under infra/postgres/schema/ (156 files on 2026-09-18) and any .sql under examples/ — for an INSERT INTO a projection table (invoices, gl_journal_*, financial_facts, shipments, ...), and refuses a scan of zero files. Until 2026-09-18 it globbed examples/*/seeds/sql/, a directory retired with the playground bundles, and exited 0 'no seed sql files' on every gate — the mechanism named here scanned nothing for months (backlog cdf2d959). (2) The seeds themselves are TOML and JSON now (accounts.toml, products.toml, workflows.toml, classes.json, employees.json ...) and reach the system only through the API: api-path-bypass-smell.sh refuses a sqlx write in any seed or sim binary, so a loader cannot pour a downstream artifact in behind the API either. Not covered: nothing parses the TOML/JSON shapes for a downstream-artifact FIELD (a seeded account carrying an invoice inline) — such a field would be refused by the receiving API's validation, not by a lint."
