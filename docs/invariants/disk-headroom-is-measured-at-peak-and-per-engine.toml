[[invariant]]
id = "disk-headroom-is-measured-at-peak-and-per-engine"
claim = "Free disk on the CI runner is judged against the PEAK a single job reaches, not against free space at rest — and on a host with more than one container engine, every engine is measured, not just the one `sudo` reaches."
source = "infra/gate.sh (require_headroom); maintenance-sweep e36a6a03; train 1597b4a4 run 255, 2026-08-27"
enforcement = "checked"
mechanism = "infra/gate.sh require_headroom polls before each check and aborts below BOSS_GATE_MIN_FREE_GB; the sweep records the measurement"
last_verified = "2026-08-27"
note = "Two mistakes in one sweep, both mine, and together they cost a train. FIRST, MEASURED AT REST: stale-build-caches closed `clear` on the reasoning that ~20GB reclaimable against 89G free was 'housekeeping, not pressure'. A full `cargo test --all-features` builds an ~80GB target inside the job container, so 89G at rest becomes 8G mid-build, and require_headroom aborted train 1597b4a4 with 'gate: 8GB free, need 12GB' AFTER every test in the suite had passed. The host reads 89G again the instant the dead container is removed, which is what makes the cause look invisible in any measurement taken afterwards. SECOND, MEASURED ONE ENGINE: the sweep ran `sudo docker system df` and saw 17.87GB of cache. The minipc also runs a ROOTLESS engine at ~/.local/share/docker, active and invisible to that command, holding 43.5GB of build cache across 566 entries with zero active. True reclaimable was ~60GB, not 20 — understated threefold. Reclaiming both took the runner from 89G to 139G free, so the peak build now leaves ~59GB against the 12GB floor. WHY `checked` RATHER THAN `enforced`: require_headroom does hold the line — it refuses rather than wedging the box, which is the behaviour earned on 2026-08-16 when a full disk stopped even `df` from running. What is NOT enforced is the SWEEP's judgement, which is a human reading a number and deciding whether it is comfortable. The tractable enforcement is to have the sweep compute headroom as (free - observed peak job size) instead of free, and to enumerate engines from a list rather than from whichever socket the operator's shell happened to reach."
