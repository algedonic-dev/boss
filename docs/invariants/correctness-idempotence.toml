[[invariant]]
id = "correctness-idempotence"
claim = "Replaying the audit log into a fresh DB lands at the live state byte-for-byte."
source = "docs/design/correctness-protocol.md §The five properties.4"
enforcement = "checked"
mechanism = "infra/postgres/validate-brewery-sim.sh drives a 365-day regen through the live API then asserts 0 net drift across all 15 rebuilders; boss-ledger-replay-check.timer re-derives financial_facts and the journal nightly in prod (--deep)"
last_verified = "2026-08-13"
note = "Verified on demand and before a release cut, never in CI (infra/verify-replay.sh, the bare-metal diff of rebuilt against live state over 127.0.0.1 ports, left with the bare-metal deploy path on 2026-09-18 — nothing had run it since the container cutover) — the byte-for-byte claim is only actually exercised for the brewery tenant, and the nightly timer covers the ledger domain alone. infra/lint/idempotence-ratchet.sh is the one STATIC guard, and it holds a narrower claim than this one: it ratchets accumulating arithmetic (SET x = x + $n), which is the shape that double-applies on JetStream redelivery."
