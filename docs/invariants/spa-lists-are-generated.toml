[[invariant]]
id = "spa-lists-are-generated"
claim = "The SPA's service/port map is generated from boss-ports, never a hand-maintained array of facts that silently drifts from its real source of truth."
source = "infra/lint/no-snapshot-arrays.sh"
enforcement = "enforced"
mechanism = "infra/gate.sh"
last_verified = "2026-09-12"
note = "Enforced from 2026-09-12: infra/gate.sh runs `check no-snapshot-arrays` after the workspace build (full gate always; a scoped --auto gate when crates/core/boss-ports or a _generated/ports.ts changed), and boss-testing tests/gate_sh.rs pins that check line. From 2026-08-31 (#161 deleted MonitoringPage.svelte, which the lint named) to 2026-09-12 the lint failed on every tree and nothing ran it, so the failure was read by nobody. infra/lint/audit-ordering.sh remains a live-DB sweep on its own timer, not a gate check."
