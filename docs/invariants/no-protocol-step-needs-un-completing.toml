[[invariant]]
id = "no-protocol-step-needs-un-completing"
claim = "No protocol path requires moving a step backwards out of `completed`: a terminal step is frozen at the row, so any design that needs to reverse one is already broken."
source = "crates/core/boss-jobs/src/postgres.rs (update_step_at); crates/core/boss-jobs/src/http/steps.rs; crates/orchestrators/boss-cli/src/train.rs (cancel/board); repair packet 777ef6e3"
enforcement = "unenforced"
mechanism = ""
last_verified = "2026-08-15"
note = "`boss train cancel` released cars by PUTting their completed `review` step back to `ready`. `update_step_at`'s UPDATE pins status, completed_on and metadata when the row is already completed or skipped — deliberately, so a write computed against a pre-completion fetch cannot demote a finished step — so the PUT changed nothing and returned 204. The conductor logged 'released car X back to the dock', cleared `train`, and left a car that `parked_ready` rejects forever: reviewed, un-trained, unboardable. It went unnoticed for weeks because every cancel until 2026-08-15 carried zero cars; the first loaded cancel exposed it, and only failed LOUDLY (409) because the add-step-guard car had landed hours earlier and made terminal writes report themselves. Note the shape: the silence was the bug, the error was the fix arriving. The repair was not to allow the reversal but to stop creating the state — boarding no longer completes `review`, because boarded-ness was always `metadata.train`, which is what `parked_ready` reads and which is not frozen. Generalise before adding any 'reopen': if a protocol wants to un-complete a step, the completion was recording the wrong fact. What would enforce it: nothing generic — a lint cannot know a PUT targets a completed row. The tractable version is a test per reversal-shaped path, which is what a_released_car_is_parked_ready_again now is."
