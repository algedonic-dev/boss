[[invariant]]
id = "an-equipment-fault-is-not-a-product-defect"
claim = "Equipment fails two ways and the record never writes one as the other: a product defect (a red gate) and an equipment fault (a dead runner, a disk floor) are separate facts on a gate-run, and every verdict reader takes both."
source = "docs/design/factory-taxonomy-v2.md (T3, the two failure facts; v1 M4); CLAUDE.md §Diagnosis, 'an infrastructure refusal is not a consist failure'; item c02fc3b3 (cars T3a, T3b)"
enforcement = "enforced"
mechanism = "crates/core/boss-jobs/src/failure_facts.rs"
last_verified = "2026-11-04"
note = "HOLDS SINCE CAR T3b (item c02fc3b3). WRITTEN once: the conductor's verdict recorder (record_gate_verdict in crates/orchestrators/boss-cli/src/train/conductor.rs) writes `equipment_fault` {kind refused | lost | stall-deadline | unjudged} and `product_defect` on every gate-run's record-verdict step by failure_facts(), declared in gate-run.toml and the `gate-verdict` StepType. READ, never re-derived: every reader goes through failure_facts::recorded() — train_gate::standing (an `unjudged` record is Standing::Unjudged: filed again once, then aborted, striking and releasing nobody; a green beside a recorded fact is not a green, so the merge reads both halves), train/equipment_red.rs classify_red (the conductor's equipment release and the strike its cancel lays: a product defect governs the strike, an equipment fault alone releases unstruck and owing no re-gate, once per car), and red_verdict.rs with_recorded_facts (the alert names which fact it carries). A gate-run carrying NEITHER field (recorded before T3a) is unrecorded and keeps the verdict-only rule; nothing is backfilled. Pinned by the t3b_a..t3b_g tests in conductor.rs, equipment_red.rs's tests, and failure_facts.rs's reader tests. What it does not cover: a car's OWN gate red (not a train's) is not classified by the dock — the car's builder reads its receipt."
