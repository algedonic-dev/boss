[[invariant]]
id = "a-migration-car-gates-on-the-whole-workspace"
claim = "A car that adds or edits a migration, a registry seed, or protocol data runs the UNSCOPED gate before it parks — never `infra/gate.sh -p <crate>`."
source = "infra/gate.sh; crates/orchestrators/boss-cli/src/cadence.rs (db_tests); crates/core/boss-dispatcher/tests/dispatcher_rules_seed.rs; trains 20260814-1738, 20260815-0420, 20260815-0621"
enforcement = "unenforced"
mechanism = ""
last_verified = "2026-08-15"
note = "Three red trains in two days, all the same shape: a migration changed registry DATA, and the test that asserts that data lives in a crate the author did not think they had touched. Migration 123 edited a cadence row and broke a boss-cli seed test (eight cars). 130 and 133 inserted a station before retiring its predecessor and broke schema load for the whole workspace (six cars, then thirteen). 129 seeded a dispatcher rule that never reached rules.toml and broke the drift guard in boss-dispatcher (the same thirteen). The tests all EXIST and all work — every one of them caught the fault. They caught it on the train, because that is the first place the whole suite runs. gate.sh already defaults to the full workspace; the narrowing is opt-in via `-p`, so this is not a missing mechanism but an author reaching for the fast path on exactly the class of change where the blast radius is widest. What would enforce it: nothing can verify what an author ran before parking — the honest options are per-car CI, which the whole train design exists to avoid because CI is the measured bottleneck, or moving the cost the other way by making the conductor gate a car at PARK time rather than the consist at board time. Until one of those is chosen this is debt, and it is written here so the next red of this shape is recognised in one minute instead of forty."
