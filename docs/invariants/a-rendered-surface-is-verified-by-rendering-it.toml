[[invariant]]
id = "a-rendered-surface-is-verified-by-rendering-it"
claim = "A change to a surface a human looks at is verified by rendering that surface and looking at it — not by reading the diff, the types, or the tests."
source = "apps/web/playwright.mocked.config.ts; apps/web/tests/mocked/*.mocked.spec.ts; ship-a-change `gate.rendered`"
enforcement = "unenforced"
mechanism = ""
last_verified = "2026-08-15"
note = "Written after fixing one guest-landing complaint in two different wrong files in a row. Both diffs compiled, typechecked, passed their unit tests and read plausibly; `/` routes to `me` (router.ts), so the surface a guest actually sees is MePage — not landing/LandingPage.svelte, which only the router catch-all reaches, and not shop/ShopHome.svelte, which is /shop. One screenshot said so in about a minute. The loop costs almost nothing and already existed: `cd apps/web && bunx playwright test -c playwright.mocked.config.ts <spec>` needs no backend and no seeding, chromium is installed, and a spec that calls `page.screenshot` renders any surface as any persona in ~4s. Two traps worth knowing: register the `**/api/**` catch-all FIRST, because Playwright matches routes in REVERSE registration order; and to render as the guest persona return `{username, role:'audit-readonly'}` from /api/session with /api/people empty, since `classifyProbe` reads a session with no matching employee plus that role as the guest. What would enforce it: nothing can verify what an author looked at, which is why the protocol ASKS instead — ship-a-change's `gate` step carries an optional `rendered` field, and a car touching apps/web that leaves it empty is the shape worth noticing at review. A lint over the diff (touches apps/web/src/**.svelte AND gate.rendered is empty) is tractable and not written."
