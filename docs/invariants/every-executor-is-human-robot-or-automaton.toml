[[invariant]]
id = "every-executor-is-human-robot-or-automaton"
claim = "An executor is a human, a robot or an automaton, there is no fourth kind, every executor id in the record resolves to exactly one of them, and a claim records its holder's kind."
source = "docs/design/factory-taxonomy-v2.md (primitive 5, car T1); docs/design/station-tree.md §8.6; design 4b27a65a"
enforcement = "enforced"
mechanism = "crates/core/boss-jobs/src/agents/one_kind_tests.rs"
last_verified = "2026-11-06"
note = "Filed unenforced by T0 (ac434bd4) and flipped by T1 (050284c2). Most of it held since v1's T1 (backlog 3ff2ef60): boss_core::actor::ExecutorKind is a closed enum of three; every_executor_id_the_tree_declares_resolves_to_exactly_one_kind holds the automations, agents and employees registries to one kind each, with the_one_kind_check_names_each_shape_of_a_fourth_kind as its control; every_claim_holder_resolves_to_exactly_one_executor_kind (boss-jobs tests/claims_console_history.rs) holds the claims history; agents.executor_kind defaults to robot, pinned by the_agents_executor_kind_column_defaults_to_what_the_parse_says_an_agent_is; the per-step claim door, which claim-next also goes through, writes `_executor_kind` on the claim's fact (http/steps.rs). T1 added two things. The claims projection now keeps that key (claims_console/source.rs PAYLOAD_KEYS, pinned by every_key_the_claim_door_adds_to_its_fact_survives_the_projection); until then the console read every claim as derived-from-id. And the staff kind is ExecutorKind::Human, which reads the v2 word `human` and still writes `person`, the word the last-converged build reads (every_kind_is_written_in_a_word_the_last_build_reads). Not covered: the agents.executor_kind column has no writer but its default and no reader, so a registered row cannot declare automaton; every claimant that is neither staff nor a robot is today an `automation:<name>` id, which is an automaton by its spelling."
