[[invariant]]
id = "conservation-sweep-covers-three-properties-not-five"
claim = "infra/lint/conservation-invariants.sh proves the five-property correctness protocol — provenance, conservation, closure, idempotence, determinism — across every projection vs. the audit_log it derives from."
source = "README.md; restated in docs/design/testing-strategy.md §Layer 6"
enforcement = "unenforced"
mechanism = ""
last_verified = ""
note = "THE CLAIM OVERSTATES THE MECHANISM. The platform script's 8 invariants cover conservation (A, B), closure-of-already-closed-records (C, D, F), provenance (E) and identity resolution (X, Y); the brewery's 14 (examples/brewery/conservation-invariants.sh, since H12 on 2026-09-18) are all conservation (G-R, V, W). The words 'idempotence' and 'determinism' do not appear in it, and no query in it replays anything or compares two runs. Recorded here so the overstatement is visible next to `correctness-idempotence` and `correctness-determinism`, which are the entries that actually carry those two properties. What would enforce it: correct the two sentences — the script is fine, the description is not."
