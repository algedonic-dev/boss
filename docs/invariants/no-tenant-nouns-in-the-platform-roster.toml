[[invariant]]
id = "no-tenant-nouns-in-the-platform-roster"
claim = "A tenant's vocabulary never ships in Tier 1: the platform protocol set carries platform kinds only, and tenant kinds seed from examples/<tenant>/."
source = "CLAUDE.md §10; David 2026-08-16 (\"We don't want brewery nouns in core no matter what\"); protocols-as-data.md Q5"
enforcement = "enforced"
mechanism = "crates/core/boss-jobs/src/registry.rs"
last_verified = ""
note = "Asserted by `platform_workflows_carries_the_shipped_meta_kinds`, which denies a list of brewery and used-device-shop nouns. Its SUBJECT moved on 2026-09-11: `platform_workflows()` is empty now that every platform protocol is a file under infra/platform/workflows/, so the denylist reads the BUNDLE — Tier 1 data that every deployment seeds, where the same leak is the same leak. Left pointed at the roster it would have become vacuous, which is how a guard stops covering what it was written for. A count assertion alone never held this either: it said seven, not seven PLATFORM kinds, so swapping one for `morning-brew` kept it green — verified by planting exactly that and watching the noun guard fire where the count did not. The roster side is now pinned EMPTY instead, by this test and by `infra/lint/the-live-protocols-are-the-authored-protocols.sh`. `tier-import-audit.sh` cannot see this class either, because a hardcoded noun in a core crate adds no crate dependency. Deliberately a denylist rather than a shape rule: whether a noun is tenant-specific is a judgement, and a bad guess encoded as a lint would block legitimate platform kinds."
