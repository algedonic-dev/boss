[[invariant]]
id = "a-machine-fault-is-not-a-product-defect"
claim = "A run at a station with machines records a machine fault and a product defect as two separate facts, the record never writes one as the other, and the merge, the alert and auto-cancel each read both."
source = "docs/design/factory-taxonomy-v2.md (R12); handoff rule 8 on design 4b27a65a; car T3 (backlog 490c12f0)"
enforcement = "enforced"
mechanism = "crates/core/boss-jobs/src/failure_facts.rs"
last_verified = "2026-11-06"
note = "The v2 spelling of an-equipment-fault-is-not-a-product-defect, filed unenforced by T0 (ac434bd4) and flipped by T3 (490c12f0). For the gate-run, the one run at a station with machines that records a verdict, it held since v1's T3b (c02fc3b3): the conductor's recorder writes `equipment_fault` and `product_defect` on record-verdict, and the merge (train_gate::standing), auto-cancel (equipment_red.rs classify_red) and the alert (red_verdict.rs with_recorded_facts) all read through failure_facts::recorded, pinned by the t3b_a..t3b_g tests in conductor.rs. T3 added the v2 name: recorded() takes the fault as `machine_fault` or `equipment_fault`, reads both names saying the same thing as one fact and two that disagree as unjudged, and the yard belt (apps/web/src/it/yard/belt.ts) draws it under the name the record used. Pinned by a_fault_recorded_under_its_v2_name_reads_as_the_machine_fault, two_names_for_the_fault_that_disagree_read_as_unjudged and the three t3_v2_ conductor tests. The recorder still WRITES `equipment_fault`: the last-converged build reads only that name and would read a `machine_fault` beside a green as a clean green, so the writer flips in the retirement car. Not covered: the runs at the converge, deploy and probe-shed stations record no failure facts at all, and no reader of them takes either."
