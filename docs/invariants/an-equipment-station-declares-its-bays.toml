[[invariant]]
id = "an-equipment-station-declares-its-bays"
claim = "An equipment station row names its automaton and its bays; bays are the non-fungible constraint on top of the pools, and the gate's capacity is `bays:gates` on that row."
source = "docs/design/factory-taxonomy.md (M2)"
enforcement = "enforced"
mechanism = "crates/core/boss-jobs/src/station_lint.rs"
last_verified = "2026-11-05"
note = "The mechanism is `check_equipment` in station_lint.rs, pinned by its tests an_equipment_station_must_name_its_automaton_and_its_bays, an_equipment_automaton_must_be_an_automation_id, an_equipment_station_has_at_least_one_bay and a_generic_station_declares_no_automaton_and_no_bays; backed by the CHECK stations_equipment_declares_its_bays in infra/postgres/schema/20261103234537-a-station-is-generic-or-equipment.sql (pinned by stations_pg's an_equipment_row_round_trips_and_the_table_refuses_what_the_lint_refuses), and the gate capacity by crates/core/boss-jobs/tests/platform_stations_bundle.rs (the_gate_capacity_is_the_gates_rows_bays, the_compiled_gate_bays_are_the_gates_rows). Holds since item 0a78f8f8 (car T2a of the taxonomy design 4348b857). `stations.kind` is actor | group | constraint | equipment — `batch` is deleted, the dock is equipment (automaton automation:train-conductor, 1 bay) and the four other batch rows are group. An equipment row must name an automaton that parses as `ActorId::Automation` in its own spelling, and at least one bay; a generic row may name neither. The viability lint refuses both at every publish (the seed bundle, the authoring door, `publish_declared`) and the table's CHECK refuses both to a direct write. The gate capacity is the `gates` equipment row's `bays` (automation:gate-runner, 2): `boss gate`, the resident supervisor, the conductor and the yard read it, and the delivery policy's `gate_max_concurrent` is dropped (train-conductor v12; the column is dropped by the same migration). The one compiled fallback, `boss_jobs::stations::COMPILED_GATE_BAYS`, is held equal to the row by the bundle test. A step naming `equipment:<station>` and a claim clearing on a free bay landed as T2b/T2c (M3). Since backlog 364b27a3 (design ccfe87ff, 2026-11-05) the converge is three more equipment rows, one bay each — `deploy` (automation:cluster-deploy-runner), `converge` (automation:train-conductor) and `probe-shed` (automation:ops-runner) — and three steps name equipment: gate-run record-verdict `gates`, pr-train converged `converge`, ship-a-change proven `probe-shed`; pinned by crates/core/boss-jobs/tests/platform_bundle_equipment_executors.rs, whose claim test drives the claim route over the bundle's own rows. The gate's region bound (`BoundKind` in crates/core/boss-jobs/src/regions/judging.rs) is the yard's capacity, which now reads the row."
