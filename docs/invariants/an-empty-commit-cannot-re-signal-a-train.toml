[[invariant]]
id = "an-empty-commit-cannot-re-signal-a-train"
claim = "A train is never re-signalled with an empty commit. `--auto` derives its scope from the diff against HEAD~1, so an empty HEAD makes the gate refuse to run at all — turning an environmental red into a second, different red."
source = "crates/core/boss-testing/tests/gate_sh.rs (the_gate_rechecks_headroom_as_the_run_proceeds); infra/gate.sh; train a960c89a run 256, 2026-08-27"
enforcement = "unenforced"
mechanism = ""
last_verified = "2026-08-27"
note = "Pushing an empty commit is the documented way to make the forge re-run CI on a train — there is no rerun API (verified 2026-08-27: both /actions/runs/{id}/rerun and /actions/jobs/{id}/rerun return 404). It is also a trap. gate_sh.rs pins BOSS_GATE_TRUNK=HEAD~1 so the poll is tested rather than the scope, and with an empty commit at HEAD that diff is empty, so gate.sh exits with 'GATE REFUSED: --auto found no change at all against HEAD~1' and the test's first assertion fails. On train a960c89a this converted a train that was red for DNS reasons into a train that was red for a reason I had introduced, and the second cause masked the first. RECOVERY IS ALSO AWKWARD, which is worth knowing before you need it: dropping the empty commit needs a force-push, and force-pushing back to a SHA the forge has already built does not re-trigger anything — Forgejo dedupes on the head. So the branch ends up correct and unbuildable, and the way out is a fresh consist. WHAT WOULD ENFORCE IT: nothing in the repo can stop a human pushing an empty commit. The narrower tractable version is to make the test not depend on HEAD~1 being non-empty — derive the scope from a synthetic two-commit fixture repo it controls, rather than from the real branch it happens to be running on. That would leave the re-signal technique merely useless rather than actively harmful. Better still is to remove the need: a train that can be re-verdicted in place (cf0021ae) never needs re-signalling."
