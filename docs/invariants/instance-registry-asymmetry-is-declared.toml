[[invariant]]
id = "instance-registry-asymmetry-is-declared"
claim = "A registry difference between the cluster system of record and the boss-gcp demo instance is drift unless this entry's baseline names it. Declared baseline: dispatcher_rules, stations and step_plugins are IDENTICAL on both instances; workflows differ by exactly the platform coordination kinds that exist on the cluster only — approval, correct-the-record, design-doc, doc-flatten, incident, incident-post-mortem, maintenance-sweep, protocol-retro, publish-to-github. No kind exists on boss-gcp only."
source = "maintenance-sweep job e41cbae6 (2026-08-18), the first cluster-conformance sweep: dispatcher_rules 50/50, stations 4/4, step_plugins 10/10, workflows 44 vs 35 after the sweep retired the one genuine drift row (regenerate-deployment, left behind by a cluster-only retire)"
enforcement = "checked"
mechanism = "The daily cluster-conformance maintenance sweep (dispatcher rule maintenance-sweep-cluster-conformance-daily, migration 142). Its inspect step counts active rows in the four registries on both instances, diffs the workflow kind sets, and classifies each difference against THIS baseline — a difference this entry does not name is drift and the sweep remediates or files it. Before this entry the classification was re-derived from judgment each firing; the 2026-08-18 sweep spent its inspection reconstructing why nine kinds differ, concluded the asymmetry was expected, and had nowhere to record that conclusion. Editing the baseline is a car touching this file, so a deliberate new asymmetry and its review leave a trace."
last_verified = "2026-08-18"
note = "The two instances run different ROLES on the same tree: the cluster is the system of record where platform coordination packets (reviews, feedback, sweeps, trains) live, and boss-gcp is the public demo whose registries carry only what the demo exercises. Seeding the coordination kinds into the demo would invent work there rather than remove drift, so the subset is deliberate. The corollary that makes the baseline load-bearing: a kind appearing on boss-gcp ONLY is never role, because nothing is authored there — it is always a leftover, like the regenerate-deployment row this sweep retired."
