# ---------------------------------------------------------------------------
# train-board-on-dock-depth — board a train as soon as the loading dock
# holds `min_dock_depth` parked ready cars, at most once per
# `cooldown_minutes`.
#
# Version 6 is the row the migrations produced, and the six-file
# history of this one rule is the argument for this bundle: 114 seeded
# v1 (depth 4), 123 v2 (8 — reconciling the record to what actually
# ran), 131 v3 (12), 147 v4 (4), 202609031515 tried 3 and silently
# no-op'd (a version-keyed retire missed the live row), 202609032030
# v5 (3, the retire-by-name idiom) and 202609042110 v6 (1, cooldown 45:
# a lone car still ships — David, 2026-09-04). Every one a contended
# timestamped file to change one integer. Declared here since
# 2026-09-18 (backlog 393d3234, consolidation H4, car 3); see
# train-reconcile.toml for what that means.
#
# `queue-depth` basis: the loop probes the dock each tick and fires
# `board` when the depth reaches the threshold and the last firing that
# DID work is older than the cooldown — a firing that boarded nothing
# does not hold the cooldown (2026-09-04, two hours of a threshold-met
# dock). This threshold is the number an operator has changed most
# often; the table stays live-editable, and a version published live
# supersedes this file (the seed reports "behind", never rewrites).
#
# VERSION 7 DROPS THE COOLDOWN FROM 45 TO 30 (David, 2026-09-21:
# "Let's go with 30m and measure"), and the number is chosen against
# measured train occupancy rather than picked. Over the 40 most recent
# trains:
#
#   inter-departure gap   median 45m   — exactly the cooldown
#   train occupancy       median 24m,  p90 33m
#   idle track per cycle  median 22m   — empty about half the time
#   consist size          median 2,    19 of 40 trains carried ONE car
#
# So departures were paced by this integer, not by dock depth, and the
# batching it exists to create was largely not happening. The rule's own
# history above says the same from the other side: depth went 4, 8, 12,
# 4, 3, 1 — "a lone car still ships" (v6). The depth half of the
# batching strategy was abandoned a fortnight ago and this was what
# remained of it.
#
# WHY 30 AND NOT 0, which was the question asked. Boarding whenever the
# track clears collapses the cycle to occupancy (~24m) and roughly
# DOUBLES the trains — and each train takes a gate bay for its own
# assembled-tree gate, triggers a cluster converge, and builds a 3.48 GB
# CI image on a forge disk that hits its floor three times a month.
# Measured the same day: three concurrent gates ran 19-21m against an
# 11m median, and a car must gate BEFORE it can board, so more trains
# means slower car gates means fewer cars ready means smaller trains.
# 30 sits just above p90 occupancy: the track is rarely idle and trains
# do not stack into the bays.
#
# WHAT WOULD SEND IT BACK TO 45: arrivals per day flat while converges
# double. That would say the gate bays were the constraint all along and
# the idle track was not costing anything. Baseline to compare against
# is on backlog 3ec04168.
#
# WHY v8 AND NOT v7, which is where the cooldown change first landed.
# v7 ALREADY EXISTED LIVE, with cooldown 45 — the bundle file said v6
# while the registry's lineage was at v7, and "bump the version" read
# the file. Measured 2026-09-21 after the change landed green: the
# lineage answers v1..v7 with v7 ACTIVE at cooldown 45, the bundle
# declared v7 at 30, and the two disagree at the same version number.
# So the change was inert — `boss cadence publish` refuses (v7 is not
# above the newest of the lineage) and the seed would refuse it at the
# next boot as exactly the drift a bundle exists to remove. A green
# gate proved the file; nothing proved the row.
#
# The bundle being BEHIND the live lineage is tolerated by design, as
# information rather than a refusal (cadence_seed.rs) — and that
# tolerance is what manufactured the collision, because the next author
# bumps from the file. train-window is in the same state right now
# (bundle v2, live v3), so the next change to it collides the same way.
# That is filed separately; this car only moves the boarding rule to a
# version above the live lineage so the decision actually takes effect.
#
# VERSION 9 ADDS `regate_hold_minutes = 15` (backlog 4890165b, design
# 42279fb2, approved 2026-09-25). Live lineage read before the bump:
# v1..v8, v8 active at depth 1 / cooldown 30 — so v9 is above it.
#
# A departure now WAITS, bounded, for the dock's re-gate round on the
# current main. Measured on the item's triage over the ten trains to
# 19:26Z that day: 22 cars boarded, 58 left-behind rows, 42 of them
# "waiting for a gate slot to re-gate on current main"; and at 19:26 the
# dock replayed a car onto 22c1a876 in the same pass that departed train
# #686, which merged 777a5888 and changed four files that car changes —
# the re-gate was stale before it finished. Main moves only by trains,
# so a round of re-gates launched on main M stays valid until the next
# departure; holding that departure for the round lets it carry every
# car the round turned green, and moves main once for all of them.
#
# 15 because the median dock re-gate measured since 12:00Z that day was
# 13.9 min (builder gates 15.3): a longer hold waits on the tail, a
# shorter one leaves the median re-gate behind. The hold is counted from
# the OLDEST re-gate in flight on the current main, so a re-gate that
# launches late in a round never extends it, and a held board is an idle
# firing — the cooldown above does not start from it.
#
# WHAT WOULD CHANGE IT: cars boarded per train not rising above 2 while
# the dock holds five or more (the round is not the constraint), or
# already-fresh cars' dock time growing by more than a gate while trains
# do not grow (the hold costs more than it batches).
#
# To change this rule, bump `version` — and check the LIVE lineage
# first (`GET /api/cadence/rules/<name>/versions`), not just this file.
# ---------------------------------------------------------------------------

[[cadence_rule]]
name = "train-board-on-dock-depth"
version = 9
status = "active"
verb = "board"
basis = "queue-depth"
min_dock_depth = 1
cooldown_minutes = 30
regate_hold_minutes = 15
