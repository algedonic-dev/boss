# boss-gcp's runner credential sender has its own attribution, distinct
# from the forge's local deposit (review 3121561f R4, backlog 1e50e66b): it
# reads the deposit key's enrollment packet and writes the receiver's
# verified effect onto that packet's verify step as context_md, never the
# step's answer or its completion.
[[automation]]
id = "automation:runner-credential-send"
role = "platform-admin"
description = 'Pushes a broker-minted ops runner credential to boss-gcp through its forced-command receiver, and records the receiver verified by effect (infra/gcp/runner-credential-send.sh, run by the forge through infra/forge/runner-credential-push.sh).'
