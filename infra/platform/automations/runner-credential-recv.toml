# boss-gcp's runner credential receiver has its own attribution, distinct
# from the forge's local deposit and from the forge's sender (backlog
# e317cbe2, from review 9bbf4e03 of car b970a8fd). Until 2026-10-18 it
# signed as automation:runner-credential-deposit, whose row describes
# infra/forge/runner-credential-deposit.sh, so a reader of the row the
# receiver signed under learned nothing about boss-gcp. Not measured
# from the audit log: every request it makes presents the runner
# credential, and the credential door rebinds the id of each one it
# resolves to automation:ops-runner (crates/core/boss-jobs/src/
# runner_credential.rs), so this id is on the record only for a request
# the door did not resolve. Its x-boss-user asserts platform-admin, the
# role automation:ops-runner's row records.
[[automation]]
id = "automation:runner-credential-recv"
role = "platform-admin"
description = 'Installs a broker-minted ops runner credential on boss-gcp from the envelope the forge sender writes, proves the installed file through the credential door, and acknowledges it to the delivery owner (infra/gcp/runner-credential-recv.sh, run by the forced command of the runner deposit key).'
