# automation:credential-broker-stage — the actor a runner credential's
# stage phase is RECORDED as once the broker-stage door verifies the
# workload token the dispatcher presents (design 6e28ed42; activation,
# backlog 25fff647). No script signs it and no header carries it: the
# jobs API's rotation door ASSIGNS it from the verified token
# (boss_jobs::credentials::broker_stage::ACTOR), replacing the rule label
# the caller typed, and keeps the caller's role — the dispatcher rule's
# platform-admin. So this row is that role, its own row and no family's:
# a signer's `signs_for` prefix answering for it would let a typed label
# stand in for a verified one. Measured 2026-10-09: no audit-log fact
# carries it yet — the first runner rotation (c896cb12) ran with the door
# off and its phases keep the rule actors they were recorded under.
[[automation]]
id = "automation:credential-broker-stage"
role = "platform-admin"
description = 'A runner credential stage phase believed from a verified projected ServiceAccount token (the broker-stage door in the jobs API); assigned by the door, never asserted by a caller.'
