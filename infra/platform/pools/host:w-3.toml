# host:w-3 — the data node's vCPUs (the Dell Precision 5820, design
# 3c475a19), a root pool of the station tree (T5 of design 4b27a65a). One
# host pool per estate node, capacity its `cpu` in infra/estate/estate.toml;
# see host:w-1.toml. Declared 2026-11-11 with the node (backlog 9323f4bf).
# No station allocates any of it: the Dell is never a build node, so neither
# engineering nor gates draws on it, exactly as nothing draws on host:w-2.
# `keeper` names the station that keeps the box, operations, which owns none
# of its capacity (station-tree.md section 3).
[[pool]]
name = "host:w-3"
version = 1
status = "active"
unit = "vCPU"
kind = "flow"
shape = "capacity"
capacity = { state = "configured", amount = 8 }
capacity_from = 'infra/estate/estate.toml: the `cpu` of estate node w-3, the box this pool is; the estate registry serves the node beside the pool (GET /api/stations?under=), and the pin every_estate_node_has_its_host_pool_and_no_other holds the two equal.'
keeper = "operations"
