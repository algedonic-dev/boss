# ---------------------------------------------------------------------------
# design-review — design-doc packets whose review step is open.
#
# Version 1 is the row the migrations produced: 116 seeded it over
# `design-doc-review` packets, and three in-place UPDATEs since moved
# it to what the live registry already enforced — the predicate reads
# `design-doc` (202609101900: the packet IS the doc), the lens renders
# the queue and nothing else, and the upstream pointer was dropped
# because the corpus page it pointed at is gone. Declared here since
# 2026-09-18 (backlog 393d3234, consolidation H4); the seed publishes it
# insert-if-missing and migrations newer than the cutover stamp in
# infra/lint/migrations-declare-schema-only.sh declare schema only.
#
# To change this station, bump `version` — the seed refuses a row that
# differs from the live active row of the same (name, version).
#
# Version 2 (2026-09-24, backlog 08372fdb, from page audit 79db48ae) is
# the first bundle-only bump: membership is unchanged, the LENS grew.
# `with_steps = true` because a review saved but not completed looked
# exactly like one never touched — Save moves only a `pending` step, so
# a `ready` review stays `ready` and its answers on the step are the
# only trace, and the envelope carried no steps. The predicate already
# reads the review step, so the server fetched them anyway; this only
# stops throwing them away. The `decided` panel is the page's WORKING
# and OUT: designs whose review completed, read from the
# `design-decided` station beside this file rather than by widening
# this one, because this station is the reviewer's queue and a fold is
# not a decision waiting on anyone.
# ---------------------------------------------------------------------------

[[station]]
name = "design-review"
version = 2
status = "active"
title = "Design review queue"
kind = "batch"
discipline = ["priority", "age"]

[station.predicate]
kind = "design-doc"
status = "open"

[station.predicate.step]
slug = "review"
status_in = ["ready", "active"]

[station.lens]
eyebrow = "System Model · Design review"
title = "Design review"
subtitle = "Design docs waiting on a decision — the packet is the doc"
panels = ["queue", "decided"]
with_steps = true
