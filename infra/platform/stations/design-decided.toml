# ---------------------------------------------------------------------------
# design-decided — design-doc packets whose review has completed.
#
# The WORKING and OUT of /it/design, which rendered only its IN until
# 2026-09-24 (backlog 08372fdb, from page audit 79db48ae). A design left
# the page the moment its review completed: four decided on the night of
# 2026-09-23 sat at `fold` with nothing showing they were in flight, and
# the 34 that closed that day showed nowhere at all.
#
# MEMBERSHIP. Every design-doc whose `review` step is completed. Open
# ones are at `fold` — decided, not yet landed; closed ones are settled.
# No `status` clause, so both are members; `terminal_window_days` is the
# RETENTION rule that lets a settled design leave (the same split
# my-watchlist makes): seven days, one week of flow, because that is how
# far back "what did we just decide" reaches, and the full record is the
# packets themselves.
#
# WHY A SECOND STATION rather than a wider `design-review`. That one is
# the reviewer's queue — "waiting on a decision" — and a fold is not
# waiting on the reviewer. Widening it would put decided designs in the
# founder's review queue everywhere that station is read, not only on
# this page. Discipline `recency`, because this is read, not pulled from.
#
# `with_steps` because the rows are drawn from the steps: when the review
# completed, where the fold has got to, and what `folded_into` says.
#
# Declared here only — no migration ever seeded it (migrations declare
# schema only since 2026-09-18). To change this station, bump `version`.
# ---------------------------------------------------------------------------

[[station]]
name = "design-decided"
version = 1
status = "active"
title = "Decided designs — folding and settled"
kind = "batch"
discipline = ["recency"]
terminal_window_days = 7

[station.predicate]
kind = "design-doc"

[station.predicate.step]
slug = "review"
status_in = ["completed"]

[station.lens]
eyebrow = "System Model · Design review"
title = "Decided designs"
subtitle = "Decided and folding, then settled — the week's flow out of review"
with_steps = true
