# ---------------------------------------------------------------------------
# checklist — the generic checkbox-list surface, shipped as a plugin like
# any other step UX; auto-completes the step when every item is checked.
#
# Version 1 is the row 03-jobs.sql seeded as the baseline plugin. Declared
# here since 2026-09-18 (backlog 393d3234, consolidation H4, car 2 of 4): a
# step plugin's ROW lives in this bundle beside the Workflow and station
# bundles, published insert-if-missing by boss-platform-workflow-seed, and
# migrations newer than the cutover stamp in
# infra/lint/migrations-declare-schema-only.sh declare schema only. The JS
# it points at is infra/step-plugins/<frontend_url>, which the converge
# runner mounts as the step-plugins ConfigMap;
# infra/lint/step-plugin-bundle-exists.sh holds the two together.
#
# To change this row, bump `version` — the seed refuses a row that differs
# from the live active row of the same (kind, version).
# ---------------------------------------------------------------------------

[[step_plugin]]
kind = "checklist"
version = 1
status = "active"
label = "Checklist"
description = "Generic checkbox list; auto-completes the step when every item is checked."
category = "generic"
frontend_url = "checklist.js"
owning_team = "platform"

[step_plugin.metadata_schema]
type = "object"

[step_plugin.metadata_schema.properties.items]
type = "array"

[step_plugin.metadata_schema.properties.items.items]
type = "object"

[step_plugin.metadata_schema.properties.items.items.properties.checked]
type = "boolean"

[step_plugin.metadata_schema.properties.items.items.properties.label]
type = "string"
