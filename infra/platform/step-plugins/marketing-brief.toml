# ---------------------------------------------------------------------------
# marketing-brief — tier 1 of marketing-motion: the brief body, its
# audience, and a per-employee acknowledgement tracker kept inline in
# step.metadata.acknowledgements.
#
# Version 1 is the row 03-jobs.sql seeded. Declared here since 2026-09-18
# (backlog 393d3234, consolidation H4, car 2 of 4): a step plugin's ROW
# lives in this bundle beside the Workflow and station bundles, published
# insert-if-missing by boss-platform-workflow-seed, and migrations newer
# than the cutover stamp in infra/lint/migrations-declare-schema-only.sh
# declare schema only. The JS it points at is
# infra/step-plugins/<frontend_url>, which the converge runner mounts as
# the step-plugins ConfigMap; infra/lint/step-plugin-bundle-exists.sh holds
# the two together.
#
# To change this row, bump `version` — the seed refuses a row that differs
# from the live active row of the same (kind, version).
# ---------------------------------------------------------------------------

[[step_plugin]]
kind = "marketing-brief"
version = 1
status = "active"
label = "Marketing Brief"
description = "Cross-department alignment brief with body + audience + per-employee ack tracker. Backs tier 1 of marketing-motion."
category = "admin"
frontend_url = "marketing-brief.js"
owning_team = "platform"

[step_plugin.metadata_schema]
type = "object"

[step_plugin.metadata_schema.properties.acknowledgements]
type = "array"

[step_plugin.metadata_schema.properties.acknowledgements.items]
type = "object"

[step_plugin.metadata_schema.properties.acknowledgements.items.properties.acknowledged_at]
type = "string"
format = "date-time"

[step_plugin.metadata_schema.properties.acknowledgements.items.properties.employee_id]
type = "string"

[step_plugin.metadata_schema.properties.audience]
type = "array"

[step_plugin.metadata_schema.properties.audience.items]
type = "string"

[step_plugin.metadata_schema.properties.brief_md]
type = "string"

[step_plugin.metadata_schema.properties.circulated_at]
type = "string"
format = "date-time"
