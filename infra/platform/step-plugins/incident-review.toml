# ---------------------------------------------------------------------------
# incident-review — the post-mortem as one readable document: the Job's
# semi-structured metadata as ordered sections, then what each sibling step
# found.
#
# Version 1 is the row 155-incident-review-plugin.sql seeded. Declared here
# since 2026-09-18 (backlog 393d3234, consolidation H4, car 2 of 4): a step
# plugin's ROW lives in this bundle beside the Workflow and station
# bundles, published insert-if-missing by boss-platform-workflow-seed, and
# migrations newer than the cutover stamp in
# infra/lint/migrations-declare-schema-only.sh declare schema only. The JS
# it points at is infra/step-plugins/<frontend_url>, which the converge
# runner mounts as the step-plugins ConfigMap;
# infra/lint/step-plugin-bundle-exists.sh holds the two together.
#
# To change this row, bump `version` — the seed refuses a row that differs
# from the live active row of the same (kind, version).
# ---------------------------------------------------------------------------

[[step_plugin]]
kind = "incident-review"
version = 1
status = "active"
label = "Incident review"
description = "Renders the whole post-mortem as one readable document — the Job's semi-structured metadata as ordered sections (known keys first-class, unknown keys as labeled prose, nothing dropped), then what each sibling step found labeled by its fields — and completes the review step. Reads the Job for its metadata and sibling steps; writes nothing but the step completion."
category = "platform"
frontend_url = "incident-review.js"
owning_team = "platform"

[step_plugin.metadata_schema]
type = "object"
properties = {}
