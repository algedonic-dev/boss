# ---------------------------------------------------------------------
# rotate-a-credential — one credential rotation, scope to revoke.
#
# The in-tree source of the protocol the credential broker executes
# (packet 7ee101aa). v1 and v2 were authored live via the workflow
# API and had NO in-tree source; this row is the spec as of v3, so a
# fresh deployment seeds the same protocol the live one runs and the
# protocol is reviewable in a diff. LIVE PUBLISH IS SEPARATE: on the
# system of record, registry rows publish via the API (a new version
# superseding v2) — the bundle seeds fresh deployments only and never
# overwrites a live registry.
#
# The Subject is the credential's REGISTRY id (the `credentials`
# table row, e.g. boss-dev-forge-token) — the durable identity that
# survives rotation. Completing `scope` (the dedicated
# `credential-rotation` StepType) hands the rotation to the machine:
# the broker rule fires on `step.done.credential-rotation`, mints,
# installs, verifies by effect, revokes what the scoper named, and
# records each phase twice — as the packet's own machine steps below
# AND as `credential.minted` / `.installed` / `.verified` /
# `.revoked` events on the audit log (the maiden rotation recorded
# only step metadata, findable by archaeology, not by kind).
#
# v3 changes, from David's review of the maiden rotation:
#   - `old_token` surfaced inline on the scope step (optional): the
#     scoper names the kill target so the machine can revoke
#     end-to-end. Absent, the broker leaves `revoke` to its assignee.
#   - `revoke` carries its human runbook as a `procedure`, for the
#     packet where no old_token was named.
#
# v4 changes, design 1c90d183 (David, 2026-09-26) — the forge host's
# checkout token, the first credential consumed OFF the cluster:
#   - `old_token_last_eight` on the scope step (optional): the old token
#     named by the identifier the forge shows beside it, computed on the
#     host that holds the value, so nobody holds its name or value.
#   - a `delivered` step (kind `credential-delivery`) that goes ready
#     only after an install whose rule declares delivery = "off-host"
#     (the broker writes `delivery` on every install). The host's
#     deposit completes it with the last eight it installed, and the
#     revoke waits for it — until the host holds the new value, the old
#     one is what every consumer there reads. A mount-delivered
#     credential never readies it and keeps v3's order.
#
# v5 changes, backlog a14f04b3 (2026-09-28): the scope step declares
# `credential`, `reason`, `locations` and `consumers`, the four fields
# its kind has always required at done. Until now a person opening the
# step was shown a form that could never complete it.
#
# THESE "v3" AND "v4" ARE REVISIONS OF THIS FILE, NOT REGISTRY VERSIONS.
# A workflow file declares no version; the registry numbers each publish
# max+1 in its own lineage, and the system of record's began after the
# v1/v2 above. There the v3 content is live v1 (2026-09-16, retired) and
# the v4 content is live v2 (published 2026-09-26 07:13Z, active) —
# measured key for key on 2026-09-28, when "v4 in the tree, v2 live" was
# filed as two unpublished versions (backlog 462cdfe3); the v5 content
# is meant to publish as live v3. Whether the row
# says what this file says is the drift lint's answer
# (infra/lint/the-live-protocols-are-the-authored-protocols.sh), never a
# number read out of this header.
#
# NO FIELD EVER CARRIES A CREDENTIAL VALUE — identifiers (a token
# name or numeric id) and observed effects only, on steps and events
# alike.
[[workflow]]
kind = "rotate-a-credential"
label = "Rotate a credential"
category = "platform"
subject_kinds = ["custom"]
owning_team = "platform"
description = "Replace one credential's value end-to-end: scope why and where, mint the replacement, install it where its consumers read it, verify it by effect, then — and only then — revoke the old one. The Subject is the credential's registry id (see /api/credentials), so \"when was this last rotated, and why\" is a Subject-history question. A human completes `scope`; the credential broker executes the four machine phases and records each as the packet's own steps plus a credential.* event on the audit log. The destructive step runs LAST, after the new credential is proven working — order is the protocol. No field ever carries a credential value: identifiers and observed effects only."
metadata = { owner_role = "platform-admin" }

[[workflow.step]]
title = "requested"
kind = "trigger"
ready_when = "true"
title_template = "Rotation requested"
metadata_defaults = { trigger_kind = "operator", trigger_name = "operator-requests-a-rotation" }

[[workflow.step]]
title = "scope"
kind = "credential-rotation"
ready_when = "steps.requested.done"
title_template = "Scope the rotation"
authority_role = "platform-admin"
# The four fields the KIND requires at done, declared here because the
# step page builds its form from the step's declared fields and nothing
# else (backlog a14f04b3, 2026-09-28 05:38Z: David opened packet
# 3df2dbd3's scope step and was shown old_token, old_token_last_eight
# and Notes — a form that could never complete). The earlier rotations
# were filed by automation with these keys already on the step, so no
# person had met the form. Pinned for every platform step by
# tests/a_step_declares_what_its_kind_requires.rs. A step field carries
# no description, so each one's meaning is the kind's, quoted here from
# crates/core/boss-jobs/seeds/step_types.toml.
[[workflow.step.fields]]
# Which credential this rotation is about — the packet Subject's id,
# e.g. boss-dev-forge-token. Names a registry declaration (the broker
# rule row that knows its Secret, scopes, and consumers), never a value.
name = "credential"
field_type = "string"
required = true
filled_by = "executor"
[[workflow.step.fields]]
# Why now: exposure, age, scope change.
name = "reason"
field_type = "string"
required = true
filled_by = "executor"
[[workflow.step.fields]]
# Where the credential value lives (e.g. the k8s Secret and the mounts
# it feeds).
name = "locations"
field_type = "string"
required = true
filled_by = "executor"
[[workflow.step.fields]]
# What reads it — every path/unit/helper that would fail if rotation
# missed it.
name = "consumers"
field_type = "string"
required = true
filled_by = "executor"
[[workflow.step.fields]]
# Inline on the workflow (v3) as well as on the kind bundle: the
# scoper names the OLD token's identifier at the issuer so the broker
# can revoke end-to-end. Optional — absent means the revoke step
# waits for its assignee. NEVER the value.
name = "old_token"
field_type = "string"
required = false
[[workflow.step.fields]]
# v4: the old token by its LAST EIGHT (design 1c90d183, D3). Optional;
# the broker refuses zero or several matches, its own replacement, and
# a token its rule declares to another consumer. NEVER the value.
name = "old_token_last_eight"
field_type = "string"
required = false

[[workflow.step]]
title = "issue"
kind = "task"
ready_when = "steps.scope.done"
title_template = "Mint the replacement"
[[workflow.step.fields]]
name = "issued"
field_type = "string"
required = true
[[workflow.step.fields]]
name = "issuer"
field_type = "string"
required = false

[[workflow.step]]
title = "install"
kind = "task"
ready_when = "steps.issue.done"
title_template = "Install into the declared storage"
[[workflow.step.fields]]
name = "installed"
field_type = "string"
required = true
[[workflow.step.fields]]
name = "permissions"
field_type = "string"
required = false

[[workflow.step]]
title = "verify"
kind = "task"
ready_when = "steps.install.done"
title_template = "Verify by effect"
[[workflow.step.fields]]
name = "verified"
field_type = "string"
required = true
[[workflow.step.fields]]
name = "method"
field_type = "browser|api|log"
required = false

[[workflow.step]]
title = "delivered"
kind = "credential-delivery"
ready_when = "steps.install.done AND steps.install.metadata.delivery = \"off-host\""
title_template = "Delivered to the host"
[[workflow.step.fields]]
name = "delivered_last_eight"
field_type = "string"
required = true
[[workflow.step.fields]]
name = "delivered_to"
field_type = "string"
required = false

[[workflow.step]]
title = "revoke"
kind = "task"
ready_when = "steps.verify.done AND (steps.install.metadata.delivery != \"off-host\" OR steps.delivered.done)"
title_template = "Revoke the old credential"
metadata_defaults = { procedure = "If the broker revoked automatically (the scope step named old_token or old_token_last_eight), this step is already completed with evidence — nothing to do. For an off-host credential the broker revokes only after the host completes `delivered`; do not revoke by hand before it, or every consumer on the host loses its credential until the next deposit. Otherwise: identify the OLD token in the forge UI by name — the issue step's recorded evidence names the NEW token (secret-name plus the packet id's first eight), so the old one is the same credential's instance WITHOUT this packet's suffix; confirm nothing still consumes it (the registry row's consumers list), delete it in the forge UI or via the admin API, and record the identifier you deleted. NEVER touch boss-credential-broker-root — it is the root credential the broker mints WITH, not a rotation product." }
[[workflow.step.fields]]
name = "revoked"
field_type = "string"
required = true
[[workflow.step.fields]]
name = "confirmed_dead"
field_type = "string"
required = false

[[workflow.step]]
title = "rotated"
kind = "outcome"
ready_when = "steps.revoke.done"
title_template = "Rotated"
terminal = { outcome = "rotated" }
metadata_defaults = { outcome_kind = "completed" }

[[workflow.step]]
title = "abandoned"
kind = "outcome"
ready_when = "steps.scope.done AND job.metadata.abandoned = \"true\""
title_template = "Abandoned"
terminal = { outcome = "abandoned" }
metadata_defaults = { outcome_kind = "aborted" }
