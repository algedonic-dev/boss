# ---------------------------------------------------------------------------
# rerail-a-car — the repair the machine files for a car the conductor has
# left behind on a merge conflict three trains running (design b35456ac,
# answering user-feedback ff4ae3d2).
#
# WHY IT EXISTS. On 2026-09-28 the dock held exactly two cars, 05ade1cc
# and d89bafeb, both refused on conflicts after train #778 landed changes
# to the same files. The conductor rebases a car onto the consist before
# it stamps a conflict skip, so every stamped conflict is one `git rebase`
# could not resolve: the repair is authorship, a new tree, which is a
# builder's act. Until this protocol that builder was dispatched by an
# operator who had happened to read the stall alarm — d89bafeb had been
# refused 13 trains in a row by then.
#
# WHO FILES IT. The dispatcher rule
# `rerail-a-car-left-behind-on-a-conflict`, when a car's `skips` reads
# exactly 3 with a `conflict:` reason, and no repair is open for that
# car's subject. The packet's subject IS the car's (its original branch),
# and its metadata carries `car`, `branch` and `skip_reason`, copied from
# the car when it is filed.
#
# WHO RUNS IT. The `rerail` step's agent block puts it in MY WORK; the run
# is opened at the claim by `boss dispatch`, like every run. The rule
# files the WORK, never an agent-run: a run nobody claimed would age out
# as `died` four hours later.
#
# NO NEW HOLD (decision 4). A resolution already carries everything a code
# change carries — a fresh gate on the new head, a receipt machine-copied
# onto the car, the train gate on the assembled consist. The trigger
# changes who STARTS the repair, not what it may do. A resolution that
# cannot keep both intents is not forced: `refused` names the hunk and a
# person decides through the car's existing left-behind and stall alarms.
#
# THREE TERMINALS, one per answer the step can give. `overtaken` is the
# machine's: rule `rerail-a-car-is-overtaken-when-its-car-closes`
# completes the step with it when the car closes first (merged, abandoned
# or retired), so a repair never outlives its car.
#
# LIVE: the platform seed is insert-if-missing per kind, so a fresh
# database gets this at v1; a live registry takes it through
# `boss workflow publish rerail-a-car infra/platform/workflows/rerail-a-car.toml`.
# Pinned by crates/core/boss-jobs/tests/platform_bundle_rerail_a_car.rs.
# ---------------------------------------------------------------------------

[[workflow]]
kind = "rerail-a-car"
label = "Rerail a car"
category = "platform"
subject_kinds = ["custom"]
owning_team = "platform"
description = "A car the conductor left behind on a merge conflict three trains running, filed by the machine for a builder to repair: rerail it onto current main, resolve the hunk so both sides' intent survives, re-gate, and carry the green onto the car - or refuse, naming the hunk, so a person decides. Closes itself as overtaken when the car closes first."
metadata = { owner_role = "platform-admin" }

[[workflow.step]]
title = "filed"
kind = "trigger"
ready_when = "true"
title_template = "Left behind on a conflict three trains running"
metadata_defaults = { trigger_kind = "event",trigger_name = "rerail-a-car-left-behind-on-a-conflict" }

[[workflow.step]]
title = "rerail"
kind = "task"
ready_when = "steps.filed.done"
title_template = "Rerail the car onto current main"
authority_role = "platform-admin"
# A scoped resolve-and-regate, not a design (decision 3): the builder
# setting at medium effort and $3, doc-flatten's `curate` precedent for a
# bounded car. One hour gives the silence rule a two-hour bound, over the
# 30-40 minutes each repair took by hand on 2026-09-28.
duration_hours = 1.0
agent = { profile = "builder", model = "opus-5[1m]", budget_usd = 3, effort = "medium" }
fields = [
  { name = "result", field_type = "rerailed|refused|overtaken", required = true },
  { name = "evidence", field_type = "string", required = true },
]
[workflow.step.metadata_defaults]
procedure = '''
This packet names a car (`car`), its branch (`branch`) and the conflict the conductor recorded (`skip_reason`). The car has been left behind on that merge conflict three trains running, and the conductor rebased it onto the consist before each refusal, so what is left is a hunk `git rebase` could not resolve.

1. `boss rerail <car>` cuts `<branch>-rerail` from current main and replays the car onto it. A clean replay gates and carries the green onto the car by itself: go to step 4.
2. On a real conflict the verb stops once and says where. Resolve it so that BOTH sides' intent survives: the car's change, and whatever landed on main, read from the git log of each conflicting file since the car's base. Never drop main's side to make the car's apply.
3. Run the touched crates' whole suites and `infra/gate.sh --lint` (judged by its exit code), commit, push the `-rerail` branch as a fast-forward, and gate it with `BOSS_AGENT_RUN` exported so the gate-run records this run.
4. `boss rerail <car> --finish` copies the green receipt onto the car as `regate_receipt`, repoints it and clears the skip. Record `result = rerailed`, and in `evidence` the gate-run and the line `--finish` printed, copied rather than retyped.

If the two changes cannot both survive (they contradict, and one must be withdrawn), do not force a resolution: record `result = refused`, and in `evidence` the file, the hunk and why. A person decides through the car's left-behind and stall alarms. `overtaken` is the machine's answer, written when the car closes before this repair finishes.
'''

[[workflow.step]]
title = "rerailed"
kind = "outcome"
ready_when = "steps.rerail.done AND steps.rerail.metadata.result = \"rerailed\""
title_template = "Rerailed: the green rides the car"
metadata_defaults = { outcome_kind = "completed" }
terminal = { outcome = "rerailed" }

[[workflow.step]]
title = "refused"
kind = "outcome"
ready_when = "steps.rerail.done AND steps.rerail.metadata.result = \"refused\""
title_template = "Refused: a person decides the hunk"
metadata_defaults = { outcome_kind = "aborted" }
terminal = { outcome = "refused" }

[[workflow.step]]
title = "overtaken"
kind = "outcome"
ready_when = "steps.rerail.done AND steps.rerail.metadata.result = \"overtaken\""
title_template = "Overtaken: the car closed first"
metadata_defaults = { outcome_kind = "withdrawn" }
terminal = { outcome = "overtaken" }
