[[workflow]]
kind = "backlog-item"
label = "Backlog item"
category = "platform"
subject_kinds = ["custom"]
owning_team = "platform"
description = "One piece of engineering backlog, modelled as work rather than a line in a markdown file. The Subject is the area it touches, so \"what is outstanding against the ledger\" answers from Subject history. Triage requires the evidence behind the routing decision, because the failure mode of a backlog is not neglect but confident wrong answers read off its own text \u2014 an internal claim about the codebase decays every time the codebase moves. `stale` exists for the items that die without anyone doing them, and `verify` for the ones whose claim needs re-measuring before anyone acts. An item routed to `design` is not finished by the review: the review's verdict is its route, and `approved` opens the build the design decided on rather than closing the item on the decision."
metadata = { owner_role = "platform-admin" }

[[workflow.step]]
title = "filed"
kind = "trigger"
ready_when = "true"
title_template = "Filed to the backlog"
metadata_defaults = { trigger_kind = "operator", trigger_name = "item-enters-the-backlog" }

[[workflow.step]]
title = "triage"
kind = "task"
ready_when = "steps.filed.done"
title_template = "Measure the claim, choose a route"
# WHO THIS IS FOR, declared once (design f5ebd2e1, car 1 — 67a58840).
# `audience` replaces the bare `authority_role` this step carried: the
# loader writes `authority_role` from it as the projection, so the
# published row is the same row plus the declaration, and every reader
# of the role key (My Day's role arm, the projected
# `q.platform-admin.task` queue, the editor) is unchanged. This step
# and `design-review` are the design's own instance — the decision
# step the `design` route produced was in My Day's endpoint and on no
# page — so they are the first two steps in the bundle to say who they
# are for in the one shape every reader derives from.
audience = { role = "platform-admin" }
# HOW AN ABSENCE VERDICT IS MADE, on the step that makes it (backlog
# fac521bc). A does-not-reproduce triage on c68104cf ran the real
# lint, used tracked fixtures, and added a CONTROL — every part of the
# method this repo asks for — and was still wrong, because the
# fixtures were built from the packet's prose rather than from the
# file the packet named. Prose in a doc is read by whoever goes
# looking; a procedure is read by whoever is doing the triage, at the
# moment they do it, and is versioned with the protocol.
#
# HOW AN AGENT RUNS IT (backlog cf6be734, 2026-09-25). Measured 05:20Z:
# 295 open backlog-items, 95 waiting HERE, the oldest six days, and
# `boss dispatch` refused every one by name — this step declared no
# block — so each was triaged by agent-claude by hand while builder
# slots and gate bays sat idle downstream. An `analyst`, not a builder:
# a route is reads and a verdict, no car, the call `draft-design` below
# makes. Medium effort at $2, the analyst setting: the judgement is
# real (an absence verdict is the expensive one to get wrong, see
# below), but it is ONE claim's measurement and one read of the open
# list, not page-audit's joined walk of a component tree.
#
# THE FIRST FOUR PARAGRAPHS ARE THE SAME CHANGE. A dispatched run is
# briefed with this text and nothing a session carries in memory, so
# the acts an operator's startup made habitual — measure on origin/main
# (CLAUDE.md §Engineering Session Startup, step 4), read the open list
# before filing a route, record through the verb's `-file` twin — ride
# here, on the step, or the run does not do them.
agent = { profile = "analyst", model = "opus-5[1m]", budget_usd = 2, effort = "medium" }
metadata_defaults = { procedure = """Measure the claim yourself before you route it, and put the measurement in `evidence` — a route chosen off the packet's own text is the failure this step exists to refuse.

MEASURE ON origin/main, NOT ON THE DAY IT WAS FILED. Run `git fetch origin`, then read the site as it stands now: `git show origin/main:<path>` for the file the claim names, `git log origin/main --oneline -S '<the string>' -- <path>` for a change that already removed it, and `boss merged <branch>` when the packet names a branch. A claim filed against an older tree may already be fixed — on 2026-09-01 a session closed five 'open' packets whose fixes were already on main. A claim about the live system (a count, a queue, an answer a service gives) is re-read now through `boss-api GET`, never quoted from the description, and an empty answer gets a control read whose answer you already know before it counts as absence.

DEDUP AGAINST WHAT IS OPEN. Read `boss-api GET '/api/jobs?kind=backlog-item&status=open&limit=500'` into a file in your run directory, compare the rows you hold to `.total` and page with `offset=` until they agree — a limit is not a filter — and search the titles and descriptions for the claim's own nouns: the file, the verb, the step, the error string. Then the cars: `boss-api GET /api/stations/loading-dock/queue` and `boss-api GET '/api/jobs?kind=gate-run&limit=40'`, because a branch already carrying the fix makes this item that car's item. A duplicate names what it duplicates, and the older item is the one that stays: `boss triage <this packet> duplicate --of <that packet> --evidence-file <PATH>`.

CHOOSE THE ROUTE THE MEASUREMENT SUPPORTS, AND RECORD IT WITH THE VERB. `build` when the claim holds on origin/main and the fix is a car; `design` when it holds and the fix is a choice (the `draft-design` step files the design next); `verify` when it cannot be measured from here yet, naming what would measure it; `stale` when origin/main no longer carries it, naming the commit that removed it; `decline` when it holds and is not worth a car, with the reason. Write the evidence to a file in your run directory and run `boss triage <this packet> <route> --evidence-file <PATH>`: the verb checks the route against this step's `disposition` set, writes `evidence`, and reads the packet back, and the file keeps a backtick intact where argv would run it as a command (2376b89e). The evidence names what you read, the origin/main sha you read it at (`git rev-parse origin/main`), when (`date -u`), the open list's `.total`, and each near-duplicate you ruled out and why — so the next reader can re-run it rather than trust it.

AN ABSENCE VERDICT — does-not-reproduce, already-fixed, `stale` — is the most expensive one to get wrong, because a well-evidenced wrong answer is a worse record than no answer at all: the next reader trusts it. Two rules, both bought on 2026-09-21 (backlog fac521bc).

REPRODUCE FROM THE FILE, NOT FROM THE PROSE. When the packet names the car, train, commit or file its finding came from, `git show <ref>:<path>` that file and reproduce in the shape it actually has. The prose is a report of the site; only the site is the site. Packet c68104cf's reported line was never the plain shell comment its triage planted: it sat inside a `python3 - <<'PY'` heredoc, and a heredoc body is classified off its OPENER, so the lexer rule the fixture was testing never applied to it. Planted in THAT shape it reproduced on the first run — and the file was named in the packet's own related-car reference, one read away.

SAY WHICH SHAPE YOU TESTED. A control proves the fixture is STRONG enough to catch something; it says nothing about whether the fixture is the right SHAPE. Those are two different failure modes, and a control covers only the first — which is why adding one, the part everyone remembers to add, did not save the verdict above. So an absence verdict names the shape it planted and where that shape came from. One that states its fixture can be re-opened by anyone who notices the shape was wrong; one that only says it does not reproduce cannot.""" }
[[workflow.step.fields]]
name = "disposition"
field_type = "verify|design|build|duplicate|stale|decline"
required = true
[[workflow.step.fields]]
name = "evidence"
field_type = "string"
required = true
# The decider's brief, written at routing time by whoever chose
# `design`: what they must READ (markdown — the measurement, the
# options, the artifact) and the answer you would give. Optional here
# because only the design route needs them; the decide step's surface
# says loudly when they are absent. They live on THIS step so the
# route and its brief are one write — 2026-09-05, three items reached
# David's queue as "Decide the design" with nothing to read, because
# the brief had gone onto the triage evidence and the decide step was
# a bare task.
[[workflow.step.fields]]
name = "context_md"
field_type = "string"
required = false
[[workflow.step.fields]]
name = "proposed"
field_type = "string"
required = false

[[workflow.step]]
title = "measure"
kind = "task"
ready_when = "steps.triage.done AND steps.triage.metadata.disposition = \"verify\""
title_template = "Re-measure the claim"
authority_role = "platform-admin"
# THE SAME DISPOSITION THE BUILD STEP CARRIES, and for the same reason
# (backlog 2802ba8c). `build` has declared this since a build that
# REFUTES its packet gained a way out. `measure` never did, so a
# re-measurement that DISPROVED the claim had exactly one exit — the
# `closed` terminal, which says the work was completed. A measurement
# is the step most likely to disprove the thing that prompted it, and
# it was the one step that could not say so.
#
# AND THE MEASUREMENT ITSELF IS REQUIRED (backlog 828381c0). That fixed
# where a disproving measurement could ROUTE; it gave no measurement
# anywhere to LAND. On 2026-09-22 `boss step complete dd92d961 --step
# measure` with no fields completed the step and closed the packet
# holding nothing measured — a bare completion was the only one this
# row permitted — and 648a68a9's real finding the same night had to be
# annotated onto the packet instead. No evidence is not a pass, at the
# step that exists to produce it: `evidence` is triage's name for the
# same thing, and every machine withdrawal (sensor.poll, estate.recover,
# cadence silence) already writes it when it completes this step.
#
# AND A MEASUREMENT THAT CONFIRMS THE CLAIM ROUTES ONWARD (backlog
# c4d82c6f). 2802ba8c gave a DISPROVING measurement its exits; the
# confirming one kept exactly one — `closed`, whose outcome says the
# work was completed. Measured 2026-09-24: four items triaged `verify`
# on 2026-09-22 (07eee681, 9b0ad69d, af27db95, ddf0773e) were
# re-measured on origin/main 518a4f8 and every claim held, and
# completing this step would have closed all four as done with nothing
# built, so they sat here. `build` and `design` are triage's own words
# for the same two routes: `build` opens the build and `design` opens
# the draft, each of which names this step in its `ready_when`, and
# `closed` excludes both. No `verify` — this step IS the verification.
#
# HOW AN AGENT RUNS IT (backlog cf6be734, 2026-09-25): `boss dispatch`
# refused this step on 70da1212 and 8db1d6a6 the day before, for want
# of this block. The same analyst setting as `triage` and for the same
# reason — reads and a verdict, no car. `audience`/`authority_role`
# stays as it was: the convert door compares authority, and an
# unchanged one keeps every open item's move automatic.
#
# THE PROCEDURE SAYS WHAT A CONFIRMED CLAIM DOES. cf6be734 wrote it
# while the row had no onward route, so it told the analyst to leave
# the disposition off and file the change as a second item — the
# workaround for this defect. Since c4d82c6f the row carries the route:
# a claim that HOLDS and needs a change says `build` or `design` and
# THIS item goes on to it. A measurement with no disposition still
# reaches `closed` (the closure fallback), for a claim that held and
# asked for nothing beyond being measured.
agent = { profile = "analyst", model = "opus-5[1m]", budget_usd = 2, effort = "medium" }
metadata_defaults = { procedure = """Re-measure the claim triage could not settle, and put the measurement in `evidence` — it is required: no evidence is not a pass (828381c0). Triage routed here with `verify`, and its evidence names what would measure the claim; start there.

MEASURE ON origin/main AND THE LIVE SYSTEM, NOW. Run `git fetch origin`, read the site with `git show origin/main:<path>` — the file the packet names, reproduced in the shape it actually has, not the shape its prose describes — and look for the change that removed it with `git log origin/main --oneline -S '<the string>' -- <path>`. A claim about the live system is re-read through `boss-api GET` with the time you read it; an empty answer gets a control read whose answer you already know before it counts as absence. An absence verdict names the shape you tested and where that shape came from: the triage step on this packet carries the two rules and the case that paid for them (fac521bc), and they bind here too.

DEDUP AGAINST WHAT IS OPEN. Read `boss-api GET '/api/jobs?kind=backlog-item&status=open&limit=500'` into a file in your run directory, page with `offset=` until the rows you hold match `.total`, and search titles and descriptions for the claim's own nouns. Another open item making the same claim makes this one the duplicate when it is the younger; name the other by its full id in the evidence.

THE DISPOSITION IS THE OUTCOME. `stale` when origin/main or the live system no longer shows the claim, naming the commit or the read; `duplicate` when another item covers it; `decline` when it holds and is not worth acting on, with the reason. When it HOLDS and needs a change, `build` opens this item's own build step, and `design` its draft-design when the change needs a decision first — the item goes on to the work, it does not close on the measurement (c4d82c6f). Leave the disposition off only when the claim held and asked for nothing beyond being measured: this item then closes `completed`.

RECORD IT WITH THE VERB. Write the evidence to a file in your run directory and run `boss step complete <this packet> --step measure --field-file evidence=<PATH>`, adding `--field disposition=<stale|duplicate|decline|build|design>` when one applies. The verb refuses a field this row does not declare, lays the write over this step's metadata so this procedure and the agent keys stay, and reads the packet back. The evidence names what you read, the origin/main sha (`git rev-parse origin/main`), when (`date -u`), the open list's `.total`, and anything filed.""" }
fields = [
  { name = "disposition", field_type = "stale|duplicate|decline|build|design", required = false },
  { name = "evidence", field_type = "string", required = true },
]

# THE DESIGN ROUTE OPENS THE DRAFT FIRST (backlog f90ca046, 2026-09-18)
# — the same shape as user-feedback's, and for the same measured
# reason: routing to `design` made `design-review` READY with no design
# filed, a decision for the founder with nothing to decide (4f6019d7).
# A platform-admin TASK rides the executor lane (the dispatcher's
# DECIDES-vs-EXECUTES rule, 291a73a7 — how `build` reaches the agent);
# the bundle names no tenant's role or agent (e2580840). `boss design
# --answers <this item>` files the design, writes the review's
# question, and completes this step with `design_id`.
#
# TWO WAYS IN since c4d82c6f: triage's `design`, or a re-measurement
# that confirmed the claim and chose `design` (see `measure` above).
# Naming `measure` also holds this step Pending across a `verify`
# route instead of Skipped at triage time — the af28e250 mechanism.
[[workflow.step]]
title = "draft-design"
kind = "task"
ready_when = "(steps.triage.done AND steps.triage.metadata.disposition = \"design\") OR (steps.measure.done AND steps.measure.metadata.disposition = \"design\")"
title_template = "Draft the design"
audience = { role = "platform-admin" }
# An analyst's step, not a builder's: agent-claude completed it 4 times
# live (measured 2026-09-18) writing a design, never code. Same block
# shape as `build` below; see the note there (c87fb59b car 1).
agent = { profile = "analyst", model = "opus-5[1m]", budget_usd = 2, effort = "medium" }
# The procedure's second paragraph (backlog 4f71e608, 2026-09-24):
# design e1dba350 carried three questions the company frame answered,
# so the author now decides those and asks only the five classes named.
# Pinned with page-audit's sites by
# the_author_decides_from_the_company_frame.rs.
metadata_defaults = { procedure = "File the design-doc that answers this item: `boss design <title> --markdown-file <file> --question 'Qn|title|proposal' ... --answers <this packet>`. The verb writes the design's id here as design_id and completes this step; the founder's design-review opens on it, asking for that design at /it/design. ALREADY ANSWERED (backlog 2d3cbeb2): when a design that already exists answers this item, file no second one — complete this step with `boss step complete <this packet> --step draft-design --field design_id=<that design's FULL id> --field disposition=duplicate`. The item closes on its duplicate terminal naming that design, and no review opens, because the decision it would ask for belongs to that design.\n\nDECIDE WHAT THE FRAME DECIDES; ASK ONLY WHAT IT CANNOT (backlog 4f71e608). A --question goes to David, and David, 2026-09-24: \"I do sort of think you are pushing too many questions to me that you could answer on your own. Remember we are building a company, run by one person plus agents, that is going to run a hosting business based on its open source release.\" That frame, he said, is the common-sense guide to our audits' gap analysis and to clearing out, then cleaning up, the demo tenant's leftover pieces. And: \"I can always provide feedback later too as our software is designed for making low cost changes.\" So every choice that frame answers — one person plus agents; a hosting business on the open-source release; our instance runs only the modules it uses and the rest stay for the example tenants; the demo tenant's leftovers cleared out, then cleaned up — is DECIDED in the markdown with its reason, and recorded on this item as `decided_<date>` (`boss job patch <this packet> <file.json>` with the object {\"decided_2026-09-24\": \"<the decision> — because <the reason>\"}, the date read from `date -u +%F`, never typed). Only strategy or priority trade-offs, trust and security boundaries, credentials, money, and brand or voice may ride as a --question. With none left, file with --no-questions — a doc that records decisions rather than asking for them — and David corrects any of them later through the ordinary cheap-change path." }
[[workflow.step.fields]]
name = "design_id"
field_type = "string"
required = true
# A DRAFT MAY FIND THE QUESTION ALREADY ANSWERED (backlog 2d3cbeb2,
# 2026-09-23). The draft-design analyst on f5c1e556 (run 0bb07052)
# found design bffc0aba already answering it, and the step had no
# honest exit: `design_id` is required, and completing it with the old
# design's id opened `design-review` — an empty Decide for David whose
# closing rule (the design's own decision) had fired long ago and
# would never fire again. So the item sat here with `duplicate_of`
# annotations and no terminal. Same shape as `build`'s and `measure`'s
# disposition (6c114a23, 2802ba8c): OPTIONAL, enum-checked at
# completion, read by the `duplicate` terminal below, and read
# NEGATIVELY by `design-review`, so a draft that filed a design carries
# none and opens the review exactly as before. `design_id` stays
# required: on a duplicate it names the design that covers the item.
#
# TWO VALUES, AND `filed` IS THE ORDINARY ONE. A one-value type is not
# an enum to the validator (step_registry.rs `validate_field_type`
# reads a type as an enum only when it contains `|`, and accepts any
# other unknown spec), so `duplicate` alone would take `dup` or
# `duplciate` in silence — and a misspelled refusal lands on the review,
# the empty decision this exists to refuse. `filed` names the ordinary
# draft; `boss design --answers` writes no disposition, which is Absent
# and lands in the same place. No `stale`: this step's `design_id` is
# required, and a claim that died is `build`'s or `measure`'s call.
[[workflow.step.fields]]
name = "disposition"
field_type = "duplicate|filed"
required = false

[[workflow.step]]
title = "design-review"
# answer-question, not task: the decision surface (question, the
# asker's markdown context, a proposed answer to copy, verdict +
# answer) — the same step user-feedback's design route already uses.
# A bare task showed a title and two empty boxes, so the person
# deciding had nothing to decide FROM. The plugin reads context_md
# and proposed from this step, then the packet, then the triage step
# that routed here.
kind = "answer-question"
# Only once there is a design to decide — see `draft-design` above —
# and NOT when the draft named a design that already answers the item
# (2d3cbeb2): that decision belongs to the other design, and nothing
# would ever complete a second copy of it here. Stated negatively so an
# ordinary draft, whose disposition is Absent, still opens the review.
ready_when = "steps.draft-design.done AND NOT (steps.draft-design.metadata.disposition = \"duplicate\")"
title_template = "Decide the design"
# Declared once — see `triage` above (f5ebd2e1 car 1). The projected
# `authority_role` is what routes this to the platform-admin holder
# today; a `station` audience naming `design-review` is the car-2 move,
# once that row's predicate reads the `station` key.
audience = { role = "platform-admin" }
# THE VERDICT IS THE ROUTE. `answered` is not a destination on its
# own, and af28e250 asked for a new `route` field to supply one. It
# does not need one: this enum already names three destinations, and
# the three steps below now read it — `approved` opens `build`,
# `declined` reaches the declined outcome, `answered` closes the item.
# A second field naming the same fork would be a fact living twice
# (CLAUDE.md 9a). `user-feedback` routes on this same field.
#
# It is required, so a review cannot complete without saying where it
# goes, and enum-checked because it is authored on the step: the
# bundle declares `verdict` as a bare string, and a probe completing
# such a step with `verdict = "__probe__"` got 204 (cb9661fe).
#
# The verdict vocabulary, authored HERE rather than on the
# `answer-question` bundle. The bundle declares `verdict` as a bare
# `string` (its three values live in prose), and a field-discovery
# probe completing this step with `verdict = "__probe__"` got 204
# (a305385b; backlog item cb9661fe, defect 2). Tightening the bundle
# is refused by steptype-bundle-ratchet — it is unversioned, so every
# in-flight step would retighten at the next restart. This is the
# versioned path `approval` already uses: packets admitted under this
# version carry the enum; earlier ones keep the contract they had.
[[workflow.step.fields]]
name = "verdict"
field_type = "approved|declined|answered"
required = true

[[workflow.step]]
title = "build"
kind = "task"
# TWO WAYS IN, and the second one is why this step is still alive.
#
# af28e250, measured 2026-09-09 against v4: this read only the triage
# disjunct, so the moment triage resolved to `design` every step that
# referenced only triage had all its references terminal, its
# predicate still false, and was SKIPPED on the spot (registry.rs,
# `refs_all_terminal`). The build was dead hours before the reviewer
# answered; then `closed` fired on a bare `steps.design-review.done`
# and the packet terminated ON the decision. Two designs were taken
# that way on 2026-09-08 — 2d4a5a8b and 9e82ee62 — and neither
# produced any work.
#
# NAMING `design-review` IS THE FIX. A Pending step is skipped only
# when EVERY step it references is terminal, so referencing the review
# holds this one Pending across it instead of resolving it at triage
# time. `user-feedback` has carried exactly this edge since v9 and its
# design route works; backlog-item simply never got it.
#
# AND A THIRD, for the same reason (backlog c4d82c6f): a re-measurement
# that CONFIRMED the claim and chose `build`. Before it, this step
# referenced only triage and the review, so a `verify` route skipped it
# at triage time and a confirmed claim could reach only `closed`.
ready_when = "(steps.triage.done AND steps.triage.metadata.disposition = \"build\") OR (steps.measure.done AND steps.measure.metadata.disposition = \"build\") OR (steps.design-review.done AND steps.design-review.metadata.verdict = \"approved\")"
title_template = "Build the change"
authority_role = "platform-admin"
# HOW AN AGENT RUNS IT, declared once (design c87fb59b car 1, backlog
# 028891cf). This is the step the executor lane hands to the agent:
# measured 2026-09-18 over 155 backlog-items read (every closed one
# and 50 open), `build` completed 74 times by the car-merged rule on
# the builder's behalf and 6 times by agent-claude directly — and
# nothing on the row said which model, at what effort, under what
# spend. The prompt is not here; it is the procedure a builder is
# briefed with. Materialisation projects this
# onto the packet as agent_profile / agent_model / agent_budget_usd /
# agent_effort, which a station predicate and the claim door read.
agent = { profile = "builder", model = "opus-5[1m]", budget_usd = 5, effort = "high" }
# A BUILDER MAY REFUTE (backlog 6c114a23, 2026-09-20). Verify-the-claim
# is required of every builder, and when it fires HERE rather than at
# triage the packet used to have nowhere to land: the three withdrawal
# terminals read triage alone, so routing to `build` skipped all three
# and the only terminal left was `closed`, whose outcome asserts the
# work was done. Measured on ef74fc12, whose builder correctly refused
# to build: it was closed out of band with a PUT and a `refuted`
# annotation, so the packet is closed with NO terminal outcome and
# every count that reads terminals sees it as neither stale nor built.
#
# OPTIONAL, and checked at completion, not at create — a build that
# built leaves it absent, which is Absent in boss-expr and false
# against every literal, so `closed` still takes it. The set omits
# `verify`, `design` and `build`: a builder refutes a packet, it does
# not re-route one. Ordering, for a dispatched run: complete the RUN's
# `building` with `result = refused` FIRST — completing this step fires
# `agent-run-delivers-when-its-step-is-done`, which would land the run
# as `delivered`, and a completed `building` is every later writer's
# no-op.
#
# `delivered` IS NOT A REFUTATION (backlog 4bcf1265, design fd8b5143
# item 3). 3fec1ed9 and fa77e3d7 were delivered through the tenant repo
# (david/algedonic-llc) and a tenant publish, with no car in this tree,
# and this set offered only the three withdrawals — so both closed as
# `stale`, a record saying the claim died when the work was done. A
# delivered build opens `prove-delivery` below instead of closing the
# item, because this tree cannot see the tenant repo: the item closes
# on the live read-back, not on the builder's word.
[[workflow.step.fields]]
name = "disposition"
field_type = "stale|duplicate|decline|delivered"
required = false

[[workflow.step]]
title = "prove-delivery"
kind = "task"
# Only a delivered build opens it; any other build, and every route
# that skips `build`, leaves it with its one reference terminal and its
# predicate false, so it is skipped (registry.rs, `refs_all_terminal`).
ready_when = "steps.build.done AND steps.build.metadata.disposition = \"delivered\""
title_template = "Prove the tenant delivery"
# Declared once, the shape `triage` uses (f5ebd2e1).
audience = { role = "platform-admin" }
metadata_defaults = { procedure = "The work landed outside this tree, so the item closes on a read of the live system, not on the delivery report. `landed`: where it landed — the tenant repo, the commit on its main, and the publish that carried it (for example `boss tenant publish`). `read_back`: the read of the LIVE registry that shows it running, with its answer — for a protocol, `GET /api/workflows/<kind>` naming the kind at the version the tenant branch declared. A read-back you did not run is not a read-back; if the live system does not show it yet, leave this step open." }
# Both required at done, not at create: no evidence is not a pass.
fields = [
  { name = "landed", field_type = "string", required = true },
  { name = "read_back", field_type = "string", required = true },
]

[[workflow.step]]
title = "duplicate"
kind = "outcome"
# THREE ARMS, ONE PER PLACE A REFUTATION CAN BE FOUND — see the
# `disposition` field on `build` above (6c114a23). Naming `build` also
# keeps this step Pending across the build instead of Skipped at triage
# time: a Pending step is skipped only when EVERY step it references is
# terminal, the same mechanism af28e250 used to keep `build` alive
# across the review.
#
# A FOURTH ARM, for a draft that found the question already answered
# (2d3cbeb2) — see `disposition` on `draft-design`. `closed` needs no
# matching edit: with the review skipped, `build` skips, and `closed`'s
# every disjunct reads a step that never completed.
ready_when = "(steps.triage.done AND steps.triage.metadata.disposition = \"duplicate\") OR (steps.build.done AND steps.build.metadata.disposition = \"duplicate\") OR (steps.measure.done AND steps.measure.metadata.disposition = \"duplicate\") OR (steps.draft-design.done AND steps.draft-design.metadata.disposition = \"duplicate\")"
title_template = "Closed as a duplicate"
metadata_defaults = { outcome_kind = "withdrawn" }
terminal = { outcome = "duplicate" }

[[workflow.step]]
title = "stale"
kind = "outcome"
ready_when = "(steps.triage.done AND steps.triage.metadata.disposition = \"stale\") OR (steps.build.done AND steps.build.metadata.disposition = \"stale\") OR (steps.measure.done AND steps.measure.metadata.disposition = \"stale\")"
title_template = "Closed \u2014 the claim no longer holds"
metadata_defaults = { outcome_kind = "withdrawn" }
terminal = { outcome = "stale" }

[[workflow.step]]
title = "declined"
kind = "outcome"
ready_when = "(steps.triage.done AND steps.triage.metadata.disposition = \"decline\") OR (steps.measure.done AND steps.measure.metadata.disposition = \"decline\") OR (steps.design-review.done AND steps.design-review.metadata.verdict = \"declined\") OR (steps.build.done AND steps.build.metadata.disposition = \"decline\")"
title_template = "Closed without action"
metadata_defaults = { outcome_kind = "aborted" }
terminal = { outcome = "declined" }

[[workflow.step]]
title = "closed"
kind = "outcome"
# NOT `steps.design-review.done`. That bare reference is the other
# half of af28e250: it closed the item the instant the review was
# answered, whatever the answer said, and it would now RACE the build
# the review has just authorized — two steps Ready off one write.
#
# So this reads the verdict, and it reads it as the NEGATIVE of the
# two verdicts that route somewhere else. Stated positively
# (`= "answered"`) a verdict that is somehow neither approved,
# declined nor answered would skip `build`, skip `declined`, and skip
# this too, leaving the packet open with no terminal reachable —
# wedged. Stated negatively, an unreadable answer still lands here and
# the item CLOSES. An absent verdict is `Absent` in boss-expr
# (7b756357), false against every literal, so `NOT (false OR false)`
# is true and this is where it goes. The API cannot produce that
# case — `verdict` is required at completion and enum-checked on the
# step below — but closure is the property that must not depend on
# that holding.
#
# AND NOT A BARE `steps.build.done` EITHER, since 6c114a23. A build
# that refutes the packet routes to a withdrawal terminal, and two
# terminals Ready off one write is the same race the review fork must
# not have. So the build disjunct is stated the same way — the NEGATIVE
# of the three dispositions that route elsewhere — and for the same
# reason: an unreadable disposition still lands HERE and the item
# closes, rather than skipping every successor and wedging the packet
# open. A build that built carries no disposition at all, which is
# Absent, false against every literal, so `NOT (false OR false OR
# false)` is true and the ordinary path is unchanged.
#
# `delivered` joins that negative list and reaches here through its
# own arm instead, `steps.prove-delivery.done` (4bcf1265): a delivered
# build closes the item as `completed` only once the live read-back is
# on the record, never on the build alone.
#
# THE MEASURE DISJUNCT EXCLUDES FIVE, since c4d82c6f: the three
# withdrawals plus `build` and `design`, which route a CONFIRMED claim
# onward. Left out, a confirming measurement would make this Ready
# beside the build it opened — the race above — and close the item as
# completed with nothing built, which is the defect.
ready_when = "(steps.measure.done AND NOT (steps.measure.metadata.disposition = \"stale\" OR steps.measure.metadata.disposition = \"duplicate\" OR steps.measure.metadata.disposition = \"decline\" OR steps.measure.metadata.disposition = \"build\" OR steps.measure.metadata.disposition = \"design\")) OR (steps.build.done AND NOT (steps.build.metadata.disposition = \"stale\" OR steps.build.metadata.disposition = \"duplicate\" OR steps.build.metadata.disposition = \"decline\" OR steps.build.metadata.disposition = \"delivered\")) OR steps.prove-delivery.done OR (steps.design-review.done AND NOT (steps.design-review.metadata.verdict = \"approved\" OR steps.design-review.metadata.verdict = \"declined\"))"
title_template = "Backlog item closed"
metadata_defaults = { outcome_kind = "completed" }
terminal = { outcome = "completed" }
