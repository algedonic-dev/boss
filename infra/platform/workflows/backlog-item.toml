[[workflow]]
kind = "backlog-item"
label = "Backlog item"
category = "platform"
subject_kinds = ["custom"]
owning_team = "platform"
description = "One piece of engineering backlog, modelled as work rather than a line in a markdown file. The Subject is the area it touches, so \"what is outstanding against the ledger\" answers from Subject history. Triage requires the evidence behind the routing decision, because the failure mode of a backlog is not neglect but confident wrong answers read off its own text \u2014 an internal claim about the codebase decays every time the codebase moves. `stale` exists for the items that die without anyone doing them, and `verify` for the ones whose claim needs re-measuring before anyone acts. An item routed to `design` is not finished by the review: the review's verdict is its route, and `approved` opens the build the design decided on rather than closing the item on the decision."
metadata = { owner_role = "platform-admin" }

[[workflow.step]]
title = "filed"
kind = "trigger"
ready_when = "true"
title_template = "Filed to the backlog"
metadata_defaults = { trigger_kind = "operator", trigger_name = "item-enters-the-backlog" }

[[workflow.step]]
title = "triage"
kind = "task"
ready_when = "steps.filed.done"
title_template = "Measure the claim, choose a route"
# WHO THIS IS FOR, declared once (design f5ebd2e1, car 1 — 67a58840).
# `audience` replaces the bare `authority_role` this step carried: the
# loader writes `authority_role` from it as the projection, so the
# published row is the same row plus the declaration, and every reader
# of the role key (My Day's role arm, the projected
# `q.platform-admin.task` queue, the editor) is unchanged. This step
# and `design-review` are the design's own instance — the decision
# step the `design` route produced was in My Day's endpoint and on no
# page — so they are the first two steps in the bundle to say who they
# are for in the one shape every reader derives from.
audience = { role = "platform-admin" }
[[workflow.step.fields]]
name = "disposition"
field_type = "verify|design|build|duplicate|stale|decline"
required = true
[[workflow.step.fields]]
name = "evidence"
field_type = "string"
required = true
# The decider's brief, written at routing time by whoever chose
# `design`: what they must READ (markdown — the measurement, the
# options, the artifact) and the answer you would give. Optional here
# because only the design route needs them; the decide step's surface
# says loudly when they are absent. They live on THIS step so the
# route and its brief are one write — 2026-09-05, three items reached
# David's queue as "Decide the design" with nothing to read, because
# the brief had gone onto the triage evidence and the decide step was
# a bare task.
[[workflow.step.fields]]
name = "context_md"
field_type = "string"
required = false
[[workflow.step.fields]]
name = "proposed"
field_type = "string"
required = false

[[workflow.step]]
title = "measure"
kind = "task"
ready_when = "steps.triage.done AND steps.triage.metadata.disposition = \"verify\""
title_template = "Re-measure the claim"
authority_role = "platform-admin"

# THE DESIGN ROUTE OPENS THE DRAFT FIRST (backlog f90ca046, 2026-09-18)
# — the same shape as user-feedback's, and for the same measured
# reason: routing to `design` made `design-review` READY with no design
# filed, a decision for the founder with nothing to decide (4f6019d7).
# A platform-admin TASK rides the executor lane (the dispatcher's
# DECIDES-vs-EXECUTES rule, 291a73a7 — how `build` reaches the agent);
# the bundle names no tenant's role or agent (e2580840). `boss design
# --answers <this item>` files the design, writes the review's
# question, and completes this step with `design_id`.
[[workflow.step]]
title = "draft-design"
kind = "task"
ready_when = "steps.triage.done AND steps.triage.metadata.disposition = \"design\""
title_template = "Draft the design"
audience = { role = "platform-admin" }
# An analyst's step, not a builder's: agent-claude completed it 4 times
# live (measured 2026-09-18) writing a design, never code. Same block
# shape as `build` below; see the note there (c87fb59b car 1).
agent = { profile = "analyst", model = "opus-5[1m]", budget_usd = 2, effort = "medium" }
metadata_defaults = { procedure = "File the design-doc that answers this item: `boss design <title> --markdown-file <file> --question 'Qn|title|proposal' ... --answers <this packet>`. The verb writes the design's id here as design_id and completes this step; the founder's design-review opens on it, asking for that design at /it/design." }
[[workflow.step.fields]]
name = "design_id"
field_type = "string"
required = true

[[workflow.step]]
title = "design-review"
# answer-question, not task: the decision surface (question, the
# asker's markdown context, a proposed answer to copy, verdict +
# answer) — the same step user-feedback's design route already uses.
# A bare task showed a title and two empty boxes, so the person
# deciding had nothing to decide FROM. The plugin reads context_md
# and proposed from this step, then the packet, then the triage step
# that routed here.
kind = "answer-question"
# Only once there is a design to decide — see `draft-design` above.
ready_when = "steps.draft-design.done"
title_template = "Decide the design"
# Declared once — see `triage` above (f5ebd2e1 car 1). The projected
# `authority_role` is what routes this to the platform-admin holder
# today; a `station` audience naming `design-review` is the car-2 move,
# once that row's predicate reads the `station` key.
audience = { role = "platform-admin" }
# THE VERDICT IS THE ROUTE. `answered` is not a destination on its
# own, and af28e250 asked for a new `route` field to supply one. It
# does not need one: this enum already names three destinations, and
# the three steps below now read it — `approved` opens `build`,
# `declined` reaches the declined outcome, `answered` closes the item.
# A second field naming the same fork would be a fact living twice
# (CLAUDE.md 9a). `user-feedback` routes on this same field.
#
# It is required, so a review cannot complete without saying where it
# goes, and enum-checked because it is authored on the step: the
# bundle declares `verdict` as a bare string, and a probe completing
# such a step with `verdict = "__probe__"` got 204 (cb9661fe).
#
# The verdict vocabulary, authored HERE rather than on the
# `answer-question` bundle. The bundle declares `verdict` as a bare
# `string` (its three values live in prose), and a field-discovery
# probe completing this step with `verdict = "__probe__"` got 204
# (a305385b; backlog item cb9661fe, defect 2). Tightening the bundle
# is refused by steptype-bundle-ratchet — it is unversioned, so every
# in-flight step would retighten at the next restart. This is the
# versioned path `approval` already uses: packets admitted under this
# version carry the enum; earlier ones keep the contract they had.
[[workflow.step.fields]]
name = "verdict"
field_type = "approved|declined|answered"
required = true

[[workflow.step]]
title = "build"
kind = "task"
# TWO WAYS IN, and the second one is why this step is still alive.
#
# af28e250, measured 2026-09-09 against v4: this read only the triage
# disjunct, so the moment triage resolved to `design` every step that
# referenced only triage had all its references terminal, its
# predicate still false, and was SKIPPED on the spot (registry.rs,
# `refs_all_terminal`). The build was dead hours before the reviewer
# answered; then `closed` fired on a bare `steps.design-review.done`
# and the packet terminated ON the decision. Two designs were taken
# that way on 2026-09-08 — 2d4a5a8b and 9e82ee62 — and neither
# produced any work.
#
# NAMING `design-review` IS THE FIX. A Pending step is skipped only
# when EVERY step it references is terminal, so referencing the review
# holds this one Pending across it instead of resolving it at triage
# time. `user-feedback` has carried exactly this edge since v9 and its
# design route works; backlog-item simply never got it.
ready_when = "(steps.triage.done AND steps.triage.metadata.disposition = \"build\") OR (steps.design-review.done AND steps.design-review.metadata.verdict = \"approved\")"
title_template = "Build the change"
authority_role = "platform-admin"
# HOW AN AGENT RUNS IT, declared once (design c87fb59b car 1, backlog
# 028891cf). This is the step the executor lane hands to the agent:
# measured 2026-09-18 over 155 backlog-items read (every closed one
# and 50 open), `build` completed 74 times by the car-merged rule on
# the builder's behalf and 6 times by agent-claude directly — and
# nothing on the row said which model, at what effort, under what
# spend. The prompt is not here; it is the procedure a builder is
# briefed with. Materialisation projects this
# onto the packet as agent_profile / agent_model / agent_budget_usd /
# agent_effort, which a station predicate and the claim door read.
agent = { profile = "builder", model = "opus-5[1m]", budget_usd = 5, effort = "high" }

[[workflow.step]]
title = "duplicate"
kind = "outcome"
ready_when = "steps.triage.done AND steps.triage.metadata.disposition = \"duplicate\""
title_template = "Closed as a duplicate"
metadata_defaults = { outcome_kind = "withdrawn" }
terminal = { outcome = "duplicate" }

[[workflow.step]]
title = "stale"
kind = "outcome"
ready_when = "steps.triage.done AND steps.triage.metadata.disposition = \"stale\""
title_template = "Closed \u2014 the claim no longer holds"
metadata_defaults = { outcome_kind = "withdrawn" }
terminal = { outcome = "stale" }

[[workflow.step]]
title = "declined"
kind = "outcome"
ready_when = "(steps.triage.done AND steps.triage.metadata.disposition = \"decline\") OR (steps.design-review.done AND steps.design-review.metadata.verdict = \"declined\")"
title_template = "Closed without action"
metadata_defaults = { outcome_kind = "aborted" }
terminal = { outcome = "declined" }

[[workflow.step]]
title = "closed"
kind = "outcome"
# NOT `steps.design-review.done`. That bare reference is the other
# half of af28e250: it closed the item the instant the review was
# answered, whatever the answer said, and it would now RACE the build
# the review has just authorized — two steps Ready off one write.
#
# So this reads the verdict, and it reads it as the NEGATIVE of the
# two verdicts that route somewhere else. Stated positively
# (`= "answered"`) a verdict that is somehow neither approved,
# declined nor answered would skip `build`, skip `declined`, and skip
# this too, leaving the packet open with no terminal reachable —
# wedged. Stated negatively, an unreadable answer still lands here and
# the item CLOSES. An absent verdict is `Absent` in boss-expr
# (7b756357), false against every literal, so `NOT (false OR false)`
# is true and this is where it goes. The API cannot produce that
# case — `verdict` is required at completion and enum-checked on the
# step below — but closure is the property that must not depend on
# that holding.
ready_when = "steps.measure.done OR steps.build.done OR (steps.design-review.done AND NOT (steps.design-review.metadata.verdict = \"approved\" OR steps.design-review.metadata.verdict = \"declined\"))"
title_template = "Backlog item closed"
metadata_defaults = { outcome_kind = "completed" }
terminal = { outcome = "completed" }
