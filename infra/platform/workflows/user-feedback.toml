# ---------------------------------------------------------------------
# THE TWO MOST-EDITED PROTOCOLS, moved here from Rust (e332a320).
#
# user-feedback reached v13 and pr-train v16 through the API, and both
# were ALSO maintained by hand in registry.rs so a fresh install seeded
# the same thing — 453 lines of Rust kept equal to production by
# somebody's diligence. There was no drift when this was measured, and
# that is the point: the mechanism was a habit, and CLAUDE.md 9a is
# explicit that a habit standing where a mechanism belongs is the thing
# to fix. Nothing compared the two, because bootstrap_reconcile
# correctly preserves operator-edited rows and therefore never looks.
# The failure mode was silent and only reachable on a fresh install —
# the one path with no operator to notice.
#
# These blocks were GENERATED from the live v13 and v16 specs and
# verified to round-trip: emitted, parsed back, and compared
# field-by-field against the live JSON before the Rust was deleted.
# ---------------------------------------------------------------------

[[workflow]]
kind = "user-feedback"
label = "User feedback"
category = "platform"
subject_kinds = ["custom"]
owning_team = "platform"
description = "Feedback a user sent from the chrome bar. The Subject is the surface it is about (a `custom` Subject whose id is the route path), so \"what have people said about this page\" is a Subject-history question rather than a report someone has to build. Modelled as a Job deliberately: feedback is work, and work that lives outside the Job model is work the system cannot route, own, or audit. Triage forks on a disposition, so routing an item is a recorded decision that opens the next step."
metadata = { owner_role = "platform-admin" }

[[workflow.step]]
title = "submitted"
kind = "trigger"
ready_when = "true"
title_template = "Feedback submitted"
metadata_defaults = { trigger_kind = "operator", trigger_name = "user-submits-feedback" }

[[workflow.step]]
title = "triage"
kind = "task"
ready_when = "steps.submitted.done"
title_template = "Triage feedback"
authority_role = "platform-admin"
[[workflow.step.fields]]
name = "disposition"
field_type = "reproduce|design|build|duplicate|needs-info|decline"
required = true
[[workflow.step.fields]]
name = "finding"
field_type = "string"
required = false

[[workflow.step]]
title = "investigate"
kind = "task"
ready_when = "steps.triage.done AND steps.triage.metadata.disposition = \"reproduce\""
title_template = "Reproduce and investigate"
authority_role = "platform-admin"
metadata_defaults = { disposition = "resolved" }
[[workflow.step.fields]]
name = "disposition"
field_type = "resolved|design|build|needs-info|duplicate|decline"
required = true
[[workflow.step.fields]]
name = "finding"
field_type = "string"
required = false

# THE DESIGN ROUTE OPENS THE DRAFT FIRST (backlog f90ca046, 2026-09-18).
# Measured on 54f0ab33 (Feedback on /it/estate): David triaged it
# `design` and the version before this one made `design-review` READY
# on the spot — an answer-question for platform-admin with an empty
# verdict and no design filed — so the founder got a decision with
# nothing to decide (his bug 4f6019d7 again: "There is no question,
# just a statement"). The rule
# complete-feedback-design-review-on-design-doc-published closes it only
# once a design carrying an `answers` edge publishes, so the step sat
# open, empty, on the one person, until an agent filed the design by
# hand.
#
# So the design IS the work between the route and the decision, and it
# is a step: this task files it. `authority_role = "platform-admin"` on
# a TASK is the executor lane — the dispatcher's DECIDES-vs-EXECUTES
# rule (291a73a7) nominates the configured executor for a platform-admin
# step that is not decision-shaped, which is how `build` below reaches
# the agent today (54f0ab33's build step is assigned to it); a
# decision-shaped step goes to the founder. The bundle names no
# tenant's role or agent (e2580840): who the executor is stays a
# deployment fact.
#
# `design_id` is required at done: `boss design --answers <this packet>`
# files the design, writes the review's question, and completes this
# step with the id — the record is the verb's, not retyped. The review
# below is `ready_when = steps.draft-design.done`, so the founder
# decides on the design's questions, once, and the publish rule
# completes it exactly as before.
[[workflow.step]]
title = "draft-design"
kind = "task"
ready_when = "(steps.triage.done AND steps.triage.metadata.disposition = \"design\") OR (steps.investigate.done AND steps.investigate.metadata.disposition = \"design\")"
title_template = "Draft the design"
authority_role = "platform-admin"
# The analyst block backlog-item's `draft-design` carries — one step,
# one declaration in both kinds (c87fb59b car 1).
agent = { profile = "analyst", model = "opus-5[1m]", budget_usd = 2, effort = "medium" }
# The procedure's second paragraph is backlog-item's draft-design's,
# word for word (backlog 4f71e608, 2026-09-24) — one step, one text in
# both kinds, pinned by the_author_decides_from_the_company_frame.rs.
metadata_defaults = { procedure = "File the design-doc that answers this feedback: `boss design <title> --markdown-file <file> --question 'Qn|title|proposal' ... --answers <this packet>`. The verb writes the design's id here as design_id and completes this step; the founder's design-review opens on it, asking for that design at /it/design.\n\nDECIDE WHAT THE FRAME DECIDES; ASK ONLY WHAT IT CANNOT (backlog 4f71e608). A --question goes to David, and David, 2026-09-24: \"I do sort of think you are pushing too many questions to me that you could answer on your own. Remember we are building a company, run by one person plus agents, that is going to run a hosting business based on its open source release.\" That frame, he said, is the common-sense guide to our audits' gap analysis and to clearing out, then cleaning up, the demo tenant's leftover pieces. And: \"I can always provide feedback later too as our software is designed for making low cost changes.\" So every choice that frame answers — one person plus agents; a hosting business on the open-source release; our instance runs only the modules it uses and the rest stay for the example tenants; the demo tenant's leftovers cleared out, then cleaned up — is DECIDED in the markdown with its reason, and recorded on this item as `decided_<date>` (`boss job patch <this packet> <file.json>` with the object {\"decided_2026-09-24\": \"<the decision> — because <the reason>\"}, the date read from `date -u +%F`, never typed). Only strategy or priority trade-offs, trust and security boundaries, credentials, money, and brand or voice may ride as a --question. With none left, file with --no-questions — a doc that records decisions rather than asking for them — and David corrects any of them later through the ordinary cheap-change path." }
[[workflow.step.fields]]
name = "design_id"
field_type = "string"
required = true

[[workflow.step]]
title = "design-review"
kind = "answer-question"
# Only once there is a design to decide — see `draft-design` above.
ready_when = "steps.draft-design.done"
title_template = "Decide the design"
authority_role = "platform-admin"
metadata_defaults = { verdict = "" }
# The verdict vocabulary the three outcome predicates below fork on,
# authored on the step so it is enforced at completion (see the same
# field on backlog-item's design-review for why not the bundle). The
# `""` default above stays: it is the key boss-expr needs present
# before the step completes, and an empty string can never be an enum
# member, so the lint reads it as the unset placeholder.
[[workflow.step.fields]]
name = "verdict"
field_type = "approved|declined|answered"
required = true

[[workflow.step]]
title = "build"
kind = "task"
ready_when = "(steps.triage.done AND steps.triage.metadata.disposition = \"build\") OR (steps.investigate.done AND steps.investigate.metadata.disposition = \"build\") OR (steps.design-review.done AND steps.design-review.metadata.verdict = \"approved\")"
title_template = "Build the change"
authority_role = "platform-admin"
# HOW AN AGENT RUNS IT, declared once (design c87fb59b car 1, backlog
# 028891cf) — the same block backlog-item's `build` carries, because it
# is the same step: the executor lane's build. Projected onto the
# packet as agent_profile / agent_model / agent_budget_usd /
# agent_effort at materialisation.
agent = { profile = "builder", model = "opus-5[1m]", budget_usd = 5, effort = "high" }

[[workflow.step]]
title = "needs-info"
kind = "task"
ready_when = "(steps.triage.done AND steps.triage.metadata.disposition = \"needs-info\") OR (steps.investigate.done AND steps.investigate.metadata.disposition = \"needs-info\")"
title_template = "Waiting on the reporter"
authority_role = "platform-admin"

[[workflow.step]]
title = "duplicate"
kind = "outcome"
ready_when = "(steps.triage.done AND steps.triage.metadata.disposition = \"duplicate\") OR (steps.investigate.done AND steps.investigate.metadata.disposition = \"duplicate\")"
title_template = "Closed as a duplicate"
terminal = { outcome = "duplicate" }
metadata_defaults = { outcome_kind = "withdrawn" }

[[workflow.step]]
title = "declined"
kind = "outcome"
ready_when = "(steps.triage.done AND steps.triage.metadata.disposition = \"decline\") OR (steps.investigate.done AND steps.investigate.metadata.disposition = \"decline\") OR (steps.design-review.done AND steps.design-review.metadata.verdict = \"declined\")"
title_template = "Closed without action"
terminal = { outcome = "declined" }
metadata_defaults = { outcome_kind = "aborted" }

[[workflow.step]]
title = "closed"
kind = "outcome"
ready_when = "(steps.investigate.done AND steps.investigate.metadata.disposition = \"resolved\") OR (steps.design-review.done AND steps.design-review.metadata.verdict = \"answered\") OR steps.build.done OR steps.needs-info.done"
title_template = "Feedback closed"
terminal = { outcome = "completed" }
metadata_defaults = { outcome_kind = "completed" }
