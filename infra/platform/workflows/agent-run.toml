# ---------------------------------------------------------------------------
# agent-run — one agent's execution of one protocol step, as a packet.
#
# THE MIDDLE THIRD, MADE VISIBLE (design c87fb59b, decided 2026-09-18;
# car 2, backlog 39d0b528). Car 1 gave a protocol step its `agent`
# block — profile, model, budget, effort — so the row says HOW an agent
# runs the step. What was still invisible was the run itself: a builder
# dispatched from the pod existed only in an operator's terminal, and a
# builder that died left nothing that aged. Measured 2026-09-18 over the
# backlog-items read for car 1, `build` was completed 74 times by the
# car-merged rule on a builder's behalf, and not one of those builds had
# a packet of its own while it ran — the crew board's BUILDING lane could
# only infer one from a branch with no gate-run behind it.
#
# `boss dispatch <packet>` opens one of these at the claim: it claims the
# step as the running actor, files this packet, writes the brief, the
# model, the budget, the worktree and the host onto it, prints the exact
# prompt, and completes `briefed`. From there the run is a packet like
# any other — it sits on /it/crew, it ages, and a rule closes it.
#
# FOUR TERMINALS, REACHED BY FIVE DIFFERENT HANDS:
#   landed  — either of two endings, both of which then require the
#             report:
#             `gated`, a BUILDER's ending — `building` is completed by
#             the rule that reads the run's gate going green
#             (`agent-run-lands-on-gate-green`:
#             jobs.complete_linked_step keyed by `metadata.agent_run` on
#             the gate-run, which `boss gate` records when BOSS_AGENT_RUN
#             is set), or by the car's arrival one hop later
#             (`agent-run-lands-on-car-merged`);
#             `delivered`, an ANALYST's ending — the run executed a step
#             that ships no car (a measure, a draft, a judgement), so
#             there is no gate to go green and never was. Both open
#             `reported`, which records the handback — by the operator
#             who read it today, by the runner later — and the run lands
#             on it. No rule ever writes the report, because a summary
#             the machine invents is not the agent's.
#   unreported — the work is evidenced and the handback never came
#             (backlog 6a5f4214, 2026-09-22): `building` closed `gated`
#             or `delivered`, and `reported` then sat open past twice its
#             duration, holding one of the six concurrent slots the claim
#             door enforces while nothing read that age. The hourly rule
#             `agent-run-ends-unreported-when-the-handback-never-arrives`
#             completes `reported` with `handback = absent` and a summary
#             that says only that none arrived — the clock still invents
#             no account of the work, and the terminal it routes to
#             claims neither a report (`landed`) nor a failure (`died`).
#   refused — the agent stopped without doing the work (the claim no
#             longer held on main, the packet was a duplicate):
#             `building` completed by hand with `result = refused`.
#   died    — the agent went silent: `building` is completed with
#             `result = died` by the hourly clock rule
#             `agent-run-dies-when-building-is-silent` once the packet
#             has not moved for 2x this step's `duration_hours`. A
#             builder that dies is a packet that ages, which is the whole
#             reason the run is a packet. A run whose `host` pod is
#             gone or terminal is ended the same way within fifteen
#             minutes by the cluster observer
#             (infra/cluster/manifests/boss-estate-observe.yaml, backlog
#             5d1b64b3), with a `host_gone` object beside the result —
#             unless a gate-run naming it is open or green, whose
#             verdict ends it instead.
#
# WHY `delivered` EXISTS, AND WHY IT IS NOT SPELLED `reported` (backlog
# a9c6ed5b, 2026-09-19). Until it did, an analyst run could not close
# honestly: its only success was `gated`, which is untrue of work that
# ships no car, so the two endings actually available were a hand
# writing `gated` or the clock writing `died` — a packet asserting
# something untrue of the run, which is the shape the correctness
# protocol refuses. Counted on the tree that day: thirteen analyst
# blocks across six kinds (department-retro 4, protocol-retro 4,
# page-audit 2, plus backlog-item, user-feedback and publish-to-github),
# and the page march alone dispatches measure and file across 47
# routes — roughly 94 such runs queued behind it. The first was
# already live: run d5e0f287 on the /ux/support page audit, whose
# `measure` step on packet 9876ef0d was COMPLETED while its run sat at
# `building` with nowhere true to go. `reported` was the obvious word
# and is the wrong one HERE: this protocol already has a step by that
# name, gated on a hand writing a summary, so `result = "reported"`
# would claim a handback that does not exist yet. `delivered` names
# what is true at that moment — the work was delivered — and leaves
# the handback to the step that requires it.
#
# WHAT COMPLETES IT IS STILL A HAND, AND THAT IS THE REMAINING GAP.
# The fact that means an analyst run succeeded is its own step
# completing on its packet (`metadata.packet` / `metadata.step`), and
# no rule can reach it today: `jobs.complete_linked_step` follows a
# link on the JOB metadata of the packet in the event, and the
# executing packet carries no `agent_run` key (one packet hosts a run
# per step, so a single key could not name which); `jobs.complete_-
# step_matching` wants the value on a COMPLETED STEP of the candidate
# and needs `id` in the payload, where `step.done.<kind>` carries
# `job_id`. So this file makes the vocabulary honest; the reacher — an
# edge written at dispatch plus a rule that follows it — is a separate
# change. Ordering, when it lands: the two gate-green/car-merged rules
# can never fire for an analyst run (it launches no gate and parks no
# car), and a completed `building` is every writer's first no-op, so a
# fourth writer races nothing. A run silent past four hours still dies,
# exactly as a builder's does.
#
# `result` is REQUIRED and enum-checked on `building`, so the fork below
# is total: every value routes somewhere, and a run cannot close without
# saying which way it went.
#
# The metadata schema names what `boss dispatch` writes: `packet` (the
# step's job), `step` (its slug), `agent` (the actor id), `model`,
# `budget_usd`, `effort`, `worktree`, `host`, and what later hands add —
# `gate_run` and `car` (by the landing rule's evidence), `spend_usd` and
# `tokens` (by the report). Only the dispatch-time keys are required.
# ---------------------------------------------------------------------------

[[workflow]]
kind = "agent-run"
label = "Agent run"
category = "platform"
subject_kinds = ["custom"]
owning_team = "platform"
description = "One agent's execution of one protocol step, as a packet: claimed at dispatch, briefed with the exact prompt, building until the run's gate goes green or a run that ships no car delivers its work (landed), the agent stops without doing it (refused), or the packet goes silent past twice the step's duration (died). The middle third of the operator surface — a builder that dies is a packet that ages."
metadata = { owner_role = "platform-admin" }
metadata_schema = { type = "object", required = ["packet", "step", "agent", "model", "budget_usd", "effort"], properties = { packet = { type = "string", description = "The job whose step this run executes." }, step = { type = "string", description = "The step's spec_slug on that job." }, agent = { type = "string", description = "The actor id the run signs as." }, model = { type = "string" }, budget_usd = { type = "number" }, effort = { type = "string" }, worktree = { type = "string" }, host = { type = "string" }, gate_run = { type = "string" }, car = { type = "string" }, spend_usd = { type = "number" }, tokens = { type = "number" } } }

[[workflow.step]]
title = "claimed"
kind = "trigger"
ready_when = "true"
title_template = "Step claimed by the agent"
metadata_defaults = { trigger_kind = "operator", trigger_name = "boss-dispatch" }

# Done BY `boss dispatch` the moment it has printed the prompt: the
# brief, the rules document for the profile, and the run id. The record
# of what the agent was told is the packet's own `brief` key; this step
# says it was handed over, and how large it was.
[[workflow.step]]
title = "briefed"
kind = "task"
ready_when = "steps.claimed.done"
title_template = "Prompt printed"
authority_role = "platform-admin"
fields = [
  { name = "prompt_bytes", field_type = "string", required = true },
]

# The run. Two hours is the builder's measured shape on this pod (six
# green first-try in one 2026-09-14 session, none over ninety minutes
# to gate launch), and the clock rule reads its bound as 2x this value —
# pinned equal by platform_bundle_agent_run.rs, because the number lives
# in two files (CLAUDE.md 9a).
[[workflow.step]]
title = "building"
kind = "task"
ready_when = "steps.briefed.done"
title_template = "Building"
authority_role = "platform-admin"
duration_hours = 2.0
fields = [
  { name = "result", field_type = "gated|delivered|refused|died", required = true },
]

# The agent's handback (rule 8 of the rules document): packet, branch,
# sha, gate packet, what changed, what it saw — or, for an analyst run,
# what it measured and what it filed. Opens on the green or on
# delivered work —
# the handback itself arrives at gate launch, ten minutes earlier, and
# until this step opens it rides the packet's metadata (`boss job
# patch`), which any hand can write at any time; this step is the
# acknowledgement that the report is on the record, and it is what the
# run lands on. Recorded by the operator who read it today and by the
# runner later; never by a rule. It follows `building` rather than
# sitting beside it because the viability lint proves the `result`
# fork total by evaluating each successor with ONLY the fork done, and
# a terminal that also needed this step would read as an orphan
# outcome.
#
# AND IT IS THE ONE STEP A RUN COULD WEDGE ON (backlog 6a5f4214,
# 2026-09-22). `building` is completed by then, so the silence clock
# that watches `building` correctly finds nothing on such a run, every
# hour, forever — and the run holds one of the six slots the claim
# door enforces (`crates/core/boss-jobs/src/http/steps.rs`, the
# concurrency gate) until an operator notices. Measured that day over
# the 116 runs that had landed: the gap from `building` completing to
# `reported` completing was a median of 2 minutes, a p90 of 49
# minutes, and a slowest genuine handback of 1.15h; then a hole, and
# nine more at 6.08h to 27.95h, every one of them recovered by a hand.
# So `reported` declares a duration like `building` does, and
# `agent-run-ends-unreported-when-the-handback-never-arrives` reads
# its bound as 2x — the same idiom, pinned equal by
# platform_bundle_agent_run.rs (CLAUDE.md 9a).
#
# `handback` is the fork that keeps the record honest about which hand
# closed it. It is NOT required and no agent writes it: `boss dispatch
# --report` writes the summary and the cost, and an absent key reads
# as the report that arrived. Only the clock writes `absent`, and the
# `unreported` terminal is what it routes to.
[[workflow.step]]
title = "reported"
kind = "task"
ready_when = "steps.building.done AND (steps.building.metadata.result = \"gated\" OR steps.building.metadata.result = \"delivered\")"
title_template = "Report recorded"
authority_role = "platform-admin"
duration_hours = 1.0
fields = [
  { name = "summary", field_type = "string", required = true },
  { name = "handback", field_type = "recorded|absent" },
  { name = "spend_usd", field_type = "string" },
  { name = "tokens", field_type = "string" },
]

[[workflow.step]]
title = "landed"
kind = "outcome"
ready_when = "steps.reported.done AND steps.reported.metadata.handback != \"absent\""
title_template = "Landed — the work is evidenced, report recorded"
metadata_defaults = { outcome_kind = "completed" }
terminal = { outcome = "landed" }

# THE WORK SHIPPED AND NOBODY SAID SO (backlog 6a5f4214). Deliberately
# not `died`: `building` closed `gated` or `delivered`, so the car is
# on main or the analyst's step is complete, and recording successful
# work as a failure is the shape backlog c8703bee names. Deliberately
# not `landed` either — that terminal's own title says the report is
# recorded, and here it never was. `unreported` is what is true, and
# it is the one terminal in this protocol reached only by a clock.
[[workflow.step]]
title = "unreported"
kind = "outcome"
ready_when = "steps.reported.done AND steps.reported.metadata.handback = \"absent\""
title_template = "Unreported — the work is evidenced, no handback arrived"
metadata_defaults = { outcome_kind = "aborted" }
terminal = { outcome = "unreported" }

[[workflow.step]]
title = "refused"
kind = "outcome"
ready_when = "steps.building.done AND steps.building.metadata.result = \"refused\""
title_template = "Refused — the builder stopped without building"
metadata_defaults = { outcome_kind = "aborted" }
terminal = { outcome = "refused" }

[[workflow.step]]
title = "died"
kind = "outcome"
ready_when = "steps.building.done AND steps.building.metadata.result = \"died\""
title_template = "Died — silent past twice the build's duration"
metadata_defaults = { outcome_kind = "aborted" }
terminal = { outcome = "died" }
