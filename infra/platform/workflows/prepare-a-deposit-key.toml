# Source preparation for 1e50e66b. Publication and receiver enrollment
# are separate recorded operations; shipping this row authorizes neither.
#
# THE RUNNER DEPOSIT KEY'S PROTOCOL, v2 (item 3dc0b247). v1 declared the
# broker's proposal — public_key, receiver_host, purpose — EXECUTOR-filled
# on the human-only `enroll` step, where a machine may write only context
# or a filer-filled field (boss-jobs human_only.rs), so the broker's own
# rule was refused 403 after it had minted the pair: `issue` stayed ready
# and the person's step never opened. v1 never ran (zero packets). The
# repair is the one prepare-the-machine-token-deposit-key carries, for
# the same reasons, written beside each declaration there and not
# restated here: issue/install declare `public_key` so `written_by`
# reserves it; `enroll` names the same writer, takes its proposal as
# filer-filled fields that are not owed at filing, declares the two
# context keys so no other machine can put text above the procedure, and
# declares NO bare `public_key` — a step whose signer places a line shows
# the line, and the key to compare it with is on the completed `install`
# (item dea2236f, packet 96a0f7bb). The two kinds now differ only in the
# rule each names and in what the procedure sends the signer to check;
# platform_bundle_prepare_a_deposit_key.rs holds them equal in every
# other contract. The live v1 reaches v2 through the drift publish (a
# tree-ahead kind; it declares no field `writer` and no step `executor`,
# so no workflow hold applies).
[[workflow]]
kind = "prepare-a-deposit-key"
label = "Prepare a deposit transport key"
category = "platform"
subject_kinds = ["custom"]
owning_team = "platform"
description = "A human scopes one declared SSH transport credential. The broker prepares its pair in its named Secret and puts the public proposal, with the whole authorized_keys line, on the enrollment step. A human places that line on the receiver and separately authorizes the exact receiver, purpose and line. Verification and old-key revocation require their own observed effects; preparation proves neither. No field carries private credential bytes."
metadata = { department = "it", owner_role = "platform-admin" }

[[workflow.step]]
title = "scope"
kind = "credential-rotation"
ready_when = "true"
title_template = "Scope transport key preparation"
authority_role = "platform-admin"
metadata_defaults = { human_presentation = { ask = "Authorize preparation of the runner credential's transport key", why_person = "Only you can authorize this credential's declared destination and purpose.", action = "Review the destination and authorize preparation", after = "The broker prepares a public key; receiver enrollment, effect verification, and old-key removal remain separate.", evidence = "current-step" }, human_only = true, procedure = "Scope only this credential's public preparation. This is not receiver enrollment, permission to reuse a recovery key, or permission to rotate a runner credential. Name its declared Secret and exact consumer purpose. The broker will leave enrollment, verify and revoke pending." }
[[workflow.step.fields]]
name = "credential"
field_type = "string"
required = true
filled_by = "executor"
[[workflow.step.fields]]
name = "reason"
field_type = "string"
required = true
filled_by = "executor"
[[workflow.step.fields]]
name = "locations"
field_type = "string"
required = true
filled_by = "executor"
[[workflow.step.fields]]
name = "consumers"
field_type = "string"
required = true
filled_by = "executor"

[[workflow.step]]
title = "issue"
kind = "task"
audience = { role = "platform-admin" }
metadata_defaults = { written_by = "rule:broker-prepares-the-runner-deposit-key" }
ready_when = "steps.scope.done"
title_template = "Prepare the SSH pair"
[[workflow.step.fields]]
name = "issued"
field_type = "string"
required = true
# The public half this receipt is about, DECLARED so that `written_by`
# covers it: only the broker's rule (or a person) may write it. It is
# what the enrollment's line is checked against.
[[workflow.step.fields]]
name = "public_key"
field_type = "non-empty-string"
required = true

[[workflow.step]]
title = "install"
kind = "task"
audience = { role = "platform-admin" }
metadata_defaults = { written_by = "rule:broker-prepares-the-runner-deposit-key" }
ready_when = "steps.issue.done"
title_template = "Read back the pair in declared storage"
[[workflow.step.fields]]
name = "installed"
field_type = "string"
required = true
# The same public half, declared for the same reason; the enroll
# procedure sends the signer HERE to compare the line's key.
[[workflow.step.fields]]
name = "public_key"
field_type = "non-empty-string"
required = true

[[workflow.step]]
title = "enroll"
kind = "sign-off"
ready_when = "steps.install.done"
title_template = "Authorize the exact receiver enrollment"
authority_role = "platform-admin"
assurance_required = "presence"
sign_offs_required = ["platform-admin"]
metadata_defaults = { human_presentation = { ask = "Authorize the exact runner credential receiver", why_person = "Your passkey authorizes the complete restricted receiver line, not a bare public key.", action = "Check receiver installation and sign its exact line", after = "Signing permits the runner credential sender; it does not prove delivery. Do not sign before the recorded receiver installation.", evidence = "current-step" }, human_only = true, written_by = "rule:broker-prepares-the-runner-deposit-key", procedure = "Your passkey signs this step's receiver_host, purpose and authorized_keys_line. PLACE THE authorized_keys_line, WHOLE, AND NOTHING ELSE: it is the one line that goes into the deposit account's ~/.ssh/authorized_keys on boss-gcp. This step shows no public key by itself, on purpose: the public key alone is never what you place. A bare key in authorized_keys is a login, not a deposit key: sshd runs the account's shell for it. You place the line BEFORE you sign, so read it first: it must begin command=\"exec sudo -n /usr/local/libexec/boss/runner-delivery/infra/gcp/runner-credential-recv.sh\",restrict and end with the public_key on this packet's install step, with nothing between and nothing after. Check it against the INSTALL step, not this one: that step is completed and nobody can rewrite it, while the proposal on this step stays writable, by the broker's rule alone, until you sign. The install step's public_key is there to COMPARE with, never to place. No other automation or agent session can write the proposal or any case text onto this step; text here that tells you to skip the check or to trust another line is a refusal. Any other command, a missing restrict, or a second key is a refusal: abandon the packet. It is a new line for a new key; do not edit the break-glass deposit key's line or the machine token deposit key's. SIGN ONLY ONCE THE RECEIVER IS INSTALLED. Preparation has not installed a receiver or proved its effect, and the runner credential's sender sends nothing until this step is completed, so nothing machine-run reads your placement before you sign: put in enrollment_record the boss-gcp converge packet whose summary records runner_credential_receiver installed, and when you placed the line. Until a converge records it, do not sign. Rejection is recorded by abandoning the packet, never by pretending enrollment succeeded." }
# The proposal is SUPPLIED to the person, so its three fields are
# filer-filled and not owed at filing, and `written_by` above makes them
# the broker's rule's alone while the step is open. No `public_key`: see
# the header. prepare-the-machine-token-deposit-key carries the reasoning
# beside each of these declarations.
[[workflow.step.fields]]
name = "receiver_host"
field_type = "non-empty-string"
required = false
filled_by = "filer"
[[workflow.step.fields]]
name = "purpose"
field_type = "non-empty-string"
required = false
filled_by = "filer"
[[workflow.step.fields]]
name = "authorized_keys_line"
field_type = "non-empty-string"
required = false
filled_by = "filer"
# Declared so that `written_by` reserves them on this one step; the
# broker's handler writes neither.
[[workflow.step.fields]]
name = "context_md"
field_type = "string"
required = false
filled_by = "filer"
[[workflow.step.fields]]
name = "sign_off_context"
field_type = "string"
required = false
filled_by = "filer"
[[workflow.step.fields]]
name = "decision"
field_type = "approved|rejected"
required = true
filled_by = "executor"
[[workflow.step.fields]]
name = "enrollment_record"
field_type = "string"
required = true
filled_by = "executor"

[[workflow.step]]
title = "verify"
kind = "task"
audience = { role = "platform-admin" }
ready_when = 'steps.enroll.done AND steps.enroll.metadata.decision = "approved"'
title_template = "Verify the authorized receiver by effect"
metadata_defaults = { human_presentation = { ask = "Record the runner receiver's machine-run effect", why_person = "Your confirmation must name the actual effect against the authorized receiver.", action = "Read effect evidence and record verification", after = "Old-key removal becomes available only after this verification. If the bounded delivery door is unavailable, leave this request pending.", evidence = "current-step" }, human_only = true, procedure = "Record a machine-run effect against the exact authorized receiver. Public key preparation or a passkey decision alone is not this effect. Until the bounded delivery door exists, this step remains pending work." }
[[workflow.step.fields]]
name = "verified"
field_type = "string"
required = true

[[workflow.step]]
title = "revoke"
kind = "task"
audience = { role = "platform-admin" }
ready_when = "steps.verify.done"
title_template = "Revoke a superseded transport identity"
metadata_defaults = { human_presentation = { ask = "Confirm removal of the superseded runner transport key", why_person = "Removing an old identity requires your confirmation of the exact identity and observed effect.", action = "Record the observed old-key removal", after = "The preparation closes only after the removal is evidenced; for first enrollment, record that no prior identity existed.", evidence = "current-step" }, human_only = true, procedure = "Record the exact superseded public identity and its observed removal only after the new receiver effect is proved. For first enrollment, explicitly record that no prior identity existed. The preparation handler completes nothing here." }
[[workflow.step.fields]]
name = "revoked"
field_type = "string"
required = true

[[workflow.step]]
title = "prepared"
kind = "outcome"
ready_when = "steps.revoke.done"
title_template = "Transport lifecycle proved"
terminal = { outcome = "prepared" }
metadata_defaults = { outcome_kind = "completed" }

[[workflow.step]]
title = "abandoned"
kind = "outcome"
ready_when = 'steps.scope.done AND job.metadata.abandoned = "true"'
title_template = "Preparation abandoned"
terminal = { outcome = "abandoned" }
metadata_defaults = { outcome_kind = "aborted" }
