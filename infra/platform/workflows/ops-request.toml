# ops-request — a host-side debug read is a packet (729329c6, PULL half).
#
# David: "I am really tired of the copy pasting after sshing." The
# operator was the transport: ssh to the host, run the command, paste
# the output back to whoever asked. This kind deletes the middle hop.
# The requester files a packet naming a host and an ALLOWLISTED
# read-only verb; a runner ON that host (infra/ops/ops-runner.sh, on a
# ~1-minute timer) polls the SoR for its own host's open packets,
# executes the verb, and completes `execute` with stdout/stderr and the
# exit code. The answer lands in the system of record with provenance,
# and "what has been asked of this host" is a Subject-history question.
#
# THE ALLOWLIST IS THE AUTHORITY. The packet carries only a verb NAME
# and pattern-validated args; the command words live in
# infra/ops/verbs/<verb>.json — in-tree, reviewed, versioned. The runner never
# executes a packet-supplied string, only allowlisted argv templates.
# Phase 1 is read-only; mutating verbs are phase 2, behind per-verb
# policy, and are deliberately absent.
#
# FILING CONVENTION. Subject: custom/<host id> (the estate node id).
# Job metadata carries the request:
#   host — estate node id (boss-gcp, forge); the runner acts only on
#          an exact match, so a packet for a host with no runner sits
#          open and VISIBLY unanswered rather than being guessed at
#   verb — a file infra/ops/verbs/<verb>.json
#   args — JSON array of strings, positional; each validated against
#          its param's pattern before anything runs
#
# The fork on `execute` is a closed enum — the correct-the-record
# lesson, "an enum makes the fork total": every disposition a runner
# can write leads to exactly one terminal. `exit_code` is authored
# OPTIONAL because field requiredness cannot depend on the
# disposition, and a refusal has no exit code — nothing ran. The
# runner (in-tree, reviewed code) always writes it on the answered
# path; `output` is required on both paths, so an answer always
# carries its text and a refusal always carries its reason.

[[workflow]]
kind = "ops-request"
label = "Ops request"
category = "platform"
subject_kinds = ["custom"]
owning_team = "platform"
description = "A host-side debug read, as a packet instead of an ssh session. The requester names a host (the Subject: custom/<estate node id>) and an allowlisted read-only verb in job metadata (`host`, `verb`, `args`); the runner on that host polls about once a minute, executes the verb from infra/ops/verbs.json — never a packet-supplied string — and completes `execute` with the output and exit code. `answered` is the output arriving in the system of record with provenance; `refused` is the runner declining a verb outside the allowlist or an arg outside its pattern, with the reason in `output`. Phase 1 is read-only; mutating verbs are phase 2, behind per-verb policy. The operator stops being the transport."
metadata = { owner_role = "platform-admin" }

[[workflow.step]]
title = "filed"
kind = "trigger"
ready_when = "true"
title_template = "Host read requested: {metadata.verb} on {metadata.host}"
metadata_defaults = { trigger_kind = "operator", trigger_name = "operator-requests-a-host-read" }

# THE APPROVAL, AND THE FIRST PRESENCE-ASSURED STEP IN THE SYSTEM.
#
# Design 17835005, answered by David 2026-09-21: he approves a
# destructive change with his passkey and the machine executes it. Q1
# settled what the signature binds — A RENDERED PLAN, not a verb call.
# A verb call authorises an intent whose target can still resolve
# differently at execution time, which is exactly how 2026-09-21 would
# have gone wrong: a second NVMe renumbered the devices, and the disk
# that looked like "the new one" by number was carrying the system.
#
# HOW THE PLAN GETS SIGNED, and why this needs no new hash. A sign-off
# with `assurance_required = "presence"` is only producible one way
# (steps.rs: "an assurance level with a bypass is a comment, not a
# control"): the gateway verified a WebAuthn assertion over
# sha256(shape_hash || ":" || nonce), where shape_hash is
# `step_shape_hash(title, metadata)` of THIS step. So putting the plan
# document in this step's metadata means the signature covers the plan
# BYTES — signing the step's shape IS signing the plan. No second hash
# to keep in agreement (§9a), and strictly stronger than a bespoke
# plan hash because it binds the title and everything else here too.
#
# AND DRIFT VOIDS IT FOR FREE, which is what q4 asked for. The stamp
# records the shape_hash it was made against, and the endpoint
# re-computes the hash from the step's CURRENT content before
# accepting a ticket. If the plan changes after the ceremony the hash
# moves and the stamp no longer matches it — so an approval cannot
# survive an edit it never saw.
#
# INERT UNTIL SOMETHING SETS THE FLAG. `job.metadata.requires_approval`
# is absent on every ops-request filed today, and an absent value reads
# FALSE in boolean position (boss-expr), so this step never becomes
# ready and `execute` is gated exactly as it was. That is deliberate,
# and the same ordering the `commission-a-disk` verb used: the gate
# exists before the power does.
[[workflow.step]]
title = "approve"
kind = "sign-off"
ready_when = "steps.filed.done AND job.metadata.requires_approval"
assurance_required = "presence"
# WHO MUST STAMP IT. Declared because an assurance with no required
# sign-off is unreachable by the door that enforces it (backlog
# 148549c5): the sign-off surface renders per required role, so a step
# with none offered the ordinary complete control instead — and that
# path had no assurance check at all. Measured live on packet d5efbb3c,
# where the first presence-assured step in the system completed with
# `sign_offs: []` and no ceremony, and the host then ran the verb it was
# gating.
#
# BOTH HALVES ARE NOW LOAD-BEARING and neither replaces the other. The
# step PUT refuses a completion that carries no presence, so the control
# holds even for a caller that never opens a browser; this line is what
# gives a human the door that produces one.
sign_offs_required = ["platform-admin"]
title_template = "Approve the plan: {metadata.verb} on {metadata.host}"
authority_role = "platform-admin"
metadata_defaults = { procedure = "READ THE PLAN ON THIS STEP AND NOTHING ELSE. `plan` holds the document rendered on the host itself: the target named by-id, the kernel name it resolved to AT PLAN TIME, what was observed about it, and the argv that would run. The kernel name is shown because it is the thing that moves — it is evidence about when the plan was made, never the target.\n\nYOUR PASSKEY SIGNS THESE EXACT BYTES. If anything about the plan changes after you sign, the signature stops matching and the runner refuses. If the plan looks wrong, do not approve it and say why — a plan that needs an operator to eyeball which thing is meant is a verb that should not be on this path at all (q3)." }
fields = [{ name = "plan", field_type = "string", required = true }]

[[workflow.step]]
title = "execute"
kind = "task"
# WAITS FOR THE APPROVAL ONLY WHERE ONE IS REQUIRED. The absent flag
# reads false, so every read verb filed today is ready exactly when it
# was; a verb that declares `requires_approval` waits for the sign-off.
ready_when = "steps.filed.done AND (NOT job.metadata.requires_approval OR steps.approve.done)"
title_template = "Run {metadata.verb} on {metadata.host}"
# Gated the way the maintenance kinds gate `run`: the simulated
# workforce must not role-match onto a real host read. The runner's
# actor presents platform-admin.
authority_role = "platform-admin"
[[workflow.step.fields]]
name = "disposition"
field_type = "answered|refused"
required = true
[[workflow.step.fields]]
name = "output"
field_type = "string"
required = true
[[workflow.step.fields]]
name = "exit_code"
field_type = "string"
required = false

[[workflow.step]]
title = "answered"
kind = "outcome"
ready_when = "steps.execute.done AND steps.execute.metadata.disposition = \"answered\""
title_template = "Answered"
metadata_defaults = { outcome_kind = "completed" }
terminal = { outcome = "answered" }

[[workflow.step]]
title = "refused"
kind = "outcome"
ready_when = "steps.execute.done AND steps.execute.metadata.disposition = \"refused\""
title_template = "Refused — outside the allowlist"
# `aborted`, matching backlog-item's `declined`: the request was turned
# down, not taken back by its filer.
metadata_defaults = { outcome_kind = "aborted" }
terminal = { outcome = "refused" }
