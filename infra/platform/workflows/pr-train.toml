[[workflow]]
kind = "pr-train"
label = "PR train"
category = "platform"
subject_kinds = ["custom"]
owning_team = "platform"
description = "The twice-daily release train: collects branches whose ship-a-change Jobs are ready for review, assembles them into one batched PR, and closes each step on evidence — the CI verdict, the observed merge, the deploys that carried it out. Driven by infra/train/conductor.sh from a systemd timer."
metadata = { owner_role = "platform-admin" }

[[workflow.step]]
title = "scheduled"
kind = "trigger"
ready_when = "true"
title_template = "Train window opened"
metadata_defaults = { trigger_kind = "periodic", trigger_name = "pr-train-window" }

[[workflow.step]]
title = "collect"
kind = "task"
ready_when = "steps.scheduled.done"
title_template = "Collect what is ready to board"
authority_role = "platform-admin"
[[workflow.step.fields]]
name = "boarded"
field_type = "string"
required = true

[[workflow.step]]
title = "assemble"
kind = "task"
ready_when = "steps.collect.done"
title_template = "Assemble the train branch"
authority_role = "platform-admin"
[[workflow.step.fields]]
name = "train_ref"
field_type = "string"
required = true

[[workflow.step]]
title = "pr"
kind = "task"
ready_when = "steps.assemble.done"
title_template = "Open the batched PR"
authority_role = "platform-admin"
[[workflow.step.fields]]
name = "pr_url"
field_type = "string"
required = true

[[workflow.step]]
title = "ci"
kind = "task"
ready_when = "steps.pr.done"
title_template = "CI verdict"
authority_role = "platform-admin"
metadata_defaults = { notify_on_done = true }
[[workflow.step.fields]]
name = "result"
field_type = "string"
required = true

[[workflow.step]]
title = "merged"
kind = "task"
ready_when = "steps.pr.done"
title_template = "Merged into main"
authority_role = "platform-admin"
metadata_defaults = { notify_on_done = true }
[[workflow.step.fields]]
name = "merge_ref"
field_type = "string"
required = true

[[workflow.step]]
title = "deployed"
kind = "task"
ready_when = "steps.merged.done"
title_template = "Deployed to the playground"
authority_role = "platform-admin"
metadata_defaults = { notify_on_done = true }
[[workflow.step.fields]]
name = "deployed"
field_type = "string"
required = true

[[workflow.step]]
title = "converged"
kind = "task"
ready_when = "steps.deployed.done"
title_template = "Cluster converged"
authority_role = "platform-admin"
[[workflow.step.fields]]
name = "cluster_commit"
field_type = "string"
required = true
[[workflow.step.fields]]
name = "verified"
field_type = "string"
required = true

[[workflow.step]]
title = "arrived"
kind = "outcome"
ready_when = "steps.converged.done AND steps.ci.done"
title_template = "Train arrived"
terminal = { outcome = "arrived" }
metadata_defaults = { outcome_kind = "completed" }

[[workflow.step]]
title = "cancelled"
kind = "outcome"
ready_when = "steps.collect.done AND job.metadata.empty = \"true\""
title_template = "Cancelled"
terminal = { outcome = "cancelled" }
metadata_defaults = { outcome_kind = "aborted" }
