# ---------------------------------------------------------------------------
# pr-train — the twice-daily release train the conductor drives.
#
# THIS FILE IS THE LIVE ROW, FOLDED: rendered from GET
# /api/workflows/pr-train at v17 on 2026-09-15 (backlog 0ccf23ec). The
# row had moved past the file through operator publishes — the yard
# grammar on the step labels ("Yard inspection", "DEPARTED", "In
# transit", "Disassembled — cars back to the dock"; David 2026-09-08,
# the yard is a floor you can follow) — and nothing the drift lint
# compared could see it, because step labels were not on its list.
# They are now, as `steps.<title>.title_template`, and this file is
# what that comparison reads equal against.
#
# In-flight trains are untouched: the seed binary inserts only what is
# missing, so an open train keeps its pinned version.
#
# THE CONDUCTOR'S STEPS ARE THE CONDUCTOR'S (backlog af796788, 2026-09-18).
# Every task step below is completed by `automation:train-conductor`
# and by nothing else, and each now declares that actor as its
# `audience` — the `individual` shape of design f5ebd2e1 — in place of
# the bare `authority_role = "platform-admin"` it carried at live v1.
# Measured on pr-trains 018fa4ad, 784c4178 and 16966a29: a role with no
# assignee at birth is what the dispatcher's executes-lane nominates,
# so all seven steps of every train landed in the agent alias's MY
# WORK (`claude@algedonic.dev`) and the conductor completed them over
# its head. A role with no nomination would be no better: the
# assignment query's role arm lists an unassigned role step for EVERY
# holder, so the same seven would have reached David's queue as
# claimable work. Born assigned to the conductor, a train step is
# passed over by the dispatcher (assignee already set), matched by
# neither arm of the assignment query, and covered — not orphaned —
# by the no-orphan-steps check. Authority is unchanged: the jobs API
# never gated a train step's completion on the role; policy does.
# Publishing this shape is a separate act — a new version through
# `POST /api/workflows` + publish; the seed inserts nothing over an
# existing kind.
# ---------------------------------------------------------------------------

[[workflow]]
kind = "pr-train"
label = "PR train"
category = "platform"
subject_kinds = ["custom"]
owning_team = "platform"
description = "The twice-daily release train: collects branches whose ship-a-change Jobs are ready for review, assembles them into one batched PR, and closes each step on evidence — the CI verdict, the observed merge, the deploys that carried it out. Driven by infra/train/conductor.sh from a systemd timer."
metadata = { owner_role = "platform-admin" }

[[workflow.step]]
title = "scheduled"
kind = "trigger"
ready_when = "true"
title_template = "Train window opened"
metadata_defaults = { trigger_kind = "periodic", trigger_name = "pr-train-window" }

[[workflow.step]]
title = "collect"
kind = "task"
ready_when = "steps.scheduled.done"
title_template = "Collect what is ready to board"
audience = { individual = "automation:train-conductor" }
[[workflow.step.fields]]
name = "boarded"
field_type = "string"
required = true

[[workflow.step]]
title = "assemble"
kind = "task"
ready_when = "steps.collect.done"
title_template = "Assemble the train branch"
audience = { individual = "automation:train-conductor" }
[[workflow.step.fields]]
name = "train_ref"
field_type = "string"
required = true

[[workflow.step]]
title = "pr"
kind = "task"
ready_when = "steps.assemble.done"
title_template = "Open the batched PR"
audience = { individual = "automation:train-conductor" }
[[workflow.step.fields]]
name = "pr_url"
field_type = "string"
required = true

[[workflow.step]]
title = "ci"
kind = "task"
ready_when = "steps.pr.done"
title_template = "Yard inspection — CI verdict"
audience = { individual = "automation:train-conductor" }
metadata_defaults = { notify_on_done = true }
[[workflow.step.fields]]
name = "result"
field_type = "string"
required = true

[[workflow.step]]
title = "merged"
kind = "task"
ready_when = "steps.pr.done"
title_template = "DEPARTED — merged into main"
audience = { individual = "automation:train-conductor" }
metadata_defaults = { notify_on_done = true }
[[workflow.step.fields]]
name = "merge_ref"
field_type = "string"
required = true

[[workflow.step]]
title = "deployed"
kind = "task"
ready_when = "steps.merged.done"
title_template = "In transit — deployed to the playground"
audience = { individual = "automation:train-conductor" }
metadata_defaults = { notify_on_done = true }
[[workflow.step.fields]]
name = "deployed"
field_type = "string"
required = true

[[workflow.step]]
title = "converged"
kind = "task"
ready_when = "steps.deployed.done"
title_template = "In transit — cluster converged"
audience = { individual = "automation:train-conductor" }
[[workflow.step.fields]]
name = "cluster_commit"
field_type = "string"
required = true
[[workflow.step.fields]]
name = "verified"
field_type = "string"
required = true

[[workflow.step]]
title = "arrived"
kind = "outcome"
ready_when = "steps.converged.done AND steps.ci.done"
title_template = "Train arrived"
terminal = { outcome = "arrived" }
metadata_defaults = { outcome_kind = "completed" }

[[workflow.step]]
title = "cancelled"
kind = "outcome"
ready_when = "steps.collect.done AND job.metadata.empty = \"true\""
title_template = "Disassembled — cars back to the dock"
terminal = { outcome = "cancelled" }
metadata_defaults = { outcome_kind = "aborted" }

# MERGE LOST (backlog f9256445, design d812f1b7 D1, decided 2026-09-25).
# Train 2026-09-25 20:04 (PR #687) merged as c85941b4 at 20:10:41Z; by
# 20:11:14Z forge main was back at 777a5888, and the 20:34 train was
# assembled on that real main. No later cluster commit could descend
# from the merge, so `converged` waited, then alarmed, then waited for
# ever: `arrived` needs `converged`, and `cancelled` means CLOSED
# UNMERGED, which is false for a PR the forge reports merged.
#
# The conductor reaches this on evidence: for a train past `merged` and
# not `converged`, it reads forge main with `ls-remote` and asks `git
# merge-base --is-ancestor <merge> <forge main>` in its clone. A git
# failure is a refusal to judge, never a verdict, and it takes TWO NOT
# readings on two ticks. Then, in this order: these four fields and the
# marker (the train closes, which releases the track), every boarded car
# unlanded through `boss car unland`'s writer (ship-a-change `unlanded`,
# a successor car on the dock's road), and ONE backlog-item on the
# pipeline-failure channel. After this a merged train either converges
# by ancestry or ends here; only a cluster that deploys nothing at all
# still waits, and the converge alarm covers that.
#
# `aborted`: the delivery did not complete, and an abort completes from
# any open state — so the four REQUIRED fields are its gate. Nobody
# reaches it without the reading.
[[workflow.step]]
title = "merge-lost"
kind = "outcome"
ready_when = "steps.merged.done AND job.metadata.merge_lost = \"true\""
title_template = "Merge lost — main no longer carries it; cars back to the dock"
terminal = { outcome = "merge-lost" }
metadata_defaults = { outcome_kind = "aborted" }
[[workflow.step.fields]]
name = "merge_ref"
field_type = "string"
required = true
[[workflow.step.fields]]
name = "main_at_read"
field_type = "string"
required = true
[[workflow.step.fields]]
name = "read_at"
field_type = "string"
required = true
[[workflow.step.fields]]
name = "evidence"
field_type = "string"
required = true
