# THE FORGE HOST'S OWN CHORES.
#
# Eleven timers on boss-gcp got Job visibility earlier; the forge host
# runs two of its own and had neither, because the lint that checks
# for it read boss-gcp's TIMERS array and called itself complete. That
# was the same shape as the bug it was written for.
#
# cluster-deploy-runner is the more serious of the two: it is the only
# thing that gets production code onto the cluster, and rules.toml
# already records that it "failed silently for hours on a missing -i in
# a docker invocation" while the cluster sat on a stale image.

# reap-dead-ci-jobs.service (forge host)
[[workflow]]
kind = "maintenance-reap-ci-jobs"
label = "Reap dead CI jobs"
category = "platform"
subject_kinds = ["custom"]
owning_team = "platform"
description = "Removes the corpses of crashed CI jobs and the NAMED volumes they hold - `docker volume prune` skips a named volume, so one held 63GB on 2026-08-14 and left the next run less disk than a cold cargo test needs."
metadata = { owner_role = "platform-admin" }

[[workflow.step]]
title = "scheduled"
kind = "trigger"
ready_when = "true"
title_template = "Timer fired"
metadata_defaults = { trigger_kind = "periodic", trigger_name = "systemd-timer" }

[[workflow.step]]
title = "run"
kind = "task"
ready_when = "steps.scheduled.done"
title_template = "Run to completion"
authority_role = "platform-admin"
fields = [{ name = "result", field_type = "string", required = true }]

[[workflow.step]]
title = "completed"
kind = "outcome"
ready_when = "steps.run.done AND steps.run.metadata.result = \"ok\""
title_template = "Maintenance completed"
metadata_defaults = { outcome_kind = "completed" }
terminal = { outcome = "completed" }

# A run that died records how (boss-step.sh from ExecStopPost: the
# service result and exit status), and lands here instead of looking
# like a run still in progress. Before 2026-09-05 this terminal did
# not exist and a failed run's packet stayed open until a later run
# closed it "ok".
[[workflow.step]]
title = "failed"
kind = "outcome"
ready_when = "steps.run.done AND steps.run.metadata.result != \"ok\""
title_template = "Maintenance failed"
metadata_defaults = { outcome_kind = "aborted" }
terminal = { outcome = "failed" }
