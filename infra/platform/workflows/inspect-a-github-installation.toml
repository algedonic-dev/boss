# Source declaration only; publication is a separately recorded operation.
[[workflow]]
kind = "inspect-a-github-installation"
label = "Inspect GitHub installation permissions"
category = "platform"
subject_kinds = ["custom"]
owning_team = "platform"
description = "A platform administrator authorizes one declared credential's public installation read. The broker records the complete public permission map and exact observed identity, without minting, revoking, installing, granting or publishing anything. A diagnostic observation does not complete the failed publication it investigates."
metadata = { department = "it", owner_role = "platform-admin" }

[[workflow.step]]
title = "scope"
kind = "task"
ready_when = "true"
title_template = "Authorize the bounded installation read"
authority_role = "platform-admin"
audience = { role = "platform-admin" }
metadata_defaults = { human_presentation = { ask = "Authorize a read of this GitHub installation's permissions", why_person = "A person must authorize the exact account and the reason for this diagnostic read.", action = "Name the account and authorize the read", after = "The broker records public permissions only; nothing is minted, granted, installed, or published.", evidence = "current-step" }, human_only = true, installation_diagnostic = "scope", procedure = "Authorize a public GET of this declared GitHub App installation. Supply the expected account login explicitly; an optional numeric account id adds a separate equality assertion. App id comes from the issuer-owned root; installation id comes from the declaration or issuer default. This does not authorize token minting, permission changes or retrying publication." }
fields = [
    { name = "credential", field_type = "non-empty-string", required = true },
    { name = "expected_account_login", field_type = "non-empty-string", required = true },
    { name = "expected_account_id", field_type = "integer", required = false },
    { name = "reason", field_type = "non-empty-string", required = true },
]

[[workflow.step]]
title = "observe"
kind = "task"
ready_when = "steps.scope.done"
title_template = "Record the installation's public grants"
audience = { role = "platform-admin" }
metadata_defaults = { written_by = "rule:broker-observes-the-github-installation-grants", procedure = "The broker reads only the declared installation endpoint after rechecking human scope. It records full public evidence through the immutable first-record door. Failed or malformed reads leave grants unknown. A matching replay keeps the original receipt and timestamp; conflicting evidence cannot replace it." }
fields = [{ name = "observation", field_type = "object", required = true }]

[[workflow.step]]
title = "observed"
kind = "outcome"
ready_when = "steps.observe.done"
title_template = "Public installation observation recorded"
terminal = { outcome = "observed" }
metadata_defaults = { outcome_kind = "completed" }

[[workflow.step]]
title = "withdrawn"
kind = "outcome"
# A request replaced by a correctly targeted one (df452c4d by 87b68bf3), or
# one whose question another request already answered (87b68bf3 by
# c78bd9d5), had no ending but `observed` and stood urgent for days
# (backlog ce9b9207). The marker's value is the reason, set through
# PATCH /api/jobs/{id}/metadata. It is absent at admission, and `> ""` reads
# false over an absent key, so this cannot close a packet on create (lint
# phase 6). It follows the signed scope because a terminal must be reachable
# from the root step, and both stranded requests were signed.
ready_when = "steps.scope.done AND job.metadata.withdrawn > \"\""
title_template = "Withdrawn — replaced or no longer needed, nothing observed"
terminal = { outcome = "withdrawn" }
metadata_defaults = { outcome_kind = "withdrawn" }
