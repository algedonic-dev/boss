# ---------------------------------------------------------------------
# publish-to-github — the public mirror is a BACKUP OF SOURCE, fed by a
# pull request the machine opens and David merges.
#
# v6 (design packet 7b59af2c, David 2026-09-08). v1–v5 were published
# live and never seeded; v5 was retired by the boot guard on 2026-09-07
# because its `superseded` terminal read `job.metadata.superseded_by !=
# ""`, which is TRUE over an absent marker, so every fresh packet closed
# as superseded the instant it opened. This row is the first seeded
# version, and it carries the four decided changes:
#
#   1. `superseded` is gated on marker PRESENCE (`> ""`), so it holds
#      until a person sets the marker. Pinned by
#      platform_bundle.rs::publish_to_github_v6_keeps_its_decided_shape.
#   2. `open-pr` is a MACHINE step. It nominates nobody (no
#      authority_role — the gate-run `record-verdict` precedent) and
#      carries `ops_verb = "publish-github-pr"`; the dispatcher rule
#      `publish-github-pr-on-open-pr-ready` (202609081200) spawns an
#      ops-request for the forge on `step.ready.task` with that marker,
#      the root ops-runner runs the verb (fetch forge main, build the
#      dated snapshot commit on the mirror's main, push it to the dauld
#      fork, `gh pr create`), and the verb completes this step with
#      `pr_url`. The merge on GitHub stays David's — the second gate.
#   3. The measure step's instrument, infra/prep-github-publish.sh,
#      refuses (non-zero, naming the ref) when a ref does not resolve
#      instead of answering `has_drift:false`.
#   4. The GitHub-side workflows are not our CI/CD: ci/install-smoke/
#      release and dependabot were deleted from the tree; codeql and
#      scorecard stay as free security scans nothing on our side reads.
#
# v7 (backlog 321f1409, David 2026-09-19) reads that scan back. "Nothing
# on our side reads" was the defect: the mirror's CodeQL ran after this
# packet closed on `pr-opened`, on a surface only David sees, and PR
# #238 was merged over 64 unread alerts (18 critical) while #239
# stalled on 109 — 100 of 100 annotations name heuristics or test
# constants, and nothing in the record said so. Two steps between
# `open-pr` and the terminal:
#
#   5. `read-checks` is a second MACHINE step, the open-pr shape again:
#      `ops_verb = "read-publish-checks"`, the rule
#      `read-publish-checks-on-read-checks-ready` files the forge
#      request when it goes ready, and the verb waits for the PR head's
#      check-runs, writes the reading onto this packet as
#      `code_scanning` (per-check conclusions; the scan's counts by
#      rule, by file and by level) and completes the step with
#      `conclusion` / `alerts` / `rules`.
#   6. `judge-checks` is the agent's: a disposition per rule
#      (heuristic-noise with the reason, or real with the backlog-item
#      filed) and one verdict. It is ready only when the scan did not
#      conclude `success`, so a clean run closes straight to
#      `pr-opened`; a red one closes only judged. The merge on GitHub
#      is still David's, and it now follows a judged reading.
#
# v8 (backlog d4bfe548, David 2026-09-24: "Sounds good"). Measured that
# day on e0558b28: opened 00:00Z, drift refreshed by machine at 00:01Z,
# and `measure` — platform-admin, no agent block — sat unworked until
# the operator did it after 03:50Z, when David asked. Nothing said an
# agent could run it, so no actor was ever dispatched.
#
#   7. `measure` and `review` carry the analyst block judge-checks
#      carries. The measure procedure RE-MEASURES with
#      infra/prep-github-publish.sh --json rather than copying the
#      machine's `drift_refresh`; the review READS each newly public
#      file and files an item for anything that should not go public.
#      `approve` stays David's sign-off and declares no agent.
#   8. (The verb, not this row.) When publish-github-pr opens a new
#      mirror PR it closes each older open publish/<date> PR as
#      superseded by it, a comment naming the new one, recorded on the
#      older packet as `pr_superseded` + `pr_state` — so David only
#      ever sees one PR to merge.
#
# v9 (backlog c6cb678b, 2026-09-24). The reading judged the SCAN alone,
# so a slower check's verdict was never read: PR #243's Gate concluded
# failure at 04:18Z, `read-checks` had recorded it in_progress minutes
# before, `judge-checks` judged CodeQL's three rules, and the packet
# closed `pr-opened` at 04:41Z. No `ready_when` changes — the row's
# words do:
#
#   9. (The verb and a rule, not this row.) read-publish-checks now
#      completes `read-checks` only once EVERY check on the head has
#      completed — re-read every fifteen minutes by `reread-publish-pr-every-15-minutes`,
#      `unfinished` past a four-hour ceiling — and its `conclusion` is
#      the verdict over all of them: the scan's own when it did not
#      pass, else `failure` when any other check failed, named in
#      `failing`. So a Gate red over a clean scan makes judge-checks
#      ready, which the `!= "success"` guard already routes.
#  10. judge-checks' procedure judges each FAILING CHECK beside each
#      scan rule — one disposition per check, by its name — because a
#      disposition list that covers only the scan's rules would close a
#      red Gate as `noise` by omission.
#
# v10 — live as REGISTRY v6 on 2026-09-27 (backlog 02b65d81, David 2026-09-27: "Approved the publish, but did
# not get a passkey check"; with 6ab3a61c and 0677a618). Measured on
# 8d7a3507 (registry v5): `approve` completed at 13:46:58Z by emp-david
# with `sign_offs []` and `sign_offs_required []`, and the forge then
# opened a PR carrying 660 commits to the PUBLIC mirror — a click, where
# an ops approval in front of a disk verb needs a passkey-signed plan.
#
#  11. `approve` demands a PRESENCE stamp and names who supplies it —
#      `assurance_required = "presence"` AND `sign_offs_required`, both
#      halves, as ops-request's approve declares them (backlog 148549c5:
#      an assurance with no required sign-off is unreachable, and the
#      ordinary complete control was offered instead). The step PUT
#      refuses a completion that carries no presence, whatever surface
#      sends it.
#  12. `approve` is `human_only = true` (6ab3a61c, David 2026-09-24:
#      "approve (and the merge) stay human"): agents work every step
#      before it, and no agent block can be added to it silently.
#  13. The passkey signs a NAMED TREE. `measure` requires `source_sha`
#      and `scanned_sha` (0677a618) and copies both onto `approve`, where
#      they are declared `filled_by = "filer"` — context for the person,
#      so the measuring agent may write them on a human-only step, and
#      not required, so admission does not demand them of the daily
#      rule's spawn. They sit in approve's metadata BEFORE the ceremony,
#      and a presence stamp binds step_shape_hash(title, metadata): the
#      signature covers the tree. The sign-off surface draws a filled
#      field on a presence step read-only, as "what your passkey signs".
#  14. (The verb, not this row.) publish-github-pr reads that approval
#      off the record before it fetches anything — a live presence stamp
#      on approve's current shape, over source_sha = scanned_sha = what
#      measure recorded, with a clean scan — and publishes EXACTLY that
#      commit's tree, refusing one no longer on forge main. Until now it
#      published forge main's head at the moment it ran, which no one
#      had measured or read.
#
# Cadence: the daily `publish-to-github-daily` rule (129/149) spawns one
# packet per day, guarded to one open packet per mirror; most days land
# on `nothing-to-publish`, which is the measurement that the mirror is
# current.
#
# Seeding: this row lands on a FRESH database through the platform seed
# (insert-if-missing). On the live system of record, where earlier
# versions exist, the seed leaves the kind alone and this row goes live
# through `boss workflow publish publish-to-github infra/platform/workflows`,
# which reads this same entry — one definition. (The vN labels above are
# this file's lineage; the registry numbers its own versions, and read
# version 2 active on 2026-09-24.)
# ---------------------------------------------------------------------
[[workflow]]
kind = "publish-to-github"
label = "Publish to the public GitHub mirror"
category = "platform"
subject_kinds = ["custom"]
owning_team = "platform"
description = "Measure what a push to the public GitHub mirror would publish, prove it carries no credential material, and put the newly-public surface in front of a human before any of it leaves the network. Runs daily; most days it will find nothing and close on the nothing-to-publish terminal, which is the measurement that says the mirror is current. On approval the forge opens the pull request by machine (the publish-github-pr ops verb, as dauld); the merge on GitHub is the second, human gate."
metadata = { owner_role = "platform-admin" }

[[workflow.step]]
title = "opened"
kind = "trigger"
ready_when = "true"
title_template = "Mirror publish check due"
authority_role = "platform-admin"

[[workflow.step]]
title = "measure"
kind = "checklist"
ready_when = "steps.opened.done"
title_template = "Measure drift and scan for secrets"
authority_role = "platform-admin"
# (7) An agent's step now: the analyst block judge-checks carries.
agent = { profile = "analyst", model = "opus-5[1m]", budget_usd = 2, effort = "medium" }
metadata_defaults = { human_only = false, procedure = "RE-MEASURE; DO NOT TRANSCRIBE. The machine's daily `publish-github-pr --measure` writes `drift_refresh` onto this packet. It is a lead, not the answer: `has_drift` = false closes this packet nothing-to-publish, so the value recorded here must be the instrument's own. From the dev pod: `git fetch origin`, then `infra/prep-github-publish.sh --json` (SOURCE_REF defaults to origin/main, the tree the forge publishes; the mirror is read through a read-only anonymous remote named `github`, and when that remote is missing the script refuses and prints the `git remote add` that configures it).\n\nRecord the script's JSON as this step's fields, copied, never retyped from memory: `commits_ahead`, `files_changed`, `secrets_scan` (clean or FAILED, as the script said), `newly_public` (its count), `has_drift` (its own true or false, never inferred), and the two shas that name what was measured — `source_sha` (the commit whose drift was counted) and `scanned_sha` (the commit whose tree the secrets scan read; the string none when nothing was scanned). Record its `newly_public_files` list on this step too, as `newly_public_files`: the review step reads each file it names.\n\nTHEN PUT THE SAME TWO SHAS ON THE APPROVE STEP, before you complete this one: PATCH /api/jobs/{id}/steps/{the approve step's id}/metadata with `source_sha` and `scanned_sha`, the same values, copied from the same JSON. David's passkey signs the approve step's own keys, so this is what makes his approval an approval of THIS tree; the forge publishes exactly that commit and refuses an approval that names none, or names one this step did not record.\n\nEXIT 2 means a ref did not resolve and NOTHING was measured: complete nothing, and say why on this packet (PATCH /api/jobs/{id}/metadata). EXIT 1 is a BLOCKING finding (a secrets hit, or mirror content the source lacks): record the numbers anyway, with the script's `blocking` text as `blocking` on this step, so the review and David's approve both see it — the script prints the lint's own report of which file hit on stderr; quote it in `blocking`. A tree whose scan FAILED is never published by machine, approved or not." }
[[workflow.step.fields]]
name = "commits_ahead"
field_type = "string"
required = true
[[workflow.step.fields]]
name = "files_changed"
field_type = "string"
required = true
[[workflow.step.fields]]
name = "secrets_scan"
field_type = "string"
required = true
[[workflow.step.fields]]
name = "newly_public"
field_type = "string"
required = true
[[workflow.step.fields]]
name = "has_drift"
field_type = "true|false"
required = true
# (13) What was measured, by name (0677a618): without them the approval
# that follows could only ever be of "whatever forge main is by then".
[[workflow.step.fields]]
name = "source_sha"
field_type = "string"
required = true
[[workflow.step.fields]]
name = "scanned_sha"
field_type = "string"
required = true

[[workflow.step]]
title = "nothing-to-publish"
kind = "outcome"
ready_when = "steps.measure.done AND steps.measure.metadata.has_drift = \"false\""
title_template = "Mirror is current"
authority_role = "platform-admin"
terminal = { outcome = "nothing-to-publish" }

[[workflow.step]]
title = "review"
kind = "checklist"
ready_when = "steps.measure.done AND steps.measure.metadata.has_drift != \"false\""
title_template = "Review the newly-public surface"
authority_role = "platform-admin"
# (7) The same analyst block. What it writes is what David reads at
# `approve`, the one step here that stays his.
agent = { profile = "analyst", model = "opus-5[1m]", budget_usd = 2, effort = "medium" }
metadata_defaults = { human_only = false, procedure = "READ EACH NEWLY PUBLIC FILE; a count is not a review. The measure step recorded `newly_public_files`: files that have never existed on the public mirror and sit under docs/runbooks/ or infra/cluster|caddy|forge/, which describe how to reach and recover the live system. Read every one on the tree that would be published — the MEASURED commit, which is the one the forge publishes: `git fetch origin`, then `git show <source_sha>:<path>` with the measure step's `source_sha`, never origin/main, which has moved on since.\n\nWrite `newly_public_review` with the verdict FIRST (publish, or do not publish and why), then one line per file: `<path>: ok` with why it is fine to publish, or `<path>: DISCLOSES <what>` (a credential or where one lives, a host or address outside infra/estate/estate.toml, a person's detail, a recovery path that helps an attacker) followed by the backlog-item you FILED for it (`boss job file`). An RFC1918 address or a k8s manifest is not a secret and the repository is open source by intent: say so rather than flag it. Carry forward anything the measurement found blocking (a FAILED secrets scan, a `blocking` note). With no newly public files, say that in one line.\n\nThe approve sign-off that follows is David's. This review is what he reads there, so it must let him decide without opening anything else." }
[[workflow.step.fields]]
name = "newly_public_review"
field_type = "string"
required = true

# (11) A PASSKEY, and (12) a person's step. Both halves of the
# requirement, as ops-request's approve declares them: the step PUT
# refuses a completion that carries no presence stamp (whatever surface
# sends it), and `sign_offs_required` is what gives the person the door
# that PRODUCES one — without it the sign-off surface renders no role
# and offers the ordinary complete control (backlog 148549c5). Publishing
# to a public repository cannot be taken back, so this is the one step
# in the protocol no agent may do and no click may stand in for.
[[workflow.step]]
title = "approve"
kind = "sign-off"
ready_when = "steps.review.done"
title_template = "Approve publishing to the public mirror"
authority_role = "platform-admin"
assurance_required = "presence"
sign_offs_required = ["platform-admin"]
metadata_defaults = { human_only = true, procedure = "YOUR PASSKEY SIGNS THIS STEP'S OWN KEYS, and two of them name the tree: `source_sha` is the commit the measurement counted and the review read, and `scanned_sha` the commit whose tree the secrets scan passed. They must be the same sha. The forge publishes exactly that commit's tree — not whatever forge main has become since — and refuses an approval without a passkey, one whose two shas differ, one naming a tree the measure step did not record, and one whose scan did not come back clean.\n\nRead the review step's `newly_public_review` first; it is written so you can decide without opening anything else. If either sha is missing, do not approve: the measurement did not put them here, and the forge would refuse the publish anyway. Reject, or request changes, when the review says do not publish." }
[[workflow.step.fields]]
name = "decision"
field_type = "pending|approved|rejected|changes-requested"
required = true
# (13) The measured tree, on the step the passkey signs. Written by the
# measure step's agent before the ceremony (`filled_by = "filer"`:
# context for the person, which a non-person may write on a human-only
# step, where the decision is the person's alone); NOT required, because a required filer field is demanded at
# admission and the daily rule spawns this packet before any
# measurement. The publish verb is what refuses an approval without
# them.
[[workflow.step.fields]]
name = "source_sha"
field_type = "string"
required = false
filled_by = "filer"
[[workflow.step.fields]]
name = "scanned_sha"
field_type = "string"
required = false
filled_by = "filer"

# The machine step (2). No authority_role: nobody is nominated; the
# forge ops-runner's actor (platform-admin) completes it. `ops_verb` is
# the routing marker the dispatcher rule reads off the step.ready
# payload — step.ready does not hoist spec_slug the way step.done does.
[[workflow.step]]
title = "open-pr"
kind = "task"
ready_when = "steps.approve.done AND steps.approve.metadata.decision = \"approved\""
title_template = "Open a pull request on the public mirror (by machine, from the forge)"
metadata_defaults = { ops_verb = "publish-github-pr" }
[[workflow.step.fields]]
name = "pr_url"
field_type = "string"
required = true

# The reading (5). A machine step like open-pr: nobody nominated, the
# `ops_verb` marker routes it, the forge verb completes it. Required at
# done: the verdict over every check on the head (9) — the scan's
# conclusion as GitHub spells it when the scan did not pass (`failure`,
# … or `absent` when no scan check ran), else `failure` when another
# check failed, `unfinished` past the ceiling, `success` otherwise —
# the annotation count read, and the count of distinct rules: the three
# numbers the judge step's readiness and the answer line both carry.
[[workflow.step]]
title = "read-checks"
kind = "task"
ready_when = "steps.open-pr.done"
title_template = "Read the pull request's check results back onto this packet (by machine, from the forge)"
metadata_defaults = { ops_verb = "read-publish-checks" }
[[workflow.step.fields]]
name = "conclusion"
field_type = "string"
required = true
[[workflow.step.fields]]
name = "alerts"
field_type = "string"
required = true
[[workflow.step.fields]]
name = "rules"
field_type = "string"
required = true

# The judgement (6). Ready only when the scan did not conclude
# `success` — `!=` over a done step's required field, never over an
# absent one (the v5 footgun), because `steps.read-checks.done` guards
# it. Agent-workable at the platform operator's queue (the analyst
# block department-retro's work steps carry, c87fb59b car 1): the
# reading is on the packet as `code_scanning`, so the procedure is a
# read of this packet, not of GitHub.
[[workflow.step]]
title = "judge-checks"
kind = "task"
ready_when = "steps.read-checks.done AND steps.read-checks.metadata.conclusion != \"success\""
title_template = "Judge the code-scanning alerts: a disposition per rule"
audience = { role = "platform-admin" }
agent = { profile = "analyst", model = "opus-5[1m]", budget_usd = 2, effort = "medium" }
metadata_defaults = { human_only = false, procedure = "The reading is ON THIS PACKET: `metadata.code_scanning` — every check on the PR head with its conclusion, and under `alerts` the scan's annotations counted by rule (`by_rule`, largest first, each with its file count), by file and by level, with `declared` (what the check-run says it holds) beside `read` (what the API exposed). Judge each RULE in `by_rule`, not each alert: record `dispositions` as one entry per rule — `{rule, disposition, reason}` — where disposition is `noise` (a heuristic that named a non-secret: an account_id / employee_id / uid in a log line, a #[cfg(test)] constant, an in-cluster http URL) with the reason that makes it noise, or `real` with the backlog-item you FILED for it (its id in the reason). Read the code behind a rule before calling it noise — `by_file` names the files, and the check-run's url the lines. EVERY FAILING CHECK IS JUDGED TOO, not only the scan's rules (backlog c6cb678b: #243 closed pr-opened with its Gate red, judged on CodeQL alone). `metadata.code_scanning.failing` names each check on the head that completed without passing — the mirror's own `Gate (infra/gate.sh, full)` among them — and `still_running` names any the reading saw unfinished (the step's `conclusion` reads `unfinished` when a check outlasted the ceiling). For each one that is not the scan itself, add one `dispositions` entry with `rule` = the check's name: `real` with the backlog-item you FILED for it (open the check's `url`, name the failing test or phase in the reason), or `noise` only with the evidence that the failure is not the tree's (a runner fault, a GitHub outage — never 'it passed on our gate'). An unfinished check is judged the same way, from what its url shows. Then `verdict`: `noise` when every rule and check is noise, `real` when any is, `clean` only when there were no alerts and nothing failed. The merge on GitHub is David's and follows this verdict; a rule or check left unjudged is a red badge he merges over by hand, which is the defect this step exists to end (backlog 321f1409: #238 merged over 64 unread alerts, #239 stalled on 109)." }
[[workflow.step.fields]]
name = "dispositions"
field_type = "array"
required = true
item_keys = ["rule", "disposition", "reason"]
[[workflow.step.fields]]
name = "verdict"
field_type = "clean|noise|real"
required = true

# The terminal follows the judgement when there was one, and the
# reading alone when the scan was clean — so a clean run never waits
# on a judge with nothing to judge, and a red one never closes unjudged.
[[workflow.step]]
title = "pr-opened"
kind = "outcome"
ready_when = "steps.judge-checks.done OR (steps.read-checks.done AND steps.read-checks.metadata.conclusion = \"success\")"
title_template = "Pull request opened and its checks read"
authority_role = "platform-admin"
terminal = { outcome = "pr-opened" }

[[workflow.step]]
title = "declined"
kind = "outcome"
ready_when = "steps.approve.done AND steps.approve.metadata.decision != \"approved\""
title_template = "Not published"
authority_role = "platform-admin"
terminal = { outcome = "declined" }

# (1) PRESENCE, not inequality. `> ""` is false for an absent marker,
# false for the empty string, true only for a set one — so this holds
# until a person supersedes the packet. `!= ""` reads true over Absent
# and closed every v5 packet at open (workflow_lint Phase 6).
[[workflow.step]]
title = "superseded"
kind = "outcome"
ready_when = "steps.opened.done AND job.metadata.superseded_by > \"\" AND job.metadata.supersession_translation > \"\""
title_template = "Superseded by a newer packet"
metadata_defaults = { outcome_kind = "withdrawn" }
terminal = { outcome = "superseded" }
