# ---------------------------------------------------------------------------
# train-conductor — the delivery pipeline's POLICY: what the conductor
# DECIDES by (crates/orchestrators/boss-cli/src/delivery_policy.rs is
# the reader; train.rs is what it DOES).
#
# ONE ROW IS THE WHOLE POLICY, the `workflows` shape: a train pins one
# policy version at boarding (`metadata.delivery_policy_version`) and
# reconcile judges it by the version it departed under, so editing this
# file mid-flight cannot rewrite the rules a train left on.
#
# Version 2 is the row the migrations produced: 202608242117 seeded v1
# with train.rs's compiled constants verbatim (hold 2, stall 6h, the
# consist check's three budgets and the two reason budgets);
# 202609030800 and 202609031000 widened the table (ci_host_floor_gb
# default 90, gate_max_concurrent default 3, both filled in place);
# 202609050500 retired v1 and published v2 with the floor at 40
# (approval d99b198d: the forge runs lean CI green at 60-70 GB free and
# the locomotive's own door is 40); 20260918102236 dropped
# consist_excluded_lints (H9 — each lint declares its own consist skip).
# Declared here since 2026-09-18 (backlog 393d3234, consolidation H4,
# car 4 of 4); see README.md for what that means.
#
# Version 3 is the first version declared ONLY here (backlog 366c2ed5,
# David 2026-09-28 02:50Z, 'Go to 4'): gate_max_concurrent 3 -> 4, bumped
# from the LIVE newest (v2, read off /api/delivery/policy/train-conductor
# on 2026-09-28), which the seed publishes over the migrations' v2 at the
# next converge. Three bays had been saturated most of the day before —
# a queue of 7-11 gates, the oldest waiting 51-69 min. Four is one step
# short of the measured cliff at FIVE (2026-08-26: w-1 I/O pressure 65%,
# CPU pressure 0.00, a ~35-min gate took ~93) and was never measured
# itself, so a day of gate duration and w-1 I/O pressure is recorded on
# that packet before five is considered.
#
# Version 4 (backlog 461159e7, 2026-09-30): gate_max_concurrent 4 -> 3,
# bumped from the LIVE newest (v3, read off
# /api/delivery/policy/train-conductor at 2026-09-30; versions/4 answered
# null). v3 rested on "4 x 90Gi ephemeral fits the 929GB disk", but the
# kubelet evicts on usage and a gate may fill its 160Gi workspace: on
# 2026-09-29 22:30:29Z w-1 evicted a running gate. The same car raises
# each gate's request to 160Gi, so the node itself now admits 3 x 160 +
# the dev pod's 154 = 634 of ~790 GiB allocatable, and a fourth needs
# 794. At 4, the fourth bay's gate would sit Pending for most of a busy
# day, look like a running slot in the yard, queue ahead of the train
# gate, and take the dev pod's room whenever the dev pod rolls
# (Recreate, preemptionPolicy Never), which locks the session out. So
# the policy states the capacity the node will honour. What restores
# four is the second NVMe on w-1 (52ea56ac, planned for the morning of
# 2026-09-30); David's throughput decision on v3 stands, deferred to
# that disk rather than overturned.
#
# Version 5 (backlog e6dc7331, 2026-09-30): gate_max_concurrent 3 -> 4,
# bumped from the LIVE newest (v4, read off
# /api/delivery/policy/train-conductor at 2026-09-30 22:4xZ;
# versions/5 answered null). The second NVMe landed (52ea56ac, #853):
# a gate's workspace and the seed live on /var/mnt/gate, off the
# install disk. Measured on w-1's nodefs across the first five
# new-layout gates (21:03Z-22:37Z), a gate keeps roughly ~8 GB on
# EPHEMERAL — inside that series' noise, with pgdata and /tmp
# unmeasured (review be559bda) — so its request drops 160Gi -> 40Gi in
# the same car, and four bays plus the train gate beside the dev pod
# ask 5 x 40 + 154 = 354 of w-1's 789 GiB allocatable (pinned in boss-testing,
# a_gate_requests_what_the_new_layout_uses_and_the_bays_fit). CPU and
# memory: five gates request 20 CPU / 40Gi of w-1's 32 / 63Gi, with
# the dev pod's 4 / 8Gi beside them. Four, not five: five was the I/O
# cliff on ONE disk (2026-08-26) and four has never been measured with
# the I/O split across two, so a day of gate duration at four is
# recorded on e6dc7331 before any further step.
#
# Version 6 (backlog 0491b7d6, 2026-10-01): consist_budget_secs 60 ->
# 120, bumped from the LIVE newest (v5, read off
# /api/delivery/policy/train-conductor at 2026-10-01 02:4xZ). Run
# 9f0faeea measured the 94-lint consist roster with no token in reach
# at 85-89 s serial, all passing; the conductor logged "budget spent
# (61s) after 68 of 94 checks" on every board, so 26 lints never ran
# there. The lints are CPU-bound: pinned to the conductor's 1-CPU
# limit, serial took 82.4 s and 8-wide 81.6 s, so a parallel runner
# buys nothing at that limit. 120 is ~40% over the 85 s projection.
# The larger option (conductor cpu 4 plus a parallel runner, ~20-25 s)
# stays open on that packet.
#
# The compiled fallback in delivery_policy.rs is held equal to this
# file by `the_bundle_equals_the_compiled_fallback` (boss-cli): the
# conductor runs on these numbers whether or not the registry answers,
# and a train that departed on the fallback pins no version.
#
# To change this policy, bump `version`.
# ---------------------------------------------------------------------------

[[delivery_policy]]
name = "train-conductor"
version = 6
status = "active"
# THE HOLD: red trains a car may be released from before boarding
# leaves it behind until a human looks.
max_red_trains = 2
# THE STALL WINDOW: hours without a step completion before an open
# train counts stalled.
stall_hours = 6
# THE CONSIST CHECK'S THREE BUDGETS: wall-clock seconds for the whole
# check, characters of a failing lint's output on the record, and how
# many filenames a refusal names.
consist_budget_secs = 120
consist_output_budget = 1200
consist_files_named = 6
# THE TWO REASON BUDGETS, in characters: a left-behind car's
# conflicted-file chip, and a jobs-API blip's cause in the journal.
skip_reason_file_budget = 96
blip_cause_budget = 80
# GB of free disk the CI host's latest host-scope estate observation
# must show before boarding assembles a consist.
ci_host_floor_gb = 40
# How many gates `boss gate` admits at once before it refuses — the
# number the CLI obeys and the number the yard draws as slots. Four
# since v5, the workspace on w-1's second NVMe (see the header).
gate_max_concurrent = 4
