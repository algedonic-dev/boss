# Platform Workflow bundle — protocols as DATA, not Rust literals.
#
# David, 2026-08-15: "get those protocols prioritized to be fully moved
# into data and registry configurations. That is hunting leakage between
# the layers too" — CLAUDE.md's own test: "a protocol that cannot be
# replaced without a deploy has leaked into the substrate".
#
# Three of the four registries carrying the operating model already seed
# as data (dispatcher_rules, stations, step_plugins). `workflows` did
# not: twelve kinds were Rust literals in `platform_workflows()`, and an
# API publish of one is REVERTED on the next boot because
# bootstrap_reconcile republishes the code default (68331085).
#
# Parsed by `boss_jobs::seed_loader::load_workflows`, the same reader the
# brewery's 25-row bundle uses. Authored rather than generated on
# purpose: `WorkflowSpec` does NOT serialize to TOML — TOML has no null,
# so every `None` field fails with UnsupportedType(unit). The fidelity
# guarantee therefore runs the other way, and it is not optional:
# `platform_bundle_matches_the_shipped_spec` parses this file and
# asserts each row equals the spec it replaces, field for field.
#
# That test is David's answer to protocols-as-data Q4 made mechanical:
# "moving user-feedback v10 from code to bundle must produce a row
# identical to the live v10 — not v11. If the loader publishes a new
# version instead of recognising the existing one, every in-flight
# packet keeps its old spec and the board grows a second lineage."
#
# CONVERSION ORDER is by blast radius (protocols-as-data.md): the kinds
# with no traffic first, so a wrong loader hurts nothing. This file
# starts with one of them.

[[workflow]]
kind = "regenerate-deployment"
label = "Regenerate a deployment"
category = "platform"
subject_kinds = ["custom"]
owning_team = "platform"
description = "Drop a deployment's database and rebuild it: schema, seed, backfilled history, then live. The Subject is the deployment, so \"what regens has this box had, and why\" answers from Subject history. Two steps are gated on a person \u2014 declaring why it is happening, and the destructive reset itself \u2014 and the rest record what was done at each stage. Note the bootstrap gap: a deployment cannot run the Workflow that regenerates it, so the Job lives wherever the operator is."
metadata = { owner_role = "platform-admin" }

[[workflow.step]]
title = "requested"
kind = "trigger"
ready_when = "true"
title_template = "Regen requested"
metadata_defaults = { trigger_kind = "operator", trigger_name = "operator-requests-a-regen" }

[[workflow.step]]
title = "scope"
kind = "task"
ready_when = "steps.requested.done"
title_template = "Why, and what it destroys"
authority_role = "platform-admin"
[[workflow.step.fields]]
name = "reason"
field_type = "string"
required = true
[[workflow.step.fields]]
name = "destroying"
field_type = "string"
required = true

[[workflow.step]]
title = "build"
kind = "task"
ready_when = "steps.scope.done"
title_template = "Build release artifacts"
[[workflow.step.fields]]
name = "source_ref"
field_type = "string"
required = true

[[workflow.step]]
title = "artifacts"
kind = "task"
ready_when = "steps.build.done"
title_template = "Prove the built thing is the deployed thing"
[[workflow.step.fields]]
name = "verified"
field_type = "string"
required = true

[[workflow.step]]
title = "deploy"
kind = "task"
ready_when = "steps.artifacts.done"
title_template = "Install"
[[workflow.step.fields]]
name = "deployed"
field_type = "string"
required = true

[[workflow.step]]
title = "reset"
kind = "task"
ready_when = "steps.deploy.done"
title_template = "Drop and reseed"
authority_role = "platform-admin"
[[workflow.step.fields]]
name = "baseline"
field_type = "string"
required = true

[[workflow.step]]
title = "backfill"
kind = "task"
ready_when = "steps.reset.done"
title_template = "Backfill, then go live"
[[workflow.step.fields]]
name = "went_live"
field_type = "string"
required = true

[[workflow.step]]
title = "verify"
kind = "task"
ready_when = "steps.backfill.done"
title_template = "Verify the new world"
[[workflow.step.fields]]
name = "checks"
field_type = "string"
required = true

[[workflow.step]]
title = "complete"
kind = "outcome"
ready_when = "steps.verify.done"
title_template = "Regen complete"
metadata_defaults = { outcome_kind = "completed" }
terminal = { outcome = "regenerated" }

[[workflow.step]]
title = "abandoned"
kind = "outcome"
ready_when = "steps.scope.done AND job.metadata.abandoned = \"true\""
title_template = "Abandoned"
metadata_defaults = { outcome_kind = "aborted" }
terminal = { outcome = "abandoned" }

[[workflow]]
kind = "workflow-design"
label = "Design a Workflow"
category = "platform"
subject_kinds = ["custom"]
owning_team = "platform"
description = "Meta-kind: every Workflow in the registry is authored by a Job of this kind. The terminal `workflow-publish` step writes the spec into the registry and emits `jobs.kind.published` into audit_log. See docs/architecture-decisions.md (Jobs, Workflows, Steps)."
metadata = { owner_role = "platform-admin" }

[[workflow.step]]
title = "author"
kind = "task"
ready_when = "true"
title_template = "Author WorkflowSpec"

[[workflow.step]]
title = "validate"
kind = "task"
ready_when = "steps.author.done"
title_template = "Validate spec"

[[workflow.step]]
title = "approve"
kind = "sign-off"
ready_when = "steps.validate.done"
title_template = "Approve spec"
authority_role = "workflow-approver"
sign_offs_required = ["workflow-approver"]
metadata_defaults = { authority_role = "workflow-approver" }

[[workflow.step]]
title = "publish"
kind = "workflow-publish"
ready_when = "steps.approve.done"
title_template = "Publish to registry"
terminal = { outcome = "published" }

[[workflow]]
kind = "backlog-item"
label = "Backlog item"
category = "platform"
subject_kinds = ["custom"]
owning_team = "platform"
description = "One piece of engineering backlog, modelled as work rather than a line in a markdown file. The Subject is the area it touches, so \"what is outstanding against the ledger\" answers from Subject history. Triage requires the evidence behind the routing decision, because the failure mode of a backlog is not neglect but confident wrong answers read off its own text \u2014 an internal claim about the codebase decays every time the codebase moves. `stale` exists for the items that die without anyone doing them, and `verify` for the ones whose claim needs re-measuring before anyone acts."
metadata = { owner_role = "platform-admin" }

[[workflow.step]]
title = "filed"
kind = "trigger"
ready_when = "true"
title_template = "Filed to the backlog"
metadata_defaults = { trigger_kind = "operator", trigger_name = "item-enters-the-backlog" }

[[workflow.step]]
title = "triage"
kind = "task"
ready_when = "steps.filed.done"
title_template = "Measure the claim, choose a route"
authority_role = "platform-admin"
[[workflow.step.fields]]
name = "disposition"
field_type = "verify|design|build|duplicate|stale|decline"
required = true
[[workflow.step.fields]]
name = "evidence"
field_type = "string"
required = true

[[workflow.step]]
title = "measure"
kind = "task"
ready_when = "steps.triage.done AND steps.triage.metadata.disposition = \"verify\""
title_template = "Re-measure the claim"
authority_role = "platform-admin"

[[workflow.step]]
title = "design-review"
kind = "task"
ready_when = "steps.triage.done AND steps.triage.metadata.disposition = \"design\""
title_template = "Decide the design"
authority_role = "platform-admin"

[[workflow.step]]
title = "build"
kind = "task"
ready_when = "steps.triage.done AND steps.triage.metadata.disposition = \"build\""
title_template = "Build the change"
authority_role = "platform-admin"

[[workflow.step]]
title = "duplicate"
kind = "outcome"
ready_when = "steps.triage.done AND steps.triage.metadata.disposition = \"duplicate\""
title_template = "Closed as a duplicate"
metadata_defaults = { outcome_kind = "withdrawn" }
terminal = { outcome = "duplicate" }

[[workflow.step]]
title = "stale"
kind = "outcome"
ready_when = "steps.triage.done AND steps.triage.metadata.disposition = \"stale\""
title_template = "Closed \u2014 the claim no longer holds"
metadata_defaults = { outcome_kind = "withdrawn" }
terminal = { outcome = "stale" }

[[workflow.step]]
title = "declined"
kind = "outcome"
ready_when = "steps.triage.done AND steps.triage.metadata.disposition = \"decline\""
title_template = "Closed without action"
metadata_defaults = { outcome_kind = "aborted" }
terminal = { outcome = "declined" }

[[workflow.step]]
title = "closed"
kind = "outcome"
ready_when = "steps.measure.done OR steps.design-review.done OR steps.build.done"
title_template = "Backlog item closed"
metadata_defaults = { outcome_kind = "completed" }
terminal = { outcome = "completed" }

# ---------------------------------------------------------------------
# design-doc — the doc IS the packet until it settles.
#
# David, 2026-08-16: "Should we just have an MD payload in the packet?
# It only writes to file when the job terminates?" Yes, and the reason
# is that the current protocol cannot start a review until the thing
# being reviewed has already shipped. review-design.js carries a 404
# message apologising for exactly that — "review Jobs are instant data
# but docs ride trains" — and every design-review bug this week lived
# in the backflow that arrangement requires: the flusher pushing to the
# wrong remote, duplicate flush jobs, an anchor-not-found message that
# could not tell "already answered" from "wrong doc", and a spawn rule
# that asks a level question on an edge.
#
# THIS DELETES THE BACKFLOW rather than repairing it. The prose and the
# questions ride in step metadata, so there is nothing to index, nothing
# to flush, and no round trip: the packet is reviewable the second it
# exists. `review-design.js` reads `metadata.questions` when present and
# falls back to the docs API when absent, so the ten in-flight
# design-doc-review Jobs are untouched.
#
# It is NOT a rejection of markdown files. David's own Q6 on
# design-docs-as-data settled the split — "file wins on prose, data wins
# on questions" — and CLAUDE.md already says settled material folds into
# architecture-decisions.md and the source doc is deleted. This only
# moves WHERE the file appears: at the end, as the residue, rather than
# at the start as a precondition. A doc under discussion has no business
# in git; git's value is review and history over things that have
# stopped moving.
#
# `publish` is deliberately a plain terminal that records the path
# rather than a step that writes the file. Writing it is a car's job —
# David's answer to design-docs-as-data Q4, twice: "the docs car that
# carries the flush through a train".
[[workflow]]
kind = "design-doc"
label = "Design doc"
category = "platform"
subject_kinds = ["custom"]
owning_team = "platform"
description = "A design doc while it is still being decided. The prose and the open questions ride in the packet, so it is reviewable the moment it exists rather than after it ships; the markdown lands as a file only when the packet terminates. Replaces the index-and-flush round trip that made a review possible only after its doc reached deployed main."
metadata = { owner_role = "platform-admin" }

[[workflow.step]]
title = "drafted"
kind = "trigger"
ready_when = "true"
title_template = "Draft written"
metadata_defaults = { trigger_kind = "operator", trigger_name = "author-drafts-a-design-doc" }

[[workflow.step]]
title = "review"
kind = "review-design"
ready_when = "steps.drafted.done"
title_template = "Answer the open questions"
authority_role = "platform-admin"

[[workflow.step]]
title = "published"
kind = "outcome"
ready_when = "steps.review.done"
title_template = "Settled — carry it to a file"
metadata_defaults = { outcome_kind = "completed" }
terminal = { outcome = "published" }

# correct-the-record — a published claim turned out to be false.
#
# WHY THIS EXISTS. On 2026-08-16 a design doc asserted, in writing and
# in review, that the boss-dev pod "has never run". It had been running
# for 25 hours. The claim was reasoned from real evidence — no script
# applies the manifest, no kubectl on boss-gcp or the forge host — and
# was wrong because the author generalised from the environments he
# could see. David reviewed it and accepted five decisions resting on
# that premise.
#
# Nothing in the protocol set could carry the fix. `design-doc` ends at
# `published`; a terminal packet has no path back. `incident` is for
# things that broke, and no service was down. `escalation` asks a
# question rather than correcting an answer. So the only route was to
# hand-edit prose — which is exactly the untracked, unreviewable motion
# every other correction in this system stopped using.
#
# David, 2026-08-16: "this is exactly why we are using data-based
# protocols. Let's make sure the actual job protocols are corrected
# and/or designed and implemented if missing."
#
# THE `method` FIELD IS THE POINT. Every false claim this week shared
# one shape: asserted from the wrong vantage and never checked against
# the thing itself. Requiring how it was measured, not just what, is
# the protocol refusing to accept a correction that is only better
# reasoning. A correction with no method is a second guess.
#
# `corrects` in metadata names the packet or doc being fixed, so the
# record of having been wrong is queryable rather than folded into a
# git diff nobody reads.
[[workflow]]
kind = "correct-the-record"
label = "Correct the record"
category = "platform"
subject_kinds = ["custom"]
owning_team = "platform"
description = "A settled decision or published doc asserts something false. Carries the claim, the measurement that contradicts it, and how that measurement was taken; a human accepts the correction before it lands. Exists because design-doc terminates at `published` and nothing could reopen a premise."
metadata = { owner_role = "platform-admin" }

[[workflow.step]]
title = "raised"
kind = "trigger"
ready_when = "true"
title_template = "Correction raised"
metadata_defaults = { trigger_kind = "operator", trigger_name = "a-published-claim-is-false" }

[[workflow.step]]
title = "evidence"
kind = "task"
ready_when = "steps.raised.done"
title_template = "Show the measurement"
fields = [
  { name = "claim", field_type = "string", required = true },
  { name = "where", field_type = "string", required = true },
  { name = "measured", field_type = "string", required = true },
  { name = "method", field_type = "string", required = true },
]

[[workflow.step]]
title = "review"
# `correction-verdict`, not `task` — this step has a custom Step UX
# (infra/step-plugins/correction-verdict.js, registered by migration
# 146). David, with four of these parked in his queue: "The UX for the
# corrections is hard for me to understand the question and trade-off."
#
# He was right, and structurally so. As a bare `task` the card read
# "Accept the correction" and offered `verdict` with two enum values
# whose names do not say what either causes — while the claim, the
# measurement contradicting it, the method and the location all sat on
# the PREVIOUS step, behind a modal and a metadata dump. The question
# was on screen; the material to answer it was not.
#
# The kind is the only way to reach a plugin: plugins register by kind
# and the SPA mounts by kind, so registering against `task` would
# hijack every task step in the system. Nothing else about the gate
# changes — the Rust StepRegistry is permissive for kinds it does not
# know, and the completion contract still comes from the `fields` below.
kind = "correction-verdict"
ready_when = "steps.evidence.done"
title_template = "Accept the correction"
authority_role = "platform-admin"
# `verdict` picks the terminal, the same shape `approval` uses. Two
# defects in a row here, both caught by machinery rather than by me:
#
# v1 gated `unfounded` on `steps.evidence.done` alone, so the first
# correction filed through this protocol auto-closed as unfounded the
# instant its evidence landed, skipping the review it exists to
# require. Found by using it, a minute after publishing.
#
# The fix to that made `verdict` a free-text fork, and the workflow
# lint refused it: "fork over free-text `verdict` needs a fallback
# successor". It is right — a typo'd verdict would strand the packet
# with no reachable terminal. An enum makes the fork total, so every
# value a reviewer can write leads somewhere.
fields = [{ name = "verdict", field_type = "accepted|unfounded", required = true }]

[[workflow.step]]
title = "applied"
kind = "task"
ready_when = "steps.review.done AND steps.review.metadata.verdict = \"accepted\""
title_template = "Land it where the claim lives"
fields = [{ name = "landed", field_type = "string", required = true }]

[[workflow.step]]
title = "corrected"
kind = "outcome"
ready_when = "steps.applied.done"
title_template = "Record corrected"
metadata_defaults = { outcome_kind = "completed" }
terminal = { outcome = "corrected" }

[[workflow.step]]
title = "unfounded"
kind = "outcome"
ready_when = "steps.review.done AND steps.review.metadata.verdict = \"unfounded\""
title_template = "The original claim held up"
# `withdrawn`, not `cancelled` — the workflow lint enforces the
# outcome_kind vocabulary (completed|skipped|aborted|withdrawn) and
# caught the invented value before it reached the registry. Withdrawn
# is also the honester word: nothing was cancelled, the correction was
# taken back because measurement upheld the original claim.
metadata_defaults = { outcome_kind = "withdrawn" }
terminal = { outcome = "unfounded" }


# THE FIVE UNWATCHED CHORES.
#
# boss-maintenance-wrap.sh states the contract already: "the timer is
# the EXECUTOR, the Job is the VISIBILITY". ExecStartPre opens (or
# reuses) a Job, ExecStartPost completes it, and a FAILED run completes
# nothing — so the Job stays open on the fleet view until a later run
# succeeds or a human closes it. Three chores were wired that way:
# backup, audit-integrity, ledger-replay.
#
# Five were not, and had no packet, no findings, no event-log trace and
# nobody's queue. A silent failure in any of them looks exactly like a
# success. That is the whole defect class of the day, running nightly.
#
# David, 2026-08-16: "Let's make sure we have a job to handle each."
#
# In the BUNDLE and not in platform_workflows(), deliberately, and the
# comment in registry.rs argues it better than this one can: a kind in
# Rust is a protocol that cannot change without a deploy and that
# bootstrap_reconcile will rewrite over an operator's edit; a kind in
# the bundle is data. The three existing maintenance kinds are still in
# Rust and should follow — separately, since moving a kind with live
# packets is its own change.

