# Look at the estate, and write down what was there.
#
# `nodes` (144-estate-subjects.sql) says what machines we MEANT to
# have. Nothing has ever recorded what is ACTUALLY there, so the two
# could not be compared — and on 2026-08-30 three separate accounts of
# the estate were wrong in the same direction, because none of them was
# connected to the machines. w-1, the 32-core node that compiles this
# repository, was missing from the registry for five days (59ef456a).
#
# WHY A CRONJOB AND NOT A DISPATCHER HANDLER. Handlers speak HTTP to
# the jobs API and own no private view — that is a deliberate property,
# and it means a handler can COMPARE but cannot OBSERVE. Only something
# inside the cluster can list nodes without a credential being placed
# somewhere it does not belong. So the split is: this observes and
# posts, the API records, and a handler on cadence compares the
# observation against the registry and opens a packet on the difference.
#
# IT DOES NOT WRITE THE REGISTRY, and must not. If the observer updated
# `nodes` directly, the cluster would become the source of truth for its
# own declaration and nothing could ever be found MISSING — only
# silently added. Declared and observed stay apart; the difference is
# the finding.
#
# Pins: reads nodes cluster-wide (read-only), posts to the jobs API by
# service DNS. Secrets are referenced by name only.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: estate-observer
  namespace: boss
---
# Node listing is cluster-scoped, so this is the one ClusterRole in the
# tree — and it is READ-ONLY. An observer that could change anything
# would be a different kind of thing, and `get` is the only verb here:
# the kubelet's write paths (/exec, /run, /attach, /portForward) are all
# POST, so none of them is reachable with this rule set.
#
# WHY nodes/proxy, added 2026-09-10 (a520737f). FREE SPACE IS NOT ON THE
# NODE OBJECT. `status.capacity.ephemeral-storage` is a total;
# `status.allocatable.ephemeral-storage` is that total minus kube-reserved
# and the eviction threshold — a static figure, not a measurement, and
# reading it as "free" would produce a number that never moves. The
# kubelet's own statfs is published at /stats/summary, reached through the
# API server at /api/v1/nodes/<name>/proxy/..., which the API server
# authorizes as `get` on the `nodes/proxy` subresource.
#
# Two alternatives were weighed and rejected:
# - The `DiskPressure` condition is free with the rule above and needs no
#   arithmetic, but kubelet raises it at its eviction threshold — 10% of
#   nodefs by default. estate_compare's floor is deliberately 35%
#   BECAUSE 8% arrived hours after CI had already gone red (2026-09-05);
#   adopting a 10% signal as the only cluster-node disk alarm would
#   reintroduce exactly what that change fixed. It fires when the node is
#   already evicting, which on w-1 means gate pods dying.
# - A DaemonSet reading `df` off a hostPath needs no cluster-wide RBAC,
#   but mounting the kubelet's filesystem into a pod is a LARGER
#   privilege than reading stats through the API server, and it replaces
#   one CronJob with a per-node workload.
#
# State plainly what this widens: `get nodes/proxy` reaches the kubelet's
# whole read surface (/pods, /runningpods, /metrics, /containerLogs), so
# the observer can now read pod logs cluster-wide. RBAC cannot scope a
# proxy grant by path. The narrower grant — talking to port 10250
# directly, where the kubelet's own check is `nodes/stats` and nothing
# else — was not taken because it needs a TLS trust decision and a
# per-node network path of its own, to save a read the API server already
# audits. Revisit if the observer ever needs a second kubelet endpoint.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: estate-observer
rules:
  - apiGroups: [""]
    resources: [nodes, nodes/proxy]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: estate-observer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: estate-observer
subjects:
  - kind: ServiceAccount
    name: estate-observer
    namespace: boss
---
# THE ONE OTHER THING THE OBSERVER MAY READ: gate runner Jobs, in the
# gate namespace only. A runner that dies with its node (cp-2 and w-1
# together, 2026-09-11 18:58Z, incident a398c4d3) never reports, and the
# conductor that reaps dead runs has no Kubernetes access by design —
# it reaps by CLOCK, three hours after opened_at. Kubernetes states the
# death the second it happens (`status.failed`), and this observer is
# the one actor with both `kubectl` and a signed write to the system of
# record, so it carries that one fact across. Namespaced, read-only,
# jobs only: it can see that a runner died, not touch it.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: estate-observer-gate-jobs
  namespace: boss-dev
rules:
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: estate-observer-gate-jobs
  namespace: boss-dev
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: estate-observer-gate-jobs
subjects:
  - kind: ServiceAccount
    name: estate-observer
    namespace: boss
---
# AND THE DEV PODS, for the same reason (backlog 5d1b64b3): an
# agent-run names the dev pod its builder runs on, and a pod that is
# gone or terminal cannot be executing it. Kubernetes states that the
# second it happens; the silence clock took four hours. Namespaced,
# read-only, pods only — the observer can see a host died, not touch
# one, and it reads no logs, exec or secrets.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: estate-observer-dev-pods
  namespace: boss-dev
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: estate-observer-dev-pods
  namespace: boss-dev
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: estate-observer-dev-pods
subjects:
  - kind: ServiceAccount
    name: estate-observer
    namespace: boss
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: boss-estate-observe
  namespace: boss
spec:
  # Daily, an hour after the backup, so a quiet window stays quiet.
  # Every 15 minutes, not daily: this series feeds the estate ALARM
  # (estate.alarm raises after 3 consecutive findings), and a daily
  # reading makes that a 3-DAY alarm — the 2026-08-27 outage lasted 25
  # minutes. 15min x 3 = a condition raises in ~30-45min (a5adfb99).
  schedule: "*/15 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          serviceAccountName: estate-observer
          containers:
            - name: observe
              image: alpine/k8s:1.33.3
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -e
                  # WHERE THE SCRATCH FILES GO — a parameter whose default is
                  # this pod's own path, so nothing the deployed observer does
                  # changes. In the pod WORK is /tmp and the pod owns every
                  # byte of it: no volume is mounted, so that is the
                  # container's own writable layer, and restartPolicy Never +
                  # concurrencyPolicy Forbid mean no two runs share it.
                  #
                  # It is a PARAMETER because this text has a second runner.
                  # infra/lint/a-cluster-node-reports-its-headroom.sh extracts
                  # this block and EXECUTES it — inline shell nothing executes
                  # is untested shell — on the long-lived dev pod, where a
                  # fixed path is shared with every other uid on the box.
                  # Measured 2026-09-11 (packet 5bf96e72): root ran the lint
                  # roster, then a second uid ran it and died on `Permission
                  # denied` writing a file root already owned — reported as the
                  # observer breaking its best-effort contract, which is not
                  # what had happened. The lint now sets BOSS_OBSERVE_WORK to
                  # its own mktemp -d; the pod sets nothing and gets /tmp.
                  WORK="${BOSS_OBSERVE_WORK:-/tmp}"
                  mkdir -p "$WORK"
                  # Transport-retry curl, INLINE. This pod runs the
                  # alpine/k8s image, which does NOT carry
                  # /usr/local/bin/boss-api-curl.sh (that script is baked
                  # only into the all-in-one boss image). Wiring the
                  # shared script in here (25e518c0) therefore broke the
                  # observer with exit 127 — no kubernetes-nodes
                  # observation landed, and the estate ALARM correctly
                  # raised on the silence. A container that cannot source
                  # the shared helper inlines its contract instead: re-send
                  # only curl exits 6 and 7 (DNS, refused — the request
                  # never left) under a 150s deadline (well under the
                  # 15-min schedule), so a deploy roll reads as a wait, not
                  # an Error pod. Any other exit may follow a request the
                  # server received, and this POSTs the observation and
                  # PUTs steps, so it is surfaced, never re-sent (backlog
                  # c51967b5: it re-sent 28/35/52/55/56 too until
                  # 2026-09-23). An HTTP answer is a real result and
                  # returns as curl wrote it. The exit list is
                  # infra/lib/curl-through-a-roll.sh's, pinned equal to it
                  # by a_chore_write_is_sent_once.rs.
                  api_curl() {
                    local deadline=150 start delay=5 rc out now left sleep_for
                    start=$(date +%s)
                    while :; do
                      rc=0; out=$(curl "$@") || rc=$?
                      case "$rc" in
                        0) printf '%s' "$out"; return 0 ;;
                        6|7) ;;
                        *) return "$rc" ;;
                      esac
                      now=$(date +%s); left=$((deadline - (now - start)))
                      [ "$left" -le 0 ] && { echo "api_curl: transport failure past ${deadline}s (curl $rc)" >&2; return "$rc"; }
                      sleep_for=$((delay < left ? delay : left))
                      echo "api_curl: transport error (curl $rc) — retry in ${sleep_for}s" >&2
                      sleep "$sleep_for"; delay=$((delay * 2))
                    done
                  }
                  # In-cluster credentials: the ServiceAccount token is
                  # mounted, so kubectl needs no kubeconfig.
                  kubectl get nodes -o json > "$WORK/nodes.json"
                  # FREE SPACE, per node, from the kubelet's own statfs
                  # (a520737f). Until this loop existed the observation
                  # carried capacity and nothing else, so
                  # estate_compare's disk floor — free below 16 GiB or
                  # below 35% of capacity — had no numerator and could
                  # never fire for cp-1, cp-2, cp-3 or w-1. w-1 is THE
                  # BUILD NODE: every gate's warm target lives on its
                  # nodefs and every gate Job prefers it by affinity, so
                  # the one machine whose disk stops the pipeline was the
                  # one machine nothing watched.
                  #
                  # WHICH FILESYSTEM. `.node.fs` of /stats/summary is the
                  # kubelet root filesystem — "nodefs" — which holds the
                  # image store, emptyDirs and the gate's warm target. It
                  # is the same filesystem the kubelet measures to publish
                  # status.capacity.ephemeral-storage, so the free figure
                  # below and the disk_gb further down are one volume's
                  # available and total, exactly as `df -k /` gives the
                  # host observer its pair. A cluster node's own `/` is a
                  # read-only Talos squashfs and is not what fills; a
                  # volume as seen from inside a pod is a third thing
                  # again, and reading one of those as a node-level
                  # figure is how this gap stayed hidden.
                  #
                  # BEST-EFFORT, AND LOUD ABOUT IT. The same POST carries
                  # the readings declared_not_observed, not_ready and the
                  # alarm's silence sweep all depend on, so a denied or
                  # unreachable kubelet must cost the free figure for one
                  # node and nothing else — never the observation. The
                  # node and the reason are printed; estate_compare turns
                  # the null into `disk_unmeasured` so going blind stays
                  # distinguishable from having plenty of room.
                  mkdir -p "$WORK/fs" && rm -f "$WORK"/fs/*.json
                  for n in $(jq -r '(.items // [])[] | .metadata.name' "$WORK/nodes.json"); do
                    if kubectl get --raw "/api/v1/nodes/$n/proxy/stats/summary" >"$WORK/fs/$n.raw" 2>"$WORK/fs/$n.err"; then
                      jq --arg id "$n" '{ id: $id, disk_free_gb:
                        (if (.node.fs.availableBytes | type) == "number"
                         then ((.node.fs.availableBytes + 536870912) / 1073741824 | floor)
                         else null end) }' "$WORK/fs/$n.raw" > "$WORK/fs/$n.json"
                    else
                      echo "no free-space reading for $n: $(cat "$WORK/fs/$n.err")"
                      jq -n --arg id "$n" '{ id: $id, disk_free_gb: null }' > "$WORK/fs/$n.json"
                    fi
                  done
                  if ls "$WORK"/fs/*.json >/dev/null 2>&1; then
                    jq -s 'map({ key: .id, value: .disk_free_gb }) | from_entries' \
                      "$WORK"/fs/*.json > "$WORK/free.json"
                  else
                    # No nodes listed at all. The door refuses an
                    # observation that saw nothing, and that refusal is
                    # the report we want — not a jq error on an unmatched
                    # glob three lines earlier.
                    echo '{}' > "$WORK/free.json"
                  fi
                  # THE DISPATCHER'S DEAD-LETTER COUNTERS (8834804a). A
                  # handler failure past its budget annotates the subject
                  # packet — except when there is no packet (six topics
                  # carry none) or when the annotation write is itself
                  # what failed, which is precisely the case where the
                  # jobs API is what broke. For those, the dispatcher
                  # counts on its OWN surface, /api/dispatcher/readyz
                  # (dead_letters, dead_letters_unrecorded,
                  # last_unrecorded_dead_letter_unix — a local read that
                  # owes nothing to the jobs API), and this observer is
                  # the one actor that can reach the dispatcher's
                  # in-cluster door AND sign a write to the record. The
                  # counters ride the same POST as the nodes; the next
                  # firing the record answers carries whatever was counted
                  # while it did not (CLAUDE.md §Diagnosis: a monitor
                  # needs a path to a reader that does not depend on what
                  # it watches). `estate.compare` turns a recent unrecorded
                  # count into a hard finding the alarm raises on.
                  #
                  # The door is boss-dispatcher-internal.yaml's Service,
                  # pinned to this default by
                  # infra/lint/a-dead-letter-is-read-from-outside-the-jobs-api.sh,
                  # which also RUNS this block under stubs.
                  #
                  # BEST-EFFORT, AND LOUD ABOUT IT — the same contract as
                  # the kubelet read above. A plain curl with a short
                  # deadline, not api_curl: the dispatcher shares the
                  # boss pod with the jobs API, so a roll takes both away
                  # together and the POST below already waits it out; a
                  # reading taken mid-roll honestly says the dispatcher
                  # was unread at that moment. A refused or failed read
                  # costs `dispatcher: null` plus `dispatcher_unread`
                  # naming why, never the observation. And a 200 whose
                  # body lacks the counters is UNREAD, never zero: the
                  # wrong surface answering confidently is the class
                  # CLAUDE.md §Doors names, refused at the instrument.
                  DISPATCHER_API="${DISPATCHER_API:-http://boss-dispatcher-internal.boss.svc.cluster.local:7950}"
                  dispatcher=null
                  dispatcher_unread=""
                  if curl -sSf -m 10 "$DISPATCHER_API/api/dispatcher/readyz" >"$WORK/readyz.json" 2>"$WORK/readyz.err"; then
                    counters=$(jq -c 'select(type == "object")
                      | select((.dead_letters_unrecorded | type) == "number")
                      | {ready, dead_letters, dead_letters_unrecorded,
                         last_dead_letter_unix, last_unrecorded_dead_letter_unix}' \
                      "$WORK/readyz.json" 2>/dev/null | head -n 1)
                    if [ -n "$counters" ]; then
                      dispatcher=$counters
                      echo "dispatcher: $(printf '%s' "$dispatcher" | jq -r '"dead_letters=\(.dead_letters) dead_letters_unrecorded=\(.dead_letters_unrecorded) last_unrecorded_dead_letter_unix=\(.last_unrecorded_dead_letter_unix)"')"
                    else
                      dispatcher_unread="$DISPATCHER_API/api/dispatcher/readyz answered without numeric dead-letter counters: $(head -c 200 "$WORK/readyz.json")"
                    fi
                  else
                    dispatcher_unread="$DISPATCHER_API/api/dispatcher/readyz unreachable: $(cat "$WORK/readyz.err")"
                  fi
                  [ -z "$dispatcher_unread" ] || echo "no dispatcher reading: $dispatcher_unread"
                  # jq, not python: directive 26d61c97 retired python
                  # from the estate's shell, and infra/estate/observe-host.sh
                  # (the host-scope sibling) is the shape to match.
                  # Kubernetes reports Ki/Mi; the registry declares GiB.
                  # Capacity rounds to the NEAREST GiB, ties half-UP
                  # (add half a GiB, then floor) — THE one stated
                  # rounding rule, shared with observe-host.sh. The
                  # python this replaces used round-half-even, so an
                  # exact .5-GiB tie now rounds up instead of to the
                  # nearest even integer.
                  jq --slurpfile free "$WORK/free.json" \
                     --argjson dispatcher "$dispatcher" --arg dispatcher_unread "$dispatcher_unread" '
                    def gib:
                      if . == null then null
                      elif endswith("Ki") then (((rtrimstr("Ki") | tonumber) + 524288) / 1048576 | floor)
                      elif endswith("Mi") then (((rtrimstr("Mi") | tonumber) + 512) / 1024 | floor)
                      else null end;
                    ($free[0] // {}) as $fs |
                    (if $dispatcher_unread == "" then {} else { dispatcher_unread: $dispatcher_unread } end) +
                    {
                      observed_at: (now | todate),
                      observer: "boss-estate-observe",
                      scope: "kubernetes-nodes",
                      dispatcher: $dispatcher,
                      nodes: ([ (.items // [])[]
                        | (.metadata // {}) as $md
                        | (.status // {}) as $st
                        | ($md.labels // {}) as $labels
                        | {
                            id: $md.name,
                            address: ([($st.addresses // [])[] | select(.type == "InternalIP") | .address] | .[0]),
                            cpu: (($st.capacity.cpu // "0" | tonumber) | if . == 0 then null else . end),
                            memory_gb: ($st.capacity.memory | gib),
                            disk_gb: ($st.capacity["ephemeral-storage"] | gib),
                            disk_free_gb: ($fs[$md.name] // null),
                            purpose: $labels["boss.dev/purpose"],
                            control_plane: ($labels | has("node-role.kubernetes.io/control-plane")),
                            ready: (([($st.conditions // [])[] | select(.type == "Ready") | .status] | (.[0] // "Unknown")) == "True")
                          }
                      ] | sort_by(.id // ""))
                    }' "$WORK/nodes.json" > "$WORK/observation.json"
                  echo "observed $(jq -r '.nodes | length' "$WORK/observation.json") node(s)"
                  # Per node, the two numbers the floor is computed from,
                  # so whoever is next in front of a disk failure can
                  # read the reading instead of re-deriving it.
                  jq -r '.nodes[] | "  \(.id): kubelet nodefs disk=\(.disk_gb)G free=\(if .disk_free_gb == null then "UNREAD" else "\(.disk_free_gb)G" end)"' \
                    "$WORK/observation.json"
                  # The door refuses an observation that saw nothing, so a
                  # denied or broken probe fails loudly here rather than
                  # recording an empty estate.
                  # `set -e` + a bare command substitution swallowed the
                  # first real failure without a word: curl exited 6 on a
                  # dead DNS name and the script died before its own
                  # report line (3ddd8333). Failing is fine; failing
                  # SILENTLY in a script that promises to fail loudly is
                  # not — so curl's own exit is caught and spoken, with
                  # the real exit code and the real target in the
                  # message. The response body rides the same capture as
                  # the status code (body, newline, code) instead of a
                  # tempfile.
                  # api_curl (inlined above) re-sends a refused connect
                  # for up to 150s (25e518c0): a deploy roll takes the
                  # API away for ~45s and must read as a wait, not an
                  # Error pod. The capture-and-speak contract below is
                  # unchanged — api_curl owns only connection-level
                  # exits; stdout still carries body+code exactly as
                  # curl wrote them.
                  resp=$(api_curl -s -w '\n%{http_code}' -X POST \
                    -H "content-type: application/json" \
                    -H "x-boss-user: {\"id\":\"automation:estate-observer\",\"role\":\"platform-admin\",\"access_tier\":\"operator\"}" \
                    --data-binary @"$WORK/observation.json" \
                    "$JOBS_API/api/estate/observation") \
                    || { rc=$?; echo "curl failed (exit $rc, target $JOBS_API/api/estate/observation)"; exit 1; }
                  code=$(printf '%s\n' "$resp" | tail -n 1)
                  body=$(printf '%s\n' "$resp" | sed '$d')
                  echo "jobs api: $code $body"
                  test "$code" = "202"
                  # A DEAD RUNNER IS SETTLED BY WHOEVER CAN SEE IT DIE.
                  # A gate runner that dies with its node never reports
                  # its verdict (cp-2 and w-1 together, 2026-09-11 18:58Z,
                  # incident a398c4d3): Kubernetes marks the Job Failed
                  # that second, but the only reader of a gate Job was
                  # the Job, and the conductor that reaps dead runs has no
                  # Kubernetes access by design, so it reaps by CLOCK —
                  # three hours after opened_at — while the yard draws
                  # the corpse as a healthy run and a re-gate shows two
                  # rows for one branch. This observer has kubectl AND a
                  # signed write, so it carries the one fact across: for
                  # every runner Job with status.failed > 0 whose packet
                  # is still open with no verdict, record `lost` — the
                  # verdict the gate-run protocol already has for "the
                  # environment died" — naming the Job and its Failed
                  # condition, because a verdict must name what failed.
                  # A Job that failed AFTER reporting (a red gate's runner
                  # exits non-zero) already carries its verdict and is
                  # left alone: the report is the truth, the exit code is
                  # not a second verdict. Namespaced to the gate namespace
                  # and scoped to app=gate-runner, so no other Job's death
                  # can ever read as a lost gate.
                  #
                  # BEST-EFFORT, after the observation has landed: the
                  # node observation is this pod's first duty, and a
                  # refused or failed read here costs one spoken line,
                  # never the run — the same contract as a lost kubelet
                  # read above.
                  #
                  # A CORPSE DOES NOT SETTLE A PACKET SOMEONE ELSE IS
                  # STILL GATING. `boss gate` REUSES an open gate-run
                  # packet, so one packet can carry a dead Job and a live
                  # one at the same time, and the dead half says nothing
                  # about the run still going. Measured 2026-09-22
                  # (backlog 53b9a103): packet e6845e06 was settled
                  # `lost` here at 15:45:02 from Job
                  # gate-feat-the-chrome-bar-b7n6j, failed at 15:33:29,
                  # while gate-feat-the-chrome-bar-xkxgl was eleven
                  # minutes into a run on the same packet; a minute later
                  # that run's 93-check GREEN receipt was refused HTTP 409
                  # by a step this settle had completed, and a third gate
                  # was spent re-proving the same sha. Both Jobs are in
                  # the ONE read above, so the live sibling is knowable
                  # at the moment of the decision: a packet any
                  # unfinished gate Job still carries is skipped, out
                  # loud, and left to that run's own verdict. The column
                  # reads `-` rather than empty because tab is an IFS
                  # WHITESPACE character, so `read` collapses two adjacent
                  # tabs into one and every field after an empty one
                  # shifts left (measured here: the dead runner's message
                  # arrived as the live sibling's name).
                  GATE_NS="${BOSS_GATE_NAMESPACE:-boss-dev}"
                  if kubectl get jobs -n "$GATE_NS" -l app=gate-runner -o json >"$WORK/gate-jobs.json" 2>"$WORK/gate-jobs.err"; then
                    jq -r '(.items // []) as $all
                      | $all[]
                      | select((.status.failed // 0) > 0)
                      | ((.status.conditions // []) | map(select(.type == "Failed")) | .[0] // {}) as $c
                      | (.metadata.labels["boss.dev/packet"] // "") as $packet
                      | [ .metadata.name,
                          $packet,
                          ($c.reason // "unknown reason"),
                          ($c.lastTransitionTime // "unknown time"),
                          ([ $all[]
                             | select((.status.failed // 0) == 0 and (.status.succeeded // 0) == 0)
                             | select((.metadata.labels["boss.dev/packet"] // "") == $packet)
                             | .metadata.name ] | .[0] // "-"),
                          ($c.message // "") ]
                      | @tsv' "$WORK/gate-jobs.json" >"$WORK/dead-gates.tsv"
                    while IFS="$(printf '\t')" read -r job packet reason at live message; do
                      [ -n "$packet" ] || continue
                      if [ "$live" != "-" ]; then
                        echo "dead runner $job: packet $packet is still being gated by $live — not settling, that run reports its own verdict (53b9a103)"
                        continue
                      fi
                      if ! api_curl -sf -H "x-boss-user: {\"id\":\"automation:estate-observer\",\"role\":\"platform-admin\",\"access_tier\":\"operator\"}" \
                          "$JOBS_API/api/jobs/$packet" >"$WORK/packet.json" 2>/dev/null; then
                        echo "dead runner $job: packet $packet could not be read — left for the clock reaper"
                        continue
                      fi
                      step=$(jq -r 'select(.status == "open")
                                    | (.steps // [])[]
                                    | select(.kind == "gate-verdict" and .status != "completed")
                                    | .id' "$WORK/packet.json" | head -n 1)
                      [ -n "$step" ] || continue
                      jq -n --arg job "$job" --arg reason "$reason" --arg at "$at" --arg message "$message" '{
                        verdict: "lost",
                        receipt: ("NO VERDICT WAS PRODUCED. Runner Job " + $job + " is Failed in Kubernetes (" + $reason + " at " + $at + (if $message == "" then "" else ": " + $message end) + "), so the checks never finished and this run says nothing about the branch. Settled as LOST by the cluster observer from the Job status; an infrastructure death is not a consist failure. Re-gate for a real verdict.")
                      }' >"$WORK/settle.json"
                      # TWO WRITES: THE KEYS THROUGH THE MERGE DOOR, THEN
                      # THE STATUS ALONE (backlog e39a9d2a, 2026-09-24).
                      # This was one PUT of {status, metadata: {verdict,
                      # receipt}} built with no read. The step PUT REPLACES
                      # metadata wholesale and the registry materializes
                      # keys onto every step at admission, so each settle
                      # shed them - the same defect the gate-runner and
                      # boss gate's refusals had on this same step. The
                      # merge goes first because verdict is required at
                      # done and the flip is where that is judged; a merge
                      # that did not answer 2xx is not followed by a flip
                      # (it would be refused the same way), and the next
                      # pass finds the step still open and tries again.
                      scode=$(api_curl -s -o /dev/null -w '%{http_code}' -X PATCH \
                        -H "content-type: application/json" \
                        -H "x-boss-user: {\"id\":\"automation:estate-observer\",\"role\":\"platform-admin\",\"access_tier\":\"operator\"}" \
                        --data-binary @"$WORK/settle.json" \
                        "$JOBS_API/api/jobs/$packet/steps/$step/metadata") || scode="curl $?"
                      case "$scode" in
                        2??)
                          scode=$(api_curl -s -o /dev/null -w '%{http_code}' -X PUT \
                            -H "content-type: application/json" \
                            -H "x-boss-user: {\"id\":\"automation:estate-observer\",\"role\":\"platform-admin\",\"access_tier\":\"operator\"}" \
                            --data-binary '{"status":"completed"}' \
                            "$JOBS_API/api/jobs/$packet/steps/$step") || scode="curl $?"
                          echo "dead runner $job ($reason at $at): packet $packet settled lost -> $scode" ;;
                        *)
                          echo "dead runner $job ($reason at $at): packet $packet NOT settled - the verdict merge answered $scode; the next pass tries again" ;;
                      esac
                    done <"$WORK/dead-gates.tsv"
                  else
                    echo "gate jobs unread — no dead runner can be settled this pass: $(cat "$WORK/gate-jobs.err")"
                  fi
                  # A DEAD HOST ENDS ITS RUNS (backlog 5d1b64b3). An
                  # agent-run's builder is a process on the dev pod its
                  # run names as `host` — `boss dispatch` writes it, and
                  # the Agent hook re-states it when a printed prompt is
                  # launched — so when that pod is gone the builder
                  # cannot be executing. The only reader of that fact was
                  # the four-hour silence clock
                  # (agent-run-dies-when-building-is-silent), and it is
                  # tuned for a builder that dies MID-run with its pod
                  # still up. Measured 2026-09-23: two dev pod rolls at
                  # 18:30Z and 18:52Z killed eleven runs, and all eleven
                  # still read `building` at 19:30Z, holding eleven of the
                  # twelve run slots the claim door enforces, so dispatch
                  # was starved for up to four hours by a fact Kubernetes
                  # held the second it happened. The dispatcher cannot
                  # read it — handlers own no private view and its
                  # ServiceAccount reads two named Secrets and nothing
                  # else — and this observer has kubectl AND a signed
                  # write, so it carries the fact across, as it does for
                  # a dead gate runner above.
                  #
                  # WHAT DEAD MEANS, read from the pod, not assumed:
                  #   - the pod is phase Failed or Succeeded. An EVICTED
                  #     pod stays listed for days (0/3,
                  #     ContainerStatusUnknown) and a terminal pod's
                  #     containers never run again, so "the object exists"
                  #     is NOT "the host is alive" — measured on
                  #     boss-dev-bc5b956bf-wvsrg, Failed/Evicted and still
                  #     listed while its four runs sat at `building`;
                  #   - or the pod is absent AND its name is one this
                  #     namespace's Deployments generate
                  #     (<deployment>-<pod-template-hash>-<suffix>, the
                  #     deployment read off a live pod's labels). A host
                  #     that is not such a name — a workstation — is never
                  #     judged here: absence from THIS namespace says
                  #     nothing about a machine it never held.
                  # A pod that is Running, Pending or Terminating is alive
                  # for this purpose; the next pass sees it gone.
                  #
                  # A GATE STILL OWNS ITS ENDING. The runner Job runs in
                  # the cluster, not on the dev pod, so a builder killed
                  # after launching its gate leaves work that is still
                  # going: an open gate-run naming the run, or a GREEN one
                  # (agent-run-lands-on-gate-green lands it), is left to
                  # that verdict and said out loud. A red gate with no
                  # builder left to repair it is an ended run.
                  #
                  # WHAT IT WRITES: `building` completed with
                  # `result = died` — the run's own terminal, the same
                  # fact the clock writes, four hours earlier — over the
                  # step's own metadata, plus a `host_gone` object naming
                  # the host, what the observer saw, and when. The reclaim
                  # rule (an-abandoned-step-is-reclaimed-when-its-run-died)
                  # then waits its own two hours before freeing the step,
                  # so the death is readable in the record before anything
                  # moves. BEST-EFFORT, after the observation, like every
                  # duty below it: a refused read costs one line.
                  DEV_NS="${BOSS_DEV_NAMESPACE:-boss-dev}"
                  OBSERVER_USER='{"id":"automation:estate-observer","role":"platform-admin","access_tier":"operator"}'
                  if ! kubectl get pods -n "$DEV_NS" -o json >"$WORK/dev-pods.json" 2>"$WORK/dev-pods.err"; then
                    echo "dev pods unread — no run can be ended by its host this pass: $(cat "$WORK/dev-pods.err")"
                  elif ! api_curl -sf -H "x-boss-user: $OBSERVER_USER" \
                      "$JOBS_API/api/jobs?kind=agent-run&status=open&limit=200" >"$WORK/runs.json" 2>/dev/null \
                      || [ "$(jq -r '(.data | type) + " " + (.total | type)' "$WORK/runs.json" 2>/dev/null)" != "array number" ]; then
                    echo "open agent-runs unread — no run can be ended by its host this pass"
                  else
                    jq -r '"open agent-runs: read \(.data | length) of \(.total)" + (if (.data | length) < .total then " — judging the rows read only" else "" end)' "$WORK/runs.json"
                    jq -r --slurpfile pods "$WORK/dev-pods.json" --arg ns "$DEV_NS" '
                      ($pods[0].items // []) as $items
                      | ($items | map({ key: .metadata.name,
                                        value: ((.status.phase // "Unknown") + (if .status.reason then "/" + .status.reason else "" end)) })
                                | from_entries) as $pod
                      | ([ $items[]
                           | (.metadata.labels["pod-template-hash"] // "") as $h
                           | select($h != "")
                           | .metadata.name
                           | select(test("-" + $h + "-[a-z0-9]+$"))
                           | sub("-" + $h + "-[a-z0-9]+$"; "") ] | unique) as $deployments
                      | .data[]
                      | .id as $run
                      | (.metadata.host // "") as $host
                      | ([ (.steps // [])[] | select(.spec_slug == "building" and .status != "completed" and .status != "skipped") ] | .[0]) as $b
                      | select($b != null and $host != "")
                      | ($pod[$host]) as $seen
                      | if $seen != null then
                          if ($seen | test("^(Failed|Succeeded)")) then [$run, $b.id, $host, "pod \($host) is \($seen) in \($ns)"] else empty end
                        elif any($deployments[]; . as $d | ($host | startswith($d + "-")) and ($host | ltrimstr($d + "-") | test("^[a-z0-9]+-[a-z0-9]+$"))) then
                          [$run, $b.id, $host, "pod \($host) no longer exists in \($ns)"]
                        else empty end
                      | @tsv' "$WORK/runs.json" >"$WORK/dead-hosts.tsv" \
                      || { echo "dev pods or open agent-runs did not parse — no run can be ended by its host this pass"; : >"$WORK/dead-hosts.tsv"; }
                    while IFS="$(printf '\t')" read -r run step host seen; do
                      [ -n "$run" ] || continue
                      # The shape is asked of jq's OUTPUT, never `jq -e`:
                      # jq-1.6 exits 0 on an input carrying no document
                      # (backlog d96e38ab), and an empty answer here read
                      # as "no gate owns this run" would end a live one.
                      if ! api_curl -sf -H "x-boss-user: $OBSERVER_USER" \
                          "$JOBS_API/api/jobs?kind=gate-run&limit=50&metadata=%7B%22agent_run%22%3A%22$run%22%7D" >"$WORK/run-gates.json" 2>/dev/null \
                          || [ "$(jq -r '.data | type' "$WORK/run-gates.json" 2>/dev/null)" != array ]; then
                        echo "run $run: $seen, but its gate-runs could not be read — left for the clock"
                        continue
                      fi
                      gating=$(jq -r '[ .data[]
                                        | select(.status == "open"
                                                 or any((.steps // [])[]; .kind == "gate-verdict" and (.metadata.verdict // "") == "green"))
                                        | .id ] | .[0] // empty' "$WORK/run-gates.json") || gating="unparsed"
                      if [ -n "$gating" ]; then
                        echo "run $run: $seen, but gate-run $gating is open or green — that verdict ends the run, not this pass"
                        continue
                      fi
                      jq --arg run "$run" --arg seen "$seen" --arg host "$host" '
                        ([ .data[] | select(.id == $run) | (.steps // [])[] | select(.spec_slug == "building") ] | .[0].metadata // {}) as $md
                        | { status: "completed",
                            metadata: ($md + { result: "died",
                                               host_gone: { host: $host, seen: $seen, at: (now | todate),
                                                            observer: "boss-estate-observe" } }) }' \
                        "$WORK/runs.json" >"$WORK/end-run.json" \
                        || { echo "run $run: $seen, but its step body could not be built — left for the clock"; continue; }
                      scode=$(api_curl -s -o /dev/null -w '%{http_code}' -X PUT \
                        -H "content-type: application/json" \
                        -H "x-boss-user: $OBSERVER_USER" \
                        --data-binary @"$WORK/end-run.json" \
                        "$JOBS_API/api/jobs/$run/steps/$step") || scode="curl $?"
                      echo "run $run: $seen — building ended died -> $scode"
                    done <"$WORK/dead-hosts.tsv"
                  fi
              env:
                - name: JOBS_API
                  # boss-jobs-internal is the in-cluster door; ns boss has
                  # no Service named `boss` — the original value resolved
                  # to nothing and no observation could ever land.
                  value: "http://boss-jobs-internal.boss.svc.cluster.local:7900"
