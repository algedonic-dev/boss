# Audit-log integrity check — in-cluster chore (migration packet 68744407).
#
# Mirrors the boss-gcp timer's cadence and contract; the rule it obeys
# is the one the search/views chores established: a chore runs against
# the database of the instance whose packet it completes. Config files
# come from boss-generate-configs — the same generator the pod's own
# services use at start, pointed at the same secret.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: boss-audit-integrity
  namespace: boss
  labels:
    boss-chore: "true"
spec:
  schedule: "30 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        spec:
          # The uid this workload runs as, DECLARED rather than inherited from
          # the image (backlog 5234cda4; the reasoning and the exemption list
          # are in infra/lint/a-workload-declares-the-user-it-runs-as.sh, and
          # the README section "Pod security" below it).
          #
          # MEASURED, not inferred from the image name: `id` inside the live
          # boss-image pod answers uid=1500(boss) gid=1500(boss), the image's
          # final directive is `USER boss` over `useradd --uid 1500`
          # (infra/oss-quickstart/Dockerfile, which cluster-deploy-runner.sh
          # builds this tag from), and no pod in this namespace overrides
          # runAsUser. So this states what ALREADY happens and changes no
          # behaviour — which is the whole point: the declaration is what
          # survives a cluster-wide restricted default, the behaviour was
          # never the gap.
          securityContext:
            runAsNonRoot: true
            runAsUser: 1500
            runAsGroup: 1500
            seccompProfile: {type: RuntimeDefault}
          restartPolicy: Never
          volumes:
            # The estate machine token, Secret boss-machine-token, whole —
            # the broker writes it (design 6805c764 car 4). Optional: until
            # its first mint the directory is empty and the chore sends no
            # token, which every gate in `report` admits. 0444, because this
            # pod sets no fsGroup and runs one uid; the file is the token's
            # only copy in the container, never an env var.
            - name: machine-token
              secret: {secretName: boss-machine-token, optional: true, defaultMode: 0444}
          containers:
            - name: chore
              image: 10.20.0.15:3000/david/boss:latest
              # Baseline/restricted floor for a chore that needs neither: it shells
              # out to boss binaries and curl, nothing setuid, no capability.
              # readOnlyRootFilesystem is deliberately NOT set — boss-generate-configs
              # writes files, so that one would change behaviour and belongs to a car
              # that measured it.
              securityContext:
                allowPrivilegeEscalation: false
                capabilities: {drop: ["ALL"]}
              command: ["/bin/bash", "-c"]
              args:
                - |
                  set -euo pipefail
                  # The binary reads DATABASE_URL directly — no config file needed.
                  /usr/local/bin/boss-chore.sh maintenance-audit-integrity "Audit-log integrity check" -- /usr/local/bin/boss-audit-integrity-check
              # The estate machine token (the pod's machine-token volume): its
              # wrap and step stamp `current` on the packet writes, only to
              # the hosts BOSS_MACHINE_TOKEN_HOSTS names (design 6805c764 car 4).
              volumeMounts:
                - {name: machine-token, mountPath: /etc/boss/machine-token, readOnly: true}
              env:
                - name: RUST_LOG
                  value: info
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: boss-secrets
                      key: database-url
                - name: BOSS_JOBS_URL
                  value: http://boss-jobs-internal.boss.svc.cluster.local:7900
                - name: BOSS_MACHINE_TOKEN_HOSTS
                  value: ".boss.svc.cluster.local"
