# BOSS — single-pod topology on the cluster.
#
# Translation of infra/oss-quickstart/docker-compose.yml. Deliberately
# single-pod for the first deployment: every boss-* binary runs under
# boss-launch on loopback inside one container, so only the gateway's
# :4443 is reachable. That satisfies BOSS's trust model structurally
# (SECURITY.md §Deployment trust model — the gateway must be the only
# thing that can reach backend ports) without needing NetworkPolicy.
#
# The compose file runs boss-init as a separate one-shot sharing a
# volume with the services container. Here it is an initContainer in the
# same pod, which is the natural Kubernetes shape: same lifecycle, same
# emptyDir for the credentials file, and it re-runs idempotently (the
# marker in the Postgres volume makes a seeded DB skip the 5-minute
# brewery load).
#
# Pins: LB IP 10.20.0.30 (boss-gateway Service, Cilium LB-IPAM) — the
# plain-HTTP upstream that Caddy on boss-gcp proxies for the human
# door, https://playground.algedonic.dev.
#
# The image tag committed below is a placeholder from the day this
# file entered the tree: cluster-deploy-runner.sh applies this file
# FIRST, then rolls deploy/boss (and the init container) to the tag it
# just built from forge main, so the fresh tag always wins.
---
apiVersion: v1
kind: Namespace
metadata:
  name: boss
  labels:
    pod-security.kubernetes.io/enforce: baseline
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: boss
spec:
  clusterIP: None
  selector: {app: postgres}
  ports: [{port: 5432, name: pg}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: boss
spec:
  serviceName: postgres
  replicas: 1
  selector: {matchLabels: {app: postgres}}
  template:
    metadata:
      labels: {app: postgres}
    spec:
      # The system of record does not share a machine with builds.
      # Neither StatefulSet had any scheduling constraint, so both went
      # wherever capacity happened to be: postgres ran on w-1 (which
      # resets under sustained build load - NVMe thermal, 2026-08-25),
      # then w-2, and reached a control plane only by being moved by
      # hand. The split lived in the design docs and nowhere the
      # scheduler could read it. Control planes are untainted here, so
      # a plain nodeSelector is enough.
      nodeSelector:
        node-role.kubernetes.io/control-plane: ""
      imagePullSecrets:
        - {name: forgejo-registry}
      containers:
        - name: postgres
          # From the forge registry, not docker.io. The LAN resolver
          # flakes (2026-09-07), and #252/#256 already moved CI's base
          # pulls onto the forge for that reason (#258 put postgres:16
          # on the mirror list). A database that cannot re-pull its
          # image during a flake cannot restart. The forge is already
          # a dependency of the boss image below, so this removes a
          # dependency rather than adding one. Needs the
          # imagePullSecrets above, the same one deploy/boss uses — a
          # private image without it is ImagePullBackOff, which is a
          # dead database.
          image: 10.20.0.15:3000/david/postgres:16
          # ~24 API services each hold an sqlx pool (default max 10), which
          # blows past PG's default max_connections=100 and makes services
          # fail-closed mid-startup. 400 matches infra/deploy-services.sh.
          args: ["postgres", "-c", "max_connections=400"]
          env:
            - {name: POSTGRES_USER, value: boss}
            - {name: POSTGRES_DB, value: boss}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: boss-secrets, key: postgres-password}}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
          ports: [{containerPort: 5432}]
          readinessProbe:
            exec: {command: ["pg_isready", "-U", "boss"]}
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            requests: {cpu: "500m", memory: 1Gi}
          volumeMounts:
            - {name: pgdata, mountPath: /var/lib/postgresql/data}
  volumeClaimTemplates:
    - metadata: {name: pgdata}
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: longhorn
        resources: {requests: {storage: 20Gi}}
---
apiVersion: v1
kind: Service
metadata:
  name: nats
  namespace: boss
spec:
  selector: {app: nats}
  ports:
    - {port: 4222, name: client}
    - {port: 8222, name: monitor}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: nats
  namespace: boss
spec:
  serviceName: nats
  replicas: 1
  selector: {matchLabels: {app: nats}}
  template:
    metadata:
      labels: {app: nats}
    spec:
      # The system of record does not share a machine with builds.
      # Neither StatefulSet had any scheduling constraint, so both went
      # wherever capacity happened to be: postgres ran on w-1 (which
      # resets under sustained build load - NVMe thermal, 2026-08-25),
      # then w-2, and reached a control plane only by being moved by
      # hand. The split lived in the design docs and nowhere the
      # scheduler could read it. Control planes are untainted here, so
      # a plain nodeSelector is enough.
      nodeSelector:
        node-role.kubernetes.io/control-plane: ""
      containers:
        - name: nats
          image: nats:2.10-alpine
          # -js: JetStream, required for audit-log replay.
          args: ["-js", "-sd", "/data", "-m", "8222"]
          ports:
            - {containerPort: 4222}
            - {containerPort: 8222}
          readinessProbe:
            httpGet: {path: /healthz, port: 8222}
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests: {cpu: "100m", memory: 256Mi}
          volumeMounts:
            - {name: jsdata, mountPath: /data}
  volumeClaimTemplates:
    - metadata: {name: jsdata}
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: longhorn
        resources: {requests: {storage: 10Gi}}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: boss-auth
  namespace: boss
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: boss
  namespace: boss
spec:
  replicas: 1
  # Single pod owning one Postgres; never run two.
  #
  # `Recreate` means the old pod is TERMINATED before the new one is
  # created, so every deploy is a full outage of the system of record —
  # jobs door, gateway, dispatcher and docs all go dark for the length
  # of a pod roll (observed 2026-08-13: ~2m, most of it boss-init
  # running migrations, and it was misdiagnosed as an incident because
  # nothing announced it).
  #
  # The obvious fix is wrong and would be worse. `RollingUpdate` with
  # maxSurge=1/maxUnavailable=0 DEADLOCKS this Deployment: `boss-auth`
  # below is a ReadWriteOnce Longhorn PVC, so the surge pod blocks in
  # ContainerCreating on multi-attach while maxUnavailable=0 forbids
  # retiring the pod holding the volume. A stuck rollout beats a
  # two-minute outage only in the sense that it lasts longer.
  #
  # Two things gated zero-downtime here; one is answered and the other
  # is half-answered, so `Recreate` still stands:
  #   1. `boss-auth` (RWO) held TWO files. session.key — the HMAC
  #      signing key for session cookies — has moved to the read-only
  #      `boss-session-key` Secret mounted below: it is read, never
  #      written (load_or_create_session_key only generates when the
  #      file is ABSENT), so a Secret projecting identical bytes into
  #      every pod is a perfect fit AND is what makes a rolling pair
  #      sign cookies the same (the cross-pod mass-signout, 2026-08-26).
  #      credentials.toml STILL lives on this RWO PVC — it is written at
  #      runtime by the break-glass path — so the volume, its multi-
  #      attach block, and therefore this `Recreate` all remain until
  #      the WebAuthn RP retires credentials.toml (packet e9703d8f).
  #   2. ANSWERED: infra/postgres/migrate.sh now takes a pg_advisory
  #      lock (MIG_LOCK_KEY), so two pods starting together no longer
  #      race the schema converge.
  # RollingUpdate cannot flip until the PVC is gone (credentials.toml),
  # so `Recreate` is still correct here; the window is shortened rather
  # than removed (see readinessProbe below). DO NOT change `strategy`.
  #
  # Not a gate, though it is the usual objection: boss-dispatcher binds
  # durable PULL consumers (crates/core/boss-nats/src/durable.rs), and
  # pull consumers sharing a durable name COMPETE rather than duplicate,
  # so a brief two-pod overlap would not double-fire dispatcher rules.
  strategy: {type: Recreate}
  selector: {matchLabels: {app: boss}}
  template:
    metadata:
      labels: {app: boss}
    spec:
      # The SoR app rides its data: control-plane nodes only, never a
      # flaky worker. Unpinned, this Deployment landed on w-1 and was
      # evicted when w-1 shed pods — :7900 went dark for minutes on a
      # Multi-Attach stall (90932d98). Its StatefulSets were already
      # pinned; the app was not.
      nodeSelector:
        node-role.kubernetes.io/control-plane: ""
      # The image runs as uid/gid 1500 (boss), but a freshly provisioned
      # Longhorn volume mounts root:root 0755 — so the credential store
      # was unwritable and boss-auth failed on the temp file. fsGroup
      # makes the kubelet chgrp the volume and set setgid on it.
      securityContext:
        fsGroup: 1500
      imagePullSecrets:
        - {name: forgejo-registry}
      volumes:
        # The break-glass credential store, credentials.toml. NOT
        # emptyDir: boss-init skips provisioning once the schema exists
        # (ours came from the GCP migration), so credentials.toml is
        # written at most once — on an emptyDir it is empty on every
        # restart, which makes the documented break-glass path a fiction.
        # idm-kanidm.md keeps local auth precisely so an IdP outage
        # cannot lock operators out; that requires it to persist.
        #
        # This volume USED to also hold session.key; that moved to the
        # read-only `boss-session-key` Secret below. credentials.toml is
        # the only file left here, and the last thing keeping this RWO
        # PVC (and `strategy: Recreate`) alive until WebAuthn retires it
        # (packet e9703d8f).
        - name: boss-auth
          persistentVolumeClaim:
            claimName: boss-auth
        # The session-cookie HMAC key, read-only, projected from a
        # Secret so every pod reads the SAME bytes — the fix for the
        # cross-pod mass-signout (2026-08-26) and step 1 toward a
        # RollingUpdate. NOT created here: David mints `boss-session-key`
        # at cutover from the CURRENT key on the boss-auth PVC (the exact
        # hex bytes of /var/lib/boss/auth/session.key) — a fresh random
        # key would invalidate every live session on the roll. No
        # `optional`: a missing Secret must wedge the pod in
        # ContainerCreating (loud, recoverable), NOT fall through to
        # load_or_create_session_key minting a new key (silent signout).
        # defaultMode 0400 + the pod fsGroup (1500) lands the file
        # root:1500; the kubelet OR's group-read onto a read-only secret
        # volume, so the boss uid can read it (matches boss-conductor).
        - name: boss-session-key
          secret:
            secretName: boss-session-key
            defaultMode: 0400
            items:
              - {key: session.key, path: session.key}
        # StepPlugin JS bundles (step-plugins.yaml). The `step_plugins`
        # rows were seeded but the bundles they point at were never
        # deployed, so every plugin-backed step rendered "No plugin
        # registered" — including the eleven ready `review-design` steps
        # gating the design-doc review workflow. Read-only: the gateway
        # serves these, nothing writes them.
        - name: step-plugins
          configMap:
            name: step-plugins
        # Break-glass PUBLIC credential records (boss-break-glass-
        # credentials.yaml — the manifest header is the ceremony doc).
        # `optional` so a deployment that has not adopted the ceremony
        # still boots; the gateway answers 409 "no credential enrolled"
        # rather than failing to mount.
        - name: break-glass-credentials
          configMap:
            name: boss-break-glass-credentials
            optional: true
      initContainers:
        # Converges the schema (infra/postgres/migrate.sh, manifest order)
        # on EVERY start — an existing database gets the migrations it is
        # missing, which is what stops the tree and the cluster drifting
        # apart. A migration error fails this container and the rollout.
        # The once-per-database steps (bootstrap-admin credential, sim
        # clock prime) and the expensive brewery seed still run only when
        # the database is empty.
        - name: boss-init
          image: 10.20.0.15:3000/david/boss:b2814ef
          command: ["/usr/bin/tini", "--", "/usr/local/bin/boss-init"]
          env:
            - {name: PGHOST, value: postgres}
            - {name: PGUSER, value: boss}
            - {name: PGDATABASE, value: boss}
            - name: PGPASSWORD
              valueFrom: {secretKeyRef: {name: boss-secrets, key: postgres-password}}
            - name: DATABASE_URL
              valueFrom: {secretKeyRef: {name: boss-secrets, key: database-url}}
            - name: BOSS_POSTGRES_URL
              valueFrom: {secretKeyRef: {name: boss-secrets, key: database-url}}
            - {name: BOSS_BOOTSTRAP_ADMIN_EMAIL, value: david@algedonic.dev}
            - name: BOSS_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom: {secretKeyRef: {name: boss-secrets, key: admin-password}}
            - {name: BOSS_AUTH_FILE, value: /var/lib/boss/auth/credentials.toml}
          volumeMounts:
            - {name: boss-auth, mountPath: /var/lib/boss/auth}
      containers:
        - name: boss
          image: 10.20.0.15:3000/david/boss:b2814ef
          env:
            - name: DATABASE_URL
              valueFrom: {secretKeyRef: {name: boss-secrets, key: database-url}}
            - name: BOSS_POSTGRES_URL
              valueFrom: {secretKeyRef: {name: boss-secrets, key: database-url}}
            - {name: BOSS_NATS_URL, value: "nats://nats:4222"}
            # Wall clock — the prod default. This is no longer a pure
            # simulation: the IT department is real people and agents, and
            # only the rest of the company is simulated, so events must be
            # stamped when they actually happen.
            #
            # It also repairs a real defect. boss-init re-primes the sim
            # epoch to 2025-03-31 on every start, but the migrated log from
            # the GCP instance carries 2026 timestamps — so post-migration
            # events were being written 17 months in the past, leaving
            # 33,042 entries stamped before their predecessor.
            - {name: BOSS_CLOCK_MODE, value: wall}
            # The clock answers the cluster, not only its own pod. The
            # `boss-clock-internal` Service (boss-clock-internal.yaml)
            # targets 7060 so the conductor can ask the clock instead of
            # falling back to wallclock — and a loopback bind refuses it.
            # Widened here, declared in the manifest, the way the jobs
            # API already listens on 0.0.0.0 behind boss-jobs-internal;
            # no LoadBalancer exposes 7060, so the reach is the cluster.
            - {name: BOSS_CLOCK_HTTP_BIND, value: "0.0.0.0:7060"}
            - {name: BOSS_DEFAULT_USER_EMAIL, value: david@algedonic.dev}
            - {name: BOSS_BOOTSTRAP_ADMIN_EMAIL, value: david@algedonic.dev}
            - {name: BOSS_STATIC_DIR, value: /opt/boss/spa}
            - {name: BOSS_AUTH_FILE, value: /var/lib/boss/auth/credentials.toml}
            - {name: BOSS_AUTH_PROVIDER, value: local-auth}
            # Deliberate: this is a public demonstration. Anonymous
            # visitors get a synthetic audit-readonly session — read every
            # projection, write nothing — so the brewery renders without a
            # login, and the write path is what's under scrutiny.
            - {name: BOSS_GUEST_ACCESS, value: "1"}
            - {name: BOSS_TENANT_MANIFEST_TOML, value: /opt/boss/examples/brewery/seeds/tenant.toml}
            # A PATH, NOT A KEY — the name is a trap and this comment is
            # the guard rail. boss-gateway reads this variable as a
            # filename and loads the key from it, generating one only if
            # the file is ABSENT — a present file is read, never rewritten.
            #
            # It must NEVER be `valueFrom: secretKeyRef`. That form once
            # pointed at boss-secrets/session-key, and the 64 hex
            # characters in that secret were taken as a RELATIVE PATH,
            # resolved against the container's working directory, found
            # missing, and a fresh random key was minted onto the
            # ephemeral overlay. Nothing errored; every deploy silently
            # issued a new signing key, so every session cookie stopped
            # verifying and every operator was signed out — three times on
            # 2026-08-26 alone, reported as the site being down when it
            # was up. (session-key-persists.sh pins both halves.)
            #
            # The file now comes from the read-only `boss-session-key`
            # Secret mounted at /etc/boss/session-key (volume + mount
            # below), NOT the boss-auth PVC. A Secret projects the SAME
            # bytes into every pod — what lets two pods overlap on a roll
            # without signing each other's cookies out — and survives a
            # restart the same as the PVC did. The Secret MUST be minted
            # with the CURRENT key bytes (see the volume comment); a new
            # key signs everyone out on the roll.
            - {name: BOSS_SESSION_KEY, value: /etc/boss/session-key/session.key}
            # Collections loop: dispatcher pushes step.done.<kind> to the
            # sim's webhook on the same loopback host:port. Both must agree
            # or zero collections fire and AR balloons.
            - {name: BOSS_EVENT_WEBHOOK_URL, value: "http://127.0.0.1:7099/callback"}
            - {name: BOSS_SIM_CALLBACK_BIND, value: "127.0.0.1:7099"}
            # PARKED: the brewery sim tick daemon is off on the cluster
            # (2026-09-05, park packet 59f063de — the sim is paused behind
            # IT delivery reliability). The tenant is still published, so
            # the app keeps its brewery data; only the packet generator is
            # stopped. Flip to "true" (or delete this line) to resume; the
            # 791 already-parked packets unblock separately (their
            # parked_batch=brewery-sim-2026-09-05).
            - {name: BOSS_SIM_ENABLED, value: "false"}
            - {name: BOSS_DISPATCH_STRATEGY, value: spread}
            # Decides-vs-executes (291a73a7, option c): decision-shaped
            # steps go to the role's human holder; executable platform
            # work defaults to the agent, who drains it. Which agent
            # runs here is a deployment fact, same class as the
            # strategy above. Scoped to platform-admin so brewery-role
            # steps never land on the platform agent.
            - {name: BOSS_DISPATCH_EXECUTOR_ID, value: "claude@algedonic.dev"}
            - {name: BOSS_DISPATCH_EXECUTOR_ROLES, value: "platform-admin"}
            - {name: BOSS_DISPATCHER_RULES, value: /opt/boss/infra/dispatcher/rules}
            # Widen the dispatcher off loopback so its machine door
            # (boss-dispatcher-internal.yaml, backlog a757b72a) can serve
            # reads to in-cluster automation — the sanctioned knob named in
            # crates/core/boss-dispatcher/src/config.rs. In-cluster only;
            # the gateway stays the human trust boundary. docs and jobs
            # already bind 0.0.0.0 (generate-configs.sh), so only the
            # dispatcher needs this.
            - {name: BOSS_DISPATCHER_BIND, value: "0.0.0.0:7950"}
            # The credential broker's root credential + issuer endpoint
            # (7ee101aa; RBAC + the credential's declaration live in
            # boss-credential-broker.yaml). The Secret is minted ONCE by
            # David with a passkey-authorized ceremony and referenced by
            # name only. `optional: true` deliberately: a deployment
            # without the Secret still boots, and a rotation rule firing
            # there dead-letters naming this variable instead of taking
            # the pod down. A VALUE, not a path — the handler reads env
            # directly (contrast the BOSS_SESSION_KEY trap above).
            - name: BOSS_BROKER_FORGEJO_TOKEN
              valueFrom: {secretKeyRef: {name: boss-credential-broker-root, key: forgejo-token, optional: true}}
            - {name: BOSS_BROKER_FORGE_URL, value: "http://10.20.0.15:3000"}
            # Bind all interfaces so the Service can reach the gateway;
            # the default 127.0.0.1 is right for systemd+Caddy, wrong here.
            - {name: BOSS_LISTEN, value: "0.0.0.0:4443"}
            - {name: BOSS_PUBLIC_URL, value: "https://playground.algedonic.dev"}
            # OIDC against Kanidm (idm-kanidm.md). The gateway is an OIDC
            # client and issues its own session after login (Q1), mapping the
            # id_token email to an EXISTING employee Subject — a login with no
            # match fails closed (Q2). Kanidm authenticates; it never provisions.
            - {name: BOSS_OIDC_ISSUER, value: "https://id.algedonic.dev/oauth2/openid/boss"}
            - {name: BOSS_OIDC_CLIENT_ID, value: "boss"}
            - name: BOSS_OIDC_CLIENT_SECRET
              valueFrom: {secretKeyRef: {name: boss-oidc, key: client-secret}}
            # Auth mail (queue item: "Email relay: pick a sender and turn on
            # auth mail"). mail.rs posts {from,to[],subject,text} with bearer
            # auth — Resend's exact shape, so this is credentials, not code.
            #
            # FROM is on send.algedonic.dev, not the root the Job named:
            # Resend is verified for the subdomain, and verifying the root
            # would mean editing the live SPF record that carries Proton mail.
            - {name: BOSS_MAIL_API_URL, value: "https://api.resend.com/emails"}
            - {name: BOSS_AUTH_MAIL_FROM, value: "auth@send.algedonic.dev"}
            - name: BOSS_MAIL_API_TOKEN
              valueFrom: {secretKeyRef: {name: resend, key: api-key}}
            # Break-glass hardware-key ceremony (break-glass-is-a-key-
            # you-hold.md; store + ceremony doc in
            # boss-break-glass-credentials.yaml). The DIR is the
            # ConfigMap mount below — public records, re-read per
            # ceremony so a committed record propagates without a
            # restart. The TOKEN arms the one-time bootstrap
            # enrollment window; the Secret exists only for the
            # duration of David's enrollment ceremony (`optional` —
            # absent means the window is closed, which is the steady
            # state). A VALUE, not a path.
            - {name: BOSS_BREAK_GLASS_DIR, value: /etc/boss/break-glass}
            - name: BOSS_BREAK_GLASS_ENROLL_TOKEN
              valueFrom: {secretKeyRef: {name: boss-break-glass-enroll, key: token, optional: true}}
            - {name: RUST_LOG, value: info}
          ports:
            - {containerPort: 4443, name: gateway}
          readinessProbe:
            # `/` is unauthenticated (the SPA index); /healthz requires a
            # session by design, so it is the wrong probe target.
            httpGet: {path: /, port: 4443}
            # Because `Recreate` guarantees a dark window (see the
            # strategy comment), every second of probe latency is a
            # second of outage. `initialDelaySeconds: 30` was a flat
            # 30s floor added AFTER migrations finish — the pod was
            # serving and the kubelet had not looked yet. Probing early
            # and often costs one cheap unauthenticated GET per 2s and
            # gives the time back on every deploy.
            #
            # The failure budget is deliberately unchanged: it was
            # 30 + 30*10 = 330s of tolerance for a slow start, and is
            # now 5 + 150*2 = 305s. Shrinking it here would turn a slow
            # migration into CrashLoopBackOff.
            initialDelaySeconds: 5
            periodSeconds: 2
            failureThreshold: 150
          resources:
            requests: {cpu: "2", memory: 4Gi}
            limits: {memory: 12Gi}
          volumeMounts:
            # credentials.toml, writable — not :ro as the compose file
            # has it. boss-auth ships in this image and is the sanctioned
            # way to rotate the break-glass credential; read-only means
            # the only way to provision one is a scale-down dance during
            # an outage — exactly when you cannot afford it. (session.key
            # used to share this mount; it is now the read-only Secret
            # below, and credentials.toml is all that is left here.)
            - {name: boss-auth, mountPath: /var/lib/boss/auth}
            # The session-cookie HMAC key, read-only, from the Secret.
            # Its own mount at a NEW path — deliberately NOT overlaying
            # /var/lib/boss/auth, so the writable credential store and
            # the read-only key stay separate volumes. BOSS_SESSION_KEY
            # points at the session.key file inside it.
            - {name: boss-session-key, mountPath: /etc/boss/session-key, readOnly: true}
            - {name: step-plugins, mountPath: /var/lib/boss/step-plugins, readOnly: true}
            # Public break-glass credential records; the gateway only
            # ever reads them (enrollment emits records for a commit,
            # never a write here — the manifest header explains why).
            - {name: break-glass-credentials, mountPath: /etc/boss/break-glass, readOnly: true}
---
apiVersion: v1
kind: Service
metadata:
  name: boss-gateway
  namespace: boss
  annotations:
    # Pinned so Caddy on GCP has a stable target across redeploys.
    io.cilium/lb-ipam-ips: "10.20.0.30"
spec:
  type: LoadBalancer
  selector: {app: boss}
  ports:
    - {port: 80, targetPort: 4443, name: http}
