# The TLS front for the cluster BOSS — Caddy terminating
# boss.algedonic.dev with the lego-issued cert (boss-tls secret,
# published by boss-tls.yaml), proxying to the gateway's in-cluster
# service. Caddy matches the playground's edge (infra/caddy) so the
# two deployments speak the same idiom.
#
# :80 redirects to https so a bare http://boss.algedonic.dev visit
# doesn't silently run cookie-less — the exact failure this front
# exists to end.
#
# Pins: LB IP 10.20.0.33 (boss-tls-front Service, MetalLB annotation)
# — the machine door boss.algedonic.dev, LAN/WireGuard only; humans
# stay on playground.algedonic.dev.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: boss-caddy-config
  namespace: boss
data:
  Caddyfile: |
    {
      auto_https off
    }
    https://boss.algedonic.dev:443 {
      tls /tls/tls.crt /tls/tls.key
      reverse_proxy boss-gateway.boss.svc.cluster.local:80
    }
    http://boss.algedonic.dev:80 {
      redir https://boss.algedonic.dev{uri} permanent
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: boss-tls-front
  namespace: boss
spec:
  replicas: 1
  selector:
    matchLabels: {app: boss-tls-front}
  template:
    metadata:
      labels: {app: boss-tls-front}
    spec:
      containers:
        - name: caddy
          image: caddy:2.8-alpine
          ports:
            - {containerPort: 443, name: https}
            - {containerPort: 80, name: http}
          volumeMounts:
            - {name: config, mountPath: /etc/caddy, readOnly: true}
            - {name: tls, mountPath: /tls, readOnly: true}
      volumes:
        - name: config
          configMap: {name: boss-caddy-config}
        - name: tls
          secret: {secretName: boss-tls}
---
apiVersion: v1
kind: Service
metadata:
  name: boss-tls-front
  namespace: boss
  annotations:
    metallb.universe.tf/loadBalancerIPs: "10.20.0.33"
spec:
  type: LoadBalancer
  loadBalancerIP: 10.20.0.33
  selector: {app: boss-tls-front}
  ports:
    - {port: 443, targetPort: 443, name: https}
    - {port: 80, targetPort: 80, name: http}
