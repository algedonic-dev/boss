# gate-seed-local — the gate's warm seed lives on the build node's own
# filesystem, so a gate's copy of it is a REFLINK, not a rewrite.
#
# THE MEASUREMENT (backlog 5b3dabb5, 2026-09-11). Every gate copied the
# warm target (tens of GB) from a Longhorn block volume into its per-run
# emptyDir with `cp -a` — 184 s per gate, and every byte of the seed
# WRITTEN to w-1's SSD each time; every green gate near tip copied it
# back to refresh the seed. w-1's NVMe had ~61 TB written in 16.7 days
# (~3.6 TB/day, /sys/block/nvme0n1/stat) with ~38 h of all-tasks IO
# stall: the seed copy was the single largest writer. A reflink copy
# (`cp --reflink=auto`, FICLONE) shares extents and writes only metadata
# — but only within ONE filesystem, and a Longhorn volume carries its
# own ext4. Talos puts every emptyDir on the EPHEMERAL partition's xfs
# (on w-1 the fourth partition of the install disk, reflink-capable); a
# `local` PersistentVolume on a directory of that same partition puts
# the seed there too.
#
# THE PARTITION IS NAMED BY ROLE, NOT BY KERNEL NUMBER, and that is
# deliberate: kernel device numbers are not stable across adding a
# disk. Measured on the forge 2026-09-21, which took a second NVMe
# beside its first — the NEW drive enumerated as nvme0n1 and the
# RUNNING ROOT FILESYSTEM moved from nvme0n1p2 to nvme1n1p2. The host
# booted only because fstab resolves by UUID; a reader who had written
# down "root is nvme0n1p2" would have been holding a loaded gun. This
# line used to say `nvme0n1p4 on w-1`, and w-1 is the next node due a
# second disk, so it was one screwdriver away from being false in the
# same way. Nothing here resolves a device by number at runtime — the
# PV below is a PATH (/var/local/gate-seed) bound by nodeAffinity — so
# this is a correction to the record, not to behaviour.
# (2026-09-30: w-1 got that second disk. Its Talos declaration picks it
# by a selector — not the system disk, NVMe, over 500 GB — and never by
# a name; see THE GATE VOLUME below.)
#
# THE GATE VOLUME (backlog 52ea56ac, design 8457c07b, 2026-09-30).
# The measured bound on parallel gates is w-1's ONE NVMe, not its CPU
# (2026-08-26: five gates, I/O pressure 65%, CPU idle, a ~35-min gate
# took ~93): the seed, every workspace, containerd, the kubelet and
# Longhorn all write the same device. David fitted a second NVMe on
# 2026-09-30, and ALL the gate's disk I/O — the seed AND the per-run
# workspaces — moves onto it as ONE xfs filesystem, because a reflink
# is only possible inside one: seed on the new disk and workspaces on
# the old would restore the 184 s full copy measured above. The disk is
# a Talos USER VOLUME named `gate`, which Talos mounts at /var/mnt/gate,
# declared in infra/cluster/talos/patches/w-1.yaml — the node's own
# filesystem again, the node's own declaration again, for every reason
# the seed directory's paragraph below gives. The
# install disk keeps containerd, the kubelet, Longhorn and the dev
# pod's /scratch; EPHEMERAL is not moved (that wipes w-1's Longhorn
# replicas, dev /work among them).
#
# Declared here as a SECOND PV (gate-w-1, path /var/mnt/gate) and its
# claim `gate` in boss-dev, because a local PV's path is immutable —
# editing gate-seed-w-1's path would fail every converge's apply — and
# because gates on an older checkout still render the old runner and
# mount the old claim until they rebase. The claim is declared HERE,
# converged with the PV, rather than beside the Job in
# infra/gate-runner/gate-runner.yaml: nothing converges that file's
# claims (`boss gate` creates only the Job), so a claim declared there
# exists only after someone applies it by hand.
#
# ORDER. The PV and claim are inert until a pod mounts them, so they
# land first, before the node has the volume; the runner moves onto the
# claim in a SEPARATE car (gate-runner.yaml, run.sh), whose own gate is
# the first pod to mount it. Between the two, David applies the Talos
# patch and PROVES it the way the seed directory was proven: a pod in
# boss-dev mounting claim `gate`, writing a file, `cp --reflink=always`
# succeeding on it — and its device read and compared, because
# EPHEMERAL is xfs and reflinks too, so a write and a reflink alone
# cannot tell the gate disk from the install disk (review a79746c6).
#
# A MISSING DISK IS NOT LOUD BY ITSELF, and an earlier version of this
# comment said it was. Once the volume has ever mounted, its mountpoint
# directory /var/mnt/gate stays on EPHEMERAL; a later boot without the
# disk (dead, unenumerated) leaves that empty directory, the PV mounts
# it, and every gate would write the seed and its workspace onto the
# install disk — with nothing evicting, because writes through a PV are
# not the pod's ephemeral storage. What makes it loud is the gate
# itself, from the runner car that followed this one (this paragraph
# named the refusal before that car had landed; review 635317c5):
# infra/gate-runner/run.sh, armed by GATE_DISK=required in the runner
# manifest, refuses to start when /gate-seed or /gate-target sits on the
# same device as the pod's EPHEMERAL files, when the two are on
# different devices, or when the marker /gate-runs/.gate-volume that
# the proof Job writes is absent.
#
# WHAT THIS DECLARES, cluster-scoped, so it is converged from here and
# not applied by `boss gate` (whose credential is namespaced) — and the
# one thing it cannot declare:
#   - a StorageClass with no provisioner and WaitForFirstConsumer, the
#     standard shape for a hand-declared local volume;
#   - the PersistentVolume itself: 200Gi of /var/local/gate-seed on
#     w-1, Retain (a warm seed is minutes of every gate; never reclaim
#     it by accident), bound only on w-1 by nodeAffinity;
#   - NOT the directory itself. A local PV refuses a path that does
#     not exist, and nothing in this cluster may make one: the only
#     Kubernetes way is a hostPath mount, and boss-dev — no pod-security
#     labels of its own — enforces the Talos DEFAULT profile, which is
#     `baseline`, and baseline refuses hostPath. MEASURED 2026-09-12
#     (backlog d42d4967): the first version of this file carried a
#     prepare CronJob whose DirectoryOrCreate hostPath was to make the
#     path; run by hand it created no pod in ten minutes, while the same
#     Job with an emptyDir completed in twenty seconds, and the gate
#     could not have told us (it applies nothing). The directory is
#     therefore the NODE's declaration — TWO entries in w-1's Talos
#     machine config, DECLARED at infra/cluster/talos/patches/w-1.yaml
#     (backlog 08430090; until 2026-09-15 they lived only on a laptop,
#     and this comment restated them — a fact that lived twice). The
#     first, `machine.files`, makes the directory; Talos creates the
#     parents at boot. The second, `machine.kubelet.extraMounts`, lets
#     the kubelet SEE it: on Talos the kubelet runs in its own mount
#     namespace with a fixed set of host paths, and /var/local is not
#     one of them — MEASURED 2026-09-12 04:21-13:30Z: with the directory
#     present on the host (`talosctl ls /var/local/` listed it) a pod
#     mounting the PVC sat nine hours at ContainerCreating while the
#     kubelet logged, 296 times, `MountVolume.NewMounter initialization
#     failed for volume "gate-seed-w-1": path "/var/local/gate-seed"
#     does not exist`. The same arrangement local-path-provisioner needs
#     on Talos. How to apply, and how to read the live node against the
#     declaration (infra/cluster/talos/check-declared.sh), is in
#     infra/cluster/talos/README.md; the kubelet restarts, running pods
#     survive, no reboot. The PROOF is a pod in boss-dev that mounts
#     the PVC and writes a file — `talosctl ls` is the host's view and
#     passed while the mount failed, so it proves nothing about the
#     mount. A rebuilt w-1 gets both back from its config, which is
#     where a node's own filesystem belongs; ownership is the gate pod's
#     fsGroup (1500) at mount, the arrangement the Longhorn seed relied
#     on.
#     infra/lint/no-manifest-mounts-a-hostpath.sh refuses the hostPath
#     mount coming back.
#   - The gate volume below differs in both halves: its path,
#     /var/mnt/gate, is the volume's MOUNTPOINT, which Talos makes when
#     it mounts the disk, so it needs no `machine.files` entry; and it
#     carries NO kubelet extraMounts entry, because Talos already binds
#     /var/mnt into the kubelet (`rbind, rslave, ro`) and an extraMounts entry would have the
#     kubelet MkdirAll the path on EPHEMERAL whenever the volume is
#     absent (review a79746c6; the reasoning is in w-1.yaml). Whether
#     Talos's own bind suffices is what the proof pod decides. The
#     directories the runner puts under it are made by the kubelet for
#     the pod's subPath mounts.
#
# WHAT IT COSTS. The PV's node affinity makes gating REQUIRE w-1: the
# gate-runner's "preferred, not required" build-node affinity is now
# effectively required through the claim, so cordoning w-1 stops gating
# instead of degrading it. That is the honest trade — the seed was
# always w-1's disk in practice (its Longhorn replica lived there), and
# the pipeline's other write sinks already assume the build node.
#
# THE MIGRATION. The first gate after this lands finds an empty seed —
# run.sh says "no warm seed — cold build" and pays ~20 min once — and
# its green refresh writes the seed back BY REFLINK. From the second
# gate on, the copy is metadata. The old Longhorn claim
# `gate-runner-disk` stays declared in infra/gate-runner/gate-runner.yaml
# until the new seed is warm, then a car retires it (delete-orphan-object).
# The move to the gate volume is the same migration, decided the same
# way (design 8457c07b): no seed is copied across; the first gate on the
# new layout runs cold once and its green refresh writes the new seed.
# gate-seed-w-1 and its claim then stay declared until no gate mounts
# them, and a car retires them like gate-runner-disk.
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: gate-seed-local
  labels: {app.kubernetes.io/part-of: boss, boss.dev/purpose: build}
provisioner: kubernetes.io/no-provisioner
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Retain
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: gate-seed-w-1
  labels: {app.kubernetes.io/part-of: boss, boss.dev/purpose: build}
spec:
  capacity:
    storage: 200Gi
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: gate-seed-local
  local:
    path: /var/local/gate-seed
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - {key: kubernetes.io/hostname, operator: In, values: ["w-1"]}
---
# THE GATE VOLUME: the whole second NVMe (see THE GATE VOLUME above).
# The capacity is a label, not a quota — a local PV has no way to bound
# what is written to it, and the filesystem's size is the disk's. 450Gi
# is under the smallest disk the Talos selector admits (> 500 GB), so
# the claim below binds whichever disk David fitted. Retain, bound by
# nodeAffinity to w-1, the same class as the seed, for the seed's
# reasons.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: gate-w-1
  labels: {app.kubernetes.io/part-of: boss, boss.dev/purpose: build}
spec:
  capacity:
    storage: 450Gi
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: gate-seed-local
  # Pre-bound BOTH ways (review a79746c6, finding 5): the claim names
  # this PV, and this PV names the claim, so no other claim of the class
  # can take it first.
  claimRef: {namespace: boss-dev, name: gate}
  local:
    path: /var/mnt/gate
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - {key: kubernetes.io/hostname, operator: In, values: ["w-1"]}
---
# Bound BY NAME to the one PV above; the class has no provisioner, so a
# typo binds nothing and a pod waits Pending rather than writing to the
# wrong disk. RWO is a placement rule here as it is for the seed claim:
# every concurrent gate co-mounts it, on w-1 only.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gate
  namespace: boss-dev
  labels: {app.kubernetes.io/part-of: boss, boss.dev/purpose: build}
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: gate-seed-local
  volumeName: gate-w-1
  resources:
    requests:
      storage: 450Gi
