# The SoR's event_facts catch-up — the chore whose false-ok was
# MEASURED (2026-08-19): the boss-gcp timer ran boss-views-catchup
# against the local demo postgres and completed the CLUSTER's
# maintenance packet with result=ok, so the SoR's packet claimed work
# the SoR never received. Same rule as the search reindex beside it:
# a chore reports to the jobs API of the instance whose DATA it
# maintains — and therefore runs THERE.
#
# Cadence matches the boss-gcp timer's contract (OnUnitActiveSec=5min):
# event_facts is an append-follow projection and five minutes bounds
# its staleness on a busy board.
#
# The chore contract (see boss-search-reindex.yaml): label
# boss-chore=true + container `chore`, so the deploy runner pins the
# deployed image on the whole set in one selector.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: boss-views-catchup
  namespace: boss
  labels:
    boss-chore: "true"
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: chore
              image: 10.20.0.15:3000/david/boss:latest
              command: ["/bin/bash", "-c"]
              args:
                - |
                  set -euo pipefail
                  /usr/local/bin/boss-maintenance-wrap.sh maintenance-views-catchup "event_facts catch-up"
                  /usr/local/bin/boss-views-catchup
                  /usr/local/bin/boss-step.sh maintenance-views-catchup run result=ok
              env:
                - name: RUST_LOG
                  value: info
                - name: BOSS_POSTGRES_URL
                  valueFrom:
                    secretKeyRef:
                      name: boss-secrets
                      key: database-url
                - name: BOSS_JOBS_URL
                  value: http://boss-jobs-internal.boss.svc.cluster.local:7900
                - name: BOSS_MACHINE_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: boss-secrets
                      key: machine-token
                      optional: true
