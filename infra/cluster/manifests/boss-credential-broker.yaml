# boss-credential-broker — the broker's write path to ONE named
# Secret, and the registry declaration of the credential that lives
# there (packet 7ee101aa, first leg).
#
# WHY THIS EXISTS. On 2026-09-02 the boss-dev pod's forge WRITE token
# was exposed in a session transcript during a hand-placement
# walkthrough — the ceremony itself was the vulnerability. The broker
# retires the ceremony: a rotate-a-credential packet's scope step
# fires the dispatcher's `credential.rotate.forgejo` handler, which
# mints a replacement with the root credential, PATCHes it into the
# Secret below, verifies by effect, revokes the old token, and records
# every phase on the packet. Consumers read the value from Secret
# mounts (or `boss credential pull forge`); no human ever holds it.
#
# THE CREDENTIAL, DECLARED (the registry row proper is the
# `broker-rotates-the-boss-dev-forge-token` rule in
# infra/dispatcher/rules/ — this block restates it where the
# RBAC it needs lives):
#   subject id      boss-dev-forge-token   (custom Subject, rotation
#                                           packets are opened on it)
#   kind            forgejo access token, user `david`
#   scopes          write:repository
#   value lives     Secret boss-dev/boss-dev-forge-token, key `token`
#   consumers       - /etc/boss-train/forge.token in the boss-dev pod
#                     (Secret mount, boss-dev.yaml — `boss train` verbs)
#                   - the git credential helper in the boss-dev pod
#                     (points at that file after `boss credential pull`)
#   rotation policy on demand via a rotate-a-credential packet;
#                   exposure = immediate urgent rotation. Routine
#                   rotation needs NO human; the packet is the record.
#
# THE ROOT CREDENTIAL is Secret boss/boss-credential-broker-root
# (key `forgejo-token`, admin scope), minted ONCE by David in a
# passkey-authorized ceremony on 2026-09-02 and referenced here by
# name only — Secrets never live in this tree (README). It reaches
# the dispatcher as env BOSS_BROKER_FORGEJO_TOKEN (boss.yaml).
#
# WHAT THE BROKER DELIBERATELY CANNOT DO:
#   - create Secrets. `create` cannot be name-scoped in RBAC, so
#     granting it would be a namespace-wide write. The target Secret
#     is created EMPTY by the cluster converge instead, which holds
#     the admin credential and the tree: every `credential.rotate.*`
#     rule's `secret_namespace` / `secret_name` args (the ones this
#     handler PATCHes) are read from infra/dispatcher/rules/ and each
#     absent Secret is created with no data, never touched once it
#     exists (cluster-deploy-lib.sh ensure_declared_secrets, backlog
#     51c98681 — until then it was a hand act, once per credential).
#     The handler's 404 message names that stage.
#   - touch any Secret but the one named below. A Role + resourceNames
#     cannot be argued into a wider grant; a compromised broker writes
#     one token slot, not a namespace.
#   - read or write anything in the `boss` namespace beyond the two
#     objects the tunnel rotation names below and the forge host
#     checkout's one Secret. The broker runs THERE (inside the boss
#     pod, so its k8s identity is that pod's ServiceAccount); the forge
#     grant lives in boss-dev, pointed at the one object it manages,
#     the tunnel grant lives in boss, pointed at its one Secret and its
#     one Deployment, and the checkout grant lives in boss, pointed at
#     its one Secret.
#
# THE SECOND CREDENTIAL (packet 04e5f833, 2026-09-16) — declared by
# the `broker-rotates-the-cloudflare-tunnel` rule and the registry
# row `cloudflare-tunnel-credentials`:
#   subject id      cloudflare-tunnel-credentials
#   kind            cloudflare tunnel credentials (cloudflared's
#                   credentials.json: AccountTag, TunnelSecret, TunnelID)
#   value lives     Secret boss/cloudflare-tunnel-credentials,
#                   key `credentials.json`
#   consumers       the in-cluster cloudflared Deployment (5a2bb0ce),
#                   which reads the file ONCE at start — so the
#                   rotation also rollout-restarts it, which is the
#                   `patch` on deployments below
#   root            Secret boss/boss-credential-broker-root, key
#                   `cloudflare-token`: ONE account API token
#                   (Cloudflare Tunnel:Edit, Zone:DNS:Edit, Zone:Read)
#                   minted once by David, reaching the dispatcher as
#                   env BOSS_BROKER_CLOUDFLARE_TOKEN (boss.yaml).
#   the object      created empty by the converge from the rule's
#                   declaration, same as above (the broker cannot
#                   `create`); the packet field is `secrets_declared`
#
# THE THIRD CREDENTIAL (design 1c90d183, David 2026-09-26; backlog
# c4cbc6b5) — declared by the `broker-rotates-the-forge-host-checkout-
# token` rule (and its delivery twin, which hands the handler the same
# args) and the registry row `forge-host-checkout-token`:
#   subject id      forge-host-checkout-token
#   kind            forgejo access token, user `david`, write:repository
#   value lives     Secret boss/forge-host-checkout-token, key `token`
#   consumers       OFF the cluster: the forge host's checkout
#                   (/home/david/boss). forge-converge's deposit
#                   (infra/forge/credential-deposit.sh) reads this Secret
#                   through the forge's admin kubeconfig and installs it
#                   as ~david/.config/boss/forge-checkout.token behind a
#                   git credential helper, for forge-converge's fetch and
#                   protect-main, publish-github-pr's forge push, and the
#                   tenant-source check. The revoke waits for the host's
#                   `delivered` record on the rotation packet.
#   the object      created empty by the converge, same as above
# Namespace `boss`, not a dedicated one (D5): its one reader outside the
# broker is the forge's admin kubeconfig, which sees every namespace,
# and against in-cluster readers the grant below is name-scoped either
# way.
---
# The broker's k8s identity is the boss Deployment's pod SA — the
# dispatcher runs inside that pod (boss.yaml declares no
# serviceAccountName, so it is `default` in `boss`). A dedicated SA
# would require splitting the deployment; the name-scoped Role keeps
# the grant honest either way.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: credential-broker-forge-token
  namespace: boss-dev
  labels: {app.kubernetes.io/part-of: boss, boss.dev/purpose: credential-broker}
rules:
  # `get` for the idempotence check (compare the installed value's
  # last-eight against the issuer's token ledger), `patch` for the
  # install (application/merge-patch+json on `data`). No `update`:
  # the handler never sends a whole-object PUT, and an unspent verb
  # is scope nobody asked for.
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [boss-dev-forge-token]
    verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: credential-broker-forge-token
  namespace: boss-dev
  labels: {app.kubernetes.io/part-of: boss, boss.dev/purpose: credential-broker}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: credential-broker-forge-token
subjects:
  - kind: ServiceAccount
    name: default
    namespace: boss
---
# The tunnel rotation's grant, in the boss namespace: the connector's
# Secret (get for the idempotence check — the installed file names
# its tunnel id — patch for the install) and the connector Deployment
# (get for the exists-before-mint refusal, patch for the rollout
# restart). Both by name; nothing else in the namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: credential-broker-cloudflare-tunnel
  namespace: boss
  labels: {app.kubernetes.io/part-of: boss, boss.dev/purpose: credential-broker}
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [cloudflare-tunnel-credentials]
    verbs: [get, patch]
  - apiGroups: [apps]
    resources: [deployments]
    resourceNames: [cloudflared]
    verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: credential-broker-cloudflare-tunnel
  namespace: boss
  labels: {app.kubernetes.io/part-of: boss, boss.dev/purpose: credential-broker}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: credential-broker-cloudflare-tunnel
subjects:
  - kind: ServiceAccount
    name: default
    namespace: boss
---
# The forge host checkout token's grant (design 1c90d183, D5): its one
# Secret, `get` for the idempotence read and `patch` for the install,
# by name. Nothing else in the namespace, and no `create` — the converge
# creates the Secret empty from the rule.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: credential-broker-forge-host-checkout-token
  namespace: boss
  labels: {app.kubernetes.io/part-of: boss, boss.dev/purpose: credential-broker}
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [forge-host-checkout-token]
    verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: credential-broker-forge-host-checkout-token
  namespace: boss
  labels: {app.kubernetes.io/part-of: boss, boss.dev/purpose: credential-broker}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: credential-broker-forge-host-checkout-token
subjects:
  - kind: ServiceAccount
    name: default
    namespace: boss
