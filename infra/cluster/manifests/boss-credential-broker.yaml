# boss-credential-broker — the broker's write path to ONE named
# Secret, and the registry declaration of the credential that lives
# there (packet 7ee101aa, first leg).
#
# WHY THIS EXISTS. On 2026-09-02 the boss-dev pod's forge WRITE token
# was exposed in a session transcript during a hand-placement
# walkthrough — the ceremony itself was the vulnerability. The broker
# retires the ceremony: a rotate-a-credential packet's scope step
# fires the dispatcher's `credential.rotate.forgejo` handler, which
# mints a replacement with the root credential, PATCHes it into the
# Secret below, verifies by effect, revokes the old token, and records
# every phase on the packet. Consumers read the value from Secret
# mounts (or `boss credential pull forge`); no human ever holds it.
#
# THE CREDENTIAL, DECLARED (the registry row proper is the
# `broker-rotates-the-boss-dev-forge-token` rule in
# infra/dispatcher/rules/ — this block restates it where the
# RBAC it needs lives):
#   subject id      boss-dev-forge-token   (custom Subject, rotation
#                                           packets are opened on it)
#   kind            forgejo access token, user `david`
#   scopes          write:repository
#   value lives     Secret boss-dev/boss-dev-forge-token, key `token`
#   consumers       - /etc/boss-train/forge.token in the boss-dev pod
#                     (Secret mount, boss-dev.yaml — `boss train` verbs)
#                   - the git credential helper in the boss-dev pod
#                     (points at that file after `boss credential pull`)
#   rotation policy on demand via a rotate-a-credential packet;
#                   exposure = immediate urgent rotation. Routine
#                   rotation needs NO human; the packet is the record.
#
# THE ROOT CREDENTIAL is Secret boss/boss-credential-broker-root
# (key `forgejo-token`, admin scope), minted ONCE by David in a
# passkey-authorized ceremony on 2026-09-02 and referenced here by
# name only — Secrets never live in this tree (README). It reaches
# the dispatcher as env BOSS_BROKER_FORGEJO_TOKEN (boss.yaml).
#
# WHAT THE BROKER DELIBERATELY CANNOT DO:
#   - create Secrets. `create` cannot be name-scoped in RBAC, so
#     granting it would be a namespace-wide write. The target Secret
#     is created EMPTY by the cluster converge instead, which holds
#     the admin credential and the tree: every `credential.rotate.*`
#     rule's `secret_namespace` / `secret_name` args (the ones this
#     handler PATCHes) are read from infra/dispatcher/rules/ and each
#     absent Secret is created with no data, never touched once it
#     exists (cluster-deploy-lib.sh ensure_declared_secrets, backlog
#     51c98681 — until then it was a hand act, once per credential).
#     The handler's 404 message names that stage.
#   - touch any Secret but the one named below. A Role + resourceNames
#     cannot be argued into a wider grant; a compromised broker writes
#     one token slot, not a namespace.
#   - read or write anything in the `boss` namespace beyond the two
#     objects the tunnel rotation names below, the forge host
#     checkout's one Secret, the GitHub App tokens' named Secrets
#     (today github-dr-push-token and github-app-algedonic-dev), the
#     ops runners' credential slots (ops-runner-credential) and the
#     estate machine token's Secret (boss-machine-token, with its copy
#     in boss-dev; the seventh credential, near the end of this file)
#     and the probe reader's (boss-probe-reader; the eighth, at the
#     end). The
#     broker runs THERE (inside the boss
#     pod, so its k8s identity is that pod's ServiceAccount); the forge
#     grant lives in boss-dev, pointed at the one object it manages,
#     the tunnel grant lives in boss, pointed at its one Secret and its
#     one Deployment, and the checkout grant lives in boss, pointed at
#     its one Secret.
#
# THE SECOND CREDENTIAL (packet 04e5f833, 2026-09-16) — declared by
# the `broker-rotates-the-cloudflare-tunnel` rule and the registry
# row `cloudflare-tunnel-credentials`:
#   subject id      cloudflare-tunnel-credentials
#   kind            cloudflare tunnel credentials (cloudflared's
#                   credentials.json: AccountTag, TunnelSecret, TunnelID)
#   value lives     Secret boss/cloudflare-tunnel-credentials,
#                   key `credentials.json`
#   consumers       the in-cluster cloudflared Deployment (5a2bb0ce),
#                   which reads the file ONCE at start — so the
#                   rotation also rollout-restarts it, which is the
#                   `patch` on deployments below
#   root            Secret boss/boss-credential-broker-root, key
#                   `cloudflare-token`: ONE account API token
#                   (Cloudflare Tunnel:Edit, Zone:DNS:Edit, Zone:Read)
#                   minted once by David, reaching the dispatcher as
#                   env BOSS_BROKER_CLOUDFLARE_TOKEN (boss.yaml).
#   the object      created empty by the converge from the rule's
#                   declaration, same as above (the broker cannot
#                   `create`); the packet field is `secrets_declared`
#
# THE THIRD CREDENTIAL (design 1c90d183, David 2026-09-26; backlog
# c4cbc6b5) — declared by the `broker-rotates-the-forge-host-checkout-
# token` rule (and its delivery twin, which hands the handler the same
# args) and the registry row `forge-host-checkout-token`:
#   subject id      forge-host-checkout-token
#   kind            forgejo access token, user `david`, write:repository
#   value lives     Secret boss/forge-host-checkout-token, key `token`
#   consumers       OFF the cluster: the forge host's checkout
#                   (/home/david/boss). forge-converge's deposit
#                   (infra/forge/credential-deposit.sh) reads this Secret
#                   through the forge's admin kubeconfig and installs it
#                   as ~david/.config/boss/forge-checkout.token behind a
#                   git credential helper, for forge-converge's fetch and
#                   protect-main, publish-github-pr's forge push, and the
#                   tenant-source check. The revoke waits for the host's
#                   `delivered` record on the rotation packet.
#   the object      created empty by the converge, same as above
# Namespace `boss`, not a dedicated one (D5): its one reader outside the
# broker is the forge's admin kubeconfig, which sees every namespace,
# and against in-cluster readers the grant below is name-scoped either
# way.
#
# THE FOURTH CREDENTIAL, AND THE FIRST MINTED FROM A GITHUB APP (design
# 76155676, David 2026-09-27; backlog 81eb6d4d) — declared by the
# `broker-rotates-the-github-dr-push-token` rule (exposure) and its
# clock twin `broker-refreshes-the-github-dr-push-token` (routine: an
# installation token lives one hour), and the registry row
# `github-dr-push-token`:
#   subject id      github-dr-push-token
#   kind            github-app-installation-token, narrowed to
#                   repository boss-dr, contents:write + metadata:read
#                   + workflows:write (the pushed tree carries
#                   .github/workflows; backlog d76cc3ac)
#   value lives     Secret boss/github-dr-push-token, key `token`, beside
#                   `token.expires-at` and `token.minted-for`
#   consumers       OFF the cluster: infra/forge/offsite-push.sh's DR
#                   target, reading /etc/boss-publish/github-dr.token on
#                   the forge host, rendered from this Secret by the
#                   forge converge (a separate car)
#   root            Secret boss/boss-credential-broker-root, keys
#                   github-app.id, github-app.installation-id,
#                   github-app.private-key.pem — the App on algedonic-dev,
#                   placed once by David
#   the object      created empty by the converge, same as above
#
# THE FIFTH CREDENTIAL, MINTED PER ACT (design 76c46869, David
# 2026-09-28; backlog bf8726c9) — declared by the rule pair
# `broker-mints-the-algedonic-dev-admin-token-when-a-github-request-is-
# filed` and `broker-re-mints-the-algedonic-dev-admin-token-when-a-
# github-request-is-approved` (no clock twin: between acts no admin token
# that has not expired exists), and the registry row
# `github-app-algedonic-dev`:
#   subject id      github-app-algedonic-dev
#   kind            github-app-installation-token, every repository of
#                   the algedonic-dev installation, administration:write
#                   + contents:write + metadata:read
#   value lives     Secret boss/github-app-algedonic-dev, one key per
#                   ops-request, `token-<request id>`, beside
#                   `token-<request id>.expires-at` and `.minted-for`
#                   (backlog 4ce4ec55)
#   consumers       OFF the cluster: infra/forge/github-act.sh on the
#                   forge host, reading
#                   /etc/boss-publish/github-app/algedonic-dev.token,
#                   which the verb renders from this Secret just before
#                   it acts and revokes after its write (a separate car)
#   root            the same App root as the fourth credential
#   the object      created empty by the converge, same as above
#
# THE SIXTH CREDENTIAL, THE FIRST WITH NO ISSUER OUTSIDE THE ESTATE
# (design f623e425 Q1, option A, David 2026-09-25; backlog 1e50e66b) —
# declared per host by the rule pair `broker-rotates-the-forge-ops-
# runner-credential` and `broker-promotes-the-forge-ops-runner-
# credential-on-delivery`, and the registry row
# `ops-runner-credential-forge`:
#   subject id      ops-runner-credential-<host> (forge today)
#   kind            ops runner credential: 32 random bytes, base64url,
#                   minted by the handler itself — the jobs API's
#                   credential door (boss_jobs::runner_credential) is its
#                   only verifier
#   value lives     Secret boss/ops-runner-credential, one key per host
#                   and slot — `<host>.current`, `<host>.next`,
#                   `<host>.previous` — beside `<host>.<slot>.minted-for`,
#                   the rotation packet that put the value there
#   consumers       the jobs API, which MOUNTS the whole Secret at
#                   /etc/boss/runner-credential (boss.yaml) and resolves a
#                   presented x-boss-runner-credential against it; and,
#                   OFF the cluster, each host's ops runner, reading
#                   /etc/boss/ops-runner.credential (root:root 0600),
#                   which forge-converge's runner-credential-deposit.sh
#                   renders from this Secret on the forge. boss-gcp's
#                   delivery waits on the remote deposit (backlog 7336cb5f)
#   root            none: no external issuer, so nothing David places
#   the object      created empty by the converge, same as above
# The jobs API holds every host's value in plaintext in that mount (the
# review of 8e5de104, finding 4): the same trust root as the machine
# token and every other brokered credential — whoever can read this
# Secret or exec into the boss pod can present as any host's runner.
---
# The broker's k8s identity is the boss Deployment's pod SA — the
# dispatcher runs inside that pod, and boss.yaml names it: ServiceAccount
# `boss` in `boss`. Every binding in this file names that account. Until
# 2026-09-28 boss.yaml named none, so the pod ran as `default` and these
# bindings named `default` — which is also every other pod in the
# namespace that declares no identity (postgres, nats, the chores,
# internet-facing cloudflared), each able to read and overwrite every
# Secret below, the per-act org-admin GitHub token among them once car
# 0660454c landed (backlog 28367b57). `default` now mounts no token, and
# no_default_service_account_reads_a_secret.rs refuses a Secret-reading
# Role bound to it. Narrower still — an SA for the dispatcher alone —
# would require splitting the deployment; the name-scoped Role keeps the
# grant honest either way.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: credential-broker-forge-token
  namespace: boss-dev
  labels: {app.kubernetes.io/part-of: boss, boss.dev/purpose: credential-broker}
rules:
  # `get` for the idempotence check (compare the installed value's
  # last-eight against the issuer's token ledger), `patch` for the
  # install (application/merge-patch+json on `data`). No `update`:
  # the handler never sends a whole-object PUT, and an unspent verb
  # is scope nobody asked for.
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [boss-dev-forge-token]
    verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: credential-broker-forge-token
  namespace: boss-dev
  labels: {app.kubernetes.io/part-of: boss, boss.dev/purpose: credential-broker}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: credential-broker-forge-token
subjects:
  - kind: ServiceAccount
    name: boss
    namespace: boss
---
# The tunnel rotation's grant, in the boss namespace: the connector's
# Secret (get for the idempotence check — the installed file names
# its tunnel id — patch for the install) and the connector Deployment
# (get for the exists-before-mint refusal, patch for the rollout
# restart). Both by name; nothing else in the namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: credential-broker-cloudflare-tunnel
  namespace: boss
  labels: {app.kubernetes.io/part-of: boss, boss.dev/purpose: credential-broker}
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [cloudflare-tunnel-credentials]
    verbs: [get, patch]
  - apiGroups: [apps]
    resources: [deployments]
    resourceNames: [cloudflared]
    verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: credential-broker-cloudflare-tunnel
  namespace: boss
  labels: {app.kubernetes.io/part-of: boss, boss.dev/purpose: credential-broker}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: credential-broker-cloudflare-tunnel
subjects:
  - kind: ServiceAccount
    name: boss
    namespace: boss
---
# The forge host checkout token's grant (design 1c90d183, D5): its one
# Secret, `get` for the idempotence read and `patch` for the install,
# by name. Nothing else in the namespace, and no `create` — the converge
# creates the Secret empty from the rule.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: credential-broker-forge-host-checkout-token
  namespace: boss
  labels: {app.kubernetes.io/part-of: boss, boss.dev/purpose: credential-broker}
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [forge-host-checkout-token]
    verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: credential-broker-forge-host-checkout-token
  namespace: boss
  labels: {app.kubernetes.io/part-of: boss, boss.dev/purpose: credential-broker}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: credential-broker-forge-host-checkout-token
subjects:
  - kind: ServiceAccount
    name: boss
    namespace: boss
---
# The GitHub App installation tokens' grant (design 76155676, backlog
# 81eb6d4d): every Secret a `credential.rotate.github-app-installation`
# rule declares, by name — the disaster-recovery push token and the
# per-act org-admin token the GitHub verbs act with on algedonic-dev
# (design 76c46869, backlog bf8726c9).
# `get` for the refresh's read of the installed expiry and the rotation's
# read of the value it revokes, `patch` for the install (token, expiry and
# provenance in one merge-patch). A later consumer credential of the same
# App (the publisher identity) adds its Secret's name HERE, beside these;
# the pin a_declared_broker_secret_is_created_empty.rs refuses a rule
# whose Secret no Role names.
#
# THE ROOT, placed once by David: Secret boss/boss-credential-broker-root,
# keys github-app.id, github-app.installation-id and
# github-app.private-key.pem, reaching the dispatcher as env
# BOSS_BROKER_GITHUB_APP_ID / _INSTALLATION_ID / _PRIVATE_KEY (boss.yaml,
# optional: true) — the forge and Cloudflare roots' posture, so this Role
# grants nothing on the root Secret itself.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: credential-broker-github-app
  namespace: boss
  labels: {app.kubernetes.io/part-of: boss, boss.dev/purpose: credential-broker}
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [github-dr-push-token, github-app-algedonic-dev]
    verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: credential-broker-github-app
  namespace: boss
  labels: {app.kubernetes.io/part-of: boss, boss.dev/purpose: credential-broker}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: credential-broker-github-app
subjects:
  - kind: ServiceAccount
    name: boss
    namespace: boss
---
# Exact-purpose transport preparation (1e50e66b). The converge derives
# the EMPTY named Secret from the broker rule. The broker cannot create,
# list, delete, or read any other Secret through this grant. Receiver
# enrollment and runner credential rotation remain separate operations.
#
# machine-token-deposit-key is the SECOND transport key the same handler
# prepares, by the same protocol: the pair the estate machine token rides
# to boss-gcp on (design-doc bdc60b65, question gcp-push, David
# 2026-10-06: "one new Role resourceNames entry for the broker"; rule
# broker-prepares-the-machine-token-deposit-key). ONE NAME ADDED TO THIS
# LIST, and nothing else: no new Role, no new verb, still no create,
# list or delete. It holds a transport key, never the machine token
# itself — the token's Secret is the broker's by its own Role at the end
# of this file.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: credential-broker-runner-deposit-key
  namespace: boss
  labels: {app.kubernetes.io/part-of: boss, boss.dev/purpose: credential-broker}
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [runner-deposit-key, machine-token-deposit-key]
    verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: credential-broker-runner-deposit-key
  namespace: boss
  labels: {app.kubernetes.io/part-of: boss, boss.dev/purpose: credential-broker}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: credential-broker-runner-deposit-key
subjects:
  - kind: ServiceAccount
    name: boss
    namespace: boss
---
# The ops runners' credential slots (backlog 1e50e66b): the one Secret
# every `credential.rotate.ops-runner` rule declares, by name. `get` for
# the stage's and the promotion's read of the host's slots and their
# provenance, `patch` for the stage (`<host>.next`) and the promotion
# (`<host>.current`, with `next` and `previous` blanked) — each one
# merge-patch. Nothing else in the namespace; the jobs API READS the
# Secret as a volume, which needs no grant of its own.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: credential-broker-ops-runner-credential
  namespace: boss
  labels: {app.kubernetes.io/part-of: boss, boss.dev/purpose: credential-broker}
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [ops-runner-credential]
    verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: credential-broker-ops-runner-credential
  namespace: boss
  labels: {app.kubernetes.io/part-of: boss, boss.dev/purpose: credential-broker}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: credential-broker-ops-runner-credential
subjects:
  - kind: ServiceAccount
    name: boss
    namespace: boss
---
# THE SEVENTH CREDENTIAL, THE ESTATE MACHINE TOKEN (design 6805c764,
# car 3; backlog 2710c8fc) — declared by the rule pair
# `broker-rotates-the-machine-token` (a rotation packet's scope step) and
# `broker-advances-the-machine-token-rotation` (every fifteen minutes,
# the same declaration), and the registry row `boss-machine-token`:
#   subject id      boss-machine-token
#   kind            machine-token, self-issued: 32 bytes from the
#                   operating system's random source, generated in the
#                   dispatcher; no issuer, no root credential
#   value lives     Secret boss/boss-machine-token (the one every service
#                   port's machine gate mounts, car 4) and its copy
#                   boss-dev/boss-machine-token (the dev pod's doors),
#                   keys `current`, `next`, `previous` — each beside
#                   `<slot>.minted-for` — and `promoted-at`
#   consumers       every service port's machine gate ACCEPTS any of the
#                   three slots; every machine caller SENDS `current`
#                   (boss_core::machine_token). Mounted by car 4; until
#                   then nothing reads these Secrets.
#   the object      created empty by the converge from the rule's
#                   declaration, both namespaces (broker_secrets reads
#                   `also_in_namespaces`)
# A DEDICATED Secret, not a key of boss-secrets (design choice 1):
# boss-secrets also holds the postgres password and the database URL,
# and a broker able to write the machine token must not be able to write
# those. `get` for the ledger read (which slot holds which packet's
# value), `patch` for stage, promote and revoke — a revoke BLANKS
# `previous`, which every gate and caller reads as absent, so no
# `delete` or `update` is asked for.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: credential-broker-machine-token
  namespace: boss
  labels: {app.kubernetes.io/part-of: boss, boss.dev/purpose: credential-broker}
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [boss-machine-token]
    verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: credential-broker-machine-token
  namespace: boss
  labels: {app.kubernetes.io/part-of: boss, boss.dev/purpose: credential-broker}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: credential-broker-machine-token
subjects:
  - kind: ServiceAccount
    name: boss
    namespace: boss
---
# The dev pod's copy: the same grant, in boss-dev, by name.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: credential-broker-machine-token
  namespace: boss-dev
  labels: {app.kubernetes.io/part-of: boss, boss.dev/purpose: credential-broker}
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [boss-machine-token]
    verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: credential-broker-machine-token
  namespace: boss-dev
  labels: {app.kubernetes.io/part-of: boss, boss.dev/purpose: credential-broker}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: credential-broker-machine-token
subjects:
  - kind: ServiceAccount
    name: boss
    namespace: boss
---
# THE EIGHTH CREDENTIAL, THE PROBE READER (design b35c22b4; backlog
# d26515c5) — the registry row `boss-probe-reader` (an INSTANCE's
# declaration: seeds/credentials.toml in the tenant repository, never a
# file of this tree, docs/tenant-contract.md), and the grant a rotation
# rule for it will need. THE GRANT LANDS BEFORE ITS RULE, in
# the car that mounts the Secret: every `credential.rotate.*` rule's
# Secret must be granted here by name
# (a_declared_broker_secret_is_created_empty.rs), so the rule's car then
# edits no Role. Until that rule exists nothing declares the Secret, the
# converge creates none, and this grant names an object that is not
# there — it reaches nothing.
#   subject id      boss-probe-reader
#   kind            machine-token, self-issued like the estate token: no
#                   issuer, no root credential. A value DISTINCT from
#                   the estate token's, always — every gate says a
#                   shared one at ERROR (boss_core::machine_gate,
#                   Reading::shared; review 177b4976, N2), because the
#                   estate token wins the match and would hand whoever
#                   holds the reader value every write
#   value lives     Secret boss/boss-probe-reader, keys `current`,
#                   `next`, `previous` — the slot names the gate reads
#   consumers       every service's machine gate, through boss.yaml's
#                   mount at /etc/boss/probe-reader: a match reads (GET
#                   and HEAD) as automation:run-car-probe-reader and
#                   never writes. The one CLIENT is `boss prove` on a
#                   proving host, from a root-only file a later car
#                   deposits; no pod mounts this Secret to send it
#   the object      created empty by the converge once a broker rule
#                   declares it (ensure_declared_secrets)
# IN NAMESPACE boss ALONE — no boss-dev copy and no playground copy
# (the_probe_reader_is_mounted_where_every_gate_reads_it.rs): the estate
# token is mirrored to boss-dev because the dev pod's doors SEND it; no
# workload sends this one, and the credential is prod's forge reading
# prod's record. `get` for the ledger read, `patch` for stage, promote
# and revoke, as the estate token's Role above.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: credential-broker-probe-reader
  namespace: boss
  labels: {app.kubernetes.io/part-of: boss, boss.dev/purpose: credential-broker}
rules:
  - apiGroups: [""]
