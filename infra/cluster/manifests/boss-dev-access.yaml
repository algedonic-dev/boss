# boss-dev-access — a credential that reaches the dev pod and nothing else.
#
# WHY THIS EXISTS. `boss-dev.yaml` has run since 2026-08-15 and has no
# Service: it is `kubectl exec` only. The only credential that could
# reach it was the cluster-admin kubeconfig on David's laptop, which is
# why the pod sat unused for 25 hours with `/work` holding nothing but
# `lost+found` — and why every attempt to verify something in the CI
# image happened on a laptop instead, at the cost of a red train
# (train 52, `bunx: command not found`).
#
# David, 2026-08-16: *"My laptop is really meant to just be a thin
# terminal to interact with a durable session somewhere in the
# BossInfra layer."* A durable session needs a credential that is not
# a person's laptop, and the answer to design Q2 was explicit about
# its shape: namespace-scoped, on boss-gcp, NOT a copy of the admin
# kubeconfig.
#
# THE SCOPING IS THE WHOLE POINT. `boss-dev` exists to remove an
# incident class by construction — its Postgres sidecar means
# `127.0.0.1:5432` cannot be the production database, after a
# `cargo test --workspace` created 582 scratch databases on the
# production volume on 2026-08-14 and crashed Postgres into recovery.
# A dev credential that can also reach the `boss` namespace hands that
# blast radius straight back. A Role (not ClusterRole) cannot cross a
# namespace boundary even if someone asks it to.
#
# WHAT IT DELIBERATELY CANNOT DO:
#   - WRITE to the `boss` namespace, where the system of record lives.
#     (Amended 2026-09-02: the dev-session-ops-read Role at the bottom
#     of this file grants READ visibility there plus rollout-undo on
#     the one deployment — the #178 boot-brick incident routed every
#     diagnostic read through a human terminal. The boundary this
#     header was written for — exec, workload writes, and any path to
#     the production Postgres — stands exactly as before.)
#   - read Secrets, here or anywhere (the forge token mounts into the
#     pod; a shell in the pod reads it from the filesystem, and this
#     credential has no business fetching it over the API) — with ONE
#     name-scoped exception, `boss-dev-forge-token`, granted below so
#     `boss credential pull forge` can land a broker-rotated write
#     token without a hand-paste ceremony (7ee101aa)
#   - create, patch or delete workloads — applying manifests stays a
#     human action with the admin config until there is a check that
#     verifies what it applied (design Q5)
#   - see cluster-scoped objects: nodes, StorageClasses, PVs. Note
#     this means it CANNOT answer the node-capacity question from
#     design Q1; that measurement needs the admin config.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dev-session
  namespace: boss-dev
  labels: {app.kubernetes.io/part-of: boss, boss.dev/purpose: development}
---
# Exec, and the reads you need to exec sensibly. Nothing else.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: dev-session
  namespace: boss-dev
rules:
  # Find the pod to attach to, and see why it is not up when it isn't.
  - apiGroups: [""]
    resources: [pods, pods/log, pods/status]
    verbs: [get, list, watch]
  # The attach itself. `create` on pods/exec is what `kubectl exec`
  # spends; there is no lesser verb for it.
  - apiGroups: [""]
    resources: [pods/exec]
    verbs: [create]
  # Enough to answer "is the workspace still bound, and did the
  # deployment roll" without reaching for the admin config.
  - apiGroups: [""]
    resources: [persistentvolumeclaims]
    verbs: [get, list]
  - apiGroups: [apps]
    resources: [deployments, replicasets]
    verbs: [get, list, watch]
  # Launching a gate. `boss gate` creates a Job and `--wait` needs to
  # tell a dead run from a silent one, which is get/list/watch.
  #
  # DELETE IS WITHHELD ON PURPOSE. The verb never removes a Job, so
  # granting it would be scope nobody asked for — and the withholding
  # has already paid for itself twice: it is why a gate cannot be
  # killed to manufacture a test (car de2f89ab still awaits a natural
  # dead Job rather than a forced one), and it keeps a session from
  # cancelling a run it does not own.
  #
  # THIS RULE LIVES HERE BECAUSE IT WAS ONCE APPLIED BY HAND. On
  # 2026-08-28 it was added with kubectl to close car fd5fc6f4, proven
  # by launching a real gate — and a converge reapplied this file and
  # silently reverted it the same afternoon, so `boss gate` began
  # failing with `jobs.batch is forbidden` again. An imperative grant
  # is not a grant; it is a grant with an expiry nobody was told about.
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [create, get, list, watch]
  # READ WHAT THIS CREDENTIAL IS RESPONSIBLE FOR VERIFYING.
  #
  # The gate runner's script reaches the cluster as ConfigMap
  # `gate-runner-script`, and a session that launches gates could not
  # read it — so "is the runner running the script the tree says?" was
  # unanswerable from the machine that runs the gates. The only way to
  # check was an admin kubeconfig on a workstation, which makes what an
  # operator can VERIFY depend on which machine they came in from
  # rather than on their credential. David, 2026-08-30: "We should have
  # the policy approval regardless of how we come in... assuming our
  # credentials are properly validated with no special backdoors."
  #
  # WORSE, THE ABSENCE READ AS DATA. A forbidden `kubectl get` prints
  # nothing on stdout, so `... | grep -c` returns 0 and a check for
  # "does the live ConfigMap carry this string" answered ZERO for the
  # wrong reason. I made exactly that measurement on 2026-08-30 and
  # only caught it by re-reading with a credential that could actually
  # see (boss-empty-api-reads-mean-wrong-actor, again).
  #
  # READ ONLY, and only here. `create`/`update` stay withheld for the
  # same reason `delete` is withheld on jobs above: the session never
  # writes a ConfigMap — the converge runner owns that — so granting it
  # would be scope nobody asked for.
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [get, list]
  # THE ONE SECRET THIS SESSION MAY READ, BY NAME (7ee101aa). The
  # header's "cannot read Secrets, here or anywhere" stays the rule;
  # this is its single, deliberate exception. When the credential
  # broker rotates the pod's forge write token into
  # `boss-dev-forge-token`, `boss credential pull forge` reads it via
  # kubectl and lands it in the pod's consumer paths (the token file +
  # the git credential helper) — replacing the hand-paste ceremony
  # that exposed the token in a transcript on 2026-09-02. `get` on
  # exactly this name: no `list` (enumeration is how one named grant
  # quietly becomes a browse), and the read token (`forge-read`) stays
  # unreadable because the pod already has it as a file mount.
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [boss-dev-forge-token]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dev-session
  namespace: boss-dev
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: dev-session
subjects:
  - kind: ServiceAccount
    name: dev-session
    namespace: boss-dev
---
# A NON-EXPIRING token, on purpose, and the reasoning is worth keeping.
#
# Since 1.24 a ServiceAccount gets no Secret automatically, and the
# ergonomic path is `kubectl create token`, which mints a bounded one.
# That is the right default and the wrong fit here: the point of this
# credential is that a session on boss-gcp survives without a person
# present, and a token that expires makes the durable session need a
# human on a timer — which is the thing being removed.
#
# The trade is real and is accepted because the grant is small: exec
# into one namespace that holds a disposable workspace and a throwaway
# Postgres. Rotation is `kubectl delete secret dev-session-token -n
# boss-dev` and re-applying this file; nothing caches it but the
# kubeconfig the script writes.
apiVersion: v1
kind: Secret
metadata:
  name: dev-session-token
  namespace: boss-dev
  annotations:
    kubernetes.io/service-account.name: dev-session
type: kubernetes.io/service-account-token
---
# Operational visibility into the boss namespace — the on-duty agent
# reads what any operator would read, without a human relaying kubectl
# output by hand.
#
# WHY (2026-09-02): during the #178 boot-brick incident every
# diagnostic read — the crash-looping pod, its log naming the failing
# line, the rollout history — had to route through David's terminal,
# with outputs pasted back. His words on the record: "I don't want to
# be a weird command-pasting go-between, when this is pure operational
# work." READ-ONLY except one deliberately name-scoped write: `patch`
# on the `boss` deployment alone, which is `kubectl rollout undo` —
# the incident-response verb this same incident needed twice. No
# secrets access; the credential boundary stays exactly where it was.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: dev-session-ops-read
  namespace: boss
rules:
  - apiGroups: [""]
    resources: [pods, pods/log, events, services]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments, replicasets, statefulsets]
    verbs: [get, list, watch]
  - apiGroups: [batch]
    resources: [jobs, cronjobs]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments]
    resourceNames: [boss]
    verbs: [patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dev-session-ops-read
  namespace: boss
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: dev-session-ops-read
subjects:
  - kind: ServiceAccount
    name: dev-session
    namespace: boss-dev
