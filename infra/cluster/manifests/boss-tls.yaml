# TLS for the cluster BOSS — boss.algedonic.dev
#
# The cluster instance is the system of record (David, 2026-08-12),
# and the gateway's session cookie is Secure — over the plain-HTTP
# LoadBalancer every session evaporated (guest bug 8d526469; feedback
# filed as `anonymous`). This gives BOSS the same treatment id.* got:
# a real Let's Encrypt cert via the lego DNS-01 job (browser-trusted
# for direct LAN/WireGuard access — Origin CA certs only satisfy
# Cloudflare's proxy), terminated by a Caddy front in the boss
# namespace, on its own LB IP.
#
# DNS: A boss.algedonic.dev -> 10.20.0.33, DNS-only (grey cloud) —
# the record resolves publicly but the address is LAN/WG-private,
# which is exactly the audience of the system of record. The record
# is created by the dns-record Job below with the same in-cluster
# Cloudflare token lego uses; the token never leaves the cluster.
#
# Apply order: this file (cert + DNS jobs run ~5-15 min because this
# zone publishes DNS slowly — see lego-issuer.yaml), then
# boss-tls-front.yaml once the boss-tls secret exists.
---
apiVersion: batch/v1
kind: Job
metadata:
  name: boss-dns-record
  namespace: cert-manager
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: dns
          image: alpine/k8s:1.33.3
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              AUTH="Authorization: Bearer ${CF_TOKEN}"
              ZONE=$(curl -fsS -H "$AUTH" \
                "https://api.cloudflare.com/client/v4/zones?name=algedonic.dev" \
                | jq -r '.result[0].id')
              EXISTING=$(curl -fsS -H "$AUTH" \
                "https://api.cloudflare.com/client/v4/zones/$ZONE/dns_records?name=boss.algedonic.dev&type=A" \
                | jq -r '.result[0].id // empty')
              BODY='{"type":"A","name":"boss","content":"10.20.0.33","ttl":300,"proxied":false,"comment":"cluster BOSS gateway (LAN/WG only) - system of record"}'
              if [ -n "$EXISTING" ]; then
                curl -fsS -X PUT -H "$AUTH" -H 'Content-Type: application/json' \
                  "https://api.cloudflare.com/client/v4/zones/$ZONE/dns_records/$EXISTING" \
                  -d "$BODY" | jq -r '"updated: " + .result.name + " -> " + .result.content'
              else
                curl -fsS -X POST -H "$AUTH" -H 'Content-Type: application/json' \
                  "https://api.cloudflare.com/client/v4/zones/$ZONE/dns_records" \
                  -d "$BODY" | jq -r '"created: " + .result.name + " -> " + .result.content'
              fi
          env:
            - name: CF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cloudflare-api-token
                  key: api-token
---
apiVersion: batch/v1
kind: Job
metadata:
  name: boss-cert-issue
  namespace: cert-manager
spec:
  backoffLimit: 2
  template:
    spec:
      serviceAccountName: lego-issuer
      restartPolicy: Never
      volumes:
        - name: certs
          persistentVolumeClaim:
            claimName: lego-data
      initContainers:
        - name: lego
          image: goacme/lego:v4.21.0
          args:
            - --accept-tos
            - --email=dhauld@gmail.com
            - --dns=cloudflare
            - --domains=boss.algedonic.dev
            - --path=/certs
            - --server=https://acme-v02.api.letsencrypt.org/directory
            - run
          env:
            - name: CLOUDFLARE_DNS_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cloudflare-api-token
                  key: api-token
            # Same fix as id.algedonic.dev: this zone publishes DNS
            # records minutes late; lego's default gives up first.
            - name: CLOUDFLARE_PROPAGATION_TIMEOUT
              value: "1800"
            - name: CLOUDFLARE_POLLING_INTERVAL
              value: "15"
          volumeMounts:
            - name: certs
              mountPath: /certs
      containers:
        - name: publish
          image: alpine/k8s:1.33.3
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              D=boss.algedonic.dev
              kubectl create secret tls boss-tls \
                --cert=/certs/certificates/${D}.crt \
                --key=/certs/certificates/${D}.key \
                -n boss --dry-run=client -o yaml | kubectl apply -f -
              echo "published boss-tls to ns boss"
          volumeMounts:
            - name: certs
              mountPath: /certs
