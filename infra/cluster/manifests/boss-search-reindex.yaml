# The SoR's search reindex — the first maintenance chore that RUNS
# where its packet lives.
#
# Until this existed the only reindex runner was a boss-gcp systemd
# timer whose BOSS_POSTGRES_URL is boss-gcp's LOCAL demo database,
# while its BOSS_JOBS_URL pointed at the cluster — so the cluster's
# packet got `result=ok` for work the cluster never received, and the
# cluster's search_index stayed EMPTY from the day it was created
# (measured 2026-08-19: every /api/search query returned nothing, id
# or text alike). The rule this fixes into place: a chore reports to
# the jobs API of the instance whose DATA it maintains.
#
# Same cadence contract as the boss-gcp timer (see
# infra/boss-search-reindex.timer): a full TRUNCATE-and-replay every
# ten minutes — there is no watermark that makes an append correct,
# and a missed window just runs late.
#
# The image tag is a placeholder; cluster-deploy-runner.sh sets the
# real one alongside deploy/boss on every converge, so the chore
# always runs the deployed build.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: boss-search-reindex
  namespace: boss
  labels:
    # Every in-cluster maintenance chore carries this label and names
    # its container `chore`: cluster-deploy-runner pins the deployed
    # image on the whole set in one selector, so adding a chore is a
    # manifest, never a runner edit.
    boss-chore: "true"
spec:
  schedule: "*/10 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        spec:
          # The uid this workload runs as, DECLARED rather than inherited from
          # the image (backlog 5234cda4; the reasoning and the exemption list
          # are in infra/lint/a-workload-declares-the-user-it-runs-as.sh, and
          # the README section "Pod security" below it).
          #
          # MEASURED, not inferred from the image name: `id` inside the live
          # boss-image pod answers uid=1500(boss) gid=1500(boss), the image's
          # final directive is `USER boss` over `useradd --uid 1500`
          # (infra/oss-quickstart/Dockerfile, which cluster-deploy-runner.sh
          # builds this tag from), and no pod in this namespace overrides
          # runAsUser. So this states what ALREADY happens and changes no
          # behaviour — which is the whole point: the declaration is what
          # survives a cluster-wide restricted default, the behaviour was
          # never the gap.
          securityContext:
            runAsNonRoot: true
            runAsUser: 1500
            runAsGroup: 1500
            seccompProfile: {type: RuntimeDefault}
          restartPolicy: Never
          volumes:
            # The estate machine token, Secret boss-machine-token, whole —
            # the broker writes it (design 6805c764 car 4). Optional: until
            # its first mint the directory is empty and the chore sends no
            # token, which every gate in `report` admits. 0444, because this
            # pod sets no fsGroup and runs one uid; the file is the token's
            # only copy in the container, never an env var.
            - name: machine-token
              secret: {secretName: boss-machine-token, optional: true, defaultMode: 0444}
          containers:
            - name: chore
              image: 10.20.0.15:3000/david/boss:latest
              # Baseline/restricted floor for a chore that needs neither: it shells
              # out to boss binaries and curl, nothing setuid, no capability.
              # readOnlyRootFilesystem is deliberately NOT set — boss-generate-configs
              # writes files, so that one would change behaviour and belongs to a car
              # that measured it.
              securityContext:
                allowPrivilegeEscalation: false
                capabilities: {drop: ["ALL"]}
              command: ["/bin/bash", "-c"]
              args:
                - |
                  set -euo pipefail
                  /usr/local/bin/boss-chore.sh maintenance-search-reindex "search_index rebuild" -- /usr/local/bin/boss-search-reindex
              # The estate machine token (the pod's machine-token volume): its
              # wrap and step stamp `current` on the packet writes, only to
              # the hosts BOSS_MACHINE_TOKEN_HOSTS names (design 6805c764 car 4).
              volumeMounts:
                - {name: machine-token, mountPath: /etc/boss/machine-token, readOnly: true}
              env:
                - name: RUST_LOG
                  value: info
                - name: BOSS_POSTGRES_URL
                  valueFrom:
                    secretKeyRef:
                      name: boss-secrets
                      key: database-url
                # In-cluster DNS for the jobs LB service: the packet
                # this completes is the SoR's own.
                - name: BOSS_JOBS_URL
                  value: http://boss-jobs-internal.boss.svc.cluster.local:7900
                - name: BOSS_MACHINE_TOKEN_HOSTS
                  value: ".boss.svc.cluster.local"
