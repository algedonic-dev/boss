# The SoR's search reindex — the first maintenance chore that RUNS
# where its packet lives.
#
# Until this existed the only reindex runner was a boss-gcp systemd
# timer whose BOSS_POSTGRES_URL is boss-gcp's LOCAL demo database,
# while its BOSS_JOBS_URL pointed at the cluster — so the cluster's
# packet got `result=ok` for work the cluster never received, and the
# cluster's search_index stayed EMPTY from the day it was created
# (measured 2026-08-19: every /api/search query returned nothing, id
# or text alike). The rule this fixes into place: a chore reports to
# the jobs API of the instance whose DATA it maintains.
#
# Same cadence contract as the boss-gcp timer (see
# infra/boss-search-reindex.timer): a full TRUNCATE-and-replay every
# ten minutes — there is no watermark that makes an append correct,
# and a missed window just runs late.
#
# The image tag is a placeholder; cluster-deploy-runner.sh sets the
# real one alongside deploy/boss on every converge, so the chore
# always runs the deployed build.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: boss-search-reindex
  namespace: boss
  labels:
    # Every in-cluster maintenance chore carries this label and names
    # its container `chore`: cluster-deploy-runner pins the deployed
    # image on the whole set in one selector, so adding a chore is a
    # manifest, never a runner edit.
    boss-chore: "true"
spec:
  schedule: "*/10 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: chore
              image: 10.20.0.15:3000/david/boss:latest
              command: ["/bin/bash", "-c"]
              args:
                - |
                  set -euo pipefail
                  /usr/local/bin/boss-maintenance-wrap.sh maintenance-search-reindex "search_index rebuild"
                  /usr/local/bin/boss-search-reindex
                  /usr/local/bin/boss-step.sh maintenance-search-reindex run result=ok
              env:
                - name: RUST_LOG
                  value: info
                - name: BOSS_POSTGRES_URL
                  valueFrom:
                    secretKeyRef:
                      name: boss-secrets
                      key: database-url
                # In-cluster DNS for the jobs LB service: the packet
                # this completes is the SoR's own.
                - name: BOSS_JOBS_URL
                  value: http://boss-jobs-internal.boss.svc.cluster.local:7900
                # Forward-compatible with machine-token activation
                # (docs/runbooks/machine-token-activation.md): optional
                # until David creates the key, then writes carry it.
                - name: BOSS_MACHINE_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: boss-secrets
                      key: machine-token
                      optional: true
