# Nightly pg_dump of the cluster BOSS database — the system of
# record gets backups on day one (David, 2026-08-12).
#
# Dump to a Longhorn PVC (14-day retention), then ship the fresh
# dump offsite to the playground box via the kanidm backup-shipper
# pattern: a deposit-only forced-command SSH key (secret
# boss-backup-key) whose entire blast radius is 'can write files
# into /var/backups/boss-cluster-pg on boss-gcp'. The receiver
# (boss-cluster-pg-recv.sh there) stamps names server-side and
# keeps the most recent 21. A failed ship fails the Job loudly —
# an offsite copy that silently stops is worse than none.
#
# The dump is plain SQL of the whole database. audit_log is the
# system of record inside the system of record — a restore is
# schema + audit_log + boss-rebuild-all, same as dev-refresh.sh —
# but a full dump keeps the restore path dumb, which is what you
# want at 03:00.
#
# SECOND OFFSITE LEG — GCS (David, 2026-08-29, option (c)).
# One offsite copy on one box means boss-gcp was both the backup
# basket and a single point of loss: lose it and the dumps go with
# it. The obvious fix — have boss-gcp push to GCS — is not available,
# because that VM's access scopes grant devstorage.READ_ONLY and an
# instance token cannot write to a bucket no matter what IAM says.
# So the flow is REVERSED: the cluster, which has no such scope
# ceiling, uploads directly with a service-account key. boss-gcp
# keeps its copy and stops being the only one.
#
# Pins: no LAN door of its own; ships offsite to boss-gcp
# (david@34.45.110.40, the playground box) with the deposit-only key
# in secret boss-backup-key, and uploads to the bucket named in
# secret boss-gcs-offsite (keys: sa.json, bucket). Secrets are
# referenced by name only — they are created out-of-band and never
# live in this tree. Until that secret exists the CronJob's upload
# leg fails loudly, which is the intended state: a backup leg that
# degrades quietly is the failure this whole file is written against.
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: boss-backups
  namespace: boss
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 20Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: boss-pg-backup
  namespace: boss
spec:
  schedule: "10 9 * * *"   # 09:10 UTC — after the household's day starts, before the US one
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          # The dump image comes from the forge registry, like every
          # other postgres in the estate since #265/#266 (the mirror
          # verb put postgres:16-alpine there on 2026-09-08, ops-request
          # 442a6d3f); the same namespace Secret deploy/boss pulls with.
          imagePullSecrets:
            - {name: forgejo-registry}
          # THE LEGS ARE ORDERED BY BEING initContainers. Sibling
          # containers in a Pod start together, so a second container
          # could upload while pg_dump was still writing; an
          # initContainer is the only thing that guarantees the dump
          # finished first. Everything that DOES the backup lives here,
          # in order, and the one main container below closes the
          # packet — which is what makes `result=ok` a fact rather than
          # a hope: Kubernetes stops the Pod at the first initContainer
          # that fails, so the closer runs if and only if every leg
          # before it passed.
          initContainers:
            # THE PACKET. Backlog 60095754: this CronJob replaced the
            # boss-gcp host timer at the 2026-09-04 cutover and did not
            # take the timer's ExecStartPre with it, so the backups ran
            # nightly and the system of record last saw one on
            # 2026-08-19 — twenty days of a healthy backup that nothing
            # could tell apart from a stopped one. Seven of the nine
            # cluster CronJobs already call these two helpers; this is
            # the eighth. The helpers are pure HTTP to the jobs API, so
            # they need only the boss image and BOSS_JOBS_URL.
            #
            # IT CANNOT STOP THE BACKUP. The packet is visibility, never
            # a precondition (CLAUDE.md §Diagnosis, "an arm that needs
            # the patient is not an arm"): boss-ml-inference-batch lost
            # 23 consecutive nights to a hard ExecStartPre that met a
            # 400. So every failure here is logged and swallowed, and
            # the dump runs regardless. A run with no packet is a run
            # whose visibility was lost; a run that never happened
            # because its packet could not open is an outage.
            - name: open-packet
              image: 10.20.0.15:3000/david/boss:latest
              command: ["/bin/bash", "-c"]
              args:
                - |
                  set -uo pipefail
                  # Opens today's packet, or REUSES an open one: a run
                  # that failed left its packet open, and today's
                  # success completing it is the recovery. That is what
                  # keeps the pile at one open Job per chore.
                  /usr/local/bin/boss-maintenance-wrap.sh maintenance-backup "Nightly backup" \
                    || echo "open-packet: the packet did not open (exit $?) — the backup runs anyway; only this run's visibility is lost" >&2
                  exit 0
              env:
                - name: BOSS_JOBS_URL
                  value: http://boss-jobs-internal.boss.svc.cluster.local:7900
                - name: BOSS_MACHINE_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: boss-secrets
                      key: machine-token
                      optional: true
            - name: dump
              image: 10.20.0.15:3000/david/postgres:16-alpine
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -e
                  STAMP=$(date -u +%Y%m%d-%H%M%S)
                  OUT=/backup/boss-${STAMP}.sql.gz
                  pg_dump "$DATABASE_URL" | gzip > "$OUT"
                  # VERIFY THE ARTEFACT, NOT THE EXIT CODE. `set -e` does
                  # not fire for the LEFT side of a pipe, so a pg_dump that
                  # died mid-stream left a truncated .gz here and the Job
                  # reported success — a backup that is worse than none
                  # because it looks present. gzip -t proves the stream is
                  # whole and pg_dump's own trailer proves it ran to the
                  # end; nothing ships or uploads until both hold.
                  gzip -t "$OUT"
                  # No leading "--" in the pattern: grep reads a pattern
                  # that starts with dashes as an OPTION and exits with a
                  # usage error, which under set -e fails the Job every
                  # night. Caught by running this check against a real
                  # gzip before shipping it.
                  gzip -dc "$OUT" | tail -5 | grep -q 'PostgreSQL database dump complete'
                  SIZE=$(du -h "$OUT" | cut -f1)
                  echo "dumped $OUT ($SIZE), verified complete"
                  # Name the file this run produced, so the upload leg
                  # cannot quietly ship yesterday's dump if today's is
                  # missing.
                  echo "$OUT" > /backup/.latest
                  # Retention: 14 days. Prune loudly, never silently.
                  find /backup -name 'boss-*.sql.gz' -mtime +14 -print -delete
                  # Offsite: ship tonight's dump to the playground box.
                  # The key is deposit-only (forced command + restrict);
                  # the receiver stamps the name and prunes its own set.
                  apk add --no-cache openssh-client >/dev/null 2>&1
                  install -m 600 /keys/id_ed25519 /tmp/k
                  cat "$OUT" | ssh -i /tmp/k \
                    -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
                    -o ConnectTimeout=20 david@34.45.110.40
                  echo "backups on volume:"; ls -lh /backup | tail -8
              env:
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: boss-secrets
                      key: database-url
              volumeMounts:
                - {name: backups, mountPath: /backup}
                - {name: ship-key, mountPath: /keys, readOnly: true}
            # SECOND OFFSITE LEG. This was the Pod's one main container
            # until the packet wiring landed; it is an initContainer now
            # for one reason — so a container that runs AFTER it can
            # vouch for it. Its script, its image and its volumes are
            # unchanged, and an initContainer that exits non-zero fails
            # the Job exactly as a main container did (restartPolicy:
            # Never), so a failed upload is still loud.
            - name: offsite-gcs
              image: google/cloud-sdk:alpine
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -e
                  BUCKET=$(cat /gcs/bucket)
                  gcloud auth activate-service-account --key-file=/gcs/sa.json --quiet
                  OUT=$(cat /backup/.latest)
                  test -s "$OUT"
                  gcloud storage cp "$OUT" "gs://${BUCKET}/$(basename "$OUT")"
                  echo "uploaded $(basename "$OUT") to gs://${BUCKET}"
                  # Retention mirrors the playground receiver's keep-21,
                  # so the two offsite copies age out together. Prune by
                  # NAME order, which is chronological because the stamp
                  # is %Y%m%d-%H%M%S — never by listing order.
                  gcloud storage ls "gs://${BUCKET}/" \
                    | grep -E 'boss-.*\.sql\.gz$' | sort > /tmp/all
                  TOTAL=$(wc -l < /tmp/all)
                  if [ "$TOTAL" -gt 21 ]; then
                    for obj in $(head -n $((TOTAL - 21)) /tmp/all); do
                      echo "pruning $obj"; gcloud storage rm "$obj"
                    done
                  fi
                  echo "offsite copies now: $(gcloud storage ls "gs://${BUCKET}/" | grep -cE 'boss-.*\.sql\.gz$')"
              volumeMounts:
                - {name: backups, mountPath: /backup, readOnly: true}
                - {name: gcs-key, mountPath: /gcs, readOnly: true}
          # THE VERDICT, and the only main container. It runs if and
          # only if every initContainer above passed, so `result=ok` is
          # the Pod's own structure saying so rather than a claim this
          # script makes. A dump that dies, a ship that dies, an upload
          # that dies: the Pod stops there, this never runs, and the
          # packet stays OPEN — where the next successful run's wrap
          # reuses it (recovery) and the silence sweep can see it
          # meanwhile. A failed run must never close green; that is the
          # whole point of putting the close last.
          #
          # AND IT NEVER FAILS THE JOB. The backup is finished and
          # verified by the time this runs. If the jobs API is dark, a
          # non-zero exit here would report a good backup as failed AND
          # spend backoffLimit re-running the entire dump-and-ship for a
          # lost HTTP call. So the close is best-effort and loud, like
          # the open.
          containers:
            - name: close-packet
              image: 10.20.0.15:3000/david/boss:latest
              command: ["/bin/bash", "-c"]
              args:
                - |
                  set -uo pipefail
                  # What the run already printed, carried on the packet:
                  # the dump this run produced (.latest is written by
                  # the dump leg, so it cannot name yesterday's), its
                  # size, and where the copies went.
                  OUT=$(cat /backup/.latest 2>/dev/null || true)
                  DUMP=$(basename "${OUT:-unknown}")
                  SIZE=unknown
                  if [ -n "$OUT" ] && [ -f "$OUT" ]; then SIZE=$(du -h "$OUT" | cut -f1); fi
                  echo "close-packet: $DUMP ($SIZE), offsite boss-gcp + gcs"
                  /usr/local/bin/boss-step.sh maintenance-backup run \
                      result=ok dump="$DUMP" size="$SIZE" offsite="boss-gcp,gcs" \
                    || echo "close-packet: the packet did not close (exit $?) — the dump is written, verified and shipped; only this run's visibility is lost" >&2
                  exit 0
              env:
                - name: BOSS_JOBS_URL
                  value: http://boss-jobs-internal.boss.svc.cluster.local:7900
                - name: BOSS_MACHINE_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: boss-secrets
                      key: machine-token
                      optional: true
              volumeMounts:
                - {name: backups, mountPath: /backup, readOnly: true}
          volumes:
            - name: backups
              persistentVolumeClaim: {claimName: boss-backups}
            - name: ship-key
              # 0o400, matching the GCS key below. It was 0o256, which
              # kubectl confirms the API stored as decimal 174 — the
              # octal was parsed correctly and the NUMBER was the
              # problem: owner write-only, group read-execute, other
              # read-write. The dump container reads this key to ship
              # offsite and only ever succeeded because it runs as
              # root, which ignores the bits. The moment anything gives
              # this Pod runAsNonRoot — which the cluster's restricted
              # profile already warns about elsewhere in this estate —
              # an owner-unreadable key stops being readable and the
              # offsite leg fails, loudly but as an SSH problem rather
              # than as a file mode set months earlier (backlog
              # a05835da).
              secret: {secretName: boss-backup-key, defaultMode: 0o400}
            - name: gcs-key
              secret: {secretName: boss-gcs-offsite, defaultMode: 0o400}
