# Nightly pg_dump of the cluster BOSS database — the system of
# record gets backups on day one (David, 2026-08-12).
#
# Dump to a Longhorn PVC (14-day retention), then upload the fresh
# dump offsite to a GCS bucket. A failed upload fails the Job loudly —
# an offsite copy that silently stops is worse than none.
#
# The dump is plain SQL of the whole database. audit_log is the
# system of record inside the system of record — a restore is
# schema + audit_log + boss-rebuild-all — but a full dump keeps the
# restore path dumb, which is what you
# want at 03:00.
#
# THE OFFSITE LEG — GCS (David, 2026-08-29, option (c)). The cluster,
# not boss-gcp, uploads: that VM's access scopes grant
# devstorage.READ_ONLY, and an instance token cannot write to a bucket
# no matter what IAM says, while the cluster has no such ceiling and
# uploads with a service-account key.
#
# THE ONLY OFFSITE LEG (David, 2026-10-01, backlog 4bf7bdd1: "boss-gcp
# doesn't need to be storage backup"). Until then each dump was ALSO
# shipped to boss-gcp over a deposit-only forced-command ssh key, into
# a receiver that kept 21 there. That copy held dumps only (the
# file-store archive rode GCS alone, so a restore from it brought back
# rows without their files) and it filled boss-gcp's root — 9.5 GB of
# a 47 GB disk, 16 GB free against its 17 GB floor (estate alarm
# a9476cbf). The leg is deleted here; what it left on boss-gcp goes
# through the bounded reclaim-gcp-root verb (bound 8), never by hand.
# The recovery sheet's backups road names the bucket as THE offsite
# copy and prints how to fetch a dump from it.
#
# Pins: no LAN door of its own; uploads to the bucket named in secret
# boss-gcs-offsite (keys: sa.json, bucket). The Secret is referenced by
# name only — it is created out-of-band and never lives in this tree.
# Until it exists the CronJob's upload leg fails loudly, which is the
# intended state: a backup leg that degrades quietly is the failure
# this whole file is written against.
#
# THE FILE STORE (backlog 6280be03, 2026-09-23). file_refs keeps its
# rows in Postgres and its BYTES on the boss-files claim (boss.yaml). A
# dump alone restores every row pointing at bytes nobody kept, so since
# the store was switched on each run also archives the claim, stamped
# like the dump it pairs with (boss-files-<stamp>.tar.gz beside
# boss-<stamp>.sql.gz), and uploads it to GCS with the dump. A restore
# is the dump plus that archive unpacked into the new root.
#
# ONE ARCHIVE COVERS EVERY RETAINED DUMP, which is why fewer are kept.
# The store is content-addressed and never rewrites an object, and
# boss-files-gc deletes bytes only when their last ref was soft-deleted
# more than 30 days earlier (DEFAULT_GC_GRACE_DAYS). So the newest
# archive holds every object any dump younger than 30 days points to —
# and every dump either copy keeps (14 days here, 21 in the bucket) is. Each
# archive is a FULL copy, so keeping 14 of them would fill this volume
# long before the dumps did; three are kept on each side, enough to
# survive a bad night.
#
# boss-files is ReadWriteOnce, so this pod runs beside deploy/boss (the
# podAffinity below); a run while that pod is down waits until it is
# back. The four consumers of the root are held equal by
# crates/core/boss-testing/tests/the_file_store_rides_a_declared_volume.rs.
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: boss-backups
  namespace: boss
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 20Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: boss-pg-backup
  namespace: boss
spec:
  schedule: "10 9 * * *"   # 09:10 UTC — after the household's day starts, before the US one
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          # Beside deploy/boss: the file-store leg mounts its RWO
          # boss-files volume, which is attached to that pod's node.
          affinity:
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector: {matchLabels: {app: boss}}
                  topologyKey: kubernetes.io/hostname
          # The dump image comes from the forge registry, like every
          # other postgres in the estate since #265/#266 (the mirror
          # verb put postgres:16-alpine there on 2026-09-08, ops-request
          # 442a6d3f); the same namespace Secret deploy/boss pulls with.
          imagePullSecrets:
            - {name: forgejo-registry}
          # THE LEGS ARE ORDERED BY BEING initContainers. Sibling
          # containers in a Pod start together, so a second container
          # could upload while pg_dump was still writing; an
          # initContainer is the only thing that guarantees the dump
          # finished first. Everything that DOES the backup lives here,
          # in order, and the one main container below closes the
          # packet — which is what makes `result=ok` a fact rather than
          # a hope: Kubernetes stops the Pod at the first initContainer
          # that fails, so the closer runs if and only if every leg
          # before it passed.
          initContainers:
            # THE PACKET. Backlog 60095754: this CronJob replaced the
            # boss-gcp host timer at the 2026-09-04 cutover and did not
            # take the timer's ExecStartPre with it, so the backups ran
            # nightly and the system of record last saw one on
            # 2026-08-19 — twenty days of a healthy backup that nothing
            # could tell apart from a stopped one. Seven of the nine
            # cluster CronJobs already call these two helpers; this is
            # the eighth. The helpers are pure HTTP to the jobs API, so
            # they need only the boss image and BOSS_JOBS_URL.
            #
            # IT CANNOT STOP THE BACKUP. The packet is visibility, never
            # a precondition (CLAUDE.md §Diagnosis, "an arm that needs
            # the patient is not an arm"): boss-ml-inference-batch lost
            # 23 consecutive nights to a hard ExecStartPre that met a
            # 400. So every failure here is logged and swallowed, and
            # the dump runs regardless. A run with no packet is a run
            # whose visibility was lost; a run that never happened
            # because its packet could not open is an outage.
            - name: open-packet
              image: 10.20.0.15:3000/david/boss:latest
              command: ["/bin/bash", "-c"]
              args:
                - |
                  set -uo pipefail
                  # Opens today's packet, or REUSES an open one: a run
                  # that failed left its packet open, and today's
                  # success completing it is the recovery. That is what
                  # keeps the pile at one open Job per chore.
                  /usr/local/bin/boss-maintenance-wrap.sh maintenance-backup "Nightly backup" \
                    || echo "open-packet: the packet did not open (exit $?) — the backup runs anyway; only this run's visibility is lost" >&2
                  bash /usr/local/bin/boss-filesystem-sample.sh maintenance-backup run boss-backups /backup start \
                    || echo 'WARNING: mounted start sample was not recorded; filesystem health remains blind' >&2
                  exit 0
              env:
                - name: BOSS_FS_NAMESPACE
                  valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
                - name: BOSS_FS_POD_UID
                  valueFrom: {fieldRef: {fieldPath: metadata.uid}}
                - name: BOSS_FS_POD
                  valueFrom: {fieldRef: {fieldPath: metadata.name}}
                - name: BOSS_FS_NODE
                  valueFrom: {fieldRef: {fieldPath: spec.nodeName}}
                - name: BOSS_FS_JOB_UID
                  valueFrom: {fieldRef: {fieldPath: "metadata.labels['batch.kubernetes.io/controller-uid']"}}
                - name: BOSS_JOBS_URL
                  value: http://boss-jobs-internal.boss.svc.cluster.local:7900
                # The hosts its packet writes may carry the estate machine
                # token to, besides loopback: this namespace's Services, by
                # suffix (backlog 2ee29275; the car-4 checklist on 2710c8fc
                # — without it the token reaches boss-jobs-internal unstamped).
                - name: BOSS_MACHINE_TOKEN_HOSTS
                  value: ".boss.svc.cluster.local"
              # The estate machine token, read by boss-maintenance-wrap.sh
              # (design 6805c764 car 4).
              volumeMounts:
                - {name: backups, mountPath: /backup, readOnly: true}
                - {name: machine-token, mountPath: /etc/boss/machine-token, readOnly: true}
            - name: dump
              image: 10.20.0.15:3000/david/postgres:16-alpine
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -e
                  STAMP=$(date -u +%Y%m%d-%H%M%S)
                  OUT=/backup/boss-${STAMP}.sql.gz
                  pg_dump "$DATABASE_URL" | gzip > "$OUT"
                  # VERIFY THE ARTEFACT, NOT THE EXIT CODE. `set -e` does
                  # not fire for the LEFT side of a pipe, so a pg_dump that
                  # died mid-stream left a truncated .gz here and the Job
                  # reported success — a backup that is worse than none
                  # because it looks present. gzip -t proves the stream is
                  # whole and pg_dump's own trailer proves it ran to the
                  # end; nothing ships or uploads until both hold.
                  gzip -t "$OUT"
                  # No leading "--" in the pattern: grep reads a pattern
                  # that starts with dashes as an OPTION and exits with a
                  # usage error, which under set -e fails the Job every
                  # night. Caught by running this check against a real
                  # gzip before shipping it.
                  gzip -dc "$OUT" | tail -5 | grep -q 'PostgreSQL database dump complete'
                  SIZE=$(du -h "$OUT" | cut -f1)
                  echo "dumped $OUT ($SIZE), verified complete"
                  # Name the file this run produced, so the upload leg
                  # cannot quietly ship yesterday's dump if today's is
                  # missing.
                  echo "$OUT" > /backup/.latest
                  # Retention: 14 days. Prune loudly, never silently.
                  find /backup -name 'boss-*.sql.gz' -mtime +14 -print -delete
                  echo "backups on volume:"; ls -lh /backup | tail -8
              env:
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: boss-secrets
                      key: database-url
              volumeMounts:
                - {name: backups, mountPath: /backup}
            # THE FILE STORE (see the header). After the dump, never
            # before: an object's bytes are written before its ref row
            # commits, so an archive taken after the dump holds every
            # object the dump points to. Same image as the dump (busybox
            # tar, gzip, find).
            - name: files
              image: 10.20.0.15:3000/david/postgres:16-alpine
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -e
                  # The volume, or nothing. Absent, this would archive an
                  # empty directory and call it a backup of an empty store.
                  test -d /var/lib/boss/files || { echo "files: /var/lib/boss/files is not mounted — the file store is not in this pod" >&2; exit 1; }
                  # Paired with the dump THIS run produced, by its stamp.
                  STAMP=$(basename "$(cat /backup/.latest)" .sql.gz)
                  FOUT=/backup/boss-files-${STAMP#boss-}.tar.gz
                  # Count the objects BEFORE archiving: uploads keep landing,
                  # so the archive may hold more, never fewer. A temp file
                  # mid-upload (sha256/<hex>.<uuid>.tmp) is not an object.
                  WANT=$(find /var/lib/boss/files -type f | grep -cE '/sha256/[0-9a-f]+$' || true)
                  tar -czf "$FOUT" -C /var/lib/boss/files .
                  # VERIFY THE ARTEFACT, as the dump does: the stream is whole
                  # and it lists at least every object counted above.
                  gzip -t "$FOUT"
                  tar -tzf "$FOUT" > ${TMPDIR:-/tmp}/archive.list
                  GOT=$(grep -cE '^(\./)?sha256/[0-9a-f]+$' ${TMPDIR:-/tmp}/archive.list || true)
                  if [ "$GOT" -lt "$WANT" ]; then
                    echo "files: $FOUT lists $GOT objects; the store held $WANT before it was written" >&2
                    exit 1
                  fi
                  echo "$FOUT" > /backup/.latest-files
                  echo "archived $FOUT ($GOT objects, $(du -h "$FOUT" | cut -f1)), verified"
                  # Retention: three archives (see the header). Loudly.
                  find /backup -name 'boss-files-*.tar.gz' -mtime +2 -print -delete
              volumeMounts:
                - {name: backups, mountPath: /backup}
                - {name: file-store, mountPath: /var/lib/boss/files, readOnly: true}
            # THE OFFSITE LEG. This was the Pod's one main container
            # until the packet wiring landed; it is an initContainer now
            # for one reason — so a container that runs AFTER it can
            # vouch for it. Its script, its image and its volumes are
            # unchanged, and an initContainer that exits non-zero fails
            # the Job exactly as a main container did (restartPolicy:
            # Never), so a failed upload is still loud.
            - name: offsite-gcs
              image: google/cloud-sdk:alpine
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -e
                  BUCKET=$(cat /gcs/bucket)
                  gcloud auth activate-service-account --key-file=/gcs/sa.json --quiet
                  OUT=$(cat /backup/.latest)
                  test -s "$OUT"
                  gcloud storage cp "$OUT" "gs://${BUCKET}/$(basename "$OUT")"
                  echo "uploaded $(basename "$OUT") to gs://${BUCKET}"
                  # The file-store archive this run produced, the same way.
                  FOUT=$(cat /backup/.latest-files)
                  test -s "$FOUT"
                  gcloud storage cp "$FOUT" "gs://${BUCKET}/$(basename "$FOUT")"
                  echo "uploaded $(basename "$FOUT") to gs://${BUCKET}"
                  # prune PATTERN KEEP. Dumps keep 21 — three weeks, the
                  # count the retired boss-gcp receiver kept, so the leg's
                  # retirement shortened no history; file-store archives
                  # keep 3 (see the header).
                  # Prune by NAME order, which is chronological because the
                  # stamp is %Y%m%d-%H%M%S — never by listing order.
                  prune() {
                    gcloud storage ls "gs://${BUCKET}/" \
                      | grep -E "$1" | sort > ${TMPDIR:-/tmp}/all
                    TOTAL=$(wc -l < ${TMPDIR:-/tmp}/all)
                    if [ "$TOTAL" -gt "$2" ]; then
                      for obj in $(head -n $((TOTAL - $2)) ${TMPDIR:-/tmp}/all); do
                        echo "pruning $obj"; gcloud storage rm "$obj"
                      done
                    fi
                  }
                  prune 'boss-.*\.sql\.gz$' 21
                  prune 'boss-files-.*\.tar\.gz$' 3
                  echo "offsite copies now: $(gcloud storage ls "gs://${BUCKET}/" | grep -cE 'boss-.*\.sql\.gz$') dumps, $(gcloud storage ls "gs://${BUCKET}/" | grep -cE 'boss-files-.*\.tar\.gz$') file-store archives"
              volumeMounts:
                - {name: backups, mountPath: /backup, readOnly: true}
                - {name: gcs-key, mountPath: /gcs, readOnly: true}
          # THE VERDICT, and the only main container. It runs if and
          # only if every initContainer above passed, so `result=ok` is
          # the Pod's own structure saying so rather than a claim this
          # script makes. A dump that dies, an archive that dies, an upload
          # that dies: the Pod stops there, this never runs, and the
          # packet stays OPEN — where the next successful run's wrap
          # reuses it (recovery) and the silence sweep can see it
          # meanwhile. A failed run must never close green; that is the
          # whole point of putting the close last.
          #
          # AND IT NEVER FAILS THE JOB. The backup is finished and
          # verified by the time this runs. If the jobs API is dark, a
          # non-zero exit here would report a good backup as failed AND
          # spend backoffLimit re-running the entire dump-and-upload for a
          # lost HTTP call. So the close is best-effort and loud, like
          # the open.
          containers:
            - name: close-packet
              image: 10.20.0.15:3000/david/boss:latest
              command: ["/bin/bash", "-c"]
              args:
                - |
                  set -uo pipefail
                  # What the run already printed, carried on the packet:
                  # the dump this run produced (.latest is written by
                  # the dump leg, so it cannot name yesterday's), its
                  # size, and where the copies went.
                  OUT=$(cat /backup/.latest 2>/dev/null || true)
                  DUMP=$(basename "${OUT:-unknown}")
                  SIZE=unknown
                  if [ -n "$OUT" ] && [ -f "$OUT" ]; then SIZE=$(du -h "$OUT" | cut -f1); fi
                  # The file-store archive paired with it (gcs only).
                  FOUT=$(cat /backup/.latest-files 2>/dev/null || true)
                  FILES=$(basename "${FOUT:-unknown}")
                  echo "close-packet: $DUMP ($SIZE), offsite gcs; $FILES to gcs"
                  bash /usr/local/bin/boss-filesystem-sample.sh maintenance-backup run boss-backups /backup final \
                    || echo 'WARNING: mounted final sample was not recorded; filesystem health remains blind' >&2
                  /usr/local/bin/boss-step.sh maintenance-backup run \
                      result=ok dump="$DUMP" size="$SIZE" offsite="gcs" files="$FILES" \
                    || echo "close-packet: the packet did not close (exit $?) — the dump is written, verified and uploaded; only this run's visibility is lost" >&2
                  exit 0
              env:
                - name: BOSS_FS_NAMESPACE
                  valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
                - name: BOSS_FS_POD_UID
                  valueFrom: {fieldRef: {fieldPath: metadata.uid}}
                - name: BOSS_FS_POD
                  valueFrom: {fieldRef: {fieldPath: metadata.name}}
                - name: BOSS_FS_NODE
                  valueFrom: {fieldRef: {fieldPath: spec.nodeName}}
                - name: BOSS_FS_JOB_UID
                  valueFrom: {fieldRef: {fieldPath: "metadata.labels['batch.kubernetes.io/controller-uid']"}}
                - name: BOSS_JOBS_URL
                  value: http://boss-jobs-internal.boss.svc.cluster.local:7900
                # The hosts its packet writes may carry the estate machine
                # token to, besides loopback: this namespace's Services, by
                # suffix (backlog 2ee29275; the car-4 checklist on 2710c8fc
                # — without it the token reaches boss-jobs-internal unstamped).
                - name: BOSS_MACHINE_TOKEN_HOSTS
                  value: ".boss.svc.cluster.local"
              volumeMounts:
                - {name: backups, mountPath: /backup, readOnly: true}
                # The estate machine token, read by boss-step.sh.
                - {name: machine-token, mountPath: /etc/boss/machine-token, readOnly: true}
          volumes:
            # The estate machine token, Secret boss-machine-token, whole —
            # the broker writes it (design 6805c764 car 4). Optional: until
            # its first mint the directory is empty and the packet legs send
            # no token, which every gate in `report` admits; a backup never
            # waits on it. 0444: this pod sets no fsGroup.
            - name: machine-token
              secret: {secretName: boss-machine-token, optional: true, defaultMode: 0444}
            - name: backups
              persistentVolumeClaim: {claimName: boss-backups}
            # 0o400, root's alone: the upload leg reads it as root (the
            # cloud-sdk image's default user). The moment anything gives
            # this Pod runAsNonRoot, the key stops being readable and the
            # upload fails — loudly, but as a gcloud auth problem rather
            # than as a file mode (the trap backlog a05835da found on the
            # retired boss-gcp leg's ship key).
            - name: gcs-key
              secret: {secretName: boss-gcs-offsite, defaultMode: 0o400}
            # The file_refs bytes (boss.yaml's boss-files claim), read-only
            # here: the backup copies them and never writes.
            - name: file-store
              persistentVolumeClaim: {claimName: boss-files, readOnly: true}
