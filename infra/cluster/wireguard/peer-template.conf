# WireGuard spoke — a cluster node dialing the GCP hub.
# Fill the three <angle> values; the hub public key and endpoint are
# printed by setup-hub.sh on the GCP box. Talos consumes this shape in
# its machine config (network.interfaces.wireguard); plain Linux nodes
# use it verbatim as /etc/wireguard/wg0.conf.
#
# The spoke DIALS OUT — no inbound hole in the home router, and
# PersistentKeepalive holds the NAT mapping so the hub can always
# reach back.

[Interface]
Address = <10.99.0.N>/24
PrivateKey = <spoke-private-key>   # wg genkey on the node

[Peer]
PublicKey = <hub-public-key>
Endpoint = <gcp-static-ip>:51820
AllowedIPs = 10.99.0.0/24
PersistentKeepalive = 25
