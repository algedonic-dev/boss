# INERT SOURCE PROPOSAL, outside the automatically published registry/rules
# directories. Native49de under 1e50/f623 prepares the other approved host's
# delivery door. This file is neither a live registry row nor a staged value.
# The live registry has no such row at the author's measured GET200.
[credential]
id = "ops-runner-credential-boss-gcp"
host = "boss-gcp"
secret_namespace = "boss"
secret_name = "ops-runner-credential"
issuer_handler = "credential.rotate.ops-runner"
consumer_file = "/etc/boss/ops-runner.credential"
writer_class = "runner:ops"

[transport]
credential_id = "runner-deposit-key"
protocol_kind = "prepare-a-deposit-key"
receiver_host = "boss-gcp"
purpose = "ops-runner credential deposit"
receiver = "infra/gcp/runner-credential-recv.sh"
sender = "infra/gcp/runner-credential-send.sh"

[activation]
automatic = false
obligations = [
  "Register the approved host-specific row and stage/promote rule data through the owning protocol",
  "Record exact-purpose receiver installation and presence-assured transport enrollment separately",
  "Mount the existing transport key and pinned known-host file through an approved deployment",
  "Record authenticated broker-stage authority independently; a shared header is not that authority",
  "Prove both-host delivery, negative READ/USE, recovery and old-key retirement by actual bounded effect",
]

# Proposed rule rows, deliberately NOT in infra/dispatcher/rules. They use the
# existing handler and named Secret and create no new issuer or entitlement.
# Publication and broker-stage authority remain separate recorded obligations.
[[rule]]
name = "broker-rotates-the-boss-gcp-ops-runner-credential"
why = "EXTERNAL GLUE: the approved second host receives a separately broker-minted runner credential; this executor only advances its own rotation packet and does not enroll a receiver."
on_event = "step.done.credential-rotation"
when = 'subject_id = "ops-runner-credential-boss-gcp"'
[[rule.do]]
handler = "credential.rotate.ops-runner"
args = { secret_namespace = "\"boss\"", secret_name = "\"ops-runner-credential\"", credential_id = "\"ops-runner-credential-boss-gcp\"", host = "\"boss-gcp\"" }

[[rule]]
name = "broker-promotes-the-boss-gcp-ops-runner-credential-on-delivery"
why = "EXTERNAL GLUE: the same approved host declaration promotes only after the authenticated original delivery receipt and completed delivered step; source preparation does not activate this row."
on_event = "step.done.credential-delivery"
when = 'subject_id = "ops-runner-credential-boss-gcp"'
[[rule.do]]
handler = "credential.rotate.ops-runner"
args = { secret_namespace = "\"boss\"", secret_name = "\"ops-runner-credential\"", credential_id = "\"ops-runner-credential-boss-gcp\"", host = "\"boss-gcp\"" }
