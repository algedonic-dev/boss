# boss-gcp's ops runner credential, as the tree declares it (backlog
# 1e50e66b). This file is neither a live registry row nor a staged value.
#
# THE RULES ARE LIVE (2026-10-10): the stage/promote pair this file used to
# hold inert is infra/dispatcher/rules/broker-rotates-the-boss-gcp-ops-
# runner-credential.toml and broker-promotes-the-boss-gcp-ops-runner-
# credential-on-delivery.toml, moved there once the transport existed — the
# broker-stage verifier landed (25fff647), the runner deposit key is
# prepared and enrolled (c7f12e6f), boss-gcp's converge installs the
# receiver, and the forge runs the sender (infra/forge/runner-credential-
# push.sh). One copy of each rule, there; none here (CLAUDE.md §9a).
#
# STILL NOT AUTOMATIC: the registry row `ops-runner-credential-boss-gcp`
# is live data, posted through POST /api/credentials/batch with the
# [credential] facts below, and nothing mints until it answers and a person
# scopes a rotate-a-credential packet on it.
[credential]
id = "ops-runner-credential-boss-gcp"
host = "boss-gcp"
secret_namespace = "boss"
secret_name = "ops-runner-credential"
issuer_handler = "credential.rotate.ops-runner"
consumer_file = "/etc/boss/ops-runner.credential"
writer_class = "runner:ops"

[transport]
credential_id = "runner-deposit-key"
protocol_kind = "prepare-a-deposit-key"
receiver_host = "boss-gcp"
purpose = "ops-runner credential deposit"
receiver = "infra/gcp/runner-credential-recv.sh"
sender = "infra/gcp/runner-credential-send.sh"
deployment = "infra/forge/runner-credential-push.sh"

[activation]
automatic = false
rules = [
  "broker-rotates-the-boss-gcp-ops-runner-credential",
  "broker-promotes-the-boss-gcp-ops-runner-credential-on-delivery",
]
obligations = [
  "Post the registry row ops-runner-credential-boss-gcp before the first rotate-a-credential packet on it",
  "Prove both-host delivery, negative READ/USE, recovery and old-key retirement by actual bounded effect",
]
