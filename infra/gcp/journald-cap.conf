# boss-gcp's journal bound — installed by infra/gcp/cap-journal.sh, which
# boss-gcp-converge runs on every tick, as
# /etc/systemd/journald.conf.d/boss-gcp-journal-cap.conf. A hand edit
# there is put back on the next tick; change it HERE.
#
# WHY (backlog d3c7eada, 2026-09-29). Without a bound journald holds 10%
# of the filesystem up to 4G, and on this host's 48 GB root that was the
# 3.9G that kept root under its 17 GB estate floor. The signed reclaim
# (ops-request 46cc2304) vacuumed it to 916M and left root at 16692 MiB
# free, still short of the 16896 MiB the nearest-GiB reading needs. At
# the 60-100 MB/day measured in that run, 256M keeps about 3-4 days here;
# older history of this host lives in the ops-request and converge
# packets, and the journal read door (:19531) serves what is kept.
[Journal]
SystemMaxUse=256M
