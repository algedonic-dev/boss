# INSTANCE DATA, not automatically published. After the transport car
# arrives, copy unchanged into the instance credential seed and publish
# through the registry door. Human scope and receiver enrollment remain
# separate steps; installing source authorizes no key.
[[credential]]
id = "root-tree-deposit-key"
kind = "ssh-transport-key"
issuer = "the credential broker (credential.prepare.ssh-deposit), generated by the existing preparation handler"
principal = "the forge root-tree-token sender, as the account boss-gcp's signed deposit line names; one forced command only"
scopes = ["boss-gcp: exec sudo -n /usr/local/libexec/boss/root-tree-delivery/infra/gcp/root-tree-token-recv.sh"]
storage_location = "Secret boss/root-tree-deposit-key"
consumers = [
  { kind = "secret-read", location = "the forge root-tree-token sender (infra/gcp/root-tree-token-send.sh), reading Secret boss/root-tree-deposit-key through the existing forge admin; not mounted on the host" },
  { kind = "authorized-keys", location = "boss-gcp, the named deposit account's authorized_keys: only the forced-command line on the prepare-the-root-tree-deposit-key enroll step" },
]
rotation_policy = "on-demand"
notes = "Transport only; no repository or cluster access. Broker preparation is not enrollment. Human scope and presence-assured enrollment must name boss-gcp, purpose root-tree credential deposit, the broker's prepared public key and exact forced command. Sign only after a real boss-gcp converge records root_tree_token_receiver installed. Registry publication, human preparation scope, signed enrollment and first delivery remain explicit recorded obligations. Root-owned tree migration must keep INSTALL_RECV_USER bound to the enrolled account rather than derive it from the new root-owned source tree."
