# The used-device shop's class rows that 01-registries.sql seeds on EVERY
# instance — kept as eviction candidates after the example is gone.
#
# WHY THIS FILE EXISTS (backlog a8991c86, car 6). David retired the
# used-device shop on 2026-09-24: the OSS ships one example tenant,
# Algedonic Ales. But 01-registries.sql seeded the shop's org chart on
# every database — 26 roles, ten departments, three account types, the
# `warehouse-zone` location kind and a `used-device-shop` companies row —
# and an applied migration cannot be edited (migrate.sh refuses a changed
# checksum). Those rows leave a company's instance through
# infra/postgres/example-reference-rows.sh (boss-init on a fresh
# instance's first start, the forge verb retire-example-reference-rows on
# a running one), whose candidate set was read ONLY from
# examples/*/seeds/. Deleting examples/used-device-shop would therefore
# have left them on every fresh instance, silently: not a candidate is
# not a refusal, it is a row nobody is asked about. The car-0 measure
# recorded that hazard; this list is its answer.
#
# WHAT IT HOLDS, AND ONLY THAT. The rows examples/used-device-shop/seeds/
# classes.toml carried that 01-registries.sql also seeds — keyed as the
# script reads them (subject_kind, member_attribute, code). The shop's
# own rows the migrations never seeded (its asset categories, document
# kinds, account-team roles, `auditor`) are not here: no instance got
# them without publishing the shop. The platform's rows are not here
# either (`platform-admin`, `audit-readonly`, `owner`, `smoke-tester`,
# `hq` and `field-region`, which the platform's default locations
# wear) — a candidate is a row an instance may lose. Two rows the shop's
# seed never carried are here too, the marketing-asset kinds `brief-body`
# and `retro` (backlog 9b28f849): their section at the foot says why.
#
# The `it` department Class IS here since backlog c87e3d6d (2026-09-27).
# It sat in the same 01-registries.sql block as its ten siblings and was
# kept back as the platform's because the operator baseline hires into
# `it` and an employee's department was validated against these Classes.
# It is not any longer: an employee's department is a row of the
# departments registry, where the platform's `it` lives now (migration
# 20260919181324 seeds it and no example declares it). So no department
# Class is the platform's, and the migration's `it` Class is residue
# like the rest of the block.
#
# HELD EQUAL TO THE MIGRATION, not by a comment (CLAUDE.md §9a):
# crates/core/boss-testing/tests/example_reference_rows_sh.rs refuses a
# row here that 01-registries.sql does not seed under the same
# member_attribute and pins the counts below, and
# example_reference_rows_sql.rs runs the eviction on a fresh schema with
# examples/used-device-shop absent — what remains must be exactly what
# the platform names, which fails if a row of the shop's is missing
# here. A code the brewery also carries (`ceo`, `sales`, …) is listed
# anyway: this file answers for the migration's rows, whichever example
# is published beside it.

