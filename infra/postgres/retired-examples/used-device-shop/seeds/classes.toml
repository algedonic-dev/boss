# --- marketing-asset kinds (backlog 9b28f849, decided 2026-09-28) -------
# The two of 01-registries.sql's nine that no live example declares. No
# example's seed file ever carried them — the migration seeded them for
# the marketing launch motion (brief, retro) that retired with the shop
# (a8991c86, the car that retired the launch calendar and the
# marketing-launch StepType) — and they are here because this list is
# where a retired example's migration rows are declared: measured
# 2026-09-28 on origin/main 7b46f277, 0 of the brewery's 43 assets wear
# either and no code names them. The seven the brewery uses moved into
# examples/brewery/seeds/classes.json. A running instance retires these
# two through the Class registry's door (POST /api/classes/
# marketing-asset/{code}/retire, a class.retired fact), since a
# migration may not rewrite a Class (migrations-declare-schema-only.sh).

[[class]]
subject_kind = "marketing-asset"
member_attribute = "kind"
code = "brief-body"

[[class]]
subject_kind = "marketing-asset"
member_attribute = "kind"
code = "retro"
