# gate-runner — a full gate as a self-contained Kubernetes Job.
#
# Born 2026-08-23 from a day of gates dying deaths that were not
# theirs: pod replacements, exec-scope reaping, shared-disk exhaustion,
# cold-start timeouts (the history is in run.sh's header and
# post-mortem #2). The shape that ended it, amended 2026-09-03 when the
# one-gate-at-a-time serialization became the pipeline's bottleneck
# (packet 28de3845: nine cars through one runner at ~14 min each):
#
#   - OWN CLONE from the forge — no dependency on the boss-dev
#     workspace PVC, and therefore no requirement to run on cp-2,
#     the node that also carries etcd and the SoR's Longhorn
#     replicas. Selected by boss.dev/purpose=build, not by hostname:
#     the gate belongs to whichever machine holds the build role, so
#     replacing that machine is a label move rather than a car. Today
#     that is w-1 - 32 cores and 64Gi, more CPU than all three control
#     planes together, and not a control plane at all, so a gate
#     cannot starve etcd however hard it runs. The ceiling below is
#     sized for that box.
#   - OWN DISK, per run. /gate-target was an emptyDir: born with the
#     pod, dead with it. Until 2026-09-30 two concurrent gates could not
#     see each other's workspace AT ALL — the 2026-08-24 crossed-receipts
#     incident was structurally impossible, not merely guarded against,
#     which is what let gates run in parallel (bounded by `boss gate`,
#     BOSS_GATE_MAX_CONCURRENT, default 3).
#     Since backlog 52ea56ac (2026-09-30) it is the pod's OWN directory
#     of the gate claim on w-1's second NVMe — `runs/<pod name>`,
#     mounted by subPathExpr — because the kubelet puts every emptyDir
#     on the install disk, and the workspace must share the seed's
#     filesystem for the seeding copy to stay a reflink. /gate-target
#     is still this pod's own directory, so two gates never share a
#     workspace PATH, and the crossed-receipts shape stays impossible.
#     But the isolation is no longer total (review 0b9c02f1, F2): the
#     gate container ALSO mounts the claim's `runs/` at /gate-runs,
#     read-write, for the sweep and the proof marker, so code a gate runs
#     (build scripts, tests, lints, as uid 65534 in gid 1500) CAN reach a
#     concurrent run's workspace — an `rm -rf "$UNSET/"`-class bug now
#     reaches other gates. The seed was already shared read-write, so
#     this widens an exposure rather than opening a new class; the
#     structural fix, moving the sweep and the marker check out of the
#     gate container, is backlog 5e77f216. What the emptyDir gave for
#     free and a directory does not — dying with the pod — run.sh now
#     does itself (a liveness lock, an empty-on-exit, and a sweep of
#     dead runs' directories).
#   - WARM SEED on the surviving PVC. run.sh copies a warm target/
#     (snapshotted at main's tip by the previous green near-tip run)
#     into the workspace before building, and CARGO_HOME lives on the
#     same volume. The math: a cold workspace build is ~74G of target
#     and 20+ minutes of compile; the seed copy is the same bytes at
#     disk speed, a few minutes, and it parallelizes. Without the
#     seed, "parallel" gates would each pay the cold build — slower
#     than the serial rig they replace. (Since 5b3dabb5 the copy is a
#     reflink, metadata only; since 52ea56ac the seed is `seed/` of the
#     same gate claim the workspaces are `runs/` of.)
#   - DATABASE SIDECAR with the 1Gi /dev/shm the dev pod's sidecar
#     earned on 2026-08-22. Since backlog 9cd74fd5 (2026-10-08) its data
#     directory is MEMORY, not the install disk: see the `pgdata` volume.
#   - SELF-REPORTING: run.sh completes the gate-run packet with the
#     verdict (green/failed/lost). A runner that dies anyway leaves
#     an overdue packet — the alarm the protocol already provides.
#
# USAGE (a Job is one-shot; names must be fresh — use kubectl create
# with generateName, never apply):
#
#   kubectl -n boss-dev create -f - <<EOF
#   $(sed -e 's/\$GATE_BRANCH/fix\/my-branch/' \
#         -e 's/\$GATE_RUN_JOB_ID/<packet-uuid>/' \
#         -e 's/\$GATE_NAME_HINT/my-branch/g' \
#         -e 's/\$GATE_MODE//' gate-runner.yaml)
#   EOF
#
# ($GATE_NAME_HINT is the branch sanitized to label/name characters —
# `boss gate` derives it; by hand, keep it short, lowercase, and
# alphanumeric-with-dashes.) Register the gate-run packet FIRST (kind
# gate-run, due_on a few hours out); the packet is the record, the Job
# is just the muscle.
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gate-seed
  namespace: boss-dev
  labels: {app.kubernetes.io/part-of: boss, boss.dev/purpose: build}
spec:
  # THE WARM SEED, on w-1's own xfs so a gate's copy is a reflink (see
  # infra/cluster/manifests/gate-seed-local.yaml for the measurement and
  # the migration). Bound by name to the one local PV; the class has no
  # provisioner, so a typo here binds nothing and the Job stays Pending
  # rather than gating on the wrong disk.
  # SUPERSEDED 2026-09-30 (backlog 52ea56ac): the Job below mounts the
  # gate claim on w-1's second NVMe instead (declared and converged in
  # gate-seed-local.yaml). This claim stays declared while a gate from an
  # older checkout can still render the manifest that mounts it, then a
  # car retires it with its PV, as gate-runner-disk below is retired.
  accessModes: [ReadWriteOnce]
  storageClassName: gate-seed-local
  volumeName: gate-seed-w-1
  resources:
    requests:
      storage: 200Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gate-runner-disk
  namespace: boss-dev
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn-dev-disposable
  resources:
    requests:
      # No longer the workspace — the WARM SEED (target/ snapshot,
      # ~74G measured cold; a warm one is comparable) + CARGO_HOME's
      # registry cache (a few G) + the refresh's staging copy is
      # rm-first so peak stays near one target's worth. The claim
      # KEEPS ITS OLD NAME on purpose: the volume already holds the
      # warm target and crate cache from the serial era, and renaming
      # the claim would orphan that warmth and make the first
      # parallel gates cold for no reason.
      #
      # RWO is now a placement rule, not a serialization rule: every
      # concurrent gate co-mounts this volume, which Kubernetes allows
      # only on ONE node — so all gates land together on the build
      # node (the affinity below already prefers it). A gate scheduled
      # to a different node waits on attach (Multi-Attach error in
      # `kubectl describe pod`) rather than corrupting anything; if
      # the build node is cordoned, gating degrades toward serial on
      # whichever node takes the volume, honestly and visibly.
      storage: 120Gi
---
apiVersion: batch/v1
kind: Job
metadata:
  # The branch rides in the NAME (gate-<branch-hint>-<rand>) so three
  # concurrent gates are tellable apart in `kubectl get jobs` — a
  # refusal or a status line that names `gate-8kx2p` three times names
  # nothing. `boss gate` fills the hint from the branch.
  generateName: gate-$GATE_NAME_HINT-
  namespace: boss-dev
  # The packet label is what lets a second `boss gate` SEE the Job the
  # first one launched. Without it a Job carried no link back to its
  # gate-run packet, so a re-invocation could not tell "this packet is
  # already being gated" from "this packet is idle" — and created a
  # second Job that raced the first on the same packet. The branch
  # label is the same fact for humans and selectors.
  labels:
    app: gate-runner
    boss.dev/packet: $GATE_RUN_JOB_ID
    # THIS RUNNER LEAVES ITS VERDICT AND WRITES NOTHING (backlog 934ccad1;
    # design bdc60b65, question gate-verdict). The label tells the
    # conductor to record this Job's verdict from its pod log
    # (boss-cli train/carried_verdict.rs reads only a Job labelled so);
    # GATE_VERDICT_CARRIER on the gate container, below, tells run.sh to
    # stop reporting for itself. ONE WITHOUT THE OTHER is a verdict
    # written twice or never, so the two lines travel together and
    # boss-testing's the_gate_runner_leaves_its_verdict_and_writes_nothing
    # holds them to it.
    #
    # THE ROLLBACK, AS A PROCEDURE (review 47319ee7, S2). The target is
    # "every runner reports for itself and the conductor leaves every
    # Job alone", which is this manifest with BOTH lines deleted - the
    # label here and GATE_VERDICT_CARRIER below. WHERE that manifest has
    # to be differs by who launches:
    #   - a car's gate (`boss gate`) renders the manifest of the tree it
    #     is run from: a worktree whose manifest lacks the two lines
    #     gates the old way at once, with nothing landed.
    #   - a TRAIN's gate and the dock's re-gate are rendered by the
    #     conductor from its IMAGE's manifest
    #     (/opt/boss/infra/gate-runner/gate-runner.yaml, or wherever
    #     BOSS_GATE_MANIFEST points). So the train that carries the
    #     two-line deletion is itself gated in the layout being rolled
    #     back. If the carried path is what is broken, that train
    #     cannot go green: it lands through the emergency lane, or the
    #     conductor is pointed at a manifest without the two lines
    #     (BOSS_GATE_MANIFEST on deploy/boss-conductor) until an image
    #     built from the deletion is running.
    # A verdict lost meanwhile is not gone: its receipt is in the pod log
    # for the Job's 24 h (`kubectl logs job/<gate Job> -c gate`).
    boss.dev/verdict-carrier: pod-log
    boss.dev/branch: $GATE_NAME_HINT
spec:
  backoffLimit: 0
  # 3h. Room for a lock-wait on the seed (bounded at 15 min), the
  # gate itself (measured ~35 -> ~93 min under five-way concurrency),
  # and the post-verdict seed refresh — the verdict is reported before
  # the refresh starts, so a refresh never delays a `--wait`.
  activeDeadlineSeconds: 10800
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels: {app: gate-runner}
    spec:
      restartPolicy: Never
      # The roomiest node, and deliberately not the one carrying etcd
      # and the system of record's replicas — post-mortem #2's open
      # question (b), answered for gates.
      # PREFER the build node, do not require it. A hard nodeSelector
      # here means the build role is a single point of failure: when
      # w-1 was cordoned for an NVMe thermal fault, a hard pin would
      # have left this with no schedulable node and stopped gating
      # entirely. Preferred affinity degrades to a slower build on a
      # control plane instead of no build at all. (The seed PVC's RWO
      # attach is what actually herds concurrent gates onto one node —
      # see the claim's comment.)
      affinity:
        nodeAffinity:
          # A BUILD NEVER SHARES A NODE WITH ETCD (incident a398c4d3,
          # 2026-09-11): a control-plane node's disk carries etcd's WAL,
          # and a gate writes tens of GB. Required, not preferred — a
          # preference is dropped under pressure, and pressure is the
          # day it matters. Pinned by
          # infra/lint/a-build-never-shares-a-node-with-etcd.sh.
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - {key: node-role.kubernetes.io/control-plane, operator: DoesNotExist}
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - {key: boss.dev/purpose, operator: In, values: ["build"]}
      imagePullSecrets:
        - {name: forgejo-registry}
      automountServiceAccountToken: false
      # THE RESTRICTED PROFILE, MET RATHER THAN WARNED ABOUT.
      #
      # Every gate launch used to print `Warning: would violate
      # PodSecurity "restricted:latest"` — unrestricted capabilities on
      # the postgres sidecar, and runAsNonRoot unset on both containers.
      # The cluster's PodSecurity default is Talos's (enforce baseline,
      # WARN restricted), and boss-dev carries no namespace label of its
      # own, so the warning was the whole consequence. That made it a
      # CLIFF, not a slope: the day anyone tightens the default or
      # labels this namespace `enforce: restricted`, every gate Job
      # becomes uncreatable at admission, and since the gate is the only
      # path a car has to a green receipt, all delivery stops — with a
      # failure shape (pods refused before any container starts) that
      # looks nothing like a code defect. Nine identical warnings a day
      # also scrolled past the line naming the packet that was created,
      # which is how an operator learns to stop reading gate output
      # (backlog bb5a902e).
      #
      # runAsNonRoot is set HERE, at the pod, so a container added later
      # inherits it and a root image is refused rather than silently
      # re-opening the gap. Each container names its own uid below.
      securityContext:
        fsGroup: 1500
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      initContainers:
        # Postgres as a NATIVE SIDECAR (initContainer + restartPolicy
        # Always), not an ordinary container. As an ordinary container
        # it never exits, so a Job whose gate container terminated 0
        # sat forever reporting neither succeeded nor failed and had to
        # be deleted by hand - `kubectl get job` lied about a gate that
        # had passed. A native sidecar starts before the gate, runs
        # beside it, and the kubelet tears it down when the gate exits.
        # Per-pod, so every concurrent gate gets its own database.
        - name: postgres
          # From the forge, not docker.io — the last public pull on a
          # gate's path. The pod-level imagePullSecrets (forgejo-registry)
          # applies to every container in the pod, initContainers
          # included, so this pulls the way the gate container's boss-ci
          # does. Pinned by infra/lint/the-build-pulls-only-mirrored-bases.sh.
          image: 10.20.0.15:3000/david/postgres:16
          restartPolicy: Always
          # UID 999 IS WHERE THIS PROCESS ENDS UP ANYWAY, so start there.
          #
          # The dev pod's sibling sidecar drops only NET_RAW, and its
          # comment is correct about why: the official image's entrypoint
          # starts as ROOT, chowns PGDATA, and execs gosu to become the
          # postgres user, so dropping CHOWN/SETUID/SETGID would take
          # away the very capabilities it uses to stop being root.
          #
          # Naming the uid removes that argument instead of fighting it.
          # `if [ "$(id -u)" = 0 ]` is the entrypoint's own gate for the
          # chown-and-gosu branch; entered as 999 it skips the branch
          # entirely, needs no capability at all, and `drop: ["ALL"]`
          # costs nothing. 999 is not a guess: it is the uid the image's
          # own `postgres` user has, measured on the live dev sidecar
          # through the shared pid namespace (six postgres processes,
          # every one Uid: 999) — so this is the same final uid the
          # gosu path reaches, with the root phase removed.
          #
          # PGDATA stays a SUBDIRECTORY of the mount (/pgdata/data, not
          # /pgdata). The pod's fsGroup makes the emptyDir root:1500
          # g+rwxs and puts 1500 in this container's supplementary
          # groups, so uid 999 can create the subdirectory; owning it
          # lets the entrypoint chmod it 0700, which postgres refuses to
          # start without and which cannot be done to the mount itself.
          securityContext:
            allowPrivilegeEscalation: false
            runAsUser: 999
            runAsGroup: 999
            capabilities: {drop: ["ALL"]}
          # NO DURABILITY, BECAUSE THERE IS NOTHING TO RECOVER. PGDATA is
          # an emptyDir that dies with the pod, so a crash-safe WAL
          # protects data no one will ever read again — and it was not
          # free. Measured 2026-09-23 on the 17:03 train gate (gate-run
          # 928665ee): one checkpoint spent 199.5s fsyncing 60,796 files,
          # because every test database is a WAL_LOG copy of the
          # template, and that slowness let blocked DROP DATABASE
          # backends pile up to max_connections in two red train gates
          # (backlog afaa90a3). The entrypoint prepends `postgres` to
          # args that begin with a dash. Pinned by gate_runner_manifests.
          args: ["-c", "fsync=off", "-c", "synchronous_commit=off", "-c", "full_page_writes=off"]
          env:
            - {name: POSTGRES_USER, value: boss}
            - {name: POSTGRES_PASSWORD, value: boss}
            - {name: POSTGRES_DB, value: postgres}
            - {name: PGDATA, value: /pgdata/data}
          volumeMounts:
            - {name: pgdata, mountPath: /pgdata}
            # The 64Mi container default dies under parallel pg suites
            # ("could not resize shared memory segment"); same fix the
            # dev pod's sidecar carries.
            - {name: pg-shm, mountPath: /dev/shm}
          # MEMORY: THIS CONTAINER IS CHARGED FOR ITS DATA (backlog
          # 9cd74fd5). Both volumes above are tmpfs, and a tmpfs page is
          # charged to the cgroup that wrote it and is never reclaimed
          # (no swap). So the LIMIT is the two volumes' sizeLimits plus
          # the server's own processes — 6Gi (pgdata) + 1Gi (pg-shm) + 2Gi
          # (128 MB of shared buffers, up to 100 backends) — and must stay
          # at or above that sum: under it the kernel OOM-kills the
          # database BELOW the volume's size, where the gate container
          # cannot see why, and the run reads as tests failing on a
          # correct branch. The REQUEST is the measured data directory
          # (1.93 GiB, see the `pgdata` volume) plus the 512Mi this
          # container asked before, rounded up, so the scheduler reserves
          # what a gate really takes and an ordinary gate is not in the
          # kubelet's "usage exceeds request" class under memory
          # pressure. It was 512Mi / 4Gi while the data was on disk and
          # most of the 4Gi was reclaimable page cache. Pinned by
          # the_gate_postgres_data_lives_in_memory.rs, with the bays'
          # arithmetic.
          #
          # WHAT THAT REQUEST COSTS (review bc011e92, F4 and F3). Every
          # pod on w-1 is Burstable, and the kubelet ranks for memory
          # eviction by usage-over-request FIRST and priority second. A
          # gate pod now requests 11 GiB (8Gi + this 3Gi) and an ordinary
          # gate stays inside it, so the dev pod - request 8.56 GiB,
          # usually far over it with builders running, limit 32Gi - is
          # the likely FIRST eviction under node memory pressure, its
          # higher priority notwithstanding. The dev pod is the
          # operator's session. And a NODE-level OOM (the kernel, not
          # the kubelet) prefers the lowest request share: these
          # sidecars, at 3Gi, before any compiler. Killing one frees
          # almost nothing, because its data is tmpfs in an emptyDir that
          # outlives the container and stays charged, so the kernel moves
          # to the next gate's database.
          #
          # WHAT A GATE DOES WHEN MEMORY RUNS OUT, AND THE BLIND SPOT
          # (review bc011e92, F2 and F3). Nothing here rewrites a verdict.
          #   - The data volume fills (6Gi): Postgres answers `No space
          #     left on device`, DB tests fail, the run is `failed`, and
          #     the receipt shows runtime_evidence.pgdata.full beside it.
          #   - The GATE container is OOM-killed: the kubelet sets
          #     memory.oom.group, so the kill takes every process in it,
          #     run.sh included. No receipt is written and the conductor
          #     settles the run `lost`. (oom.group read on the dev
          #     container on w-1, same kubelet; not read on a gate pod.)
          #     runtime_evidence.memory.oom_kill is therefore a count a
          #     receipt will almost never carry above zero.
          #   - THIS container is killed (its own limit, or the node):
          #     it restarts on the surviving tmpfs, the gate sees
          #     connection errors, DB tests fail and the run is `failed` -
          #     WITH NOTHING ON THE RECEIPT TO SAY WHY: the volume is not
          #     full and the gate's own cgroup counted no kill. This is
          #     the known blind spot. The gate container cannot see this
          #     cgroup and does not try to; the one place it shows is the
          #     pod's `restartCount` for `postgres`, while the Job lives.
          resources:
            requests: {cpu: 250m, memory: 3Gi}
            limits: {cpu: "2", memory: 9Gi}
      containers:
        - name: gate
          image: 10.20.0.15:3000/david/boss-ci:rust1.96
          # Always, not the default IfNotPresent: :rust1.96 is a mutable
          # tag, and a node that cached an older build keeps serving it —
          # the stale-runner-cache split that redded the browser-bake
          # keystone (6aa603ef), here for the gate-runner. Always makes
          # the gate pull the current baked image (chromium + system deps
          # at /opt/ms-playwright); layers are cached, so only changed
          # ones transfer.
          imagePullPolicy: Always
          command: ["bash", "/repo-script/run.sh"]
          env:
            - {name: GATE_BRANCH, value: "$GATE_BRANCH"}
            - {name: GATE_RUN_JOB_ID, value: "$GATE_RUN_JOB_ID"}
            - {name: GATE_MODE, value: "$GATE_MODE"}
            # The runner's half of the verdict-carrier label on this Job's
            # metadata (see there). The verdict leaves this container in
            # two places a holder of the gates Role reads and this pod's
            # ServiceAccount-less code cannot reach beyond: its stdout,
            # and its termination message (the default
            # /dev/termination-log, 4096 bytes, published by the kubelet
            # once the container has ended).
            - {name: GATE_VERDICT_CARRIER, value: pod-log}
            # The BAKED browser, not a per-run PVC download. The keystone
            # bakes chromium + its libs into boss-ci at /opt/ms-playwright;
            # pointing here lets gate.sh's web suite run the mocked
            # Playwright specs with no run-time download. The old
            # /gate-target/ms-playwright value was never seeded by run.sh,
            # so the suite could not have run at all (ade5d82b).
            - {name: PLAYWRIGHT_BROWSERS_PATH, value: /opt/ms-playwright}
            - {name: BOSS_TEST_POSTGRES_ADMIN_URL, value: "postgres://boss:boss@127.0.0.1:5432/postgres"}
            # HOME IS NAMED BECAUSE THE UID IS. boss-ci declares no USER,
            # so this container ran as root with HOME=/root; 65534's own
            # passwd entry points at /nonexistent, and an uncatalogued uid
            # gets `/` — neither is writable. The first thing run.sh
            # does is `git config --global credential.helper`, i.e. write
            # $HOME/.gitconfig, under `set -e`: an unwritable HOME would
            # kill every gate before the clone. /gate-target is the
            # per-run workspace mount, so it exists before the container
            # starts and fsGroup has already made it group-writable —
            # and bun's install cache ($HOME/.bun) then lands on the
            # volume that has a sizeLimit instead of on the node's
            # container store. (Since 52ea56ac that volume is the gate
            # disk, which has no sizeLimit but is not the node's disk
            # either.) This must be an env var, not a mkdir in
            # run.sh: the script reaches the pod through a ConfigMap
            # applied separately, so a manifest that depended on a
            # run.sh change would be live before the change was.
            - {name: HOME, value: /gate-target}
            # THE WORKSPACE'S NAME: this pod's own, so /gate-target
            # (subPathExpr runs/$(POD_NAME) below) is a directory no
            # other gate mounts AS ITS WORKSPACE — every gate can still
            # reach it through /gate-runs (the known exception, see the
            # header; 5e77f216). A Job's pods are named by generateName
            # and never reused, so a dead run's directory is never
            # adopted by a new one — which is what lets run.sh sweep it.
            # The same rule as HOME: the manifest must not depend on a
            # run.sh change, and a pod name needs no script at all.
            # INLINE like every entry here: a block-style `- name:` inside
            # this container ends the container for the readers that scan
            # it (brief.rs gate_ids reads the uid below that way).
            - {name: POD_NAME, valueFrom: {fieldRef: {fieldPath: metadata.name}}}
            # Passive runtime identity and declared quantities, not a resource intervention.
            - {name: POD_UID, valueFrom: {fieldRef: {fieldPath: metadata.uid}}}
            - {name: NODE_NAME, valueFrom: {fieldRef: {fieldPath: spec.nodeName}}}
            - {name: NATIVE_JOB_NAME, valueFrom: {fieldRef: {fieldPath: "metadata.labels['batch.kubernetes.io/job-name']"}}}
            - {name: NATIVE_JOB_UID, valueFrom: {fieldRef: {fieldPath: "metadata.labels['batch.kubernetes.io/controller-uid']"}}}
            - {name: GATE_CPU_REQUEST, valueFrom: {resourceFieldRef: {containerName: gate, resource: requests.cpu, divisor: 1m}}}
            - {name: GATE_CPU_LIMIT, valueFrom: {resourceFieldRef: {containerName: gate, resource: limits.cpu, divisor: 1m}}}
            - {name: GATE_MEMORY_REQUEST, valueFrom: {resourceFieldRef: {containerName: gate, resource: requests.memory, divisor: "1"}}}
            - {name: GATE_MEMORY_LIMIT, valueFrom: {resourceFieldRef: {containerName: gate, resource: limits.memory, divisor: "1"}}}
            # THE LAYOUT, DECLARED where the claim is mounted (review
            # 635317c5, C1/C2). run.sh arms its gate-disk guard, empties
            # the workspace at exit and sweeps dead runs ONLY under this
            # key, and refuses a runner that mounts /gate-runs without
            # it. Dropping the key or the mount is a red in
            # a_runner_mounting_the_gate_claim_arms_the_guard, never a
            # silently disarmed guard.
            - {name: GATE_DISK, value: required}
            # WHERE THE POSTGRES DATA VOLUME IS READABLE (backlog 9cd74fd5):
            # the read-only mount of `pgdata` below. The clone's
            # runtime-evidence.py reads how full it is (one statvfs, at
            # every check boundary and from run.sh's watcher between them)
            # and the receipt carries the peak as runtime_evidence.pgdata,
            # so the volume's sizeLimit is checked by a number on every
            # gate. A runner without this key records `unavailable`, never
            # a zero. Tests inherit it like every key here and set their
            # own.
            - {name: BOSS_GATE_PGDATA, value: /gate-pgdata}
          # uid 65534 (`nobody`) WITH GROUP 1500, so everything this build
          # writes is owned by the group that owns the volumes. The gate's
          # capability posture was already compliant; only the uid was
          # missing.
          #
          # THE UID MUST BE ONE THE IMAGE CAN NAME, and that is measured,
          # not assumed: the first full gate on this branch ran as uid
          # 1500 — matching fsGroup, which looked like the obvious
          # choice — and the `boss-gcp-converges-itself` lint failed with
          #   id: cannot find name for user ID 1500
          #   runuser: user UNKNOWN does not exist
          # because boss-ci has no passwd entry for 1500, so the
          # converge's `as_owner` got `UNKNOWN` out of `stat -c %U` on a
          # fixture the gate itself owns. Every other check passed. The
          # fix is the uid, NOT the lint: the lint is exercising a real
          # script that runs on a real host as a real named user, and
          # bending it to tolerate a nameless one would be changing
          # production code to suit the test environment. 65534 exists in
          # the base image, so `id -un` and `stat -c %U` both answer.
          # Adding a 1500 user to boss-ci would also work and is worse:
          # the gate never builds its own image, so the manifest would be
          # live a train before the image that supports it.
          #
          # What a non-root gate needs, and why each is satisfied:
          #   - /gate-target (emptyDir) and /gate-seed (the PVC holding
          #     the warm target + CARGO_HOME): fsGroup chowns both to
          #     group 1500 recursively and ORs g+rw onto files, g+rwxs
          #     onto dirs, at every mount — which is the stated reason
          #     the dev pod carries the same fsGroup. Seed files written
          #     by the root era stay writable for exactly that reason,
          #     and so do files written by a run at a different uid.
          #     (Since 52ea56ac both are directories of ONE claim, and
          #     the kubelet makes a subPath's directory with the volume
          #     root's mode — g+rwxs after fsGroup — so both stay
          #     group-writable. The apply sequence's proof pod mounts
          #     the claim in exactly this shape, as this uid, and writes.)
          #   - /etc/forge/token (secret, defaultMode 0400): the kubelet
          #     ORs group-read onto a read-only secret under fsGroup, so
          #     it lands root:1500 0440 — the same arrangement boss.yaml
          #     relies on for boss-auth's key.
          #   - the Rust toolchain: the official rust image ends its
          #     install with `chmod -R a+w $RUSTUP_HOME $CARGO_HOME`, so
          #     /usr/local/rustup is readable and writable by any uid.
          #   - `cp -a` of the seed: GNU cp tolerates a failed
          #     preserve-ownership when the process has no CAP_CHOWN
          #     (owner_failure_ok), so the seeding copy does not turn
          #     into a cold build — measured on the first run of this
          #     branch, "target seeded from head ... in 86s", the same
          #     shape as a root run.
          #   - git identity: the three lints that commit into fixture
          #     repos export GIT_AUTHOR_*/GIT_COMMITTER_* or set
          #     per-repo user.email, so none of them has to ask git to
          #     auto-detect an author from the running uid.
          # Proven by full gate runs on this branch, not by reading: the
          # manifest is rendered from the working tree, so a wrong uid
          # fails its own gate first — which is exactly how the 1500
          # attempt above was caught.
          securityContext:
            allowPrivilegeEscalation: false
            runAsUser: 65534
            runAsGroup: 1500
            capabilities: {drop: ["ALL"]}
          resources:
            # CPU/memory: four concurrent gates (policy v3, backlog
            # 366c2ed5, 2026-09-28; four again at v5, e6dc7331) request
            # 16 CPU / 32Gi against w-1's 32 / 63Gi — five with the train
            # gate, 20 / 40Gi; the 20-CPU limit lets a lone gate use the box.
            # Five is the measured I/O cliff (2026-08-26: I/O pressure
            # 65%, a ~35-min gate took ~93), so four is measured for a
            # day before any further step.
            #
            # DISK: the ephemeral-storage request EQUALLED the workspace
            # sizeLimit below (160Gi), pinned equal by
            # the_gate_requests_the_workspace_it_may_fill (backlog
            # 461159e7; since 52ea56ac the workspace is off this disk and
            # since e6dc7331 the pin is
            # a_gate_requests_what_the_new_layout_uses_and_the_bays_fit,
            # see the 2026-09-30 paragraphs below). The kubelet evicts on USAGE, which only the
            # sizeLimit bounds; the scheduler admits on the REQUEST. At
            # 90Gi the two disagreed, and on 2026-09-29 at 22:30:29Z w-1
            # evicted a running gate: five gate pods were live (four
            # bays plus the train gate, which launches outside the bay
            # bound — 0f4224bc), and the scheduler had seen 5 x 90 + 154
            # (the dev pod) = 604 GiB of w-1's ~790 allocatable (929 GiB
            # nodefs less the kubelet's 15% line, 139.3 GiB). The worst
            # case it had admitted was 5 x 160 + 154 = 954, plus the
            # 200Gi seed PV and ~39G of containerd on the same /var that
            # no pod requests: 1193 against 790.
            #
            # At 160: 3 x 160 + 154 = 634 fits and a fourth needs 794,
            # so w-1 holds THREE gates beside the dev pod and a fourth
            # (bay or train gate) waits Pending — visible, loses no
            # verdict, spends its activeDeadlineSeconds. So the policy
            # drops to three with this change (train-conductor v4,
            # gate_max_concurrent = 3): at v3's four, the fourth bay's
            # gate sat Pending most of a busy day, read as a running
            # slot, queued ahead of the train gate, and took the dev
            # pod's room whenever the dev pod rolled (Recreate, with a
            # PriorityClass that never preempts). The capacity that
            # restores four is 52ea56ac (a second NVMe). The train gate
            # still launches outside the bay bound (0f4224bc), so a dev
            # pod roll that meets a Pending train gate can still wait
            # one gate for its room. The request narrows the disk gap
            # rather than closing it: the seed, containerd and the
            # unrequested pgdata emptyDir are still outside every
            # request (634 + 239 = 873 > 790).
            #
            # EVICTION ORDER, which way it now falls: the kubelet ranks
            # pods "usage exceeds request" first, then by priority. A
            # gate can no longer exceed its request by more than its
            # pgdata and writable layers, so under pressure a dev pod
            # OVER its own 154Gi request is evicted before any gate —
            # where a gate between 90 and 160 used to share that class
            # and lose to the dev pod's priority. A dev pod WITHIN its
            # request still outranks every gate
            # (the_dev_pod_outranks_a_gate_under_pressure), so its
            # protection is the scratch floor wt-cargo runs before
            # every build, as it has been since 2026-09-24 (3f2a08ab).
            #
            # 2026-09-30 (backlog 52ea56ac): the workspace LEFT the
            # install disk for the gate disk, so the 160Gi sizeLimit the
            # request above was pinned to no longer exists, and this
            # request now over-reserves EPHEMERAL on purpose: it is what
            # holds w-1 at v4's three gates. Lowering it is the v5 step
            # — measure w-1's allocatable ephemeral-storage and a gate's
            # real use of it (writable layer, /tmp, pgdata) on the new
            # layout, then move this request, gate_max_concurrent and
            # COMPILED_GATE_MAX_CONCURRENT together — never a side
            # effect of the move (the packet's `after_the_disk`).
            # The kubelet also stops measuring the workspace at all,
            # which ends the reflink-at-full-size eviction run.sh's
            # prune paragraph records (#424's train gate, "exceeds the
            # limit 160Gi" two minutes in).
            #
            # 2026-09-30, later (backlog e6dc7331, delivery-policy v5):
            # MEASURED, and moved. w-1's allocatable ephemeral-storage is
            # 789 GiB, read off the kubelet's own eviction threshold
            # (149611037292 bytes, the 15% line: nodefs 928.9 GiB). A
            # new-layout gate's use was read off the estate observer's
            # 15-minute talos-nodefs series across the first five
            # new-layout gates (21:03Z-22:37Z): 494 and 491 GB free with
            # no gate, 492 / 501 / 489 / 486 with one or two running,
            # so roughly ~8 GB per gate against the 506 -> 391 swings of
            # the old layout that afternoon. The car first set 20Gi from
            # that; review be559bda raised it to 40Gi, because (N1) the
            # 8 GB sits inside the samples' noise — one gate-running
            # sample read MORE free than both idle ones, and none of the
            # five shows a full train gate at its peak — so it is not an
            # upper bound, and (N2) the pgdata emptyDir (no sizeLimit;
            # the postgres container requests nothing) and /tmp (no
            # TMPDIR, so the writable layer) both land under this one
            # request unmeasured. 40Gi costs nothing — four bays plus
            # the train gate beside the dev pod ask 5 x 40 + 154 = 354
            # of 789 — and keeps an ordinary full gate out of the
            # kubelet's "exceeds request" eviction class until 943f1065
            # records a measured peak on the receipt to set it from. The
            # pin reads that sum out of this file, the policy row and
            # boss-dev.yaml, so a raise of either number that would
            # leave a gate Pending is a red. Under pressure a gate within
            # 40Gi still ranks below a dev pod within its own request
            # (priority), and a runaway gate past 40Gi is evicted first.
            #
            # 2026-10-08 (backlog 9cd74fd5): the pgdata emptyDir LEFT
            # EPHEMERAL for memory, so the paragraphs above that count it
            # on this disk are history. 40Gi is unchanged and now covers
            # the writable layer and /tmp alone; it was not re-measured
            # here. MEMORY, which the first paragraph counts per gate at
            # this container's 8Gi: a gate POD now requests 8Gi + 3Gi,
            # the postgres sidecar's share being its data directory — the
            # arithmetic for the bays is beside the `pgdata` volume and
            # pinned in the_gate_postgres_data_lives_in_memory.rs.
            requests: {cpu: "4", memory: 8Gi, ephemeral-storage: 40Gi}
            limits: {cpu: "20", memory: 32Gi}
          volumeMounts:
            # ONE claim, three directories of it, so the seed and every
            # workspace share a filesystem and the seeding copy is a
            # reflink (52ea56ac): the seed, this pod's OWN workspace
            # (named by the pod — see POD_NAME above), and the runs
            # directory itself, which run.sh uses to sweep the
            # directories of gates that died (a lock tells it which) and
            # to read the proof marker. It is mounted READ-WRITE and holds
            # every live run's workspace, so it is the one known
            # exception to per-pod isolation (review 0b9c02f1, F2;
            # structural fix 5e77f216).
            # The kubelet makes a missing subPath directory itself.
            - {name: gate-disk, mountPath: /gate-seed, subPath: seed}
            - {name: gate-disk, mountPath: /gate-target, subPathExpr: runs/$(POD_NAME)}
            - {name: gate-disk, mountPath: /gate-runs, subPath: runs}
            # READ-ONLY, and only to be measured (BOSS_GATE_PGDATA above).
            # The database's own directory under it is 0700 to uid 999, so
            # code a gate runs can neither write nor read its files here.
            - {name: pgdata, mountPath: /gate-pgdata, readOnly: true}
            - {name: run-script, mountPath: /repo-script}
            - {name: forge-token, mountPath: /etc/forge, readOnly: true}
      volumes:
        # THE HISTORY OF THE WORKSPACE VOLUME, kept because each number
        # in it was paid for. Until 2026-09-30 the per-run workspace was
        # an emptyDir `gate-workspace` on the install disk:
        #
        # The per-run workspace: clone + CARGO_TARGET_DIR + logs +
        # receipt. Nothing here outlives the pod, and nothing here is
        # visible to any other gate. The sizeLimit is the eviction
        # backstop behind the scheduler-level request above: a runaway
        # run is evicted alone instead of taking the node's disk down
        # with it.
        #
        # 160Gi, not 100Gi. At 100 the backstop was firing on ORDINARY
        # full runs rather than runaway ones: a cold workspace needs
        # ~74GB of target/ before the clone, the test binaries and the
        # logs, and 2026-09-04 evicted four full gates in a day
        # (`Usage of EmptyDir volume "gate-workspace" exceeds the limit
        # "100Gi"`, exit 137). Every SCOPED gate that day passed and
        # every UNSCOPED one died, which is the signature of a cap set
        # below the real cost of the work rather than of a leak.
        #
        # An eviction here is worse than a slow build, because the pod
        # dies without recording a verdict: the gate-run packet stays
        # open forever, holding a slot and reading as "still gating"
        # (three such ghosts accumulated that day, one of which silently
        # ate a car). A backstop that fires on normal work does not
        # protect the node, it just loses runs.
        #
        # The gate container's ephemeral-storage REQUEST is this same
        # 160Gi, pinned equal (backlog 461159e7). It stood at 90Gi as
        # "the typical run, for placement", which let the scheduler pack
        # five gates whose worst case the node could not hold, and the
        # kubelet evicted one mid-run on 2026-09-29 — the arithmetic is
        # beside the request above. A limit is the size the scheduler
        # must reserve, because it is the size the kubelet evicts on.
        # 160 itself is still an estimate, not a measured peak; 943f1065
        # records the peak on the receipt so both can be set from it.
        #
        # …and the warm seed + crate cache was the claim `gate-seed`
        # (see that PVC's comment), mounted read-write because run.sh's
        # post-verdict refresh writes the next snapshot there; reads and
        # writes coordinate through flock on the volume, never by luck.
        # It sat on the build node's OWN filesystem (a `local` PV
        # declared in infra/cluster/manifests/gate-seed-local.yaml), so
        # run.sh's `cp --reflink=auto` shares extents instead of
        # rewriting tens of GB per gate. The Longhorn claim above stays
        # until this seed is warm, then a car retires it.
        #
        # SINCE 2026-09-30 (backlog 52ea56ac, design 8457c07b) both are
        # ONE claim, `gate`, on w-1's second NVMe — a Talos user volume
        # at /var/mnt/gate — because the bound on parallel gates was
        # that one disk's I/O, and a reflink cannot cross two
        # filesystems, so the workspaces had to move WITH the seed. The
        # mounts above give each pod its own `runs/<pod>` directory as
        # /gate-target, so no two gates share a workspace path; the flock
        # discipline on the seed is unchanged. What changed:
        #   - isolation is NO LONGER TOTAL: /gate-runs mounts every run's
        #     directory read-write into every gate, for the sweep and the
        #     marker (review 0b9c02f1, F2; structural fix 5e77f216). It is
        #     the one known exception, and the isolation pin lists every
        #     mount of the claim so a second one cannot arrive silently.
        #   - no sizeLimit: a local volume has no quota. A runaway run
        #     can fill the gate disk, not the node's; gate.sh's disk
        #     floor reads the workspace's filesystem and REFUSES a gate
        #     before any check when it is short, instead of letting
        #     ENOSPC read as red.
        #   - nothing dies with the pod: run.sh holds a liveness lock,
        #     empties its workspace on exit, and sweeps the directories
        #     of runs that died (the lock is free and nothing in them
        #     moved for an hour).
        #   - the kubelet no longer measures the workspace, so a
        #     reflinked seed can no longer be counted at full size and
        #     evicted as over its limit.
        #   - a missing gate disk is NOT loud by itself: the volume's
        #     old mountpoint directory stays on EPHEMERAL and the PV
        #     mounts it, and PV writes are not ephemeral storage, so
        #     nothing would evict (review a79746c6). run.sh therefore
        #     compares devices before it writes anything and REFUSES
        #     (verdict `refused`, exit 2) when /gate-target shares one
        #     with the pod's /etc/hosts or the seed and workspace sit on
        #     two. The guard is armed by GATE_DISK=required above, not by
        #     a mount happening to exist, and it also requires the
        #     marker /gate-runs/.gate-volume that the gate-volume proof
        #     Job writes once (review 635317c5, C1 and C3).
        # The claim is declared and converged beside its PV in
        # gate-seed-local.yaml, not here: nothing applies this file's
        # claims (`boss gate` creates only the Job). The VOLUME is named
        # gate-disk, not gate, because the container is `gate` and more
        # than one reader finds that container by its `- name: gate` line.
        - name: gate-disk
          persistentVolumeClaim: {claimName: gate}
        # THE GATE'S POSTGRES DATA DIRECTORY IS MEMORY (backlog 9cd74fd5,
        # design 3a8a44c1 step 2, 2026-10-08). It was `emptyDir: {}`,
        # which the kubelet puts on the install disk's EPHEMERAL — the
        # Samsung, beside the dev pod's builders. Design 8457c07b moved a
        # gate's disk I/O to the gate volume and left this one writer
        # behind. Measured on backlog 17f6170c: a gate's test check (30 of
        # its 37 minutes alone) barely writes the gate drive and writes
        # the Samsung, with write await spikes of 40 to 143 ms there, and
        # two false reds on loopback timeouts on 2026-10-07 came with
        # three gates plus five builders. The sidecar already runs with
        # fsync, synchronous_commit and full_page_writes off, so the data
        # is disposable by design and loses nothing by being pages.
        #
        # MEASURED, 2026-10-07 23:18Z to 2026-10-08 00:42Z, on three
        # `--auto` gates on w-1 (two car gates and the 23:36 train gate):
        # the sum of pg_database_size over every database plus pg_wal,
        # read from each running gate's own Postgres every 20 to 25 s
        # (the kubelet's volume stats are not readable by the dev
        # session). The shape repeated: about ten minutes in, 110 to 120
        # scratch databases appear within 90 seconds, 16 MB each, and
        # stay for most of the test check; the directory peaks at 1.78,
        # 1.85 and 1.93 GiB, pg_wal never passed 0.08 GiB, and the train
        # gate ended at 0.19 GiB once they were dropped. Largest reading:
        # 2,072,238,410 bytes, 126 databases. NOT measured: a full-scope
        # gate, the first ten minutes of two of the three, and anything
        # between two reads.
        #
        # 6Gi IS THAT PEAK TIMES THREE (3.1), the factor standing in for
        # what was not measured. Since Kubernetes 1.22 a memory emptyDir
        # with a sizeLimit is a tmpfs OF that size, so at the limit
        # Postgres gets `No space left on device` and the DB-backed tests
        # after it fail; the kubelet evicts the pod only if use ever reads
        # ABOVE the limit. A run that fails that way is recorded
        # `failed`, like any other red: the collector marks the volume
        # (runtime_evidence.pgdata.full, at 95% of its size) as EVIDENCE
        # for whoever reads the red and changes no verdict, because a
        # reading over a threshold cannot say which check failed or
        # whether the car's own tests filled the database (review
        # bc011e92, F1). An evicted pod leaves no receipt, which the
        # conductor settles `lost`. Every receipt carries the peak
        # (runtime_evidence.pgdata), so this number is re-read on every
        # gate: raise it, with the postgres container's limit, when a
        # receipt shows a peak over half of it.
        #
        # WHAT IT COSTS w-1 (62.7 GiB; MemTotal 65,735,920 kB). By
        # request: three bays plus the train gate (delivery policy v7) at
        # 8Gi + 3Gi each, beside the dev pod's 8.6Gi, is 52.6 GiB. THAT IS
        # FOUR GATES, AND IT IS THE CEILING: a FIFTH concurrent gate (a
        # dock re-gate beside three bays and a train gate) asks 63.6 GiB,
        # over the node's whole 62.7, and would sit Pending until one
        # finishes. Five ran together on 2026-10-06/07 at the old 8.5 GiB
        # a pod (51.1). The pin holds four against nine tenths of
        # MemTotal - the node's allocatable is not readable from the dev
        # session, and the pin counts only this namespace's pods. By use:
        # MemAvailable read 44 GB (41 GiB) with FIVE gates running, their
        # builds' memory included (17f6170c); four gates at the measured
        # peak take 7.7 GiB of it, and four gates each FILLING this volume
        # take 24 GiB and leave 17. The gate container's own memory.peak
        # read 11.7 to 14.7 GiB on four gates that day, file cache
        # included, against its 32Gi limit.
        #
        # THE FALLBACK, if receipts or the node show memory pressure: put
        # this directory on the gate volume instead (a `pgdata/$(POD_NAME)`
        # subPath of the `gate-disk` claim, emptied by run.sh like the
        # workspace) — never EPHEMERAL again. Not built: memory fits.
        - name: pgdata
          emptyDir: {medium: Memory, sizeLimit: 6Gi}
        - name: pg-shm
          emptyDir: {medium: Memory, sizeLimit: 1Gi}
        # run.sh ships in the repo and reaches the pod through this
        # ConfigMap, because run.sh is what performs the clone and so
        # cannot come FROM the clone. Regenerate it from the tree with
        #   ./infra/gate-runner/apply-script-configmap.sh
        # and ask whether it has drifted with --check. This used to be
        # a kubectl command in a comment; on 2026-08-26 the live copy
        # turned out to hold an unlanded branch is script, and ten gates
        # issued receipts from a gate that is not in this repository.
        - name: run-script
          configMap: {name: gate-runner-script, defaultMode: 0755}
        # Read-only forge credential. NOT optional: without it the clone
        # prompts for a username and the Job fails before it gates
        # anything, which is how this rig sat broken while every gate
        # ran in the dev pod instead.
        - name: forge-token
          secret: {secretName: forge-read, defaultMode: 0400}
