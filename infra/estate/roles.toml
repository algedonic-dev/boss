# infra/estate/roles.toml — which units a host runs, derived from the
# roles it DECLARES (design 9e3e093f; migration
# 202609120300-a-node-declares-its-roles.sql).
#
# THIS FILE IS THE ROSTER. A managed host's roster used to be "every
# row of deploy-services.sh's TIMERS array", pinned equal to this file
# by a lint — a holding action (CLAUDE.md §9a). Since 2026-09-18 (backlog
# e109bd71) the array is gone: infra/gcp/install-units.sh reads the set
# of rows from here and finds each stem's `<stem>.service` +
# `<stem>.timer` pair in the tree. The host reads its roles off
# /api/estate/nodes (Classes of `node`, joined through node_roles) and
# `install-units.sh units` installs the rows its roles name plus the
# `always` set; every other row is REPORTED as NOT IN ROLE — reported,
# not uninstalled: the uninstall is the uninstall-not-in-role ops verb's
# job (infra/gcp/uninstall-not-in-role.sh), which takes its set from
# `install-units.sh roster` — the same derivation — and never from a
# list of its own.
#
# Every stem appears in exactly one role (or `always`) here — the
# installer refuses a stem named twice — and every stem named here must
# have a unit pair under infra/ (timers-leave-a-packet.sh names one that
# does not). Keep each `units = [...]` on ONE line: the installer reads
# this file with the shell, not a TOML parser.
#
# A host that declares NO roles installs every row, exactly as before
# this file existed; a host whose system of record cannot be reached at
# converge time does the same and says so on its packet. An arm that
# needs the patient is not an arm.

# Every managed host: the loop that adopts its own units, and the
# observer that reports what those units did.
[always]
units = ["boss-gcp-converge", "boss-estate-observe-units"]

[roles.wireguard-bastion]
# WireGuard itself is a distro service, not a BOSS timer.
units = []

[roles.off-cluster-observer]
# Observes the estate from OUTSIDE the cluster it observes, and reads
# the codebase's own size — the drift between its authored protocols
# and the live registry — and which of its surfaces operators open,
# from the checkout it converges.
units = ["boss-estate-observe-host", "boss-codebase-metrics", "boss-protocol-drift", "boss-surface-usage"]

[roles.ml-batch-host]
units = ["boss-ml-inference-batch"]

[roles.cluster-operator]
# Where cluster management commands run (design 1bc4b4ed): the host
# carries talosctl and kubectl and the cluster credentials under
# /etc/boss-ops — and, since 2026-09-18 (backlog 9f00a805), the tree's
# own `boss` CLI, taken out of the cluster image built for the commit
# the converge checked out (infra/estate/install-cli-from-image.sh, the
# installer boss-gcp runs unconditionally; `cli_sha` on the converge
# packet). No units row — what this role brings is tooling, installed
# by infra/forge/install.sh when the converge reads the role, and a
# credential-presence check reported on the converge packet. The
# ops verbs that read the cluster (node-status, pod-events, talos-logs)
# and the bounded act (node-converge) are the next cars, and the forge
# verbs that are shell twins of CLI verbs retire onto the CLI one at a
# time.
units = []

[roles.legacy-stack]
# The chores that maintained the second, older stack's data — retired
# with it on 2026-09-15 (ops-request 7912c9ae) and uninstalled from
# boss-gcp by the uninstall-not-in-role verb. The host backup and the
# deploy-confirm dead-man left this list with the bare-metal deploy path
# (2026-09-18): the cluster's boss-pg-backup CronJob is the backup, and
# the conservation sweep's units were deleted the same day once its
# CronJob existed (H12, backlog 236529aa). Each chore here has a cluster
# CronJob twin that is the one that runs.
# This role exists to be removed.
units = ["boss-messages-events-purge", "boss-audit-integrity-check", "boss-ledger-recognize", "boss-ledger-replay-check", "boss-files-gc", "boss-views-catchup", "boss-search-reindex"]
