# systemd drop-in for boss-gateway: read-only guest browsing.
#
# BOSS_GUEST_ACCESS takes one of three answers (design 2830b6b7,
# decided 2026-09-25): `0` (or unset) offers no guest; `basic` (or `1`)
# signs a stranger in as guest@algedonic.dev with the `visitor` role,
# which reads only what the install grants it as policy data; `audit`
# signs them in with the `audit-readonly` role — read every projection.
# Either guest writes nothing: the gateway refuses every write from a
# read-only role at the edge. This file set `1` and said it minted
# audit-readonly, which stopped being true when `1` came to mean basic
# (backlog e0996bca), so it now names `audit`, the playground's answer
# in infra/cluster/instances.toml — the container gateway there reads it
# from boss.yaml, not from this drop-in.
#
# Replaces demo-mode.conf, which set BOSS_DEMO_MODE and did three
# unrelated things: gated guest access, gated whether the brewery
# simulator ran, and — worst — made the gateway MINT an
# audit-readonly session for anyone arriving without a valid cookie.
# That last one made an EXPIRED login indistinguishable from a
# permissions problem: the mint reissued the cookie under the same
# name, so an operator stayed apparently signed in while silently
# downgraded, and every write returned 403.
#
# Whether the simulator runs is now answered by whether its unit is
# enabled. Nothing mints a session; a visitor is signed in as an
# employee, as a guest, or not at all.
#
# After editing:
#   sudo systemctl daemon-reload && sudo systemctl restart boss-gateway

[Service]
Environment=BOSS_GUEST_ACCESS=audit
# Origin the password-reset link points at. Without it the link falls
# back to the loopback listener, which nobody outside this box can
# open — deliberately obvious rather than plausibly wrong.
Environment=BOSS_PUBLIC_URL=https://playground.algedonic.dev
