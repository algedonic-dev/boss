# systemd drop-in for boss-gateway: the auth-event staging path
# (docs/architecture-decisions.md §Policy & auth; resolved
# 2026-08-11).
#
# The URL carries the INSERT-only boss_gateway_audit role created by
# 111-gateway-audit-events.sql — not the boss service user. The
# gateway stages auth.login.denied / auth.login.succeeded /
# auth.session.guest onto event_outbox through a 2-connection lazy
# pool; the relay carries them into audit_log like every other event.
#
# Unset this and the gateway still runs: every auth event degrades to
# the structured warn line that was the record before this existed.
#
# After editing:
#   sudo systemctl daemon-reload && sudo systemctl restart boss-gateway

[Service]
Environment=BOSS_GATEWAY_AUDIT_DB_URL=postgres://boss_gateway_audit:boss_gateway_audit@127.0.0.1/boss
