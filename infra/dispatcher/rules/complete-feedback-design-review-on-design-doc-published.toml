# Deciding the design decides the feedback (backlog 5f0b2661; David's
# bug 4f6019d7, 2026-09-15 00:52Z on /ux/jobs/61366e5a).
#
# A feedback routed to `design` gave one person TWO decisions: the
# design-doc packet's review — structured questions at /it/design — and
# the feedback packet's own `design-review` step, an `answer-question`
# carrying `verdict: ""` and nothing else. The second is empty by
# construction: the design IS the question, and it lives on the other
# packet. "There is no question, just a statement … If I was assigned a
# decision step there is something to decide and the needed context has
# been provided by upstream job workers." And if the operator decided
# that step first, the design went unread. The two were linked by
# `metadata.design_packet` on the feedback — a free-text string an
# operator typed, which nothing read. Both live pairs (61366e5a <-
# c6bd173e, 33324fe9 <- c6f9fb3e) sat that way after David decided both
# designs.
#
# THE SAME SHAPE AS THE MERGE OBLIGATION, with different data.
# `boss design --answers <packet>` writes `metadata.answers` on the
# design-doc — a DECLARED job edge (20260915023329), ref-checked and
# prefix-normalised at the write like ship-a-change's `backlog_item` —
# and gives the feedback's design-review a real question naming the
# design. This rule is the other half: when the design closes
# `published`, `jobs.complete_linked_step` follows `answers` to the
# packet and completes its open `design-review`, and the packet's own
# `ready_when` opens `build`. The handler needed one change: `fill`
# treated a present `""` as a person's answer, so it would have PUT the
# Workflow's own `verdict: ""` placeholder back and 400'd (the design-
# close witness test in jobs_complete_linked_step.rs found it).
#
# WHY THE VERDICT IS `approved`, AND WHY ONLY `published`. design-doc's
# review step declares `resolutions` required at done with `covers =
# "questions"`, so a design cannot reach `fold`, and so cannot publish,
# until EVERY question carries a decision — `published` IS "every
# question decided", read off the Workflow rather than re-derived from
# the resolutions' free text. And `published` is design-doc's ONLY
# terminal today: there is no declined design in the protocol. A design
# closed any other way (a hand status-PUT carries a null outcome) does
# not match here and leaves the feedback's step to a person — the rule
# must not fabricate `declined` from silence. When design-doc gains a
# declined terminal (c6f9fb3e's abort-with-reason is the nearest work),
# the mapping to `verdict = declined` is a v2 of this file with a second
# outcome, not a new mechanism.
#
# `steps` names ONE branch and there is NO `route`: a design must not
# triage a packet nobody routed to design. `backlog-item` has the same
# `design-review` step (answer-question, the same verdict enum), and
# the handler follows the edge to whatever kind it names — so this one
# rule covers both kinds; design_decides_feedback_rule.rs pins the step
# and its verdict enum against both live Workflows.
#
# `evidence_key = decided_by`: the default `arrived_from` says a change
# landed, and nothing landed here — a design was decided. The evidence
# object still names the closing packet, its title and its outcome.
#
# v2 (backlog 8f83cade, 2026-09-18): THE BACKSTOP, NOT THE DECISION.
# `published` was the wrong moment: between the review and the
# terminal sits `fold`, the agent's write-up, so a design David had
# decided stayed undecided on the packet it answers for minutes to
# hours (two 'Decide the design' steps sat in his queue after he had
# answered both designs). The completion now fires at the review's
# completion — complete-feedback-design-review-on-design-review-decided,
# on `step.done.review-design`. This rule stays for the one case that
# one cannot reach: a design whose review completed BEFORE that rule
# was live and whose fold happens after (measured at the change: one
# open design, 01c3cc3f, still at review; the two decided ones had
# already published). When the review-time rule has already completed
# the packet's step, the handler's second guard finds it completed and
# this rule writes nothing — no second `step.done`, no noop note.
[[rule]]
name = "complete-feedback-design-review-on-design-doc-published"
why = """
A CROSS-PROTOCOL REACTOR: it advances a `user-feedback` (or
`backlog-item`) packet from a `design-doc` close, spanning two
protocols by construction, so no single Workflow definition can
declare it. Measured 2026-09-15: both live feedback packets routed to
design (61366e5a, 33324fe9) had their designs decided by David and
their own design-review steps still open — an empty second decision
for the same person, linked to the first only by a string nothing
read (David's bug 4f6019d7: "There is no question, just a statement").
The design decision is the feedback decision; this rule makes the
system say so instead of an operator. Since v2 (8f83cade) the
review-time rule says it at the review, and this one is the backstop
for a design decided before that rule was live: idempotent, silent
when the step is already complete.
"""
version = 2
on_event = "jobs.job.closed"
when = "kind = \"design-doc\" AND outcome = \"published\""
[[rule.do]]
handler = "jobs.complete_linked_step"
args = { link = "\"answers\"", steps = "\"design-review\"", done_metadata = '"{\"verdict\": \"approved\", \"answer\": \"design decided: {title} ({car}) — every question resolved and the design published; the build goes ahead as it proposes\"}"', evidence_key = "\"decided_by\"" }
