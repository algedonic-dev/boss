# A read of a replica rebuild that is still moving files the next read of
# the same volume, until the rebuild is PROVEN or STALLED (backlog
# 090643a1).
#
# rebuild-a-failed-replica-in-progress-files-its-read-back files the
# first read-a-replica-rebuild when the passkey-approved rebuild reaches
# its read-back bound with the copy still being written (ops-request
# d326b6c7: 73 GB, FAILED at 1200 s, healthy 21 to 37 minutes after it
# started). Each read waits up to BOSS_REBUILD_READBACK_S (default 1200)
# for the volume to stand at its declared count, every replica healthy
# and RW on distinct nodes; that wait is the cadence, so the forge's
# serial runner is asked once per bound rather than once a minute.
#
# HOW THE CHAIN ENDS. On the verb's own answer, never on a count: PROVEN
# prints a line this pattern does not match, so nothing is filed;
# STALLED (nothing moved for BOSS_REBUILD_PROGRESS_S) and CANNOT ANSWER
# exit 1, which ops.judge does not chain and files as an urgent alarm
# naming the line. A copy that sits at a percentage, or at 100 without
# turning RW, stops moving and reads STALLED. What this chain does NOT
# bound is a rebuild Longhorn keeps failing and restarting under new
# replica names: each restart moves, so each read answers IN PROGRESS
# and files the next, one request per bound, every one on the record —
# visible, not silent, but not an alarm; a ceiling is not this car's.
# ops.judge skips a request that IS the packet
# its rule files by comparing the rule's LITERAL args, so a templated
# `{volume}` follow-on of the same verb is judged — that is what lets
# this rule read its own follow-on, and why the ending above is the
# verb's to give.
[[rule]]
name = "read-a-replica-rebuild-in-progress-reads-it-again"
why = """
A CROSS-PROTOCOL REACTOR, the second half of
rebuild-a-failed-replica-in-progress-files-its-read-back: a read that is
itself still in progress must file the next read, and jobs.job.closed
carries neither the exit nor the output, so no Workflow consequence can.
Measured on ops-request d326b6c7 (backlog 090643a1): the rebuild
outlived the verb's bound by about twenty minutes, and a 73 GB copy at
~35 MB/s can outlive one read too. No authority widened: it files only
the READ-ONLY read-a-replica-rebuild, on the volume the previous read
named. A stall is an urgent alarm rather than a silent end. Redelivery-
safe: the judged read carries `judged` once read, and an open read
linked by for_check is found before a twin is filed.
"""
version = 2
on_event = "jobs.job.closed"
# `failed` and `indeterminate` are how the ops-request row closes a verb
# that RAN with a nonzero or an unknown exit (design b7bb1625, backlog
# 50a1578f); before that row it closed `answered` whatever the exit, so
# this rule hears exactly the runs it heard before, and its judge still
# reads the exit off the execute record. Pinned by boss-dispatcher's
# an_ops_request_rule_that_hears_an_answer_hears_a_failure.
when = 'kind = "ops-request" AND (outcome = "answered" OR outcome = "failed" OR outcome = "indeterminate")'
[[rule.do]]
handler = "ops.judge"
args = { verb = '"read-a-replica-rebuild"', verdict_pattern = '"^read-a-replica-rebuild: IN PROGRESS . volume (?P<volume>pvc-[0-9a-f-]+) is still rebuilding after [0-9]+s, last moved (?P<moved>[0-9]+)s ago"', when = '"moved >= 0"', then_verb = '"read-a-replica-rebuild"', then_host = '"forge"', then_args = '"{volume}"' }
