# publish-to-github v6's machine step (design 7b59af2c). When the
# protocol's `open-pr` step becomes READY — David approved the publish —
# spawn an ops-request for host=forge verb=publish-github-pr; the root
# ops-runner runs the verb (snapshot commit on the mirror's main, push to
# the dauld fork, `gh pr create`) and completes `open-pr` with `pr_url`.
# Routed on the STEP's metadata marker, not its slug: `step.ready.*`
# payloads carry the step's metadata_defaults but do not hoist spec_slug
# the way step.done does. `metadata.ops_verb` is Absent on every other
# task step, and Absent is UNEQUAL to the literal — false, not
# PredicateFailed — so the shared topic never dead-letters. A cross-
# protocol reactor (publish-to-github -> ops-request -> the forge host),
# which no single Workflow `on` consequence can express. First seeded by
# 202609081200-publish-github-pr-on-open-pr-ready.sql, applied history: this
# FILE is now the definition, and the registry row is published from
# it at boot (rules::seed — backlog 41ba00cd).
[[rule]]
name = "publish-github-pr-on-open-pr-ready"
why = """
A CROSS-PROTOCOL REACTOR spanning three protocols — publish-to-github
-> ops-request -> a verb on the forge host — which no single Workflow
`on` consequence can express. publish-to-github v6's `open-pr` step
becoming ready means David approved the publish; the mirror PR is then
opened by machine, as dauld, and the merge on GitHub stays David's. It
adds no routing inside the protocol: the row still owns measure ->
review -> approve -> open-pr, and this only files the packet that runs
one step. (Ratchet history: 57 -> 58, 2026-09-08, migration
202609081200.)
"""
on_event = "step.ready.task"
when = 'metadata.ops_verb = "publish-github-pr"'
[[rule.do]]
handler = "jobs.spawn"
args = { kind = "\"ops-request\"", subject_kind = "\"custom\"", subject = "\"forge\"", title = "\"publish the mirror PR from the forge — a publish was approved\"", "metadata.host" = "\"forge\"", "metadata.verb" = "\"publish-github-pr\"" }
