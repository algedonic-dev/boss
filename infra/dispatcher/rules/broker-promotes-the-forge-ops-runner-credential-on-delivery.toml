# ---------------------------------------------------------------------
# The broker promotes the forge's new ops runner credential once the
# forge has recorded delivery of it (backlog 1e50e66b).
#
# THE GAP THIS CLOSES. The stage leaves the new value in forge.next and
# the old one in forge.current, both resolving to `forge`, because the
# runner reads a FILE the forge's converge fills on its next pass, up to
# ten minutes later; dropping the old value before then would leave the
# runner presenting a credential the jobs API no longer knows. So the
# deposit (infra/forge/runner-credential-deposit.sh) completes the
# packet's `delivered` step — kind `credential-delivery`, so this fires
# on nothing else — with the last eight of the value it installed, and
# only then does this rule promote: forge.current = that value,
# forge.next and forge.previous blank, in one merge-patch. The handler
# then confirms by effect that the new value resolves at slot `current`
# and the old one resolves to nothing, and completes `revoke`.
#
# THE ARGS ARE THE ROTATION RULE'S, verbatim: one declaration, two
# triggers. crates/core/boss-dispatcher/tests/ops_runner_credential_rules.rs
# pins them equal (CLAUDE.md §9a).
[[rule]]
name = "broker-promotes-the-forge-ops-runner-credential-on-delivery"
why = """
EXTERNAL GLUE, the same class as the rotation rule it completes: the
effect is a k8s Secret write no Workflow definition can address, and
the condition is a fact only the host can observe — that it now holds
the new value — which it records as the packet's `delivered` step. It
adds no routing: it advances the very packet that fired it and spawns
nothing. Backlog 1e50e66b (2026-09-30).
"""
on_event = "step.done.credential-delivery"
when = 'subject_id = "ops-runner-credential-forge"'
[[rule.do]]
handler = "credential.rotate.ops-runner"
args = { secret_namespace = "\"boss\"", secret_name = "\"ops-runner-credential\"", credential_id = "\"ops-runner-credential-forge\"", host = "\"forge\"" }
