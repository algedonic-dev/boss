# ---------------------------------------------------------------------
# The credential broker rotates the forge's ops runner credential (design
# f623e425 Q1, option A, decided by David 2026-09-25; backlog 1e50e66b).
# THIS RULE IS ITS DECLARATION, the convention of
# `broker-rotates-the-forge-host-checkout-token`: registry id
# `ops-runner-credential-forge`, Secret boss/ops-runner-credential, the
# slots of host `forge` (keys forge.current / forge.next /
# forge.previous, each a file of the jobs API's credential door's mount
# at /etc/boss/runner-credential).
#
# THE VALUE HAS NO ISSUER OUTSIDE THE ESTATE: 32 random bytes, base64url,
# minted by the handler. The scope step fires the stage: mint into
# forge.next (forge.current, the value the runner holds, keeps resolving),
# record issue and install, then verify by effect through GET
# /api/jobs/runner-credential — the door itself, presenting the staged
# value. The install says delivery = "off-host", which readies the
# packet's `delivered` step.
#
# OFF-HOST DELIVERY. The consumer is a root-only file on the forge,
# /etc/boss/ops-runner.credential, which infra/ops/ops-runner.sh presents
# on every request. forge-converge's infra/forge/runner-credential-deposit.sh
# reads this Secret through the forge's admin kubeconfig, proves the
# staged value resolves to `forge` through the same door, installs it
# (root:root 0600), and completes `delivered` with its last eight. The
# promotion — forge.current = the new value, forge.next and
# forge.previous blank, the old value dead by effect — runs on the second
# rule, `broker-promotes-the-forge-ops-runner-credential-on-delivery`,
# which hands the handler this same declaration (pinned equal by
# crates/core/boss-dispatcher/tests/ops_runner_credential_rules.rs).
#
# boss-gcp, the other ops runner host, is a second pair of these rules
# once its delivery exists: the forge's deposit is local, and a deposit
# onto another host is the remote target backlog 7336cb5f builds.
#
# The Secret is created EMPTY by the cluster converge from this file's
# secret_namespace/secret_name (cluster-deploy-lib.sh
# ensure_declared_secrets); the broker's name-scoped grant on it is
# `credential-broker-ops-runner-credential` in
# infra/cluster/manifests/boss-credential-broker.yaml.
[[rule]]
name = "broker-rotates-the-forge-ops-runner-credential"
why = """
EXTERNAL GLUE, the census class for reactions whose effect lives
outside the system: the broker writes the k8s Secret store, which no
Workflow definition can address, and proves the write through the jobs
API's credential door. The rotate-a-credential protocol row declares the
ORDER (issue -> install -> verify -> delivered -> revoke); this rule is
the machine executor for ONE credential, and its args are that
credential's declaration. It adds no routing: it advances the very
packet that fired it and spawns nothing. Backlog 1e50e66b (2026-09-30).
"""
on_event = "step.done.credential-rotation"
when = 'subject_id = "ops-runner-credential-forge"'
[[rule.do]]
handler = "credential.rotate.ops-runner"
args = { secret_namespace = "\"boss\"", secret_name = "\"ops-runner-credential\"", credential_id = "\"ops-runner-credential-forge\"", host = "\"forge\"" }
