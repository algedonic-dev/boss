# The image-freshness sweep arrives with its measurement. When its
# `Inspect` checklist becomes ready (the step.ready.checklist event
# whose subject is this sweep's target), spawn an ops-request
# `ci-image-report` to the forge and link it back to the sweep as
# metadata.for_sweep — so the inspector reads the runner's own numbers
# off a packet instead of fetching them by hand first. Counted
# 2026-09-12 (8e8311f5): six inspections in one day each began with
# that fetch.
#
# ITS OWN VERB, since 2026-09-18 (backlog 18df96c4). This rule was a
# copy of disk-headroom's and filed `disk-report`, whose verdict is the
# disk floor and says nothing about the question the daily rule's `why`
# records — a runner-local boss-ci tag older than the registry's — so
# the sweep's Inspect step could never be judged by rule and sat on the
# agent. `ci-image-report` (infra/forge/ci-image-report.sh) compares
# the system daemon's floating boss-ci tag against the registry's
# digest and ends with the one verdict line
# judge-image-freshness-sweep-on-report-answered reads.
[[rule]]
name = "measure-image-freshness-sweep-on-inspect-ready"
why = """
A CROSS-PROTOCOL REACTOR spanning maintenance-sweep -> ops-request ->
a read on the forge host, which no single Workflow consequence can
express: the sweep's protocol cannot name a host verb, and the
ops-request's cannot know which sweep asked. The measurement is a
READ (ci-image-report, forge-scoped, no authority widened) that
answers THIS sweep's question — the runner's local boss-ci tag
against the registry's — where the disk-report it filed until
2026-09-18 answered the disk floor's (backlog 18df96c4); the
inspector's judgement stays a human or agent step over a reading
that is now on the record before they arrive. Self-filters to this
one sweep by the subject the daily spawner gives it.
"""
version = 2
on_event = "step.ready.checklist"
when = 'subject_id = "image-freshness"'
[[rule.do]]
handler = "jobs.spawn"
args = { kind = "\"ops-request\"", subject_kind = "\"custom\"", subject = "\"forge\"", title = "\"ci-image-report on forge — the image-freshness sweep's measurement\"", "metadata.host" = "\"forge\"", "metadata.verb" = "\"ci-image-report\"", "metadata.for_sweep" = "job_id" }
