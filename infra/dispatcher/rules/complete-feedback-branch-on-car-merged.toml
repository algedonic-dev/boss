# A shipped change answers the packet that authorized it (job
# 2c4ae549). `ship-a-change` has declared a `backlog_item` job edge at
# its Job metadata since migration 104 — dialed to `abort` by 105, so
# an unresolvable referent is refused at the write — and until now
# nothing READ it. Measured 2026-08-11: sixteen feedback packets sat at
# `submitted` while the work they authorized was shipped, tested and
# live; the loop closed only because an agent remembered.
#
# David ratified the rule: "Once the user feedback results in either a
# shipped change or some other terminal state, it can be closed without
# the filer approving." So the merge completes the branch step triage
# opened, and the `user-feedback` Workflow's own `ready_when` fires its
# `closed` terminal — nothing here knows the packet closes.
#
# `steps` lists the branches a SHIPPED change satisfies. `needs-info`
# is deliberately absent: a change landing does not answer a question
# asked of the reporter. The list is pinned against the live Workflow
# by boss-dispatcher's tests/feedback_obligation_rules.rs, so renaming
# a branch fails CI instead of silently completing nothing.
#
# `when` binds `kind` / `outcome` off the close marker — both present
# on every emit site, null when unanswered (the same always-present
# contract `notify_on_done` has on step.done: an ABSENT identifier is a
# PredicateFailed → Retry → dead-letter, not a quiet false). Seeded
# live by 117-feedback-obligation.sql.
[[rule]]
name = "complete-feedback-branch-on-car-merged"
why = """
A CROSS-PROTOCOL REACTOR: it advances a `user-feedback` packet from a
`ship-a-change` close, spanning two protocols by construction, so no
single Workflow definition can declare it. Measured 2026-08-11:
sixteen feedback packets sat at `submitted` while the work they
authorized was shipped, tested and live — the loop closed only
because an agent remembered. David ratified the reaction: a shipped
change may close the packet without the filer approving.
(Ratchet history: this rule and the one below raised the census
baseline 38 -> 40 on 2026-08-13, unnoticed until the gate was wired
into forge CI.)
"""
# Bumped by migration 150: v2 adds `done_metadata`, the rule row's own
# translation of "this car merged" into the completed step kind's
# vocabulary. user-feedback v11's design-review is `answer-question`
# (verdict + answer required at done), and an evidence-only completion
# would 400 there. String values substitute {branch}/{car}/{title};
# absent keys only — a person's own written metadata always wins.
#
# Bumped by migration 202609082000: v3 adds `route` (dda0713c). The
# trigger was already the right moment — ship-a-change's `merged`
# terminal is `ready_when = "steps.proven.done"`, so this close IS the
# car proven in production — but a `backlog-item` parked against the
# car with `--park-backlog-item` sat untriaged: `build` was pending,
# `triage` was the open step, and v2 wrote an `obligation_noop` on the
# car instead ("triage is a routing decision an obligation must not
# make"). For a backlog item that reasoning inverts: the route asks an
# operator to measure a claim, and a car that landed and was proven IS
# the measurement. Five items were closed by hand that way in one
# night — triage `disposition=build` with the car as evidence, then
# `build` with the proof. `route` is that routing as data: the KIND
# whose triage vocabulary it speaks (user-feedback keeps the v2 answer
# — a filer's decision is still theirs), the routing STEP, and the
# METADATA that step requires at done. The handler completes the route
# step, re-reads, and the fork's own `ready_when` opens `build`, which
# `steps` then completes; the item's `closed` outcome does the rest.
# Absent keys only, as with done_metadata.
version = 3
on_event = "jobs.job.closed"
when = "kind = \"ship-a-change\" AND outcome = \"merged\""
[[rule.do]]
handler = "jobs.complete_linked_step"
args = { link = "\"backlog_item\"", steps = "\"investigate,design-review,build\"", done_metadata = '"{\"verdict\": \"approved\", \"answer\": \"shipped: {branch} — {title}\"}"', route = '"{\"kind\": \"backlog-item\", \"step\": \"triage\", \"metadata\": {\"disposition\": \"build\", \"evidence\": \"shipped and proven: {branch} — {title} (car {car})\"}}"' }
