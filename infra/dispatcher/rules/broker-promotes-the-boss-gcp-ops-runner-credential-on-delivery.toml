# ---------------------------------------------------------------------
# The broker promotes boss-gcp's new ops runner credential once boss-gcp
# has recorded delivery of it (backlog 1e50e66b) — the forge pair's
# promotion (broker-promotes-the-forge-ops-runner-credential-on-delivery
# carries the reasoning), for the host whose credential arrives by push.
#
# boss-gcp's receiver (infra/gcp/runner-credential-recv.sh, behind the
# runner deposit key's forced command) installs the staged value, proves
# it resolves to boss-gcp at the jobs API's credential door, and completes
# the packet's `delivered` step with its original owner receipt; only then
# does this rule promote: boss-gcp.current = that value, boss-gcp.next and
# boss-gcp.previous blank, in one merge-patch, the old value dead by
# effect.
#
# THE ARGS ARE THE ROTATION RULE'S, verbatim: one declaration, two
# triggers (CLAUDE.md §9a), pinned equal by
# crates/core/boss-testing/tests/runner_credential_recv_sh.rs.
[[rule]]
name = "broker-promotes-the-boss-gcp-ops-runner-credential-on-delivery"
why = """
EXTERNAL GLUE, the same class as the rotation rule it completes: the
effect is a k8s Secret write no Workflow definition can address, and
the condition is a fact only the host can observe — that it now holds
the new value — which its receiver records as the packet's `delivered`
step. It adds no routing: it advances the very packet that fired it and
spawns nothing. Backlog 1e50e66b (2026-10-10).
"""
on_event = "step.done.credential-delivery"
when = 'subject_id = "ops-runner-credential-boss-gcp"'
[[rule.do]]
handler = "credential.rotate.ops-runner"
args = { secret_namespace = "\"boss\"", secret_name = "\"ops-runner-credential\"", credential_id = "\"ops-runner-credential-boss-gcp\"", host = "\"boss-gcp\"" }
