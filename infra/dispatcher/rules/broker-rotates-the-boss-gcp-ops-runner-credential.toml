# ---------------------------------------------------------------------
# The credential broker rotates boss-gcp's ops runner credential (design
# f623e425 Q1, option A; backlog 1e50e66b). THIS RULE IS ITS DECLARATION,
# the forge pair's convention (broker-rotates-the-forge-ops-runner-
# credential carries the reasoning): registry id
# `ops-runner-credential-boss-gcp`, Secret boss/ops-runner-credential,
# the slots of host `boss-gcp`.
#
# OFF-HOST DELIVERY, BY PUSH. boss-gcp reads no Secret, so the forge
# delivers it: forge-converge's infra/forge/runner-credential-push.sh runs
# infra/gcp/runner-credential-send.sh, which hands the staged boss-gcp.next
# to the forced-command receiver infra/gcp/runner-credential-recv.sh over
# the broker-prepared runner deposit key (prepare-a-deposit-key on
# runner-deposit-key, enrolled and signed by David). The receiver installs
# /etc/boss/ops-runner.credential (root:root 0600), proves it through the
# jobs API's credential door, and completes `delivered`; the promotion is
# the second rule, which hands the handler this same declaration.
#
# Moved here from infra/gcp/runner-credential-declaration.toml, where both
# rows sat inert until the transport existed: the broker-stage verifier
# landed (25fff647, car ee80318b), the deposit key is prepared and enrolled
# (c7f12e6f), and the receiver is installed by boss-gcp's converge. The
# handler still mints nothing until the registry row
# `ops-runner-credential-boss-gcp` answers kind ops-runner-credential and
# principal runner:ops, and nothing fires until a person scopes a
# rotate-a-credential packet on it.
[[rule]]
name = "broker-rotates-the-boss-gcp-ops-runner-credential"
why = """
EXTERNAL GLUE, the census class for reactions whose effect lives
outside the system: the broker writes the k8s Secret store, which no
Workflow definition can address, and proves the write through the jobs
API's credential door. The rotate-a-credential protocol row declares the
ORDER (issue -> install -> verify -> delivered -> revoke); this rule is
the machine executor for ONE credential, boss-gcp's, and its args are
that credential's declaration. It adds no routing: it advances the very
packet that fired it and spawns nothing. Backlog 1e50e66b (2026-10-10).
"""
on_event = "step.done.credential-rotation"
when = 'subject_id = "ops-runner-credential-boss-gcp"'
[[rule.do]]
handler = "credential.rotate.ops-runner"
args = { secret_namespace = "\"boss\"", secret_name = "\"ops-runner-credential\"", credential_id = "\"ops-runner-credential-boss-gcp\"", host = "\"boss-gcp\"" }
