# CounterpartyEngine reacts to (banks, suppliers, the keg courier, the tax
# authority, the operational broadcasts) to its callback receiver via
# `webhook.notify`. The simulator never subscribes to the event stream — the
# system pushes to a configured webhook, preserving the sim/system boundary.
# No-op in any deployment without BOSS_EVENT_WEBHOOK_URL set.
# ---------------------------------------------------------------------------

[[rule]]
name = "forward-billing-done-to-webhook"
on_event = "step.done.billing"
[[rule.do]]
handler = "webhook.notify"

[[rule]]
name = "forward-procurement-done-to-webhook"
on_event = "step.done.procurement"
[[rule.do]]
handler = "webhook.notify"

[[rule]]
name = "forward-shipment-done-to-webhook"
on_event = "step.done.shipment"
[[rule.do]]
handler = "webhook.notify"

[[rule]]
name = "forward-handoff-done-to-webhook"
on_event = "step.done.handoff"
[[rule.do]]
handler = "webhook.notify"

[[rule]]
name = "forward-receiving-done-to-webhook"
on_event = "step.done.receiving"
[[rule.do]]
handler = "webhook.notify"

[[rule]]
name = "forward-invoice-paid-to-webhook"
on_event = "commerce.invoice.paid"
[[rule.do]]
handler = "webhook.notify"

[[rule]]
name = "forward-invoice-past-due-to-webhook"
on_event = "commerce.invoice.past_due"
[[rule.do]]
handler = "webhook.notify"

[[rule]]
name = "forward-vendor-invoice-to-webhook"
on_event = "inventory.vendor_invoice_received"
[[rule.do]]
handler = "webhook.notify"

[[rule]]
name = "forward-tax-filing-to-webhook"
on_event = "ledger.tax_filing_filed"
[[rule.do]]
handler = "webhook.notify"

# Reviews create themselves (dogfooding arc e556c000, S2): on a doc
# indexing with open questions and no open review for its path, spawn
# the design-doc-review Job. `when` binds FLAT payload identifiers
# from the S1 `docs.design.indexed` event; `open_review_exists` is
# the dedup (indexed re-fires on question-count changes — each firing
# must not open another review). Seeded live by
# 107-dispatcher-rule-design-review-spawn.sql.
[[rule]]
name = "design-review-spawn"
on_event = "docs.design.indexed"
when = "open_questions > 0 AND NOT open_review_exists(path)"
[[rule.do]]
handler = "jobs.spawn"
args = { kind = "\"design-doc-review\"", subject_kind = "\"custom\"", subject = "path", title = "title", "metadata.doc_path" = "path", "metadata.doc_title" = "title" }

# A recorded design decision queues its doc's flush (cea82de0; the
# handler no-ops the no-pending 400 so answer bursts settle clean).
# Seeded live by 109-dispatcher-rule-flush-queue.sql.
[[rule]]
name = "design-decision-flush-queue"
on_event = "docs.design.decision_recorded"
[[rule.do]]
handler = "docs.flush_queue"

# A closed Job wakes its waiters (e9291570, reopening 50e78d70): any
# Job carrying `metadata.waiting_on` naming the closed Job (full id or
# >= 8-char prefix — the `('*','waiting_on')` edge, migration 110)
# gets the key cleared through jobs-api, whose update path re-evaluates
# metadata-gated steps (aa9980c8) in the same write. No `when`: every
# close runs one indexed usually-empty query. Seeded live by
# 110-waiting-on-edge.sql.
[[rule]]
name = "jobs-clear-waiting-on"
on_event = "jobs.job.closed"
[[rule.do]]
handler = "jobs.clear_waiting"

# A shipped change answers the packet that authorized it (job
# 2c4ae549). `ship-a-change` has declared a `backlog_item` job edge at
# its Job metadata since migration 104 — dialed to `abort` by 105, so
# an unresolvable referent is refused at the write — and until now
# nothing READ it. Measured 2026-08-11: sixteen feedback packets sat at
# `submitted` while the work they authorized was shipped, tested and
# live; the loop closed only because an agent remembered.
#
# David ratified the rule: "Once the user feedback results in either a
# shipped change or some other terminal state, it can be closed without
# the filer approving." So the merge completes the branch step triage
# opened, and the `user-feedback` Workflow's own `ready_when` fires its
# `closed` terminal — nothing here knows the packet closes.
#
# `steps` lists the branches a SHIPPED change satisfies. `needs-info`
# is deliberately absent: a change landing does not answer a question
# asked of the reporter. The list is pinned against the live Workflow
# by boss-dispatcher's tests/feedback_obligation_rules.rs, so renaming
# a branch fails CI instead of silently completing nothing.
#
# `when` binds `kind` / `outcome` off the close marker — both present
# on every emit site, null when unanswered (the same always-present
# contract `notify_on_done` has on step.done: an ABSENT identifier is a
# PredicateFailed → Retry → dead-letter, not a quiet false). Seeded
# live by 117-feedback-obligation.sql.
[[rule]]
name = "complete-feedback-branch-on-car-merged"
on_event = "jobs.job.closed"
when = "kind = \"ship-a-change\" AND outcome = \"merged\""
[[rule.do]]
handler = "jobs.complete_linked_step"
args = { link = "\"backlog_item\"", steps = "\"investigate,design-review,build\"" }

# …and the filer always hears how it ended (same ratification: "But, we
# should always notify the filer with the terminal state"). ANY
# terminal, not only the shipped one — `duplicate` and `declined` are
# answers a filer is owed for the same reason. The message names the
# packet, the terminal, and what satisfied it, and goes through
# boss-messages with a deterministic id so a redelivered close
# collapses on that surface's existing ON CONFLICT (id) insert rather
# than stacking an inbox row. Seeded live by
# 117-feedback-obligation.sql.
[[rule]]
name = "notify-filer-on-feedback-terminal"
on_event = "jobs.job.closed"
when = "kind = \"user-feedback\""
[[rule.do]]
handler = "messages.notify_job_terminal"
args = { recipient_key = "\"submitted_by\"" }

# ---------------------------------------------------------------------
# The maintenance protocol (migration 121). David, 2026-08-14: "We
# probably need protocol around maintenance of the IT systems."
#
# These two are the dispatcher's SANCTIONED shape under its narrowed
# charter — initiate on a schedule, and initiate on threshold. Neither
# routes anything: routing belongs in the protocol row.
# ---------------------------------------------------------------------

# 1. ADMISSION, on the clock. The first clock-triggered rule in the
# system — the schedule machinery existed and had never been used.
# Daily per maintenance AREA; more areas are more rows, and intraday is
# a `schedule` edit rather than a deploy. Starting with disk headroom,
# which has already cost real time twice wearing two disguises on train
# #22 (once as `ld terminated with signal 7 [Bus error]`, because the
# linker mmaps its output and ENOSPC surfaces as a bus error, not as
# "disk full") and put three machines at 100% on 2026-08-13.
[[rule]]
name = "maintenance-sweep-disk-daily"
schedule = { cadence = "daily", anchor_date = "2026-08-14" }
[[rule.do]]
handler = "jobs.spawn"
args = { kind = "\"maintenance-sweep\"", subject_kind = "\"custom\"", subject = "\"disk-headroom\"", title = "\"Disk headroom sweep\"", "metadata.target" = "\"disk-headroom\"", "metadata.area" = "\"infra\"" }

# 2. WHAT A SWEEP PRODUCES. A sweep that concluded it needed work spawns
# a ship-a-change car carrying a `backlog_item` edge back to the sweep,
# so the car closes its own sweep on merge through the existing
# feedback-obligation machinery. That is what makes the dock
# self-filling rather than hand-loaded.
#
# Fires on the sweep's TERMINAL OUTCOME, not on the `remediate` step
# completing: the step-done topic is `step.done.<step kind>` and
# `remediate` is a plain `task`, so subscribing there would wake this on
# every task step in every workflow and lean on a `when` to discard
# almost all of them. The outcome is the more honest trigger anyway.
[[rule]]
name = "spawn-car-on-sweep-remediated"
on_event = "jobs.job.closed"
when = "kind = \"maintenance-sweep\" AND outcome = \"remediated\""
[[rule.do]]
handler = "jobs.spawn"
args = { kind = "\"ship-a-change\"", subject_kind = "\"custom\"", subject = "id", title = "title", "metadata.backlog_item" = "id" }

# ---------------------------------------------------------------------
# Three more maintenance areas (migration 122). 121 seeded the protocol
# and one area and noted that David expects several; this is the
# follow-through, filed as d0092947.
#
# Seeded together on purpose. David, 2026-08-14: "introducing and
# changing protocol is cheap, so we can create as many as we need and
# edit them to find the right operating cadence." The `clear` vs
# `remediated` counts are what say which cadence is wrong — that is a
# query, not an opinion, and it needs rows to run against.
#
# All three are invisible-until-expensive, and each was found by paying
# for it once. Cadence `daily` per David's standing instruction; if the
# dock floods, the fix is a `schedule` edit on these rows, not a deploy.
# ---------------------------------------------------------------------

# 1. STALE BUILD CACHES. The disk problem 121 was written about had a
# cause a disk sweep would not have found: 69GB of cargo target dirs
# under .claude/worktrees for branches that shipped days earlier, 48GB
# in one worktree. The main tree gave back 9GB, the worktrees 67GB — so
# an inspection pointed at the repo reports the small number and moves
# on. Deliberately its own area rather than a bigger disk check: the two
# look in different places, and collapsing them is how the 67GB stayed
# invisible the first time.
[[rule]]
name = "maintenance-sweep-build-caches-daily"
schedule = { cadence = "daily", anchor_date = "2026-08-14" }
[[rule.do]]
handler = "jobs.spawn"
args = { kind = "\"maintenance-sweep\"", subject_kind = "\"custom\"", subject = "\"stale-build-caches\"", title = "\"Stale build cache sweep\"", "metadata.target" = "\"stale-build-caches\"", "metadata.area" = "\"infra\"" }

# 2. IMAGE FRESHNESS. The CI runner's rootful docker held a 31-hour-old
# boss-ci image while the registry served a newer one. build.sh's header
# already warns that a registry retag does not refresh a runner's local
# tag — the warning existed and the drift happened anyway, which is the
# signal that a comment is not a mechanism (CLAUDE.md 9a). Cost a
# 25-minute mystery once, and fails in the worst direction: CI goes
# green or red against an image nobody is looking at.
[[rule]]
name = "maintenance-sweep-image-freshness-daily"
schedule = { cadence = "daily", anchor_date = "2026-08-14" }
[[rule.do]]
handler = "jobs.spawn"
args = { kind = "\"maintenance-sweep\"", subject_kind = "\"custom\"", subject = "\"image-freshness\"", title = "\"CI image freshness sweep\"", "metadata.target" = "\"image-freshness\"", "metadata.area" = "\"ci\"" }

# 3. DEPLOY CONVERGENCE LAG. The converge runner failed silently for
# hours on a missing `-i` in a docker invocation and the cluster sat on
# a stale image while forge main moved on. A failed systemd oneshot
# notifies nobody. This is the one that most directly undermines "the
# cluster is the system of record": an unconverged cluster is a system
# of record telling you about a commit that is no longer true.
[[rule]]
name = "maintenance-sweep-converge-lag-daily"
schedule = { cadence = "daily", anchor_date = "2026-08-14" }
[[rule.do]]
handler = "jobs.spawn"
args = { kind = "\"maintenance-sweep\"", subject_kind = "\"custom\"", subject = "\"deploy-convergence\"", title = "\"Deploy convergence sweep\"", "metadata.target" = "\"deploy-convergence\"", "metadata.area" = "\"deploy\"" }

# ---------------------------------------------------------------------
# Expire the notifications about a job that has finished (David,
# 2026-08-14: "we still need a way to automatically expire inbox
# messages for jobs that have moved past relevancy"). Migration 128.
#
# A ready-step notification is true when it is sent and stops being
# true the moment the work behind it is done. Nothing retracted them,
# so the admin inbox reached 2,058 unread — overwhelmingly signals
# about steps closed days ago. That count was not a backlog, it was
# sediment, and an inbox nobody can read is a channel that does not
# exist.
#
# A cross-protocol reactor, which is the exemption the ratchet names:
# no single Workflow definition can express "when a job of any kind
# closes, retire the messages about it", because the messages are not
# part of the job's protocol.
#
# Only unread `signal` rows move, and never a `direct` — the messages
# port carries that reasoning. A person asking another person something
# does not stop asking because a job closed.
# ---------------------------------------------------------------------
[[rule]]
name = "expire-signals-on-job-closed"
on_event = "jobs.job.closed"
[[rule.do]]
handler = "messages.expire_for_job"

# ---------------------------------------------------------------------
# Publish to the public GitHub mirror, on the clock.
#
# The mirror is fed by PULL REQUEST, never by pushing main (the mirror
# protocol's own rule), so the daily packet is what carries a batch of
# forge commits over and puts David's sign-off in front of the push.
#
# Seeded by 129-publish-to-github-rule.sql. It is here because
# `dispatcher_rules_seed_matches_toml` compares the seeded registry
# against this file in BOTH directions: a migration that seeds a rule
# without adding it here fails the same way an unseeded rule does, and
# that is exactly how it reddened the 13-car train 20260815-0621. The
# table is the runtime registry; this file is the human-authored source;
# neither is allowed to be the only one that knows.
[[rule]]
name = "publish-to-github-daily"
schedule = { cadence = "daily", anchor_date = "2026-08-15" }
[[rule.do]]
handler = "jobs.spawn"
args = { kind = "\"publish-to-github\"", subject_kind = "\"custom\"", subject = "\"github-mirror\"", title = "\"Publish to the public GitHub mirror\"", "metadata.target" = "\"origin/main\"", "metadata.area" = "\"platform\"" }
