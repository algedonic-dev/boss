[package]
name = "boss-dispatcher-handlers"
description = "Side-effect handler library + the boss-dispatcher service binary. The generic rule-driven engine lives in the core `boss-dispatcher` crate; this crate holds the handler implementations (the side effects of step transitions) and the binary that assembles engine + handlers. Handlers speak the domain HTTP APIs — they do not import the module crates — so new handlers land here as the model grows, without churning core."
version.workspace = true
edition.workspace = true

[[bin]]
name = "boss-dispatcher"
path = "src/bin/boss_dispatcher.rs"

[dependencies]
boss-dispatcher = { path = "../../core/boss-dispatcher" }
boss-core = { path = "../../core/boss-core" }
boss-ports = { path = "../../core/boss-ports" }
boss-nats = { path = "../../core/boss-nats" }
# `postgres`: the binary wires the firing record's one reader,
# `PgDispatcherFirings`, into `GET /api/dispatcher/schedule` (ea906603).
boss-jobs = { path = "../../core/boss-jobs", features = ["postgres"] }
boss-people-client = { path = "../../modules/boss-people-client" }
boss-expr = { path = "../../core/boss-expr" }
boss-clock-client = { path = "../../core/boss-clock-client" }
boss-calendar-client = { path = "../../core/boss-calendar-client" }
boss-events = { path = "../../core/boss-events" }
# The binary wires the schedule read's scope gate (ea906603); the tests
# used it before the binary did.
boss-policy-client = { path = "../../core/boss-policy-client" }
anyhow = { workspace = true }
async-nats = { workspace = true }
async-trait = { workspace = true }
axum = { workspace = true }
base64 = "0.22"
chrono = { workspace = true }
clap = { workspace = true }
futures = { workspace = true }
rand = "0.10"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# The credential broker's GitHub App issuer (design 76155676): the App
# JWT is RS256 over the App private key. `rsa` is already in the lock
# (sqlx-mysql); `sha2` re-exported through it keeps the digest version
# the one its PKCS#1 v1.5 signer is built against.
rsa = { version = "0.9", features = ["sha2"] }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { version = "0.8", default-features = false, features = ["macros", "runtime-tokio", "postgres", "chrono", "json"] }
thiserror = { workspace = true }
tokio = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
# `ops.file_remedies` derives a request's id from the board it was filed
# against (v5), so two firings that raced name one packet (backlog
# b2f78bb9, review 63bafc11 LOW 2a).
uuid = { workspace = true }

[dev-dependencies]
boss-testing = { path = "../../core/boss-testing", features = ["postgres"] }
http-body-util = "0.1"
tower = { workspace = true }
# A test key is GENERATED per test binary, never checked in: a PEM
# private key in the tree would trip the public mirror's secret scanning.
rsa = { version = "0.9", features = ["sha2", "getrandom"] }
# Test-only, for `policy_check_refusals_alarm`: the tally the alarm reads
# is what boss_policy::check_mode serializes, so the test judges a real
# one rather than a hand-written copy of its shape (CLAUDE.md §9a). No
# `postgres`: only the check mode is built.
boss-policy = { path = "../../core/boss-policy", default-features = false }

[lints]
workspace = true
