[package]
name = "boss-cli"
description = "Boss operator + developer CLI"
version.workspace = true
edition.workspace = true

[[bin]]
name = "boss"
path = "src/main.rs"

[dependencies]
boss-core = { path = "../../core/boss-core" }
boss-ports = { path = "../../core/boss-ports" }
boss-events = { path = "../../core/boss-events" }
boss-nats = { path = "../../core/boss-nats" }
# The station registry + its predicate evaluator. `boss packet
# census` answers "which stations would present this packet?" by
# calling the SAME `StationPredicate::matches` the /queue endpoint
# calls — a census that disagrees with the queue is worse than none.
boss-jobs = { path = "../../core/boss-jobs" }
boss-people-client = { path = "../../modules/boss-people-client" }
# `boss tenant check` validates a tenant directory with the SAME
# types the product reads it with (fcc1d57b): the classes batch row,
# the people row, the policy grant loader, and the manifest in
# boss-core. A second parser would be a second contract.
boss-classes = { path = "../../core/boss-classes" }
# The locations batch row, for the same reason (1ec8312a): check reads
# `seeds/locations.toml` with the door's own `LocationInput`.
boss-locations = { path = "../../core/boss-locations" }
boss-people = { path = "../../modules/boss-people" }
boss-policy-client = { path = "../../core/boss-policy-client" }
# `boss tenant publish` sends a tenant through the SAME doors the two
# engines' prepare compose (ee7b62bb): boss-policy's bootstrap and
# boss-jobs' bootstrap are those doors. default-features=false keeps
# the policy service's sqlx/axum tree out of the CLI, as the engines do.
boss-policy = { path = "../../core/boss-policy", default-features = false }
# `seeds/rules.toml` (backlog 458971ef) is read with the dispatcher's
# OWN rule parser and validated by the same `authoring::validate` the
# publish door applies, and its handler names are checked against the
# same `cascade::handler_emits` roster the product's rules are — a
# second parser would be a second contract.
boss-dispatcher = { path = "../../core/boss-dispatcher" }
# The roster itself lives beside the handlers it describes, in the
# crate whose binary registers them — no longer in core (backlog
# ec40e269).
boss-dispatcher-handlers = { path = "../boss-dispatcher-handlers" }
# `seeds/demo_agents.toml` (backlog 1c68aebc) is judged by the loader
# boss-observability refuses to boot without — the same contract, one
# reader.
boss-observability = { path = "../../core/boss-observability" }
toml = { workspace = true }
boss-assets = { path = "../../modules/boss-assets", features = ["postgres"] }
boss-clock-client = { path = "../../core/boss-clock-client" }
boss-ledger = { path = "../../modules/boss-ledger", features = ["postgres"] }
sqlx = { version = "0.8", default-features = false, features = ["macros", "runtime-tokio", "postgres", "json", "chrono"] }
clap = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
dirs = "6"
chrono = { workspace = true }
uuid = { workspace = true }
# publish-request bundles travel as base64 in packet metadata
# (workflow publish-request v1, packet 0b1b32f9).
base64 = "0.22"
# `multipart` + `stream`: `boss attach` sends a file as a multipart part
# streamed from disk by `Part::file` (backlog 7610dd2f) — the bytes go
# from the file to the socket with nothing between them.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "blocking", "multipart", "stream"] }
# `boss attach` states the file store's body limit from the constant the
# content-api's route applies (UPLOAD_BODY_LIMIT_BYTES), not a copy of
# it; its tests serve that REAL router over in-memory adapters.
boss-content = { path = "../../core/boss-content" }
# `boss attach` hashes the file it sent and the bytes it reads back, and
# compares both with the row's sha256 — the same digest crate the store
# keys objects by.
sha2 = "0.11"
hex = "0.4"
# `boss job list --where` sends a JSON document as ONE query value
# (`metadata=`); percent-encoding it is what keeps a `&` or `+` in a
# value from splitting the query (backlog 58eef0f5). Same crate
# boss-classes-client already uses for path segments.
percent-encoding = "2"
# `boss ops` applies the allowlist's arg patterns at the terminal, the
# same regexes ops-runner.sh applies on the host (3d6daea9).
regex = "1"

[dev-dependencies]
# Paused time (backlog 034002b3): a jobs-API call against a dark SoR
# now waits out a rollout for 120s, and a test that pins what a
# best-effort read does when the SoR is dark walks that window on the
# runtime's clock instead of spending two real minutes of every gate.
tokio = { workspace = true, features = ["test-util"] }
# dock_preview's tests prove trial_merge against REAL git in a scratch
# repo (fixtures of what we hope merge-tree prints would pin nothing).
tempfile = "3"
# DB-backed cadence tests (the firing claim's exactly-once contract
# rides the cadence_firings primary key, which only Postgres can pin).
boss-testing = { path = "../../core/boss-testing", features = ["postgres"] }
# The delivery-policy seed pin reads the seeded row through the same Pg
# adapter the jobs API serves it from, so "seed equals the conductor's
# compiled fallback" is checked end to end rather than against a
# hand-copied column list. Test-only: the shipped `boss` binary reads
# the policy over HTTP and needs no database.
boss-jobs = { path = "../../core/boss-jobs", features = ["postgres"] }
# The cadence door tests serve the REAL /api/cadence/* router over a
# TestDb and point the loop's I/O at it — the same wire, handler and
# adapter production runs, not a lookalike. axum is test-only: the
# shipped binary is an HTTP client of that surface, never a server.
axum = { workspace = true }
# The fresh-instance seed proof (backlog 0d2d7daa) serves the REAL
# people and policy routers over one empty TestDb and runs the shipped
# `boss tenant publish` and the operator-baseline seed against them.
# Test-only, like axum: the shipped binary never serves either.
boss-people = { path = "../../modules/boss-people", features = ["postgres"] }
boss-policy = { path = "../../core/boss-policy", features = ["postgres"] }

[lints]
workspace = true
