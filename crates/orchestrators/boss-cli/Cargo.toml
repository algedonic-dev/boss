[package]
name = "boss-cli"
description = "Boss operator + developer CLI"
version.workspace = true
edition.workspace = true

[[bin]]
name = "boss"
path = "src/main.rs"

[dependencies]
boss-core = { path = "../../core/boss-core" }
boss-ports = { path = "../../core/boss-ports" }
boss-events = { path = "../../core/boss-events" }
boss-nats = { path = "../../core/boss-nats" }
# The station registry + its predicate evaluator. `boss packet
# census` answers "which stations would present this packet?" by
# calling the SAME `StationPredicate::matches` the /queue endpoint
# calls — a census that disagrees with the queue is worse than none.
boss-jobs = { path = "../../core/boss-jobs" }
boss-assets = { path = "../../modules/boss-assets", features = ["postgres"] }
boss-clock-client = { path = "../../core/boss-clock-client" }
boss-ledger = { path = "../../modules/boss-ledger", features = ["postgres"] }
sqlx = { version = "0.8", default-features = false, features = ["macros", "runtime-tokio", "postgres", "json", "chrono"] }
clap = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
dirs = "6"
chrono = { workspace = true }
uuid = { workspace = true }
# publish-request bundles travel as base64 in packet metadata
# (workflow publish-request v1, packet 0b1b32f9).
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }

[dev-dependencies]
# dock_preview's tests prove trial_merge against REAL git in a scratch
# repo (fixtures of what we hope merge-tree prints would pin nothing).
tempfile = "3"
# DB-backed cadence tests (the firing claim's exactly-once contract
# rides the cadence_firings primary key, which only Postgres can pin).
boss-testing = { path = "../../core/boss-testing", features = ["postgres"] }
# The delivery-policy seed pin reads the seeded row through the same Pg
# adapter the jobs API serves it from, so "seed equals the conductor's
# compiled fallback" is checked end to end rather than against a
# hand-copied column list. Test-only: the shipped `boss` binary reads
# the policy over HTTP and needs no database.
boss-jobs = { path = "../../core/boss-jobs", features = ["postgres"] }
# The cadence door tests serve the REAL /api/cadence/* router over a
# TestDb and point the loop's I/O at it — the same wire, handler and
# adapter production runs, not a lookalike. axum is test-only: the
# shipped binary is an HTTP client of that surface, never a server.
axum = { workspace = true }

[lints]
workspace = true
