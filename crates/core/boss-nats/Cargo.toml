[package]
name = "boss-nats"
description = "NATS adapter for the Boss EventBus port"
version.workspace = true
edition.workspace = true

[dependencies]
boss-core = { path = "../boss-core" }
async-nats = { workspace = true }
async-trait = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
futures = { workspace = true }

[dev-dependencies]
# `dark_port`: a refused address held for the test (backlog c0259ecc).
boss-testing = { path = "../boss-testing" }
# `start_paused`: keep_bound's reopen ladder walked on a paused clock
# (backlog 2e45840a, design ad9519bc car 3).
tokio = { workspace = true, features = ["test-util"] }
uuid = { workspace = true }
chrono = { workspace = true }

[lints]
workspace = true
