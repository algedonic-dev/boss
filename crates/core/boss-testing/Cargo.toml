[package]
name = "boss-testing"
description = "Shared test utilities for Boss service testing"
version.workspace = true
edition.workspace = true

[features]
default = []
postgres = ["dep:sqlx", "dep:uuid"]

[dependencies]
boss-core = { path = "../boss-core" }
axum = { workspace = true }
tokio = { workspace = true, features = ["sync", "macros", "rt"] }
tower = { workspace = true }
http-body-util = "0.1"
serde = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }
sqlx = { version = "0.8", default-features = false, features = ["macros", "runtime-tokio", "postgres"], optional = true }
uuid = { version = "1", features = ["v4"], optional = true }
# `leaked_policy` (and the `boss-leaked-policy` bin): CLAUDE.md §9's code
# half is counted over an AST, never a regex — a string-literal match arm
# is equally a leaked workflow policy, the dispatcher's own handler table,
# a serde round trip or a MIME lookup, and arms span lines and nest.
# `full` parses whole files rather than just item signatures; `visit` is
# the read-only walker. `toml` reads the registry seeds the kind
# vocabulary comes from, so the vocabulary cannot drift from the
# registries (§9a).
syn = { version = "2", features = ["full", "visit"] }
# A site without a line number is a number nobody can go and check by
# hand, and hand-checking is the only evidence this count is worth
# filing daily. `span-locations` is what makes `Span::start()` answer.
# Resolver 3 decouples proc-macro dependencies' features from normal
# ones, so this does not reach the host-side `syn` the derive macros use.
proc-macro2 = { version = "1", features = ["span-locations"] }
toml = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
# Test-only, for `the_machine_door_carries_every_read_surface.rs`: the
# ports the LAN machine door (boss-jobs-internal.yaml) exposes, the table
# the unattended prove door hands the probe reader (infra/forge/sor-ports.env) and
# the services that reader routes to are three copies of one fact whose
# definition is boss-ports. Pinned equal (CLAUDE.md §9a; design 28d2bed9).
boss-ports = { path = "../boss-ports" }
# Test-only, for `tag_release_sh.rs`: the answer line tag-release.sh
# prints and the `verdict_pattern` the dispatcher rule complete-release-
# tag-on-tag-release-answered reads it with are one fact in two files
# (the script and the rule), so the test compiles the rule's regex and
# runs it over the script's real output (CLAUDE.md §9a).
regex = "1"

[[test]]
name = "migrate_sh"
required-features = ["postgres"]

[[test]]
name = "fixture_smoke"
required-features = ["postgres"]

[[test]]
name = "tenant_census_sql"
required-features = ["postgres"]

[[test]]
name = "switch_instance_database_sql"
required-features = ["postgres"]

[[test]]
name = "example_reference_rows_sql"
required-features = ["postgres"]

[lints]
workspace = true
