# ---------------------------------------------------------------------------
# answer-question — the approval Workflow's decide step: the asker's
# question and markdown context beside the answer, so the evidence and the
# decision are on screen together (David, 2026-08-14).
#
# Version 1 is the row 126-answer-question-plugin.sql seeded. Declared here
# since 2026-09-18 (backlog 393d3234, consolidation H4, car 2 of 4): a step
# plugin's ROW lives in this bundle beside the Workflow and station
# bundles, published insert-if-missing by boss-platform-workflow-seed, and
# migrations newer than the cutover stamp in
# infra/lint/migrations-declare-schema-only.sh declare schema only. The JS
# it points at is infra/step-plugins/<frontend_url>, which the converge
# runner mounts as the step-plugins ConfigMap;
# infra/lint/step-plugin-bundle-exists.sh holds the two together.
#
# To change this row, bump `version` — the seed refuses a row that differs
# from the live active row of the same (kind, version).
# ---------------------------------------------------------------------------

[[step_plugin]]
kind = "answer-question"
version = 1
status = "active"
label = "Answer a question"
description = "Custom Step UX for the approval Workflow: renders the asker's question, the markdown context they supplied (evidence, a measurement, the artifact under review), and their proposed answer behind a control that copies it into the answer box. Verdict and answer are both required, so a decision cannot complete as an empty step."
category = "coordination"
frontend_url = "answer-question.js"
owning_team = "platform"

[step_plugin.metadata_schema]
type = "object"

[step_plugin.metadata_schema.properties.answer]
type = "string"

[step_plugin.metadata_schema.properties.verdict]
type = "string"
enum = ["approved", "declined", "answered"]
