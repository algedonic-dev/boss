# ---------------------------------------------------------------------------
# diagnostic-call — tier 1 of field-service: a call log with scheduled
# time, channel, attendees, join URL, notes and an optional pasted
# recording URL.
#
# Version 1 is the row 03-jobs.sql seeded. Declared here since 2026-09-18
# (backlog 393d3234, consolidation H4, car 2 of 4): a step plugin's ROW
# lives in this bundle beside the Workflow and station bundles, published
# insert-if-missing by boss-platform-workflow-seed, and migrations newer
# than the cutover stamp in infra/lint/migrations-declare-schema-only.sh
# declare schema only. The JS it points at is
# infra/step-plugins/<frontend_url>, which the converge runner mounts as
# the step-plugins ConfigMap; infra/lint/step-plugin-bundle-exists.sh holds
# the two together.
#
# To change this row, bump `version` — the seed refuses a row that differs
# from the live active row of the same (kind, version).
# ---------------------------------------------------------------------------

[[step_plugin]]
kind = "diagnostic-call"
version = 1
status = "active"
label = "Diagnostic Call"
description = "Call log for scheduled video/phone sessions with a account. Captures scheduled time, channel, attendees, join URL, notes, optional recording URL. Backs tier 1 of field-service."
category = "admin"
frontend_url = "diagnostic-call.js"
owning_team = "platform"

[step_plugin.metadata_schema]
type = "object"

[step_plugin.metadata_schema.properties.attendees]
type = "array"

[step_plugin.metadata_schema.properties.attendees.items]
type = "string"

[step_plugin.metadata_schema.properties.channel]
type = "string"

[step_plugin.metadata_schema.properties.ended_at]
type = "string"
format = "date-time"

[step_plugin.metadata_schema.properties.join_url]
type = "string"

[step_plugin.metadata_schema.properties.notes_md]
type = "string"

[step_plugin.metadata_schema.properties.outcome]
type = "string"

[step_plugin.metadata_schema.properties.recording_url]
type = "string"

[step_plugin.metadata_schema.properties.scheduled_for]
type = "string"
format = "date-time"

[step_plugin.metadata_schema.properties.transcript_url]
type = "string"
