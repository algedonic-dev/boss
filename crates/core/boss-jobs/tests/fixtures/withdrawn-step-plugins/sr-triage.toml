# ---------------------------------------------------------------------------
# sr-triage — tier 0 of field-service: the mandatory intake fields and the
# triage decision (dispatch / remote / parts-only).
#
# Version 1 is the row 03-jobs.sql seeded. Declared here since 2026-09-18
# (backlog 393d3234, consolidation H4, car 2 of 4): a step plugin's ROW
# lives in this bundle beside the Workflow and station bundles, published
# insert-if-missing by boss-platform-workflow-seed, and migrations newer
# than the cutover stamp in infra/lint/migrations-declare-schema-only.sh
# declare schema only. The JS it points at is
# infra/step-plugins/<frontend_url>, which the converge runner mounts as
# the step-plugins ConfigMap; infra/lint/step-plugin-bundle-exists.sh holds
# the two together.
#
# To change this row, bump `version` — the seed refuses a row that differs
# from the live active row of the same (kind, version).
# ---------------------------------------------------------------------------

[[step_plugin]]
kind = "sr-triage"
version = 1
status = "active"
label = "SR Triage"
description = "Service-request intake + triage decision. Captures mandatory fields at creation and records the dispatch/remote/parts-only decision at completion. Backs tier 0 of field-service."
category = "admin"
frontend_url = "sr-triage.js"
owning_team = "platform"

[step_plugin.metadata_schema]
type = "object"
required = ["account_id", "device_serial", "failure_description", "priority"]

[step_plugin.metadata_schema.properties.account_id]
type = "string"

[step_plugin.metadata_schema.properties.device_serial]
type = "string"

[step_plugin.metadata_schema.properties.failure_description]
type = "string"

[step_plugin.metadata_schema.properties.intake_channel]
type = "string"

[step_plugin.metadata_schema.properties.jira_issue_key]
type = "string"

[step_plugin.metadata_schema.properties.priority]
type = "string"

[step_plugin.metadata_schema.properties.requester_contact_id]
type = "string"

[step_plugin.metadata_schema.properties.triage_outcome]
type = "string"
enum = ["dispatch", "remote", "parts-only"]
