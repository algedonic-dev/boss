[package]
name = "boss-policy"
description = "Row-level authorization — rules, user overrides, scope predicates"
version.workspace = true
edition.workspace = true

[[bin]]
name = "boss-policy-api"
path = "src/bin/boss_policy_api.rs"
required-features = ["postgres"]

[[bin]]
name = "boss-policy-bootstrap"
path = "src/bin/boss_policy_bootstrap.rs"

[features]
# `postgres` ships in default so `cargo build --release --workspace`
# produces /target/release/boss-policy-api with the postgres adapter.
# No orchestrator depends on boss-policy with the postgres feature
# enabled, so feature unification doesn't activate it → workspace
# build silently produces an in-memory-only binary that fails on
# startup. Same fix as boss-docs (postgres → default 2026-05-05).
default = ["postgres"]
postgres = ["dep:sqlx", "dep:boss-events"]

[dependencies]
# `blocking`: the policy bootstrap walk sends through
# machine_token::BlockingClient (design 6805c764 car 2).
boss-core = { path = "../boss-core", features = ["blocking"] }
boss-ports = { path = "../boss-ports" }
boss-policy-client = { path = "../boss-policy-client" }
# The outbox the policy check and the machine gate state their facts
# through (design 21946380), in the binary only.
boss-events = { path = "../boss-events", default-features = false, features = ["postgres"], optional = true }
async-trait = { workspace = true }
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
axum = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tokio = { workspace = true }
sqlx = { version = "0.8", default-features = false, features = ["macros", "runtime-tokio", "postgres", "chrono", "json"], optional = true }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }

[dev-dependencies]
boss-testing = { path = "../boss-testing", features = ["postgres"] }
tower = { workspace = true }
http-body-util = "0.1"
sqlx = { version = "0.8", default-features = false, features = ["macros", "runtime-tokio", "postgres", "chrono", "json"] }

[lints]
workspace = true

[[test]]
name = "postgres_roundtrip"
required-features = ["postgres"]

[[test]]
name = "the_policy_adapters_agree_pg"
required-features = ["postgres"]

[[test]]
name = "the_service_read_is_kept_and_a_refusal_is_on_the_log_pg"
required-features = ["postgres"]
