[package]
name = "boss-views"
description = "Views — saved compositions over the Information API; the personal rung of the extensibility ladder"
version.workspace = true
edition.workspace = true

[[bin]]
name = "boss-views-api"
path = "src/bin/boss_views_api.rs"
required-features = ["postgres"]

[[bin]]
name = "boss-views-catchup"
path = "src/bin/boss_views_catchup.rs"
required-features = ["postgres"]

[features]
default = ["postgres"]
postgres = ["dep:sqlx"]

[dependencies]
boss-core = { path = "../boss-core" }
boss-ports = { path = "../boss-ports" }
boss-expr = { path = "../boss-expr" }
boss-policy-client = { path = "../boss-policy-client" }
async-trait = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
axum = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
sqlx = { version = "0.8", default-features = false, features = ["macros", "runtime-tokio", "postgres", "chrono", "json", "uuid"], optional = true }

[dev-dependencies]
boss-testing = { path = "../boss-testing", features = ["postgres"] }
tower = { workspace = true }
http-body-util = "0.1"
sqlx = { version = "0.8", default-features = false, features = ["macros", "runtime-tokio", "postgres", "chrono", "json", "uuid"] }

[lints]
workspace = true

[[test]]
name = "all_sources_pushdown_pg"
required-features = ["postgres"]

[[test]]
name = "fleet_pg"
required-features = ["postgres"]

[[test]]
name = "steps_source_pg"
required-features = ["postgres"]

[[test]]
name = "subject_linkage_pg"
required-features = ["postgres"]
