[package]
name = "boss-policy-client"
description = "HTTP client + in-process fake for boss-policy"
version.workspace = true
edition.workspace = true

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
boss-core = { path = "../boss-core" }
axum = { workspace = true }
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
toml = { workspace = true }
futures = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tracing = { workspace = true }

[dev-dependencies]
# For `assert_roster_floor!`. `default_rules()` is a derived roster four
# tests range over, and a per-item assertion over it is vacuous the moment
# it thins (backlog 024c0db2). boss-testing dev-depends on THIS crate in
# turn; both edges are dev-only, so the library graph stays acyclic.
boss-testing = { path = "../boss-testing" }

[lints]
workspace = true
