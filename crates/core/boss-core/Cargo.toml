[package]
name = "boss-core"
description = "Core domain types, traits (ports), and event definitions"
version.workspace = true
edition.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }
async-trait = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
sha2 = "0.11"
hex = "0.4"
# The presence ticket (src/presence.rs): minted by the gateway and
# verified by the jobs API from this one definition (backlog 72fe3640).
# The same versions boss-gateway already carried for it.
base64 = "0.22"
hmac = "0.13"
subtle = "2"
# The machine gate (src/machine_gate.rs): the middleware every service
# binary mounts, so it lives in the crate every one of them depends on
# (design 6805c764, car 1). Every such binary already links axum.
axum = { workspace = true }

[features]
# `machine_token::BlockingClient`, the stamping client on reqwest's
# blocking half, for the seed and publish walks (design 6805c764 car 2).
# Off by default so a service that never blocks does not build it.
blocking = ["reqwest/blocking"]

[dev-dependencies]
proptest = "1"
tower = { workspace = true }
tracing-subscriber = { workspace = true }
# Test-only, for `tests/a_sigterm_ends_a_gated_process.rs`: it re-runs
# its own test binary, and `boss_testing::reexec` is the one definition
# of how such a child is waited for — start judged by liveness under a
# named ceiling, work timed from the child's `ready()` (backlog 7e30ddb0,
# review 12a4ee82 B1: the inline copy here had lost the ceiling).
# boss-testing depends on boss-core in turn; cargo admits the cycle for
# a dev-only edge, and an integration test links the one boss-core lib
# both sides name. The lib's own `#[cfg(test)]` units do not use it.
boss-testing = { path = "../boss-testing" }
# The paused clock: gate evidence's end is bounded inside END_GRACE,
# and its tests run that grace without waiting it out (backlog 9f1e4063).
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
