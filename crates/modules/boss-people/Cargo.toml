[package]
name = "boss-people"
description = "Employee roster, org chart, certifications, and requisitions"
version.workspace = true
edition.workspace = true

[[bin]]
name = "boss-people-api"
path = "src/bin/boss_people_api.rs"
required-features = ["postgres"]

[[bin]]
name = "boss-people-rebuild"
path = "src/bin/boss_people_rebuild.rs"
required-features = ["postgres"]

[[bin]]
name = "boss-operator-baseline-seed"
path = "src/bin/boss_operator_baseline_seed.rs"
required-features = ["postgres"]

[features]
default = []
postgres = ["dep:sqlx", "boss-events/postgres", "dep:boss-subject-kinds"]

[dependencies]
boss-subject-kinds = { path = "../../core/boss-subject-kinds", features = ["postgres"], optional = true }
boss-policy = { path = "../../core/boss-policy" }
boss-policy-client = { path = "../../core/boss-policy-client" }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
axum = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
sqlx = { version = "0.8", default-features = false, features = ["macros", "runtime-tokio", "postgres", "chrono", "json"], optional = true }
uuid = { version = "1", features = ["v4"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
base64 = "0.22"

boss-clock-client = { path = "../../core/boss-clock-client" }
boss-ports = { path = "../../core/boss-ports" }
# `blocking`: the operator-baseline seed sends through
# machine_token::BlockingClient (design 6805c764 car 2).
boss-core = { path = "../../core/boss-core", features = ["blocking"] }
boss-classes-client = { path = "../../core/boss-classes-client" }
boss-locations-client = { path = "../../core/boss-locations-client" }
boss-subject-kinds-client = { path = "../../core/boss-subject-kinds-client" }
boss-calendar-client = { path = "../../core/boss-calendar-client" }
boss-events = { path = "../../core/boss-events" }
boss-assets-client = { path = "../boss-assets-client" }
boss-nats = { path = "../../core/boss-nats" }
[dev-dependencies]
tower = { workspace = true }
boss-people-client = { path = "../boss-people-client" }
boss-testing = { path = "../../core/boss-testing", features = ["postgres"] }
sqlx = { version = "0.8", default-features = false, features = ["macros", "runtime-tokio", "postgres", "chrono", "json"] }
proptest = "1"

[lints]
workspace = true

[[test]]
name = "a_guest_is_refused_the_roster_by_email"
required-features = ["postgres"]

[[test]]
name = "an_employee_sits_in_a_registry_department"
required-features = ["postgres"]

[[test]]
name = "a_requisition_asks_policy_for_create"
required-features = ["postgres"]

[[test]]
name = "audit_log_e2e"
required-features = ["postgres"]

[[test]]
name = "change_log_policy"
required-features = ["postgres"]

[[test]]
name = "every_people_read_asks_policy_or_is_named_public"
required-features = ["postgres"]

[[test]]
name = "operator_baseline_seed_e2e"
required-features = ["postgres"]

[[test]]
name = "pg_people_roundtrip"
required-features = ["postgres"]

[[test]]
name = "the_adapters_agree_on_the_people_roster_pg"
required-features = ["postgres"]

[[test]]
