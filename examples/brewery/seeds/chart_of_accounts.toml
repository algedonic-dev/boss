# The brewery's chart of accounts — one [[account]] per row of the
# ledger's `gl_accounts` table, published through the tenant contract
# (docs/tenant-contract.md, "The chart of accounts is the tenant's":
# POST /api/ledger/accounts/batch, insert-if-absent by code).
#
# Until 2026-09-17 these rows were the product's: 40-ledger.sql seeded
# them as the "starter chart" on every instance, brewery-shaped (beer
# revenue lines, keg deposits, excise), so a company that is not a
# brewery booted with a brewer's books and could only adopt or dodge
# the codes (backlog 41af5195, design 18cf4272). Backlog 718ac982
# (design e2580840 car 3) moved them here: the migrations keep
# seeding them on the instances that already ran (applied history is
# never edited), a fresh instance whose tenant is not an example
# evicts them at boot before any service starts, and the bounded
# forge verb retire-example-reference-rows evicts the unreferenced
# residue from an instance that is already running. The set below is
# the migrations' rows verbatim — code, name, kind, normal balance —
# so the playground publishes exactly what it used to inherit.
#
# Fields (boss_ledger::chart::AccountInput): code, name, kind
# (asset|liability|equity|revenue|expense), normal_balance
# (debit|credit), parent? (a code declared earlier in this file).

