[[grants]]
role = "coo"
resource = "step-signoff:workflow-approver"
action = "sign-off"
scope = "all"

[[grants]]
role = "cto"
resource = "step-signoff:workflow-approver"
action = "sign-off"
scope = "all"

[[grants]]
role = "owner"
resource = "step-signoff:workflow-approver"
action = "sign-off"
scope = "all"

[[grants]]
role = "head-of-distribution"
resource = "step-signoff:head-of-distribution"
action = "sign-off"
scope = "all"

[[grants]]
role = "sales-rep"
resource = "step-signoff:sales-rep"
action = "sign-off"
scope = "all"

[[grants]]
role = "bookkeeper"
resource = "step-signoff:bookkeeper"
action = "sign-off"
scope = "all"

[[grants]]
role = "ar-clerk"
resource = "step-signoff:ar-clerk"
action = "sign-off"
scope = "all"

[[grants]]
