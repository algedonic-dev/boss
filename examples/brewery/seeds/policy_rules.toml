# break-glass — and no brewery role holds it. Each role is granted the
# kinds its surfaces file, measured from the web on 2026-09-27; the
# pin is boss-brewery-engine's
# tests/every_role_may_open_what_its_surfaces_file.rs, which names a
# role the widget would refuse.
#
# Admission reads only whether a grant allows: a Create has no row yet
# for a scope to narrow, so these say `all` unless the role's older
# grant said otherwise.
# ------------------------------------------------------------------

# The feedback widget (libs/web-kit FeedbackControl) files
