# weekly-leadership-review's ceo-review step requires a ceo sign-off.
# Missing until 2026-09-25 (backlog 292c00c2): the sim-origin bypass
# signed it in the grant's place, which stops once the bypass is bound
# (car ab1dba92). Pinned by boss-brewery-engine's
# every_sign_off_role_is_granted test, which reads both seed files.
[[grants]]
role = "ceo"
resource = "step-signoff:ceo"
action = "sign-off"
scope = "all"

# ------------------------------------------------------------------
# Identity + log access as result sets.
#
# `subject` and `event` govern being HANDED rows back — from global
# search, from a View — as distinct from reading a particular
# account or employee, which the per-kind resources above still
# govern. Both were previously ungoverned: search returned identical
# results to every caller, including one with no session at all.
#
# `subject` is broad. Enumerating identity is how anyone finds the
# thing they are working on, and withholding it does not protect an
# account whose detail the caller can already open — it just breaks
# search. The per-kind resources remain the control on detail.
#
# `event` is narrow. Raw audit rows carry payloads from every domain,
# so they go to the roles whose job is looking across the whole
# system, not to everyone with a login.
# ------------------------------------------------------------------

[[grants]]
roles = [
    "account-manager", "ap-clerk", "ar-clerk", "benefits-coord",
    "bookkeeper", "brewer", "cellar-tech", "controller",
    "distribution-driver", "events-coord", "fp-analyst",
    "head-brewer", "head-of-distribution", "head-of-marketing",
    "head-of-people", "head-of-sales", "senior-brewer",
]
resource = "subject"
action = "read"
scope = "all"

[[grants]]
roles = ["controller", "head-of-people"]
resource = "event"
action = "read"
scope = "all"

# ------------------------------------------------------------------
# The finance read surface.
#
# `/api/ledger/*` — accounts, trial balance, the three statements,
# journal entries, tax liability, bills — had NO read gate at all, so
# anyone who could reach the port could read the company's books.
# `ledger` is all-or-nothing by nature; a balance sheet is a
# company-wide aggregate with no owner to narrow by.
#
# Granted to the roles whose work is the books, plus audit-readonly
# (which picks it up from the platform defaults, not here).
# ------------------------------------------------------------------

# Posting to the books (backlog 34f0a954, 2026-09-28): a door that adds
# a row — a journal entry, a bill, a settlement, a payroll run, a tax
# filing — asks `create` on `ledger`, and one that changes
# a row — paying, settling, remitting, superseding a fact — asks
# `update`. Until then every door asked for the read grant below and
# nothing more, so every clerk and analyst could post to the books. The
# finance leads hold both; platform-admin holds both from the platform
# defaults, which is what the dispatcher's rules and this tenant's
# prepare sign as. A clerk who books day to day is one row more.
[[grants]]
roles = ["controller", "cfo"]
resource = "ledger"
actions = ["create", "update"]
scope = "all"

[[grants]]
roles = [
    "controller", "bookkeeper", "ap-clerk", "ar-clerk", "fp-analyst",
    "head-of-people",
]
resource = "ledger"
action = "read"
scope = "all"

# Closing a month (`close`, the /ux/finance Lock button) and reopening
# one (`update`, Unlock) on `ledger-period` (backlog 25a4f7f9,
# 2026-09-28). Both doors asked for the read grant above and nothing
# more, so every clerk and analyst could freeze a month or reopen one.
# The month-end close is the controller's; the CFO holds it too.
# Opening a fiscal year (`create`, POST /api/ledger/periods) is the same
# resource (backlog 34f0a954), so one grant covers a year's whole life.
# platform-admin holds all three from the platform defaults.
[[grants]]
roles = ["controller", "cfo"]
resource = "ledger-period"
actions = ["create", "close", "update"]
scope = "all"

# ------------------------------------------------------------------
# Pay.
#
# `annual_salary_cents` on every people read went to any signed-in
# viewer (backlog c7484d0e, 2026-09-23). The roster stays open — the
# dispatcher's notifier and auto-assign read it by role — and the pay
# on it is shown only where `compensation` Read is granted, in the
# grant's scope. People and the books, plus platform-admin from the
# platform defaults. audit-readonly does NOT hold it: it is also what
# an anonymous visitor carries.
# ------------------------------------------------------------------

[[grants]]
roles = ["ceo", "cfo", "controller", "head-of-people"]
resource = "compensation"
action = "read"
scope = "all"

# ------------------------------------------------------------------
# Schedules.
#
# Availability, assignments, shift patterns and the week grid answered
# any session and any headerless caller (backlog a621d091,
# 2026-09-25). Every employee reads their own without a grant; the
# `schedule` grant is what reading anyone else's takes, in its scope.
# The people who staff the whole brewery read all of it; a manager
# reads their team (themself and their direct reports). audit-readonly
# does NOT hold it, for the reason it does not hold pay.
#
# The `team` list is every role some employee in employees.json reports
# to, and nothing else — the leads run the crews whose weeks these
# reads are for, and a role that manages nobody needs no grant to read
# itself. Pinned by boss-brewery-engine
# tests/every_manager_reads_their_teams_schedule.rs.
# ------------------------------------------------------------------

[[grants]]
roles = ["ceo", "coo", "head-of-people"]
resource = "schedule"
action = "read"
scope = "all"

