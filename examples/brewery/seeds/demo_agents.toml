# Brewery demo-agent roster — the synthetic agents the playground's
# /ops dashboard shows before a real boss-cybernetics is wired in.
#
# Read by boss-observability (`demo_agents::Roster::load`) when its
# config carries a `[demo_agents]` block; the container's config
# generator (infra/oss-quickstart/generate-configs.sh) writes that block,
# naming THIS file, only for a tenant that ships one beside its
# manifest. A tenant with no demo_agents.toml gets the real aggregator
# path, never synthetic figures.
#
# WHY THIS FILE IS HERE (backlog 1c68aebc, 2026-09-23). These four
# agents were a `json!` literal in crates/core/boss-observability — a
# Tier 1 crate every adopter ships — so a fresh install that is not a
# brewery carried agent fixtures about hop cultivars and tap handles
# in a core crate it could not opt out of. The mechanism (canned
# snapshot + telemetry loop) stays in the core; the content is the
# tenant's, here.
#
# Every figure below is invented. `queue_depth`, `run` and the two
# cost windows exist only to make the dashboard read as populated;
# `/api/snapshot` answers `demo_mode: true` so the SPA says so.

[[agent]]
id = "agent-hop-sourcing-scout"
display_name = "Hop sourcing scout"
system_prompt = "Watch supplier price feeds + cone-quality reports; flag any cultivar where the trailing 30-day price climbs >10% or COA fails the brewery's spec."
model = "claude-haiku-4-5"
hourly_budget_usd_micros = 250_000
max_concurrent_runs = 3
queue_depth = 2
run = { id = "run-hop-001", started_seconds_ago = 42 }
cost_hour = { input_tokens = 14_220, output_tokens = 2_140, usd_micros = 8_400 }
cost_day = { input_tokens = 312_000, output_tokens = 48_000, usd_micros = 184_000 }

