# Used Device Shop — the example tenant's dispatcher rules.
#
# A tenant's reactors are the tenant's protocol data, not the
# product's (docs/tenant-contract.md §A tenant's own reactors; backlog
# 458971ef). Same shape as the brewery's seeds/rules.toml and the
# product's infra/dispatcher/rules/*.toml: `name`, `why`, `version`,
# `on_event`, optional `when`, one or more `[[rule.do]]`. Read by
# `boss tenant check`, published by `boss tenant publish` with
# `source = tenant:used-device-shop`, LAST, after the Workflows.
#
# WHICH RULES, AND WHY THESE (design e2580840 car 4, backlog 105fb702,
# 2026-09-17). When the brewery's reactors left infra/dispatcher/rules/
# for examples/brewery/seeds/rules.toml, a rule serving BOTH example
# tenants went to both files — this one holds the subset this tenant
# measurably uses. Measured from this directory's own seeds: the step
# kinds its workflows.toml declares that a rule reacts on (`repair`,
# `procurement`, `billing`, `receiving`, `shipment`, `handoff`) and the
# topics its tenant.toml `[counterparty.*]` blocks `listens_to`
# (`commerce.invoice.paid`, `step.done.billing`, `step.done.shipment`,
# `step.done.procurement`, `inventory.vendor_invoice_received`,
# `ledger.tax_filing_filed`, `step.done.handoff`). Not here, because
# nothing in this directory produces the trigger: the brewery's
# brewhouse/keg/tasting rules, `bill-approval` / `expense-bill` /
# `payroll-release` / `tax-remittance` / `hr-hire` step kinds (this
# tenant's hiring and vendor-payment workflows are task/sign-off/billing
# steps), and the forwards on `step.done.receiving` and
# `commerce.invoice.past_due`, which no counterparty here listens to.
# Each rule is the brewery's text verbatim — the args are the model's
# (a CA sales-tax rate, a taproom category, an equipment-repair reason);
# this tenant is a worked example, modeled to be plausible, not
# developed further (its tenant.toml says the same).

# ======================================================================
# Step-completion side effects: sales, fulfilment, procurement, repair
# ======================================================================

[[rule]]
name = "invoice-issue-on-billing-step-done"
why = """
Step-completion side effect: a completed `billing` step issues the customer invoice. The
sales-tax rate, jurisdiction and taxable categories ride in the
rule args, so a rate change is a registry edit rather than a deploy.
This is ROUTING, the residue the rule census (protocol-policy-publish.md)
owes back to the protocol row as an admission-staged obligation. It is
kept because the migration has not been written, not because it could
not be a protocol consequence — and it must not be joined by new
routing. The census counts these 22 `step.done.*` rules as the number to
watch.
"""
on_event = "step.done.billing"
[[rule.do]]
handler = "commerce.invoice.issue"
# Sales tax: retail + taproom + event-package lines are end-user sales and
# carry CA state sales tax (725 bps / US-CA); wholesale + distribution are
# resale-exempt (omitted from taxable_categories, so they accrue no 2300).
# The handler taxes only the taxable-category line subtotal; commerce stamps
# a tax_lines[account=2300] that the ledger accrues, and the quarterly
# sales-tax-filing Workflow remits it back to Cash.
args = { due_days = "30", default_revenue_category = "\"uncategorized\"", tax_rate_bps = "725", tax_jurisdiction = "\"US-CA\"", taxable_categories = "\"retail,taproom,event-package\"" }

# FG drawdown + COGS per issued invoice — the consume owns COGS
# (Q2, docs/architecture-decisions.md §Finance & ledger). Commerce posts
# revenue/AR/tax only; this rule drives the physical drain + the
# DR 5100 / CR 1320 recognition through the products surface, at the
# drained value, tagged with each line's revenue_category. Insufficient
# stock NAKs and converges when production lands (a visible backorder,
# not a blocked sale).
[[rule]]
name = "products-consume-on-invoice-created"
why = """
Step-completion side effect: an issued invoice drains finished goods and recognizes COGS. Keyed
on a domain event rather than a step, but the same census class:
the consume owns COGS, and the ordering belongs in the protocol.
This is ROUTING, the residue the rule census (protocol-policy-publish.md)
owes back to the protocol row as an admission-staged obligation. It is
kept because the migration has not been written, not because it could
not be a protocol consequence — and it must not be joined by new
routing. The census counts these 22 `step.done.*` rules as the number to
watch.
"""
on_event = "commerce.invoice.created"
[[rule.do]]
handler = "products.consume_from_invoice"

[[rule]]
name = "shipment-side-effects-on-shipment-step-done"
why = """
Step-completion side effect: a completed `shipment` step creates the shipment and drains what
it ships.
This is ROUTING, the residue the rule census (protocol-policy-publish.md)
owes back to the protocol row as an admission-staged obligation. It is
kept because the migration has not been written, not because it could
not be a protocol consequence — and it must not be joined by new
routing. The census counts these 22 `step.done.*` rules as the number to
watch.
"""
on_event = "step.done.shipment"
[[rule.do]]
handler = "shipping.create"
[[rule.do]]
handler = "inventory.parts.consume"
args = { reason = "\"sale\"" }
[[rule.do]]
handler = "products.consume"

[[rule]]
name = "po-place-on-procurement-step-done"
why = """
Step-completion side effect: a completed `procurement` step places the purchase order.
This is ROUTING, the residue the rule census (protocol-policy-publish.md)
owes back to the protocol row as an admission-staged obligation. It is
kept because the migration has not been written, not because it could
not be a protocol consequence — and it must not be joined by new
routing. The census counts these 22 `step.done.*` rules as the number to
watch.
"""
on_event = "step.done.procurement"
[[rule.do]]
handler = "inventory.po.place"

[[rule]]
name = "receive-on-receiving-step-done"
why = """
Step-completion side effect: a completed `receiving` step receives the shipment into inventory.
This is ROUTING, the residue the rule census (protocol-policy-publish.md)
owes back to the protocol row as an admission-staged obligation. It is
kept because the migration has not been written, not because it could
not be a protocol consequence — and it must not be joined by new
routing. The census counts these 22 `step.done.*` rules as the number to
watch.
"""
on_event = "step.done.receiving"
[[rule.do]]
handler = "inventory.receive"

[[rule]]
name = "parts-consume-on-repair-step-done"
why = """
Step-completion side effect: a completed `repair` step consumes the parts the repair used.
This is ROUTING, the residue the rule census (protocol-policy-publish.md)
owes back to the protocol row as an admission-staged obligation. It is
kept because the migration has not been written, not because it could
not be a protocol consequence — and it must not be joined by new
routing. The census counts these 22 `step.done.*` rules as the number to
watch.
"""
on_event = "step.done.repair"
[[rule.do]]
handler = "inventory.parts.consume"
args = { reason = "\"equipment-preventive-maintenance-repair\"" }

# ======================================================================
# External-party callbacks: forward to the simulator's CounterpartyEngine
# ======================================================================

[[rule]]
name = "forward-billing-done-to-webhook"
why = """
External glue, the census class for reactions whose EFFECT LIVES OUTSIDE
the system: forwards `step.done.billing` to the configured webhook so an external
party — the simulator's CounterpartyEngine standing in for banks,
suppliers, the keg courier, the tax authority — reacts without
subscribing to the event stream. No Workflow definition can declare a
consequence that happens off-system. No-op wherever
BOSS_EVENT_WEBHOOK_URL is unset.
"""
on_event = "step.done.billing"
[[rule.do]]
handler = "webhook.notify"

