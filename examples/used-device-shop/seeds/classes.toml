# ---------------------------------------------------------------------------
# Employee roles this tenant adds on top of the platform registry.
#
# The platform seed (infra/postgres/schema/01-registries.sql) already
# carries every other role + department the roster in
# data/employees.json references — measured 2026-09-02: 22 of the 23
# roles and all 9 departments are platform rows. `auditor` is the one
# role only this tenant uses, so it ships here. boss-people-api
# validates every employee write against
# (subject_kind='employee', member_attribute='role'); without this
# row emp-201's seed POST is refused and the tenant prepare aborts.
# ---------------------------------------------------------------------------

[[class]]
subject_kind = "employee"
member_attribute = "role"
code = "auditor"
display_name = "Auditor"
metadata = { department = "finance", is_management = false }
sort_order = 400

# ---------------------------------------------------------------------------
# Employee — roles, departments; Account — types; Location — one kind.
#
# These were the product's until 2026-09-17: 01-registries.sql seeded
# them on every instance as "the used-device-shop example" (26 roles
# with their department roll-ups, the ten departments, three account
# types, the warehouse-zone location kind), so a company that is not a
# device shop booted with a refurb shop's org chart. Backlog 718ac982
# (design e2580840 car 3) made them this tenant's rows: the migrations
# keep seeding them on instances that already ran, a fresh instance
# whose tenant is not an example evicts them at boot, and the bounded
# forge verb retire-example-reference-rows evicts the unreferenced
# residue from a running one. Verbatim from the migration — code,
# display name, metadata, sort order — so nothing this tenant's roster
# wears changes. The generic rows stay the platform's: the
# `platform-admin` / `audit-readonly` / `owner` / `smoke-tester` roles,
# the `it` department, employment types and statuses, the
# `unspecified` account type, and the kinds the platform's default
# locations wear (`remote`, `hq`, `field-region`) — loc-hq is where the
# operator baseline hires.
# ---------------------------------------------------------------------------

[[class]]
subject_kind = "employee"
member_attribute = "role"
code = "ceo"
display_name = "CEO"
metadata = { department = "executive", is_management = true, is_executive = true }
sort_order = 10

