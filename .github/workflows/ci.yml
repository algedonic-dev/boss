name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least-privilege token: CI only reads the repo (checkout + build).
# No job needs write — release/attestation live in release.yml.
permissions:
  contents: read

# A new push to the same ref supersedes the in-flight run — cancel it
# instead of paying for both. Same convention install-smoke.yml already
# uses.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Retry transient crates.io download failures (curl / "SSL unexpected eof")
# rather than failing the whole run on an infra flake — these blips have
# red-X'd green code mid-clippy. Applies to every job's cargo invocations.
env:
  CARGO_NET_RETRY: "10"

jobs:
  rust:
    runs-on: ubuntu-latest
    env:
      # Trim debuginfo from the dev/test build. The ~60-crate workspace
      # otherwise fills the runner's disk (rustc-LLVM "No space left on
      # device") partway through `cargo test`.
      CARGO_PROFILE_DEV_DEBUG: "0"
      # TestDb refuses to run against a server that hosts a database
      # named `boss` — the tell that separates a BOSS deployment from a
      # scratch instance (the 2026-08-14 port-forward incident). The
      # service container below is created with POSTGRES_DB=boss on
      # purpose and dies with the job, so this is the disposable-server
      # case the guard's own message names. Same reason as the forge CI.
      BOSS_TEST_ALLOW_PRODUCTION_SERVER: "1"
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: boss
          POSTGRES_PASSWORD: boss
          POSTGRES_DB: boss
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      nats:
        image: nats:latest
        ports:
          - 4222:4222
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4 (pinned per OpenSSF Scorecard)

      - name: Free up runner disk space
        # The default GitHub-hosted runner has ~14 GB free; the large
        # workspace's test build needs more. Reclaim ~25 GB of
        # preinstalled toolchains we don't use before building. Inline
        # rm (not a third-party action) to keep every action SHA-pinned
        # per OpenSSF Scorecard.
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal

      - name: Cache cargo registry + dependency artifacts
        # Caches ~/.cargo (registry index + crate sources) and the
        # dependency slice of target/, keyed on Cargo.lock + rustc
        # version. Workspace-crate artifacts are pruned before saving,
        # so our own code always rebuilds from source — only the ~400
        # third-party dependencies stop being recompiled on every run.
        # cache-on-failure: a red clippy/test run still saves the
        # dependency build it just paid for.
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.1 (pinned per OpenSSF Scorecard)
        with:
          cache-on-failure: true

      - name: Apply schema
        run: infra/postgres/migrate.sh -- psql -h localhost -U boss -d boss
        env:
          PGPASSWORD: boss

      - name: Gate
        # ONE definition of the rust gate — the same script an agent
        # runs before pushing a car (`infra/gate.sh -p <crate>`), so CI
        # and the local gate cannot drift (CLAUDE.md §9a; on the
        # 2026-08-10 train they were two definitions and drifted twice
        # in one day). The check roster, each check's flags, and the
        # provenance comments for both live IN the script; environment
        # setup (toolchain, cache, schema) stays above.
        # boss-testing/tests/gate_sh.rs pins this step and the roster.
        run: infra/gate.sh

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4 (pinned per OpenSSF Scorecard)

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install dependencies
        working-directory: apps/web
        run: bun install

      - name: Typecheck
        working-directory: apps/web
        run: bun run typecheck

      # The unit suite did not run here at all until 2026-08-08 — 195
      # tests, including every equality test that pins a fact living in
      # two places (the nav catalog against the department registry, the
      # route kinds against the section chain, the banned-construct
      # lint). They ran only on a developer's machine, which means they
      # ran when someone remembered.
      - name: Unit tests
        working-directory: apps/web
        run: bun run test:unit

      - name: Build
        working-directory: apps/web
        run: bun run build

      # Mocked-backend Playwright smoke — guards the SPA's interactive
      # behavior (the JobKind authoring graph/inspector/workflow rail,
      # routing) against regression. Every /api call is intercepted
      # in-browser, so no backend is needed; the live-stack suite is the
      # separate Phase-2 gate. See apps/web/playwright.mocked.config.ts.
      - name: Install Playwright browser
        working-directory: apps/web
        run: bunx playwright install --with-deps chromium

      - name: Frontend smoke (mocked backend)
        working-directory: apps/web
        run: bun run test:mocked
