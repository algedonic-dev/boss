# CodeQL — static application security testing (SAST).
#
# Scorecard's SAST check only credits a recognized SAST engine (CodeQL,
# Sonar, Snyk, …); clippy/svelte-check don't count, which is why the
# check scored 0 despite our lint gates. This workflow runs CodeQL over
# both halves of the tree:
#   - javascript-typescript — apps/web (Svelte 5 SPA)
#   - rust                  — the crates/ workspace
#
# Both languages use build-mode: none — CodeQL builds its database from
# source without compiling, so this stays fast and never has to
# reproduce the workspace build. Actions are pinned to a SHA (matching
# scorecard.yml) so this doesn't reopen a Pinned-Dependencies alert.
#
# The scan runs from .github/codeql/codeql-config.yml (backlog 3ac9ad30):
# unconfigured, the default suites stalled publish PR #239 on 100
# name-heuristic annotations. The config records each excluded query
# with the PR and count it was read from, and the pin in
# crates/core/boss-testing/tests/the_mirrors_codeql_scan_records_its_exclusions.rs
# refuses an exclusion without one — and a workflow that stops naming
# the config.

name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 5 * * 1"  # Mondays 05:23 UTC

permissions: read-all

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write   # upload CodeQL SARIF to the Security tab
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            build-mode: none
          - language: rust
            build-mode: none

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          config-file: ./.github/codeql/codeql-config.yml

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          category: "/language:${{ matrix.language }}"
