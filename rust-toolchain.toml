# The gate's toolchain, pinned so CI and a dev box agree by
# construction rather than by luck.
#
# Why this exists. On 2026-08-13 a car could not be gated locally at
# all: `cargo clippy --all-features --tests` failed with `duplicated
# attribute` on two postgres adapters, while the same commit passed
# the same gate in forge CI. The divergence was the toolchain — a dev
# box on 1.93.1 against a CI image on 1.96 — and it cost a
# diagnosis before anyone thought to compare versions, because
# nothing in the tree stated what version the gate expected.
#
# 1.96 matches infra/forge/boss-ci/Dockerfile (`FROM
# rust:1.96-slim-bookworm`). Those two facts now live twice, which
# CLAUDE.md §9a says to collapse or pin; they are pinned rather than
# collapsed because the Dockerfile's FROM line and a rustup channel
# are different vocabularies with no shared source. Moving one means
# moving the other in the same car — and the version appearing in a
# diff is the point, since a silent toolchain bump is exactly the
# change that produces phantom failures on one machine and not
# another.
#
# The components are the gate's, not a preference: infra/gate.sh runs
# clippy and `cargo fmt -- --check`, so a toolchain without them
# cannot run the gate.
[toolchain]
channel = "1.96"
components = ["rustfmt", "clippy"]
